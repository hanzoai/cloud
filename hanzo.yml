# Canonical CI config for hanzoai/cloud — read by the hanzoai/ci reusable
# (.hanzo/workflows/cicd.yml, the `gate` job) and platform.hanzo.ai.
#
# NO images: lane HERE, and the reason changed. The cloud MAIN image and its v*
# tags still have exactly ONE owner, and the tag-is-a-receipt invariant still
# holds (main push → claim → build → smoke → RECORD → pin → prove live). But that owner is
#
# RECORD is not decoration in that list. A resume used to read "have these bytes
# been published" and answer "then skip the smoke too" — so a run that pushed and
# then failed the smoke came back, found its own image, and handed rollout bytes
# nothing had ever booted. Smoking is now a FACT, written when it happens:
# refs/smoked/sha256-<digest> at the commit, in the same compare-and-swap
# namespace the version claim uses. Resume reads that fact. An artifact existing
# proves it was built and never that it was tested, and the two questions are now
# asked of the two systems that know — the registry, and git.
# now the `image` job of .hanzo/workflows/cicd.yml, not apps/platform/release.go.
#
# release.go held it until a release could be shown to reliably kill itself: it
# ran detached inside the single replica whose pin it moved, so its own last step
# terminated the pod mid-pipeline and left an image published, unsmoked and
# untagged. v1.801.328 and 330-334 and 336+ are those images.
#
# This file still declares no image because a lane here would be a SECOND builder
# on the same commit — the double-build that re-opens the phantom-tag hole. One
# owner, in the one place the rest of the fleet already builds. No other artifact
# in this repo is built as an image either — the prebuilt inputs cloud's
# Dockerfile pulls (console-embed, agent-skills) are published by THEIR OWN repos.
#
# So CI's job here is the TEST GATE — and the gate is now what the whole release
# hangs off. The `test:` block below is car 0 of the train: every later job
# (image, rollout, reach, fanout, receipt) declares `needs:` on it, which is the
# edge that did not exist when the drift gate below was red on main through 87
# commits and 6 releases. A gate with no edge to the thing it stops is a
# decoration.
#
# NO deploy here either: the `rollout` job ends in universe/charts/app/pin.sh,
# and cd.hanzo.ai reconciles what that pin records.

# NO binaries: LANE YET — AND THE CREDENTIAL IS NO LONGER THE REASON.
#
# Both blockers below are CLOSED. Read this first, because the text under them
# was written when they were open and it sends you to provision an S3 key that
# is not needed:
#
#   1. FIXED in hanzoai/ci (`the run:/out: lane indexes per FILE`) and in THIS
#      repo, apps/platform/artifact.go — both lanes now derive {name, os, arch}
#      from the filename when it carries the <name>-<os>-<arch> shape the Go lane
#      already writes, and keep the recipe name + "any" for a wheel or a tarball.
#      Pinned by TestArtifactScripts_IndexPerFileWhenTheNameCarriesThePlatform,
#      which runs both scripts for real and fails on the old behaviour.
#
#   2. NOT A BLOCKER: the door the comment below calls "being built next door" is
#      built, HERE. `POST /v1/runner` with a `binaries:` recipe launches the
#      artifact Job, and the only container that ever sees the object-store
#      credential is the publisher, from the `artifact-s3` KMSSecret in the build
#      namespace — so a CALLER holds no bucket key and names no bucket. The gate
#      is the ordinary one (SuperAdmin or OrgAdmin, `repoOwnerInOrg` confining an
#      org-admin to its own owner), i.e. the IAM bearer the KMS step already
#      mints. Live: an unauthenticated POST answers 403 `invalid build token`,
#      which is a routed door refusing. It publishes to the same layout
#      s3.hanzo.ai/<bucket>/<owner>/<repo>/<tag>/binaries.json that CLOUD_PLUGINS
#      reads — one index, two front doors, exactly as apps/platform/artifact.go
#      says. Provisioning S3_ADMIN_* to use ci's own `bucket:` lane would be a
#      SECOND credential for a job that already has one.
#
# So what remains is a decision about WHERE the plugin build runs, not a missing
# secret: ci's `bucket:` lane (on the runner, needs the key) or this door (in the
# cluster, holds the key already, and takes the build off the release train's
# critical path — which is the point of a light host in the first place).
#
# ---- written while both were open; kept for the reasoning, not the verdict ----
#
# The build half is done and lives in this repo: `make -f mk/fleet.mk dist` puts
# all 121 plugins for linux/amd64 + linux/arm64 into dist/<app>-<os>-<arch> —
# the exact triple manifest/release.go resolves a plugin by, through the same
# mk/plugin.mk recipe an app's own Makefile runs, CGO_ENABLED=0 so a fetched
# plugin does not demand a libsqlite3 on a box we did not build. (The image's
# /plugins are built the other way, cgo + libsqlite3, because there the host owns
# the filesystem they land on. Same source, two consumers, one recipe.)
#
# Two things outside this repo have to be true before the declaration at the
# bottom of this comment becomes real:
#
#   1. hanzoai/ci's run:/out: lane must index per FILE, not per RECIPE. It records
#      {name: <the recipe's>, os: any, arch: any} for every file it collects —
#      right for a wheel, and precisely what manifest/release.go cannot read. The
#      fix is to derive the triple from the filename when it carries the
#      <name>-<os>-<arch> shape ci's OWN Go lane already writes: one naming
#      convention, either lane. (`out: dist/*` also aborts that lane today — it
#      copies each match into dist/ by basename, and `cp x x` is an error, not a
#      no-op.) The alternative is not 121 entries: that would blow the platform
#      front door's 16-binary bound AND restate manifest/apps.go in YAML.
#
#   2. Somebody has to answer where the write credential comes from. `bucket:`
#      uploads through S3_ADMIN_ACCESS_KEY/S3_ADMIN_SECRET_KEY read from KMS, and
#      those names are in KMS for NO ORG. The lane fails CLOSED on that, so
#      declaring it would publish nothing and turn every TAG build of this repo
#      red — and rollout, reach, fanout and receipt all declare needs: on the gate
#      below. That is the release train stopped in exchange for nothing, which is
#      exactly the state ci's `site:` lane shipped in. The answer being built next
#      door is to stop needing the credential: publish through an authenticated
#      cloud endpoint on the IAM bearer the KMS step already mints, so CI names no
#      bucket and holds no bucket key. If that is the direction, this wants the
#      same door rather than a provisioned S3_ADMIN_*.
#
# When both hold, the whole declaration is:
#
#   bucket: plugins
#   binaries:
#     - name: plugins
#       run: make -f mk/fleet.mk dist   # PLATFORMS lives in mk/fleet.mk, not here
#       out: dist/*
#
# ONE entry, not 121, so the app set stays in the one place that owns it. It
# publishes to https://s3.hanzo.ai/plugins/hanzoai/cloud/<tag>/ — artifacts first
# and binaries.json LAST, so the index never names an object that is not there —
# which is the index CLOUD_PLUGINS already reads (manifest/release.go), on a tag
# only, digest-verified before anything is executed. The image keeps its own copy
# of every plugin regardless; this is the same artifact set for the host that has
# no such copy, not a second distribution channel.

# THE CGO TAG FLOOR for every raw `go` invocation below. Under cgo,
# `sqlite_math_functions` is not a preference — hanzoai/base declares a
# COMPILE ERROR without it (base/core/sqlite_math_required.go, `//go:build cgo &&
# !sqlite_math_functions`): its search layer generates SQL calling acos/cos/sin/
# radians/sqrt, which the cgo sqlite has only behind that tag, so base refuses to
# build a binary whose SQL surface is smaller than the code above it writes
# against. 47 of cloud's 306 packages reach base/core (apps/git, apps/agents,
# apps/billing, apps/base, … plus their plugin/<app> mains), so a cgo build
# without the tag fails to COMPILE them — and a gate that cannot build is a gate
# that never ran a test. `sqlite_fts5` is the same tag the image and `make test`
# carry: without it any store whose migration declares an FTS5 table cannot open.
# The Dockerfile passes both (plus libsqlite3) already; these steps are the raw-go
# path that bypasses the Makefile, which is exactly how the two drifted apart.
# Note go-vet sets no CGO_ENABLED: it inherits the toolchain default, which is 1
# on a runner with a C toolchain (build.yml provisions one), so vet needs the tag
# for the same reason go-unit does.
test:
  - name: closure-current
    # FIRST, AND IT IS THE CHEAPEST THING THAT CAN BE KNOWN. `go list` over the whole
    # plugin closure — no compile, no link — is 2 seconds, against 6m39s for
    # app-contract warm and 35-53 minutes on this runner.
    #
    # It answers the ONE question nothing in this file could: has a committed document
    # been left behind by a dependency that moved? A commit that bumps a version in
    # go.mod and touches nothing else invalidates a generated document silently, and
    # every gate here is blind to it — go-vet compiles the new code happily,
    # zipdoc-current only reads this repo's own comments, and app-contract catches it
    # correctly but fiftieth. hanzoai/iam v1.34.21 → v1.34.29 added EnableCodeSignin,
    # the commit touched go.mod, go.sum and apps/iam, and run 996 spent 53m11s to
    # report a 3-line diff in plugin/iam/openapi.json.
    #
    # openapi/closure.json records what each document was generated FROM; this compares
    # it to what the tree resolves now, names every stale document in ONE pass, names
    # the dependency that moved, and prints the command that repairs it — scoped to the
    # apps that moved when that is fewer than a third of the fleet. See cmd/closure for
    # why the unit is the PACKAGE and not the module, and for where that does NOT help.
    #
    # It PREDICTS; app-contract still DECIDES. A moved closure means the document was
    # generated from source that has since changed, not that the projection differs.
    run: |
      export GOPRIVATE='github.com/hanzoai/*' GOWORK=off
      # A STABLE cache home. setup-go's cache writes to the Actions cache
      # backend, which a self-hosted forge runner may not provide — and when it
      # does not, the flag is a no-op and every step here compiles the world.
      # These runners keep their filesystem between jobs, so naming the two
      # caches at a fixed path makes them persist on the host regardless. Go
      # locks both, so concurrent jobs sharing them is safe.
      export GOCACHE=${GOCACHE:-/var/tmp/hanzo-go/build} GOMODCACHE=${GOMODCACHE:-/var/tmp/hanzo-go/mod}
      mkdir -p "$GOCACHE" "$GOMODCACHE"
      # IT PREDICTS; app-contract DECIDES — and this step used to be fatal, which
      # promoted the prediction to the verdict and stopped every release that
      # followed a dependency bump. Measured: four times in one day, each time a
      # bump moved go.mod without regenerating the witness, each time reported as
      # `117 app document(s) stale`, and each time the full regeneration below
      # produced documents that were IDENTICAL — only the witness had moved.
      #
      # So the whole surface was held by a signal that was right about staleness
      # and silent about consequence, and the release train was red for a day for
      # documents that had not changed. app-contract regenerates all 123 from
      # source in the same job and fails on any real diff, so nothing is lost by
      # letting this one report instead of refuse.
      #
      # It stays FIRST and it stays loud: it is two seconds against app-contract's
      # thirty-five minutes, so a reader who is about to lose that time learns why
      # here. What it must not do is decide.
      if ! make closure-check; then
        echo "::warning::the closure witness is stale — app-contract below decides whether any document actually moved; if it passes, commit openapi/closure.json"
      fi
  - name: generated-current
    # manifest/apps.go is the hand-authored source of truth for the subsystem set.
    # gen-app-cmds scaffolds a plugin/<app>/main.go for any manifest app that
    # lacks one and refuses a plugin/<app> the manifest does not list — the bijection
    # that keeps the light host from routing to a binary that is not there (or a
    # binary from going unrouted). It never rewrites an existing main (those are
    # source), so it is idempotent: a clean tree after running it is the whole
    # invariant. It reads manifest.Apps as a value; seconds, no fleet build.
    run: |
      set -e
      export GOPRIVATE='github.com/hanzoai/*' GOWORK=off
      # A STABLE cache home. setup-go's cache writes to the Actions cache
      # backend, which a self-hosted forge runner may not provide — and when it
      # does not, the flag is a no-op and every step here compiles the world.
      # These runners keep their filesystem between jobs, so naming the two
      # caches at a fixed path makes them persist on the host regardless. Go
      # locks both, so concurrent jobs sharing them is safe.
      export GOCACHE=${GOCACHE:-/var/tmp/hanzo-go/build} GOMODCACHE=${GOMODCACHE:-/var/tmp/hanzo-go/mod}
      mkdir -p "$GOCACHE" "$GOMODCACHE"
      go run ./plugin/gen-app-cmds
      # --porcelain, not `git diff`: a NEW manifest app scaffolds a NEW
      # plugin/<app>/main.go, which is untracked and therefore invisible to a diff.
      # The failure that matters most is exactly the one a diff would miss.
      # Scoped to plugin/*/main.go, the files the generator owns.
      stale=$(git status --porcelain -- 'plugin/*/main.go')
      if [ -n "$stale" ]; then
        echo "::error::a manifest app has no plugin/<app> (or one is stale) — run 'make generate' and commit. An orphan plugin/<app> fails the generator itself, above."
        echo "$stale"
        exit 1
      fi
  - name: zipdoc-current
    # The 99 zipdoc_gen.go files are the ONLY path from a typed handler's doc
    # comment to /v1/openapi.json: Go drops comments at compile time, so cmd/zipdoc
    # lifting them into a compiled-in file is the whole mechanism. They are
    # COMMITTED, which is what lets the release image compile the real prose into
    # every binary WITHOUT running the generator — that RUN cost 355.9s of a
    # 17-minute build to re-derive files the tree already had, and it is gone.
    #
    # Committed means they can go stale, and dropping the build-time pass is only
    # sound if staleness cannot be MERGED. Nothing here checked that. `make test`
    # has carried a zipdoc check for a long time, but CI does not run `make test` —
    # it runs the raw-go steps in this file — so that check has never once executed
    # in CI. app-contract cannot cover it either: it regenerates these files as a
    # side effect (mk/plugin.mk: describe → build → generate) and then scopes its
    # porcelain check to openapi.yaml, public.yaml, openapi/floor.json and plugin/, so a stale
    # lift is silently repaired in the runner's tree and never reported. Main went
    # stale straight through that gap — plane.go documents RunOnBehalfIn.Model and
    # apps/agents/zipdoc_gen.go did not carry a word of it.
    #
    # BEFORE app-contract, necessarily: after it the tree is already regenerated and
    # this would assert nothing.
    #
    # BEFORE go-vet now, and that move is the single biggest thing in this file.
    # It used to sit after vet and the note here said vet had warmed the caches these
    # package loads want — true, and beside the point: vet is ~22 minutes on this
    # runner and this is 1m23s, so every stale lift was reported twenty-two minutes
    # late. Measured over runs 985-1003, zipdoc-current was the failing step in SIX of
    # the eight runs that started, at 8m54s to 35m00s each. The load cost moves, it
    # does not appear — vet pays it a minute later instead — and what changes is when
    # a thirty-second regeneration is discovered.
    #
    # It reports EVERY stale file rather than the first. Under `set -e` this loop
    # stopped at one, which is how apps/meet took three red runs and apps/projects
    # took three more behind it.
    run: |
      set -e
      export GOPRIVATE='github.com/hanzoai/*' GOWORK=off
      # A STABLE cache home. setup-go's cache writes to the Actions cache
      # backend, which a self-hosted forge runner may not provide — and when it
      # does not, the flag is a no-op and every step here compiles the world.
      # These runners keep their filesystem between jobs, so naming the two
      # caches at a fixed path makes them persist on the host regardless. Go
      # locks both, so concurrent jobs sharing them is safe.
      export GOCACHE=${GOCACHE:-/var/tmp/hanzo-go/build} GOMODCACHE=${GOMODCACHE:-/var/tmp/hanzo-go/mod}
      mkdir -p "$GOCACHE" "$GOMODCACHE"
      # ONE gate definition, called rather than restated — the discipline
      # app-contract already follows with surface-check. This is the same target a
      # developer runs, so CI and the Makefile cannot drift apart, which is exactly
      # how the Makefile's own zipdoc check ended up policing nothing.
      make zipdoc-check
  - name: go-vet
    # NO LONGER FIRST, and the reason is the clock rather than taste. This step
    # typechecks the whole module and is the single most expensive thing before
    # app-contract — ~22 minutes on this runner (run 992: 04:39:57 → 05:01:44). The
    # three steps above it now cost about 1m26s together and each of them can fail on
    # its own evidence without a build. So the order here is cost, ascending: every
    # question that can be answered without compiling is asked before the one that
    # compiles everything, and the release train learns in ninety seconds what it used
    # to learn in twenty-three minutes.
    #
    # Nothing above depends on vet having run. They were ordered the other way because
    # vet warmed the build cache the package loads want, which is a saving of a minute
    # inside a step that reports twenty-two minutes late.
    run: |
      set -e
      export GOPRIVATE='github.com/hanzoai/*' GOWORK=off
      # A STABLE cache home. setup-go's cache writes to the Actions cache
      # backend, which a self-hosted forge runner may not provide — and when it
      # does not, the flag is a no-op and every step here compiles the world.
      # These runners keep their filesystem between jobs, so naming the two
      # caches at a fixed path makes them persist on the host regardless. Go
      # locks both, so concurrent jobs sharing them is safe.
      export GOCACHE=${GOCACHE:-/var/tmp/hanzo-go/build} GOMODCACHE=${GOMODCACHE:-/var/tmp/hanzo-go/mod}
      mkdir -p "$GOCACHE" "$GOMODCACHE"
      go vet -tags "sqlite_fts5 sqlite_math_functions" ./...
  - name: host-is-light
    # The light host's ONE property is that it links no subsystem: it knows where
    # each app lives and what path it answers, never what the app does. That is
    # what keeps it at ~395 packages while the fleet's subsystem graphs total
    # thousands, and it is a property of the IMPORT GRAPH, so it is checked with
    # the import graph rather than with a size threshold nobody can interpret. One
    # stray import of a apps/* package drags a subsystem's whole graph back in,
    # and the only symptom would be a slow build — this turns that into a failed
    # one.
    #
    # TWO CHECKS, BECAUSE THE NAME AND THE PROPERTY ARE DIFFERENT QUESTIONS.
    # "No apps/* import at all" was a PROXY for "links no subsystem graph", and
    # the proxy went wrong the moment an app's EDGE had to run in this process:
    # cmd/cloud/sites.go serves <slug>.hanzo.app, and it must, because the image
    # runs this binary on the public port — a published site mounted anywhere else
    # is served nowhere, which is the outage that put it here. apps/sites is a
    # leaf (zip + s3; 2 cloud packages, never the root), so it drags in nothing,
    # and the host measured 392 packages with it linked — inside the ~395 the
    # paragraph above names. The gate was red on main for a day for a graph that
    # never grew, and because every later car declares `needs:` on this one, that
    # is the whole release train stopped by its own approximation.
    #
    # So the exception is NAMED with its reason — the discipline go-unit's -skip
    # list already follows — and the property it approximates is measured
    # directly beside it. The name check catches a subsystem leaking in; the count
    # catches an ALLOWED leaf that quietly grew a graph. Neither alone is enough,
    # which is exactly why this is two checks and not a widened pattern.
    run: |
      set -e
      # CGO_ENABLED=0 to match `make cloud`: the cgo graph carries one extra
      # package, so leaving it unset makes the number CI prints disagree with the
      # number a developer measures, for no reason anyone can see.
      export GOPRIVATE='github.com/hanzoai/*' GOWORK=off CGO_ENABLED=0
      # A STABLE cache home. setup-go's cache writes to the Actions cache
      # backend, which a self-hosted forge runner may not provide — and when it
      # does not, the flag is a no-op and every step here compiles the world.
      # These runners keep their filesystem between jobs, so naming the two
      # caches at a fixed path makes them persist on the host regardless. Go
      # locks both, so concurrent jobs sharing them is safe.
      export GOCACHE=${GOCACHE:-/var/tmp/hanzo-go/build} GOMODCACHE=${GOMODCACHE:-/var/tmp/hanzo-go/mod}
      mkdir -p "$GOCACHE" "$GOMODCACHE"
      # apps/s3admin rides in with apps/sites (its storage leaf), not on its own.
      leak=$(go list -deps ./cmd/cloud | grep -E '^github.com/hanzoai/cloud/(apps|clients)' \
        | grep -vE '^github.com/hanzoai/cloud/apps/(sites|s3admin)$' || true)
      if [ -n "$leak" ]; then
        echo "::error::cmd/cloud links subsystem code, which defeats the point of the light host: $leak"
        exit 1
      fi
      n=$(go list -deps ./cmd/cloud | wc -l)
      if [ "$n" -gt 450 ]; then
        echo "::error::cmd/cloud links $n packages (bound 450) — an edge leaf grew a subsystem graph; the name check above cannot see this."
        exit 1
      fi
      echo "OK: cmd/cloud links $n packages and no subsystem"
  - name: openapi-composed
    # The fleet spec must BE the composition of its apps' own specs. Each app
    # binary emits its own subset from its own router (`<app> openapi`), and
    # openapi/weave.go puts them back together — refusing, loudly, when two apps
    # claim one path+method or mean different things by one schema name. Silent
    # last-write-wins is exactly the class of bug the manifest's call-graph walk
    # caught when apps/git's /:org/:repo was swallowing its neighbours.
    #
    # It also pins FRESHNESS, which is why it earns its own entry rather than
    # riding go-unit: the monolith is gone, so the woven document IS openapi.yaml —
    # `make describe` writes it through this same weave, and this verifies the
    # committed subsets weave back to the committed golden byte for byte. A route
    # change that regenerates one and not the other goes red here, in seconds,
    # instead of shipping a wrong SDK. Links no subsystem and mounts nothing but
    # the openapi endpoint itself.
    run: |
      set -e
      export GOPRIVATE='github.com/hanzoai/*' GOWORK=off
      # A STABLE cache home. setup-go's cache writes to the Actions cache
      # backend, which a self-hosted forge runner may not provide — and when it
      # does not, the flag is a no-op and every step here compiles the world.
      # These runners keep their filesystem between jobs, so naming the two
      # caches at a fixed path makes them persist on the host regardless. Go
      # locks both, so concurrent jobs sharing them is safe.
      export GOCACHE=${GOCACHE:-/var/tmp/hanzo-go/build} GOMODCACHE=${GOMODCACHE:-/var/tmp/hanzo-go/mod}
      mkdir -p "$GOCACHE" "$GOMODCACHE"
      go test ./openapi
  - name: app-contract
    # Every app builds, tests and describes itself through ONE shared file
    # (mk/plugin.mk), and this is the only gate that proves every per-app binary
    # still LINKS and still MOUNTS ALONE — the property the whole host+plugin
    # model rests on and that nothing else here checks. It is the per-app
    # `openapi` target run across the fleet, so the artifacts it regenerates must
    # come back identical: a dirty tree means an app's routes moved without its
    # subset being regenerated.
    #
    # Slow by construction (one link per app, sequential, GOFLAGS=-p=2 — each
    # link peaks in the GiBs). It runs after the cheap gates on purpose.
    run: |
      set -e
      export GOPRIVATE='github.com/hanzoai/*' GOWORK=off
      # A STABLE cache home. setup-go's cache writes to the Actions cache
      # backend, which a self-hosted forge runner may not provide — and when it
      # does not, the flag is a no-op and every step here compiles the world.
      # These runners keep their filesystem between jobs, so naming the two
      # caches at a fixed path makes them persist on the host regardless. Go
      # locks both, so concurrent jobs sharing them is safe.
      export GOCACHE=${GOCACHE:-/var/tmp/hanzo-go/build} GOMODCACHE=${GOMODCACHE:-/var/tmp/hanzo-go/mod}
      mkdir -p "$GOCACHE" "$GOMODCACHE"
      # ONE gate definition, called here rather than restated: mk/fleet.mk's
      # check regenerates every subset AND weaves the golden, then fails
      # on any porcelain change. This step used to regenerate the subsets only,
      # so openapi.yaml — the file the SDK repos actually pull — was never checked
      # against source by anything: openapi-composed above compares it to the
      # subsets, and both are derived. That is how plugin/ingress lost eight paths
      # with every gate green.
      make -f mk/fleet.mk check
  - name: go-unit
    run: |
      set -e
      export GOPRIVATE='github.com/hanzoai/*' GOWORK=off CGO_ENABLED=1
      # A STABLE cache home. setup-go's cache writes to the Actions cache
      # backend, which a self-hosted forge runner may not provide — and when it
      # does not, the flag is a no-op and every step here compiles the world.
      # These runners keep their filesystem between jobs, so naming the two
      # caches at a fixed path makes them persist on the host regardless. Go
      # locks both, so concurrent jobs sharing them is safe.
      export GOCACHE=${GOCACHE:-/var/tmp/hanzo-go/build} GOMODCACHE=${GOMODCACHE:-/var/tmp/hanzo-go/mod}
      mkdir -p "$GOCACHE" "$GOMODCACHE"
      # THE WHOLE TREE. This used to name twelve packages, which meant a red
      # package could sit on main without ever producing a red build — that is
      # exactly how apps/git and apps/entitlements went unnoticed. An
      # allowlist silently stops covering everything added after it is written,
      # so the gate takes ./... and the exceptions are named, with reasons.
      #
      # -skip, each entry env-dependent rather than broken:
      #   TestRecord_DebitsFinanceInProcess — cek demands CLOUD_KMS_MASTER_KEY_REF
      #     on an encryption-capable build; it runs where that key exists.
      #   TestIndexerUnreachableHonestEmpty — asserts a hostname does NOT resolve.
      #     A resolver that hijacks NXDOMAIN (or is merely slow) fails it for
      #     reasons that have nothing to do with this code.
      # -tags: the cgo floor above. CGO_ENABLED=1 without sqlite_math_functions
      # cannot compile the 47 packages that reach hanzoai/base/core, so this step
