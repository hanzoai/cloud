# Canonical CI config for hanzoai/cloud — read by the hanzoai/ci reusable
# (.hanzo/workflows/cicd.yml, the `gate` job) and platform.hanzo.ai.
#
# The cloud MAIN image has NO images: entry — clients/platform/release.go OWNS it
# + the v* tags (the tag-is-a-receipt invariant: main push → build → smoke → push
# image → tag). That is the in-cloud port of the old release.yml, reached at
# POST /v1/runner {release:true}; declaring the cloud image here too would
# double-build and re-open the phantom-tag hole it exists to close. The images:
# block below is ONLY the decoupled native flags staticlib (cloud-flags) — a
# distinct artifact on its own version, never a v* git tag — so cloud's
# Dockerfile pulls it (FROM ${FLAGS_IMAGE} AS flagslib) instead of recompiling
# Rust every release. CI's other job here is the TEST GATE on every push/PR.
#
# NO deploy: cloud is operator-managed — universe records desired state and the
# operator reconciles the Service CR; the release path notifies universe with a
# proven tag.
images:
  - name: cloud-flags
    context: native/flags
    dockerfile: native/flags/Dockerfile
    repo: ghcr.io/hanzoai/cloud-flags

test:
  - name: native-flags
    # The flags evaluator staticlib clients/flags links under CGO=1.
    run: |
      set -e
      if ! command -v cargo >/dev/null 2>&1; then
        curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
      fi
      . "$HOME/.cargo/env" 2>/dev/null || true
      # zccache: drop-in compiler cache — no-op unless the runner carries it, so
      # it never breaks the gate; where present (self-hosted runners + Actions cache) it
      # warms the Rust compile cross-run.
      command -v zccache >/dev/null 2>&1 && export RUSTC_WRAPPER=zccache || true
      cargo build --release --locked --manifest-path native/flags/Cargo.toml
  - name: go-vet
    run: |
      set -e
      export GOPRIVATE='github.com/hanzoai/*' GOWORK=off
      go vet ./...
  - name: generated-current
    # apps.Wire() is the single source of truth for the subsystem set; cmd/<app>
    # and manifest/apps.go are DERIVED from it by cmd/gen-app-cmds, and the
    # generator is idempotent. So a clean tree after re-running it is the whole
    # invariant — and a dirty one means someone edited Wire() without
    # regenerating, which leaves the light host routing to binaries that do not
    # exist (or not routing to ones that do). Pure AST parse: no build, seconds.
    run: |
      set -e
      export GOPRIVATE='github.com/hanzoai/*' GOWORK=off
      go run ./cmd/gen-app-cmds
      # --porcelain, not `git diff`: a NEW subsystem in Wire() produces a NEW
      # cmd/<app>/main.go, which is untracked and therefore invisible to a diff.
      # The failure that matters most is exactly the one a diff would miss.
      #
      # Scoped to the files the generator OWNS. Pointing it at cmd/ wholesale
      # would also fail on anything else untracked there — a scratch harness, a
      # local experiment — which is a red build for a reason that has nothing to
      # do with the manifest.
      stale=$(git status --porcelain -- 'cmd/*/main.go' manifest/apps.go)
      if [ -n "$stale" ]; then
        echo "::error::cmd/ or manifest/ is stale — apps.Wire() changed without 'make generate'. Run it and commit."
        echo "$stale"
        exit 1
      fi
  - name: host-is-light
    # The light host's ONE property is that it links no subsystem: it knows where
    # each app lives and what path it answers, never what the app does. That is
    # what keeps it at ~317 packages against cmd/cloud's 3105, and it is a
    # property of the IMPORT GRAPH, so it is checked with the import graph rather
    # than with a size threshold nobody can interpret. One stray import of a
    # clients/* package (or of apps) drags the whole graph back in, and the only
    # symptom would be a slow build — this turns that into a failed one.
    run: |
      set -e
      export GOPRIVATE='github.com/hanzoai/*' GOWORK=off
      leak=$(go list -deps ./cmd/host | grep -E '^github.com/hanzoai/cloud/(apps|clients)' || true)
      if [ -n "$leak" ]; then
        echo "::error::cmd/host links subsystem code, which defeats the point of the light host: $leak"
        exit 1
      fi
      echo "OK: cmd/host links $(go list -deps ./cmd/host | wc -l) packages and no subsystem"
  - name: go-unit
    run: |
      set -e
      export GOPRIVATE='github.com/hanzoai/*' GOWORK=off CGO_ENABLED=1
      # THE WHOLE TREE. This used to name twelve packages, which meant a red
      # package could sit on main without ever producing a red build — that is
      # exactly how clients/git and clients/entitlements went unnoticed. An
      # allowlist silently stops covering everything added after it is written,
      # so the gate takes ./... and the exceptions are named, with reasons.
      #
      # -skip, each entry env-dependent rather than broken:
      #   TestRecord_DebitsFinanceInProcess — cek demands CLOUD_KMS_MASTER_KEY_REF
      #     on an encryption-capable build; it runs where that key exists.
      #   TestIndexerUnreachableHonestEmpty — asserts a hostname does NOT resolve.
      #     A resolver that hijacks NXDOMAIN (or is merely slow) fails it for
      #     reasons that have nothing to do with this code.
      go test -count=1 -timeout 30m \
        -skip 'TestRecord_DebitsFinanceInProcess|TestIndexerUnreachableHonestEmpty' \
        ./...
