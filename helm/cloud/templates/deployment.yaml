apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cloud.fullname" . }}
  labels: {{- include "cloud.labels" . | nindent 4 }}
spec:
  # Embedded IAM (clients/iam) keeps a per-pod SQLite identity store, so a
  # horizontally scaled app tier would give each replica its own divergent store.
  # Whenever IAM is enabled the Deployment is PINNED to a single replica; cloud's
  # Config.Validate also refuses to boot iam-enabled above CLOUD_REPLICAS=1
  # (defence in depth). Point IAM at a shared store to lift this.
  #
  # This predicate MIRRORS Config.Enabled: iam is not staged, so an EMPTY enable
  # list ("mount everything") enables it just as naming it does. Testing only for
  # the name would leave an empty-list deployment unpinned, and Validate would
  # then refuse to boot it.
  {{- $enable := splitList "," .Values.hanzo.enable }}
  {{- $iamEnabled := or (empty (compact $enable)) (has "iam" $enable) }}
  {{- $replicas := ternary 1 (int .Values.replicaCount) $iamEnabled }}
  replicas: {{ $replicas }}
  selector:
    matchLabels: {{- include "cloud.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "cloud.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "cloud.serviceAccountName" . }}
      # Exceed the in-process drain + final ship so a rolling pod hands off cleanly before
      # SIGKILL (see drain.go / serve.go shutdown).
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: cloud
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "--brand={{ .Values.hanzo.brand }}"
            - "--domain={{ .Values.hanzo.domain }}"
            - "--data-dir={{ .Values.hanzo.dataDir }}"
            - "--iam-issuer={{ .Values.hanzo.iamIssuer }}"
            - "--enable={{ .Values.hanzo.enable }}"
          # preStop belt-and-suspenders: give the endpoint controller a moment to remove
          # this pod before SIGTERM so no request is dialed to a tearing-down pod. The
          # in-process drain (drain.go) is the primary mechanism; this only sharpens it.
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 3"]
          env:
            # The tag actually deployed, surfaced as X-Api-Version so a running pod
            # says which build it is. Read at config.go's getenv("CLOUD_VERSION", …);
            # without it the binary falls back to the link-time default and every
            # deployment answers "dev", which makes a rollout unverifiable from
            # outside. Sourced from the same expression as image.tag above, so it
            # cannot drift from the image, and it needs no rebuild — the release
            # assigns the final version AFTER the image is pushed, so a link-time
            # stamp would race it (see version.go).
            - name: CLOUD_VERSION
              value: "{{ .Values.image.tag | default .Chart.AppVersion }}"
            # Mirrors the resolved replica count so Config.Validate can enforce the
            # single-replica contract embedded IAM requires (memory session store).
            - name: CLOUD_REPLICAS
              value: {{ $replicas | quote }}
            # Stable pod identity (HRW weight) + namespace for the live membership source.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # Label selector that names this deployment's writer pods, so the live
            # membership source (membership_k8s.go) tracks the pod set in-cluster. Empty /
            # out-of-cluster falls back to the static self set — no flag, works everywhere.
            - name: CLOUD_PEER_SELECTOR
              value: "app.kubernetes.io/name={{ include "cloud.name" . }},app.kubernetes.io/instance={{ .Release.Name }}"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
            - name: zap
              containerPort: 9653
              protocol: TCP
          livenessProbe: {{- toYaml .Values.probes.liveness | nindent 12 }}
          readinessProbe: {{- toYaml .Values.probes.readiness | nindent 12 }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.hanzo.dataDir }}
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "cloud.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
