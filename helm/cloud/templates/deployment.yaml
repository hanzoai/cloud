apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cloud.fullname" . }}
  labels: {{- include "cloud.labels" . | nindent 4 }}
spec:
  # WHAT MAY RUN AT MORE THAN ONE REPLICA, ASKED HERE AND ANSWERED THE SAME WAY
  # THE BINARY ANSWERS IT.
  #
  # replicaCount used to be CLAMPED to 1 whenever IAM was enabled — asked for
  # three, given one, told nothing. A chart that ignores the value it was handed
  # is worse than one that refuses it: the operator reads their own values file
  # and believes it. So the two conditions that genuinely forbid a second replica
  # are checked, and each one that holds REFUSES TO RENDER, naming itself and its
  # remedy. Everything else honours the count as given.
  #
  # IAM IS ALWAYS MOUNTED, so the embedded-store question is always asked. The
  # binary knows which apps it was built with (manifest.Apps) and a deployment no
  # longer restates the set — config.go says why, and names the two devnet
  # outages a second source of truth caused. So this no longer reads an enable
  # list to decide: reading one would let `enable: "base"` skip the check while
  # the binary mounted iam regardless, which is the same disagreement in a
  # quieter place.
  {{- $iamStore := .Values.hanzo.iamStore | default "" | trim }}
  {{- $iamShared := and (ne $iamStore "") (ne $iamStore "sqlite") }}
  {{- $replicas := int .Values.replicaCount }}
  {{- $max := int (default $replicas .Values.autoscaling.maxReplicas) }}
  {{- $peak := max $replicas $max }}
  {{- $rwo := and .Values.persistence.enabled (has "ReadWriteOnce" .Values.persistence.accessModes) }}
  {{- if and (gt $peak 1) (not $iamShared) }}
    {{- fail (printf "cloud: %d replicas with embedded IAM on the per-pod store. iam is mounted and hanzo.iamStore is %q, so each replica opens its own %s/iam/iam.db and a user created on one cannot sign in on the next. Set hanzo.iamStore to a shared backend (\"sql\"), or keep replicaCount (and autoscaling.maxReplicas) at 1." $peak $iamStore .Values.hanzo.dataDir) }}
  {{- end }}
  {{- if and (gt $peak 1) $rwo }}
    {{- fail (printf "cloud: %d replicas on a ReadWriteOnce volume. A block volume attaches to ONE node, so the second pod never leaves ContainerCreating on Multi-Attach and a rolling update deadlocks against itself. Declare persistence.accessModes as ReadWriteMany on a filesystem that supports it, or set persistence.enabled=false and let the durable plane ship per-org state to object storage, or keep replicaCount (and autoscaling.maxReplicas) at 1." $peak) }}
  {{- end }}
  replicas: {{ $replicas }}
  # An RWO volume and a rolling update cannot coexist even at one replica: the
  # surge pod claims the same volume the pod it replaces still holds, so it waits
  # on Multi-Attach until the deadline. Recreate takes the outage instead of
  # hanging. Without that volume there is nothing to contend for, so the pods roll
  # — which is the whole point of the count above being honoured.
  #
  # This is the rule apps/platform already enforces on a customer app that
  # declares storage (apps/platform/k8s.go); cloud's own chart obeys it rather
  # than keeping a second opinion about the same physics.
  strategy:
    {{- if $rwo }}
    type: Recreate
    {{- else }}
    type: RollingUpdate
    rollingUpdate:
      # Never fewer than the declared count while rolling: a drained pod's orgs
      # are re-elected onto a READY peer, and at maxUnavailable>0 with one replica
      # there is no peer to elect. Surge one at a time so a bad image meets its
      # readiness probe before a second pod is spent on it.
      maxUnavailable: 0
      maxSurge: 1
    {{- end }}
  selector:
    matchLabels: {{- include "cloud.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "cloud.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "cloud.serviceAccountName" . }}
      # Exceed the in-process drain + final ship so a rolling pod hands off cleanly before
      # SIGKILL (see drain.go / serve.go shutdown).
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: cloud
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "--brand={{ .Values.hanzo.brand }}"
            - "--domain={{ .Values.hanzo.domain }}"
            - "--data-dir={{ .Values.hanzo.dataDir }}"
            - "--iam-issuer={{ .Values.hanzo.iamIssuer }}"
          # preStop belt-and-suspenders: give the endpoint controller a moment to remove
          # this pod before SIGTERM so no request is dialed to a tearing-down pod. The
          # in-process drain (drain.go) is the primary mechanism; this only sharpens it.
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 3"]
          env:
            # The tag actually deployed, surfaced as X-Api-Version so a running pod
            # says which build it is. Read at config.go's getenv("CLOUD_VERSION", …);
            # without it the binary falls back to the link-time default and every
            # deployment answers "dev", which makes a rollout unverifiable from
            # outside. Sourced from the same expression as image.tag above, so it
            # cannot drift from the image, and it needs no rebuild — the release
            # assigns the final version AFTER the image is pushed, so a link-time
            # stamp would race it (see version.go).
            - name: CLOUD_VERSION
              value: "{{ .Values.image.tag | default .Chart.AppVersion }}"
            # The count this Deployment declares, so Config.Validate checks the same
            # contract the template checked above and the two cannot drift. It is the
            # DECLARED count and not the live pod set: a `kubectl scale` past it leaves
            # this value behind, which the template's refusal cannot see either.
            - name: CLOUD_REPLICAS
              value: {{ $replicas | quote }}
            # Which backend holds embedded IAM's identity records — users, orgs, apps,
            # certs, and the session revocation rows. Empty or "sqlite" is the per-pod
            # file; anything else is a server every replica reaches alike, which is the
            # whole condition for running more than one of these pods.
            {{- if $iamStore }}
            - name: IAM_STORE_BACKEND
              value: {{ $iamStore | quote }}
            {{- end }}
            # The ceiling on the bare repositories git holds under {dataDir}/git,
            # in bytes. Absent is unbounded — the store grows with what has ever
            # been imported, which is what makes this claim large enough to need
            # ReadWriteOnce and therefore what pins the deployment to one replica.
            # Only a repository the forge or an upstream can hand back is ever
            # released, so this costs a refetch and never a repository.
            {{- if .Values.hanzo.gitCacheBytes }}
            - name: GIT_CACHE_BYTES
              value: {{ .Values.hanzo.gitCacheBytes | quote }}
            {{- end }}
            # THE MEMORY RESERVATION, HANDED TO THE PROCESS THAT MUST SIZE ITSELF BY IT.
            #
            # This host holds N lazily-started plugin children and bounds N so their
            # total fits what the pod RESERVED — the request, not the limit, because the
            # kubelet scores eviction candidacy against the reservation and a pod
            # comfortably inside its limit is still first to go once past its request
            # (which is how this one was evicted and took the API down). manifest.Warm
            # was that bound as a CONSTANT, sized by hand against 6Gi, so raising the
            # request bought capacity the host would not use and lowering it left the
            # host over a reservation nobody had told it about.
            #
            # A process cannot read its own request — the cgroup carries the LIMIT — so
            # the downward API is the only thing that can say it, and it says it in MiB.
            # Vertical scaling is now ONE number: change requests.memory and the ceiling
            # follows.
            - name: CLOUD_MEMORY_REQUEST_MIB
              valueFrom:
                resourceFieldRef:
                  containerName: cloud
                  resource: requests.memory
                  divisor: 1Mi
            # Stable pod identity (HRW weight) + namespace for the live membership source.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # Label selector that names this deployment's writer pods, so the live
            # membership source (membership_k8s.go) tracks the pod set in-cluster. Empty /
            # out-of-cluster falls back to the static self set — no flag, works everywhere.
            - name: CLOUD_PEER_SELECTOR
              value: "app.kubernetes.io/name={{ include "cloud.name" . }},app.kubernetes.io/instance={{ .Release.Name }}"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
            - name: zap
              containerPort: 9653
              protocol: TCP
          livenessProbe: {{- toYaml .Values.probes.liveness | nindent 12 }}
          readinessProbe: {{- toYaml .Values.probes.readiness | nindent 12 }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.hanzo.dataDir }}
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "cloud.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
