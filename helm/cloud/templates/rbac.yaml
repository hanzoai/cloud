{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cloud.serviceAccountName" . }}
  labels: {{- include "cloud.labels" . | nindent 4 }}
{{- end }}
{{- if .Values.rbac.create }}
---
# The live membership source (membership_k8s.go) lists+watches this deployment's own pods
# to track the writer set for zero-downtime rolling upgrades. Namespaced, read-only, scoped
# to pods — the least privilege that lets a replica see its peers leave/join.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "cloud.fullname" . }}-membership
  labels: {{- include "cloud.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cloud.fullname" . }}-membership
  labels: {{- include "cloud.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "cloud.fullname" . }}-membership
subjects:
  - kind: ServiceAccount
    name: {{ include "cloud.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
# The platform surface (/v1/platform/*) reads and writes a tenant's workloads: it puts each
# app in its own namespace as an operator App CR, watches the Deployment the operator makes
# from it, and gives it volumes. Those namespaces are created per tenant, so the grant has to
# be cluster-wide — a namespaced Role could only see namespaces that already existed.
#
# Every verb below is one the code actually calls; nothing is granted "just in case". Apps are
# replaced rather than edited, which is why there is no update or patch on them, and nothing
# here watches. Without this the whole surface answers 503 and reports itself degraded
# (`crd: false`) while Kubernetes itself is reachable.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "cloud.fullname" . }}-platform
  labels: {{- include "cloud.labels" . | nindent 4 }}
rules:
  - apiGroups: ["hanzo.ai"]
    resources: ["apps"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "create"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "create"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "patch"]
  - apiGroups: ["apps.hanzo.ai"]
    resources: ["applications"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "cloud.fullname" . }}-platform
  labels: {{- include "cloud.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "cloud.fullname" . }}-platform
subjects:
  - kind: ServiceAccount
    name: {{ include "cloud.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
