# hanzoai/cloud — Helm values
#
# Minimal chart: Deployment + Service + ConfigMap.
# Reference shape only — for richer ops use luxfi/operator and the
# Service CRD (operator wraps this shape with reconciliation).

image:
  repository: ghcr.io/hanzoai/cloud
  tag: ""          # defaults to .Chart.AppVersion when empty
  pullPolicy: IfNotPresent

imagePullSecrets: []

replicaCount: 1

# rbac grants the pod's ServiceAccount pods:list,watch so the LIVE membership source
# (membership_k8s.go) can track the writer set for zero-downtime rolling upgrades. When
# the durable plane is active, every replica elects org owners over this live set, so a
# draining/dead pod is never routed an org's traffic. Disable only for a single-replica
# deployment that never scales (the source falls back to self, no API access needed).
rbac:
  create: true
serviceAccount:
  create: true
  name: ""

# terminationGracePeriodSeconds MUST exceed the in-process drain (shardDrainGrace, ~6s,
# during which the pod stays serving NotReady so peers re-elect its orgs) PLUS the shutdown
# window (in-flight drain + final fenced ship, up to ~30s). 60s leaves headroom; a value
# below ~40s risks SIGKILL before a pod ships its last writes.
terminationGracePeriodSeconds: 60

# Brand / domain / enabled subsystems mirror the binary's CLI flags
# (cmd/cloud/main.go).
hanzo:
  brand: hanzo
  domain: api.hanzo.ai
  dataDir: /var/lib/cloud
  # OIDC issuer — REQUIRED. Without this the IAM mount refuses and the
  # process exits at start.
  iamIssuer: https://iam.hanzo.id
  # Comma-separated subsystem list (empty = all imported in cmd/cloud).
  # Payments + Vault are NEVER co-resident per HIP-0106 PCI isolation;
  # leave them off unless you fully understand the implications.
  #
  # platform (/v1/platform, order 124) + git (/v1/git, order 132) are the PaaS
  # control plane. A non-empty enable list mounts ONLY the named subsystems
  # (config.go Enabled), so both must be listed explicitly or the PaaS never
  # mounts. Their deps are already satisfied: platform seals secret env into the
  # kms plane (kms listed) and meters via deps.Metering (HTTP to commerce, or a
  # no-op when unset — commerce need NOT be co-resident); git needs none.
  enable: "iam,base,kms,gateway,o11y,platform,git"

service:
  type: ClusterIP
  httpPort: 8080
  metricsPort: 9090
  zapPort: 9653

persistence:
  # Per-tenant SQLite (HIP-0302) lives under dataDir. Set to an
  # appropriate PVC for production; emptyDir is fine for dev.
  enabled: false
  size: 20Gi
  storageClass: ""
  accessModes:
    - ReadWriteOnce

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

probes:
  liveness:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 30
    periodSeconds: 30
  # Readiness targets /readyz on the ops (metrics) listener, which returns 503 the moment
  # the process begins a graceful shutdown (drain.go) — so Kubernetes marks the pod
  # NotReady and stops routing to it BEFORE it tears down. Liveness stays on /health (200
  # throughout the drain) so the pod is never killed mid-drain. Keep readiness on the
  # metrics port: /readyz there is the ONLY drain-aware endpoint.
  readiness:
    httpGet:
      path: /readyz
      port: metrics
    initialDelaySeconds: 5
    periodSeconds: 5
