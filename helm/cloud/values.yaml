# hanzoai/cloud — Helm values
#
# Minimal chart: Deployment + Service + ConfigMap.
# Reference shape only — for richer ops use luxfi/operator and the
# Service CRD (operator wraps this shape with reconciliation).

image:
  repository: ghcr.io/hanzoai/cloud
  tag: ""          # defaults to .Chart.AppVersion when empty
  pullPolicy: IfNotPresent

imagePullSecrets: []

# replicaCount is HONOURED, and above 1 the chart checks the two things that
# genuinely forbid a second pod (see templates/deployment.yaml): embedded IAM on
# its per-pod store, and a ReadWriteOnce volume. Each refuses to render and says
# how to lift it, rather than quietly rendering 1.
replicaCount: 1

# rbac grants the pod's ServiceAccount pods:list,watch so the LIVE membership source
# (membership_k8s.go) can track the writer set for zero-downtime rolling upgrades. When
# the durable plane is active, every replica elects org owners over this live set, so a
# draining/dead pod is never routed an org's traffic. Disable only for a single-replica
# deployment that never scales (the source falls back to self, no API access needed).
rbac:
  create: true
serviceAccount:
  create: true
  name: ""

# terminationGracePeriodSeconds MUST exceed the in-process drain (shardDrainGrace, ~6s,
# during which the pod stays serving NotReady so peers re-elect its orgs) PLUS the shutdown
# window (in-flight drain + final fenced ship, up to ~30s). 60s leaves headroom; a value
# below ~40s risks SIGKILL before a pod ships its last writes.
terminationGracePeriodSeconds: 60

# Brand / domain / data dir / issuer mirror the binary's CLI flags
# (cmd/cloud/main.go).
hanzo:
  # brand is the ONE value a white-label deployment states. domain and iamIssuer
  # DERIVE from it (brand.APIHost / brand.IssuerFor) and are empty here on
  # purpose: an empty flag is skipped rather than forwarded (cmd/cloud forward),
  # so the binary's brand derivation runs. Set either one only to PIN a value
  # that is not the brand's own — a vanity API host, a staging issuer.
  brand: hanzo
  # domain: api.hanzo.ai   <- derived from brand; state it only to override.
  domain: ""
  dataDir: /var/lib/cloud
  # OIDC issuer. Derived from brand — hanzo→https://hanzo.id, lux→https://lux.id,
  # zoo→https://zoolabs.id — so leave it empty unless pinning.
  #
  # This read `https://iam.hanzo.id`, which is not in the brand registry and is
  # not the issuer IAM actually stamps. Because the template renders the flag
  # unconditionally, that wrong value WON on every chart deployment and the brand
  # derivation never ran. An issuer that does not equal the token's `iss` fails
  # every real token and anonymizes every principal — see brand/brand.go, which
  # spells out that exact failure for the near-miss spelling iam.hanzo.ai.
  iamIssuer: ""
  # The app set is NOT configured here. The binary knows which apps it was
  # built with (manifest.Apps) and Listen sets it; a values file restating
  # the set can only ever disagree with it, which is what config.go records
  # two devnet outages for. There is no --enable flag to render into.
  # Which backend holds embedded IAM's identity records — users, orgs, applications,
  # signing certs, and the session revocation rows (apps/iam.openStore).
  #
  #   ""/"sqlite"  the encrypted per-pod file at {dataDir}/iam/iam.db
  #   "sql"        hanzoai/sql over ZAP — no path, no per-file key, reached
  #                identically from every replica
  #
  # It is the ONE condition on running more than one of these pods with iam
  # enabled. Sessions themselves are already replica-correct: a session is a
  # signed cookie whose MAC key comes from the platform signing cert — chosen
  # deterministically from the referenced cert set precisely so every replica
  # picks the same one — plus a revocation row in this store. What does not
  # survive a second pod is the STORE, when it is a file on one pod's volume.
  iamStore: ""
  # The ceiling in BYTES on the bare repositories git materializes under
  # {dataDir}/git. Empty is UNBOUNDED, and unbounded is what every deployment
  # keeps until an operator has looked at their volume: this reclaims disk by
  # DELETING repositories, and a chart default that starts doing that on a
  # rollout would be the worst kind of surprise.
  #
  # It is bytes and not a repository count because the constraint is a volume.
  # Measured on the production claim: 3,160 repositories ranging from 36KB to
  # 10.4GB, so a count bounds nothing.
  #
  # ONLY A REPOSITORY THAT CAN BE FETCHED AGAIN IS EVER RELEASED — one imported
  # by a mirror, whose source answered, and which has not been pushed to since.
  # Everything else is pinned, so setting this can cost a refetch and cannot
  # cost a repository. A store held above the ceiling with nothing releasable
  # says so in the log rather than reclaiming something it cannot restore.
  gitCacheBytes: ""

service:
  type: ClusterIP
  httpPort: 8080
  metricsPort: 9090
  zapPort: 9653

persistence:
  # Per-tenant SQLite (HIP-0302) lives under dataDir. Set to an
  # appropriate PVC for production; emptyDir is fine for dev.
  #
  # ReadWriteOnce is a block volume and attaches to ONE node, so it is the second
  # thing that forbids a second replica — the chart refuses to render that
  # combination rather than emitting pods that deadlock on Multi-Attach. It also
  # forces strategy: Recreate at one replica, because a surge pod would contend
  # with the pod it replaces for the same volume.
  #
  # The way OUT of that is not a bigger volume: it is needing less on it. The
  # durable plane (internal/org + hanzoai/ha + hanzoai/vfs/replica) already elects
  # one writer per org and ships that org's SQLite to object storage, so per-org
  # state does not require the shared disk. What still does is whatever is not on
  # that plane.
  enabled: false
  size: 20Gi
  storageClass: ""
  accessModes:
    - ReadWriteOnce

# MEASURED ON THE RUNNING POD, not chosen. An empty resources block gives the
# scheduler no signal and leaves the HPA below nothing to compute a utilization
# against, so it can neither place this pod nor scale it.
#
# The request is what binds, twice over. The kubelet scores eviction candidacy
# against the RESERVATION, so a pod inside its limit is still first to go once
# past its request — measured, in the kubelet's own words when it killed this one:
# "was using 11406568Ki, request is 6Gi, has larger consumption of memory", and at
# one replica each such reclaim was a full API outage. And the HPA computes
# utilization as usage/request, so the request is the denominator of every scaling
# decision.
#
# 6Gi is the plugin catalog, not the traffic: this host holds up to
# manifest.Warm() lazily-started children at a measured mean of 167MiB each, plus
# ~200MiB of host. That is why memory is not an autoscaling signal below, and why
# raising this number is what gives the host room rather than raising a constant.
resources:
  requests:
    cpu: "1"
    memory: 6Gi
  limits:
    cpu: "4"
    memory: 11Gi

# HORIZONTAL AUTOSCALING — ON CPU, AND DELIBERATELY NOT ON MEMORY.
#
# Memory here tracks how much of the CATALOG is warm, not how much work is
# arriving: each subsystem is a child process started by the first request to its
# prefix and reaped after 15 idle minutes, bounded by manifest.Warm(). So resident
# memory climbs to roughly that bound and stays there whatever the load. Measured
# on the production pod an hour apart: CPU 439m → 761m (+73%) while memory went
# 1824Mi → 1843Mi (+1%). A memory target would sit flat through a real surge and
# then latch a scale-up that never comes back down.
#
# maxReplicas participates in the render-time checks above, because a ceiling of 6
# is a claim that six of these may run — if that is not true the chart says so
# now, rather than at 3am when the HPA acts on it.
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: 65
nodeSelector: {}
tolerations: []
affinity: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

probes:
  liveness:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 30
    periodSeconds: 30
  # Readiness targets /readyz on the ops (metrics) listener, which returns 503 the moment
  # the process begins a graceful shutdown (drain.go) — so Kubernetes marks the pod
  # NotReady and stops routing to it BEFORE it tears down. Liveness stays on /health (200
  # throughout the drain) so the pod is never killed mid-drain. Keep readiness on the
  # metrics port: /readyz there is the ONLY drain-aware endpoint.
  readiness:
    httpGet:
      path: /readyz
      port: metrics
    initialDelaySeconds: 5
    periodSeconds: 5
