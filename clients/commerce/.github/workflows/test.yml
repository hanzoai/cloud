name: Test

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  go-vet:
    name: Go Vet
    runs-on: hanzo-build-linux-amd64
    env:
      # Resolve private hanzoai/* Go modules (cloud external + the in-repo
      # thirdparty/ethereum nested module) the same way the Docker build does:
      # GOPRIVATE skips the public proxy/sumdb and GOWORK=off avoids the stale
      # committed go.work.sum ("SECURITY ERROR"), so deps resolve via direct git
      # authenticated with UNIVERSE_PAT. Without this the bare `go vet` fell back
      # to an unauthenticated fetch and failed on EVERY commit.
      GOPRIVATE: github.com/hanzoai/*
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: ./go.mod

      - name: Configure private Go modules
        env:
          UNIVERSE_PAT: ${{ secrets.UNIVERSE_PAT }}
        run: git config --global url."https://x-access-token:${UNIVERSE_PAT}@github.com/".insteadOf "https://github.com/"

      - name: Fetch @hanzo/plans
        # api/billing/plans/ is gitignored (@hanzo/plans is the SOT, fetched at
        # build). api/billing/plans.go go:embed's plans/{dns,subscription}.json,
        # so this MUST run before `go vet` compiles the package. Public npm, no auth.
        run: sh scripts/fetch-plans.sh

      - name: Run go vet
        run: go vet ./...

  go-tests:
    name: Go Tests
    runs-on: hanzo-build-linux-amd64
    needs: [go-vet]
    env:
      CGO_ENABLED: 1
      GOPRIVATE: github.com/hanzoai/*
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: ./go.mod

      - name: Configure private Go modules
        env:
          UNIVERSE_PAT: ${{ secrets.UNIVERSE_PAT }}
        run: git config --global url."https://x-access-token:${UNIVERSE_PAT}@github.com/".insteadOf "https://github.com/"

      - name: Fetch @hanzo/plans
        # api/billing/plans/ is gitignored; go:embed needs it before compiling.
        run: sh scripts/fetch-plans.sh

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc

      - name: Run unit tests
        run: |
          go test -v -count=1 -timeout=10m \
            ./billing/... \
            ./delay/... \
            ./models/creditgrant/... \
            ./models/pricingrule/... \
            ./models/cryptobalance/... \
            ./models/cryptopaymentintent/... \
            ./models/networktoken/... \
            ./models/product/... \
            ./payment/...

      - name: Run Ginkgo test suites
        # Run the ginkgo CLI pinned by go.mod (v2.28.1) via `go run`, NOT
        # `go install ...@latest` — the latter mismatched the library version
        # ("Mismatched package versions found") and risked flag/discovery errors.
        run: |
          go run github.com/onsi/ginkgo/v2/ginkgo -r --randomize-all --fail-fast --trace \
            --skip-package=test-integration \
            test/
