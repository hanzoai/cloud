# Hanzo blueprint: WordPress — the CMS + its MariaDB database.
# Uses the legacy top-level resource keys (cpus / mem_limit / mem_reservation);
# the db declares memory only, so the estimator fills cpu from the db default.
services:
  wordpress:
    image: wordpress:6-php8.2-apache
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-wordpress}
      WORDPRESS_DB_NAME: wordpress
    cpus: "0.5"
    mem_limit: 512m
    depends_on:
      - db
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: ${DB_PASSWORD:-wordpress}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-wordpress}
    mem_reservation: 1g
    volumes:
      - wpdb:/var/lib/mysql
volumes:
  wpdb:
