# ---- templates: reusable prompts/snippets referenced by steps ----
templates:
  - id: facebook-access-request
    title: "Facebook access-request email"
    enabled: true
    body: |
      Hi {client_name}!

      To get started we'll need access to your Facebook Page and advertising account,
      your Google Analytics account and your AdWords account.

      Facebook:
      If you are not using Facebook Business manager, you'll want to convert to that
      first. This guide outlines the process: https://www.facebook.com/help/1428785834029669/.

      Once your page and ad account is managed by a Facebook Business account, go to the
      Ad Account tab in Business manager and click Assign Agency. Use this number to grant
      us access: 920910517982389. We need admin access to both the page and ad account.
  - id: facebook-agency-grant
    title: "Facebook agency grant"
    enabled: true
    body: |
      In Business Manager -> Ad Account tab -> Assign Agency, grant agency number
      920910517982389 ADMIN access to BOTH the Page and the Ad Account.
  - id: google-analytics-permissions
    title: "Google Analytics permission set"
    enabled: true
    body: |
      Add youremail@hanzo.ai (and zach@hanzo.ai) at the Google Analytics ACCOUNT level
      (not a property) with: Manage Users, Edit, Collaborate, Read & Analyze.
  - id: adwords-mcc-link
    title: "AdWords MCC link"
    enabled: true
    body: |
      Ask the client for their Google AdWords account number. In our MCC: Accounts ->
      + Account -> Link existing account with their number -> invite them to allow us to manage.
  - id: mailchimp-mandrill-domain
    title: "Mailchimp / Mandrill sending domain (DKIM + SPF)"
    enabled: true
    body: |
      In Mandrill: Settings > Sending Domains -> add {domain}. Verify by emailing an address
      ending in {domain} and clicking the link. Add the DKIM TXT record to Cloudflare, and
      the SPF TXT record Mandrill specifies. DNS can take time but often updates immediately.
  - id: adwords-campaign-structure
    title: "AdWords default campaign structure"
    enabled: true
    body: |
      US-only initially. Separate brand keywords into their own campaigns. Split every
      audience at the campaign level. Example ({product} = the product name):
        {product} US - Search - Brand (Exact, Phrase, Broad/Modified)
        {product} US - Search - Generic (Exact, Phrase, Broad/Modified)
        {product} US - Display - Topic / Keywords / Placements / In-market / Affinity / Similar / Remarketing
        {product} US - Video - In-market / Affinity / Keyword / Topic / Similar / Remarketing
