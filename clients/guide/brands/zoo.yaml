# zoo.yaml — the Zoo brand's default Business AI Guide blueprint (white-label).
#
# Zoo Labs Foundation is an open AI research network (DeAI / DeSci). The journey
# reframes the base launch playbook for a research org: form the foundation, open
# membership and grants, publish your research thesis, and run the agentic-research
# growth loop — all on the SAME Hanzo surfaces (/v1/company, /v1/content,
# /v1/analytics, /v1/automations), white-labeled as Zoo. It is DATA: this file is
# the whole customization — no code change (see clients/guide/brands.go).
#
# Same Blueprint schema as base.yaml (see blueprint.go — Section / Step / Strategy /
# Template, each with an `enabled` lever). This brand ships a thin STEPS-only journey
# (no sections/strategies/templates); AI-ready steps bind the real content_generate
# tool, assisted steps guide the researcher to the Zoo surface. It is seeded into the
# shared brand-blueprint store on Mount and is then SuperAdmin-editable, exactly like
# the base blueprint.
version: zoo-1
brand: zoo
title: Launch your research org on Zoo
enabled: true
steps:
  - {id: foundation, title: "Form your foundation", detail: "Run the entity wizard in Zoo Company (/v1/company) — the legal research entity grants, memberships, and collaborations attach to.", deps: [], enabled: true, draft: "Draft the founding basics for a new open-AI research foundation on Zoo: a suggested name, entity type, and a one-line research mission. Return plain text."}
  - {id: members, title: "Open membership and governance", detail: "Issue membership and governance rights in Zoo Cap Table (/v1/captable) — your members and their voting power are the source of truth for who governs the research and its funding.", deps: [foundation], enabled: true}
  - id: thesis
    title: "Publish your research thesis"
    detail: "Draft a thesis Campaign in Zoo Content (/v1/content) — a sharp one-line thesis is the seed every artifact grows from. The Research AI can write the first draft."
    deps: [foundation]
    enabled: true
    signal: acted
    tool: content_generate
    draftInto: brief
    draft: >
      Write a single crisp research thesis (one sentence) plus three supporting
      bullets for an open-AI research org launching on Zoo. Return plain text.
    args:
      doctype: Campaign
      title: Research thesis
  - id: site
    title: "Publish your research site"
    detail: "Generate a site Asset in Zoo Content and publish it — the public destination every paper, grant, and collaborator link points at. The Research AI drafts the copy."
    deps: [thesis]
    enabled: true
    signal: acted
    tool: content_generate
    draftInto: brief
    draft: >
      Write research-site copy — a headline, subheadline, three research pillars,
      and a call to contribute — for the thesis above. Return plain text sections.
    args:
      doctype: Asset
      title: Research site
  - {id: signals, title: "Turn on analytics", detail: "Instrument your site so events flow to Zoo Analytics (/v1/analytics). Once events arrive for your org this step completes itself.", deps: [site], enabled: true, signal: analytics}
  - {id: contributors, title: "Open a contributor waitlist", detail: "Enable the Zoo waitlist surface (/v1/waitlist) and point your site's contribute CTA at it — capture researcher interest before you are fully live.", deps: [site], enabled: true}
  - {id: grants, title: "Open a grant program", detail: "Configure a grant program in Zoo Referrals (/v1/referrals) and share the application link — grants turn your treasury into research output.", deps: [site], enabled: true}
  - {id: autopilot, title: "Turn on the daily research loop", detail: "Enable a scheduled flow in Zoo Automations (/v1/automations) — generate → review → publish — so the Research AI runs your outreach daily.", deps: [signals, contributors], enabled: true}
  - {id: launch, title: "Launch", detail: "With your foundation, thesis, site, analytics, waitlist, and grants in place, announce your research to the world and open it to contributors.", deps: [site, signals, contributors, grants], enabled: true}
