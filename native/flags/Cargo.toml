[package]
name = "hanzo-flags"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Stateless PostHog-compatible flag evaluator embedded into hanzoai/cloud over FFI"

[lib]
name = "hanzo_flags"
crate-type = ["staticlib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
dateparser = "0.2"
fancy-regex = "0.14"
semver = "1"
tracing = "0.1"
regex = "1"
once_cell = "1"

[profile.release]
lto = "thin"
codegen-units = 1

[dev-dependencies]
test-case = "3"
