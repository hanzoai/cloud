# Single-node VPS deployment of the unified hanzoai/cloud binary (HIP-0106).
#
# Mounts the iam + base + kms + gateway + o11y subsystems in-process.
# Payments / Vault stay out-of-process per HIP-0106 PCI scope; configure
# their ZAP endpoints via env if you need them.
#
# Usage:
#   cp deploy/compose.env.example deploy/compose.env
#   # edit HANZO_BRAND, HANZO_DOMAIN, HANZO_IAM_ISSUER
#   docker compose -f deploy/compose.yml --env-file deploy/compose.env up -d
#
# Health check:
#   curl http://localhost:8080/health

services:
  cloud:
    image: ghcr.io/hanzoai/cloud:${HANZO_CLOUD_TAG:-latest}
    container_name: hanzo-cloud
    restart: unless-stopped
    ports:
      - "${HANZO_HTTP_PORT:-8080}:8080"
      - "${HANZO_METRICS_PORT:-9090}:9090"
      - "${HANZO_ZAP_PORT:-9653}:9653"
    environment:
      HANZO_BRAND: ${HANZO_BRAND:-hanzo}
      HANZO_DOMAIN: ${HANZO_DOMAIN:-api.hanzo.local}
      HANZO_DATA_DIR: /var/lib/cloud
      HANZO_IAM_ISSUER: ${HANZO_IAM_ISSUER:-https://iam.hanzo.id}
      HANZO_ENABLE: ${HANZO_ENABLE:-iam,base,kms,gateway,o11y}
    command:
      - "--brand=${HANZO_BRAND:-hanzo}"
      - "--domain=${HANZO_DOMAIN:-api.hanzo.local}"
      - "--data-dir=/var/lib/cloud"
      - "--iam-issuer=${HANZO_IAM_ISSUER:-https://iam.hanzo.id}"
    volumes:
      - cloud-data:/var/lib/cloud
    # /smoke, not `wget /health`. The image is distroless: there is no shell for
    # CMD-SHELL and no busybox wget to run in it. /smoke is the prober this repo
    # already ships beside /cloud (plugin/smoke), and `-class health` is the narrow
    # question a healthcheck asks — /v1/base/health, /v1/health and /readyz 200,
    # and /v1/health's `degraded` list empty.
    #
    # The last two are what a status code alone cannot reach. `degraded` names a
    # plane that mounted fail-closed: it answers an honest 503 on its own routes
    # while the front door stays 200. /readyz is the HOST's answer rather than a
    # plugin's, and it is the only one that can see a sibling that never started —
    # 503 when the absent app is Vital, which `ai`, the owner of /v1, is.
    #
    # NOT the whole matrix. The release gate runs every class because a release
    # must route every surface; a deployment need not, and a 404 on a prefix this
    # deployment does not enable is its shape, not its health. Measured: the full
    # matrix reports 7 failures against a single-node cloud that is serving.
    healthcheck:
      test: ["CMD", "/smoke", "-class", "health", "-base", "http://127.0.0.1:8080", "-timeout", "5"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 60s

volumes:
  cloud-data:
    driver: local
