name: release

# Builds and pushes ghcr.io/hanzoai/cloud:<tag> on tag (v*) / main / dispatch.
#
# Delegates to the canonical shared reusable workflow
# (hanzoai/.github docker-build.yml), which runs on the self-hosted arcd
# pools — NEVER GitHub-hosted runners. This is deliberate: GitHub-hosted
# Actions for this org are subject to a billing freeze (jobs fail in ~5s with
# "recent account payments have failed"), so the bespoke ubuntu-latest build
# could never start. The shared workflow also injects the org GH_PAT as the
# BuildKit `gh_token` secret, which the Dockerfile consumes to fetch private
# cross-org Go modules (hanzoai/*, luxfi/*) over authenticated git.
#
# amd64-only: the cloud-api cluster (do-sfo3-hanzo-k8s) is amd64, and pinning a
# single platform guarantees the build completes on an available evo runner
# without blocking on the (often scaled-to-zero) arm64 spark pool.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  docker:
    uses: hanzoai/.github/.github/workflows/docker-build.yml@main
    with:
      image: ghcr.io/hanzoai/cloud
      platforms: linux/amd64
    secrets: inherit
