name: Publish OCI Image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Zero credentials, zero GOPRIVATE: every module must resolve from
      # proxy.golang.org and verify against sum.golang.org.
      - name: Build and vet with no credentials (public Go proxy only)
        env:
          GIT_TERMINAL_PROMPT: "0"
          GIT_SSH_COMMAND: "false"
          GOENV: "off"
          GOWORK: "off"
          GOPROXY: https://proxy.golang.org
          GOSUMDB: sum.golang.org
          GOFLAGS: -mod=readonly
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          go build ./...
          go vet ./...

      - name: OSS boundary, host lifecycle, fault-isolation & race tests
        env:
          GOENV: "off"
          GOWORK: "off"
          GOPROXY: https://proxy.golang.org
          GOSUMDB: sum.golang.org
          CLOUD_KMS_MASTER_KEY_REF: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          CONSOLE_CSRF_KEY: "ZGV2LWNzcmYta2V5LWZvci10ZXN0cy1vbmx5LTAwMDA="
        run: |
          set -euo pipefail
          go test -race ./cmd/cloud/... ./manifest/... ./sdk/coord/... ./apps/iam ./apps/event -count=1
          CGO_ENABLED=0 go test -tags 'sqlite_fts5 sqlite_math_functions' ./sdk/plan/... ./openapi -count=1

  publish-arch:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: true
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build light host and OSS plugin fleet (${{ matrix.arch }})
        env:
          GIT_TERMINAL_PROMPT: "0"
          GIT_SSH_COMMAND: "false"
          GOENV: "off"
          GOWORK: "off"
          GOPROXY: https://proxy.golang.org
          GOSUMDB: sum.golang.org
          GOFLAGS: -mod=readonly
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::7}"
          VERSION="${GITHUB_REF_NAME}-${SHORT_SHA}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${SHORT_SHA}" >> "$GITHUB_ENV"

          OUT="dist/linux-${{ matrix.arch }}"
          mkdir -p "${OUT}/var/lib/cloud/run"
          GOOS=linux GOARCH="${{ matrix.arch }}" go build -trimpath \
            -tags "sqlite_fts5 sqlite_math_functions" \
            -ldflags="-s -w -X github.com/hanzoai/cloud/sdk/env.version=${VERSION} -X github.com/hanzoai/cloud/sdk/env.revision=${GITHUB_SHA}" \
            -o "${OUT}/cloud" ./cmd/cloud

          SPAWNED="$(sed -n '/Coresident: *true/d; s/.*{Name: "\([^"]*\)".*/\1/p' manifest/apps.go)"
          GOOS=linux GOARCH="${{ matrix.arch }}" go build -trimpath \
            -tags "sqlite_fts5 sqlite_math_functions" \
            -ldflags="-s -w" \
            -o "${OUT}/" ./plugin/smoke $(printf './plugin/%s ' $SPAWNED)

          chmod 0755 "${OUT}"/* 2>/dev/null || true
          chmod 0755 "${OUT}/var/lib/cloud" "${OUT}/var/lib/cloud/run"
          tar --owner=65532 --group=65532 --mtime='@0' -cf "dist/layer-${{ matrix.arch }}.tar" -C "${OUT}" .

      - name: Push per-arch OCI image (${{ matrix.arch }})
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BIN="${HOME}/.local/bin"
          mkdir -p "${BIN}"
          export PATH="${BIN}:${PATH}"

          if ! command -v crane >/dev/null 2>&1; then
            CRANE_VER="v0.20.3"
            curl -fsSL "https://github.com/google/go-containerregistry/releases/download/${CRANE_VER}/go-containerregistry_Linux_x86_64.tar.gz" \
              | tar xz -C "${BIN}" crane
          fi

          printf '%s' "${GITHUB_TOKEN}" | crane auth login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

          REPO="ghcr.io/hanzoai/cloud-oss"
          if [[ "${{ matrix.arch }}" == "amd64" ]]; then
            BASE="gcr.io/distroless/static-debian12:nonroot@sha256:52dcfbabb7457ea47c82f6e13af8c8a4a1d9f7b0145142b3ecab20f2b888411d"
          else
            BASE="gcr.io/distroless/static-debian12:nonroot@sha256:06c3c14b7fa252d9f4285242d2d665ce3b51f74b02d3c529464f220f2912aecb"
          fi

          TAG="${REPO}:sha-${SHORT_SHA}-${{ matrix.arch }}"
          crane mutate "${BASE}" \
            --append "dist/layer-${{ matrix.arch }}.tar" \
            --entrypoint /cloud \
            -u 65532:65532 \
            -e CLOUD_LISTEN=:8080 \
            -e CLOUD_DATA_DIR=/var/lib/cloud \
            -e ZIP_RUNTIME_DIR=/var/lib/cloud/run \
            -l org.opencontainers.image.source=https://github.com/hanzoai/cloud \
            -l org.opencontainers.image.title="Hanzo Cloud (OSS)" \
            -l org.opencontainers.image.licenses="Apache-2.0 OR MIT" \
            -l org.opencontainers.image.revision="${GITHUB_SHA}" \
            -l org.opencontainers.image.version="${VERSION}" \
            -t "${TAG}"

  publish-index:
    if: github.event_name != 'pull_request'
    needs: publish-arch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publish multi-arch OCI manifest index
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BIN="${HOME}/.local/bin"
          mkdir -p "${BIN}"
          export PATH="${BIN}:${PATH}"

          if ! command -v crane >/dev/null 2>&1; then
            CRANE_VER="v0.20.3"
            curl -fsSL "https://github.com/google/go-containerregistry/releases/download/${CRANE_VER}/go-containerregistry_Linux_x86_64.tar.gz" \
              | tar xz -C "${BIN}" crane
          fi

          printf '%s' "${GITHUB_TOKEN}" | crane auth login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

          SHORT_SHA="${GITHUB_SHA::7}"
          VERSION="${GITHUB_REF_NAME}-${SHORT_SHA}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi

          REPO="ghcr.io/hanzoai/cloud-oss"
          AMD64_TAG="${REPO}:sha-${SHORT_SHA}-amd64"
          ARM64_TAG="${REPO}:sha-${SHORT_SHA}-arm64"

          crane index append -m "${AMD64_TAG}" -m "${ARM64_TAG}" -t "${REPO}:sha-${SHORT_SHA}"

          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            crane index append -m "${AMD64_TAG}" -m "${ARM64_TAG}" -t "${REPO}:main"
            crane index append -m "${AMD64_TAG}" -m "${ARM64_TAG}" -t "${REPO}:latest"
          fi
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            crane index append -m "${AMD64_TAG}" -m "${ARM64_TAG}" -t "${REPO}:${VERSION}"
            crane index append -m "${AMD64_TAG}" -m "${ARM64_TAG}" -t "${REPO}:v${VERSION}"
          fi
