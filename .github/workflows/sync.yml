name: Sync to Hanzo Git
# GitHub's only job for this repo is to hand main to git.hanzo.ai, which is
# canonical and owns build, publish and deploy through .hanzo/workflows/cicd.yml.
# Nothing here builds, tests, or deploys — that all runs on our own PaaS.
#
# This PUSHES the ref rather than asking the forge to pull it. A push is
# deterministic and needs no timer, and it fails visibly when it does not happen.
# The previous per-repo sync workflow asked the forge to pull and exited 0 when
# its token was absent, so on every repo but one it reported success while doing
# nothing. Silence is the failure mode worth designing out.
#
# Requires the forge repo to be a normal repository. While hanzoai/cloud is a
# Gitea PULL MIRROR the forge refuses the push and this job fails — that failure
# is the honest signal that CD is not running. Convert it with hanzoai/.github
# `scripts/forge-migrate.sh convert --repo hanzoai/cloud`, which also enables
# Actions there so cicd.yml can execute.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch: {}

concurrency:
  group: sync-to-hanzo-git
  cancel-in-progress: false # never abandon a half-delivered ref

jobs:
  push-to-forge:
    # Our own pool. GitHub-hosted minutes are billing-blocked for this org, so a
    # hosted runner is a coin flip on the invoice; the build pool always runs.
    runs-on: hanzo-build-linux-amd64
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the forge needs full history, not a shallow tip

      - name: Push main and release tags to git.hanzo.ai
        env:
          # Instance token for git.hanzo.ai. The value lives in KMS at
          # hanzo/prod:/git/admin-token and must be a REPOSITORY secret here.
          #
          # It reads like an organization secret belongs here, and that is what
          # this file used to say. It does not work: hanzoai is on the GitHub
          # FREE plan, where organization secrets reach PUBLIC repositories only.
          # This repo is private, so an org secret arrives as the empty string —
          # no error, no warning, and the REST API still reports the secret as
          # visible to this repo. The empty value simply trips the guard below.
          # Set it per-repo until the org is on Team, or the plan will keep
          # eating the credential silently:
          #   gh secret set HANZO_GIT_TOKEN -R hanzoai/cloud --body "$V"
          HANZO_GIT_TOKEN: ${{ secrets.HANZO_GIT_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${HANZO_GIT_TOKEN:-}" ]; then
            echo "::error::HANZO_GIT_TOKEN is empty, so main was not handed to git.hanzo.ai and no build ran. Set it as a REPOSITORY secret on hanzoai/cloud (value in KMS at hanzo/prod:/git/admin-token) — on the Free plan an organization secret resolves to empty in a private repo."
            exit 1
          fi
          # A rejection here is not a credential problem. It means git.hanzo.ai
          # holds commits this ref does not contain — the forge is canonical and
          # runs ahead — and the reconciliation is a MERGE made on the forge
          # ("Merge github/main into canonical"), never a force-push from here.
          if ! git push --follow-tags \
            "https://x-access-token:${HANZO_GIT_TOKEN}@git.hanzo.ai/hanzoai/cloud.git" \
            "${GITHUB_SHA}:refs/heads/main"; then
            echo "::error::git.hanzo.ai refused ${GITHUB_SHA}. If this is non-fast-forward, canonical main has commits GitHub does not; merge github/main into canonical ON THE FORGE and push that merge. Do not force-push — it would drop canonical-only history."
            exit 1
          fi
          echo "handed ${GITHUB_SHA} to git.hanzo.ai — build, publish and deploy run there"
