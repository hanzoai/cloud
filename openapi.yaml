        revenue, an overdrawn wallet), sharpest first. An empty list means the books look clean;
        the detector is deterministic over the ledger and invents nothing.
      operationId: get_v1_books_questions
      parameters:
      - description: |-
          Sandbox reads the org's SANDBOX ledger when it is exactly "true"; anything else
          reads the live one.
        example: "false"
        in: query
        name: sandbox
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionsResponse'
          description: ok
      summary: |-
        ListQuestions returns the clarifying questions the caller's own recent GL raises — the
        unusual postings a founder should look at (outliers, reversals, round-offs, uncosted
        revenue, an overdrawn wallet), sharpest first.
      tags:
      - books
  /v1/books/rules:
    get:
      description: |-
        ListRules returns the org's auto-categorization rules, highest priority first. A rule
        is a standing instruction — "anything whose merchant contains X books to category Y" —
        and it overrides a vendor's default category, so this is the list that decides how a
        future bill classifies itself.
      operationId: get_v1_books_rules
      parameters:
      - description: |-
          Sandbox reads the org's SANDBOX ledger when it is exactly "true"; anything else
          reads the live one.
        example: "false"
        in: query
        name: sandbox
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rulesOut'
          description: ok
      summary: ListRules returns the org's auto-categorization rules, highest priority
        first.
      tags:
      - books
    post:
      description: |-
        UpsertRule creates or updates one auto-categorization rule, keyed by its pattern —
        writing a pattern that already exists REPLACES that row's category and priority. The
        category is normalized to a real COA expense account, and anything unrecognized becomes
        5900 Uncategorized rather than a guessed real account. It answers the row exactly as
        stored, so the caller sees the normalization. A rule overrides a vendor's default
        category, so this is the standing instruction that decides how a future bill classifies.
      operationId: post_v1_books_rules
      requestBody:
        content:
          application/json:
            example:
              category: cloud
              pattern: aws
              priority: 5
            schema:
              $ref: '#/components/schemas/Rule'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rule'
          description: ok
      summary: |-
        UpsertRule creates or updates one auto-categorization rule, keyed by its pattern —
        writing a pattern that already exists REPLACES that row's category and priority.
      tags:
      - books
  /v1/books/scan:
    post:
      operationId: post_v1_books_scan
      tags:
      - books
  /v1/books/scan/book:
    post:
      description: |-
        BookScan posts a reviewed scanned bill to the ledger. It is the scanner's ONLY write:
        the voucher goes through the same post() choke point every other source uses, so it is
        checked to balance (Σdebit == Σcredit) and is idempotent by (scan, scanId) — re-booking
        the same scan answers posted=false and writes nothing. A bill whose economic identity
        (vendor, total, issue date) already posted under a DIFFERENT scan is refused 409 unless
        override is set, which is what stops the same receipt re-scanned into a new file hash
        from double-booking. An unbalanced voucher is refused 400.
      operationId: post_v1_books_scan_book
      requestBody:
        content:
          application/json:
            example:
              scanId: a5f3c1
              voucher:
                description: GitHub
                legs:
                - account: "5300"
                  debit: 1234
                - account: "2001"
                  credit: 1234
            schema:
              $ref: '#/components/schemas/BookRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookResponse'
          description: ok
      summary: BookScan posts a reviewed scanned bill to the ledger.
      tags:
      - books
  /v1/books/sync:
    post:
      description: |-
        Sync ingests the caller's OWN org from commerce into BOTH ledgers (live and sandbox)
        and reports how many new vouchers posted to each. It is idempotent — money that has
        already been booked posts nothing on a repeat — and it is read-only against commerce:
        it never mints a deposit, a credit or a payout, only the accounting twin of money that
        already moved.
      operationId: post_v1_books_sync
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/syncIn'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/syncTally'
          description: ok
      summary: |-
        Sync ingests the caller's OWN org from commerce into BOTH ledgers (live and sandbox)
        and reports how many new vouchers posted to each.
      tags:
      - books
  /v1/books/transactions:
    get:
      description: |-
        ListTransactions returns the org's booked ledger as a single-line register, newest
        first: one row per voucher, with its date, description, vendor, category, source and
        amount in exact cents. It is the double-entry ledger projected to the register a human
        reads, filterable by posting-time window, category and vendor. Strictly read-only — it
        restates the books, it never moves them.
      operationId: get_v1_books_transactions
      parameters:
      - description: Sandbox reads the org's SANDBOX ledger when it is exactly "true".
        in: query
        name: sandbox
        required: false
        schema:
          type: string
      - description: From is the RFC3339 start of the posting-time window, inclusive.
        in: query
        name: from
        required: false
        schema:
          type: string
      - description: To is the RFC3339 end of the posting-time window, inclusive.
        in: query
        name: to
        required: false
        schema:
          type: string
      - description: |-
          Category filters to one COA account, named by number ("5300") or by category
          slug ("software").
        example: software
        in: query
        name: category
        required: false
        schema:
          type: string
      - description: |-
          Vendor filters to rows whose vendor or description contains this text,
          case-insensitively.
        in: query
        name: vendor
        required: false
        schema:
          type: string
      - description: Limit caps how many rows come back; 200 when absent or not positive.
        example: 50
        in: query
        name: limit
        required: false
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/transactionsOut'
          description: ok
      summary: |-
        ListTransactions returns the org's booked ledger as a single-line register, newest
        first: one row per voucher, with its date, description, vendor, category, source and
        amount in exact cents.
      tags:
      - books
  /v1/books/trial-balance:
    get:
      description: |-
        TrialBalance returns the org's trial balance over an optional [from, to] window of
        RFC3339 posting times, including the opening/closing columns and the
        TotalDebit == TotalCredit proof that the books balance.
      operationId: get_v1_books_trial-balance
      parameters:
      - description: Sandbox reads the org's SANDBOX ledger when it is exactly "true".
        in: query
        name: sandbox
        required: false
        schema:
          type: string
      - description: From is the RFC3339 start of the window, exclusive. Empty means
          all time.
        example: "2026-01-01T00:00:00Z"
        in: query
        name: from
        required: false
        schema:
          type: string
      - description: To is the RFC3339 end of the window, inclusive. Empty means up
          to now.
        example: "2026-03-31T23:59:59Z"
        in: query
        name: to
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrialBalance'
          description: ok
      summary: TrialBalance returns the org's trial balance over an optional [from,
        to] window of
      tags:
      - books
  /v1/books/vendors:
    get:
      description: |-
        ListVendors returns the org's vendor book: each canonical vendor, the alias spellings a
        receipt may print it under, and the expense account new bills from it default to. A
        vendor here is what makes a scanned bill self-classify instead of asking again.
      operationId: get_v1_books_vendors
      parameters:
      - description: |-
          Sandbox reads the org's SANDBOX ledger when it is exactly "true"; anything else
          reads the live one.
        example: "false"
        in: query
        name: sandbox
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/vendorsOut'
          description: ok
      summary: |-
        ListVendors returns the org's vendor book: each canonical vendor, the alias spellings a
        receipt may print it under, and the expense account new bills from it default to.
      tags:
      - books
    post:
      description: |-
        UpsertVendor creates or updates one vendor in the org's vendor book, keyed by its
        canonical name — writing a canonical name that already exists REPLACES that row's
        aliases and default category. A category given as a slug ("software") is normalized to
        its real COA expense account, and anything unrecognized becomes 5900 Uncategorized
        rather than a guessed real account. It answers the row exactly as stored, so the caller
        sees the normalization. Recording a vendor is what makes future bills from it
        self-classify instead of asking again.
      operationId: post_v1_books_vendors
      requestBody:
        content:
          application/json:
            example:
              aliases:
              - github.com
              canonical: GitHub
              defaultCategory: software
            schema:
              $ref: '#/components/schemas/VendorRow'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorRow'
          description: ok
      summary: |-
        UpsertVendor creates or updates one vendor in the org's vendor book, keyed by its
        canonical name — writing a canonical name that already exists REPLACES that row's
        aliases and default category.
      tags:
      - books
