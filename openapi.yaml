              description: |-
                ScopeOrgs is the caller's visible tenant window: empty for a SuperAdmin (means
                ALL orgs), or the WL tenant's own subtree (today the singleton {org}). The SPA
                threads it through the faceting/drill-down layer so a WL tenant can never widen
                a filter past their subtree.
              items:
                type: string
              type: array
          type: object
        msg:
          type: string
        status:
          type: string
      type: object
    mirrorList:
      properties:
        data:
          description: Data holds the repo's outbound mirror targets.
          items:
            properties:
              createdAt:
                description: CreatedAt is RFC 3339 UTC.
                type: string
              host:
                description: Host is the target's lowercased hostname, taken from
                  URL and never the body.
                type: string
              id:
                description: ID is the target's identifier ("mir_…"), the handle to
                  remove it by.
                type: string
              repo:
                description: Repo is the repo whose advanced refs are pushed downstream.
                type: string
              url:
                description: URL is the canonical https remote, with any embedded
                  credentials stripped.
                type: string
            type: object
          type: array
      type: object
    mirrorReq:
      properties:
        name:
          description: |-
            Name is the local repo to mirror into, from the :name path segment. It is
