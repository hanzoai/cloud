      - in: path
        name: repo
        required: true
        schema:
          type: string
      - in: path
        name: wildcard1
        required: true
        schema:
          type: string
  /{org}/{repo}/commits:
    get:
      operationId: get_by_org_by_repo_commits
      parameters:
      - in: path
        name: org
        required: true
        schema:
          type: string
      - in: path
        name: repo
        required: true
        schema:
          type: string
  /{org}/{repo}/git-receive-pack:
