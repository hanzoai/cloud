  /v1/admin/compute:
    get:
      description: |-
        compute rolls the fleet's compute usage up to one row per (org, app, project, kind):
        how many distinct machines ran in the window, how many are still active, what they
        billed, and when each group last emitted an event. The console folds these into its
        org → app → project tree.

        A machine counts as ACTIVE when its LATEST lifecycle event is not a terminal one
        (stop/destroy/terminate/delete/off/shutdown/expire and their past tenses) — the same
        fold the console applies, done in the warehouse so the count is over every machine and
        not just the page.

        Honest-empty when the warehouse is not connected or hanzo.compute_usage is not
        provisioned yet: an empty list, never a fabricated fleet.
      operationId: adminCompute
      parameters:
      - description: |-
          Kind narrows to one workload class (bot | machine | cluster | nodepool |
          container | function | …). An OPEN spectrum matched as a plain string, lowercased
          to the warehouse's convention; empty means every kind.
        example: bot
        in: query
        name: kind
        required: false
        schema:
          type: string
      - description: |-
          Org narrows to one tenant. Empty means every tenant — this board is
          cross-tenant by nature.
        example: acme
        in: query
        name: org
        required: false
        schema:
          type: string
      - description: 'Range is the lower time bound: 24h, 7d or 30d. Anything else
          reads as 30d.'
        example: 7d
        in: query
        name: range
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                - active: 2
                  app: support
                  kind: bot
                  lastTs: "2026-07-26T18:00:00Z"
                  machines: 4
                  org: acme
                  project: default
                  spendCents: 900
                data2: 1
                msg: ""
                status: ok
              schema:
                $ref: '#/components/schemas/computeOut'
          description: ok
      summary: |-
        compute rolls the fleet's compute usage up to one row per (org, app, project, kind):
        how many distinct machines ran in the window, how many are still active, what they
        billed, and when each group last emitted an event.
      tags:
      - admin
  /v1/admin/credit-grants:
    post:
      description: |-
        createCreditGrant mints credit for one org. It is the ONE admin mint surface, and it
        does NOT mint in-process: it forwards the request to commerce's already-mint-gated
        POST /v1/billing/credit-grants, authenticated by the service token and scoped to the
        target org, then writes one tamper-evident compliance record. Commerce stays the sole
        credit ledger; this is a thin, audited relay so there is exactly one place credit is
        created.

        The body is commerce's OWN CreateCreditGrant contract, forwarded whole — every field
        it carries reaches commerce. The only two this layer reads are the target org (`org`,
        or `user` as the org-pool alias), which selects the namespace commerce's EdgeAuth
        trusts, and `idempotencyKey`, which makes a double-clicked grant credit once.

        A FAILED grant is audited too, with the request body attached: an attempted mint is
        exactly as interesting to a compliance auditor as a successful one.
      operationId: adminCreateCreditGrant
      requestBody:
        content:
          application/json:
            example:
              amountCents: 50000
              idempotencyKey: grant-2026-07-27-acme
              org: acme
              reason: design partner credit
            schema:
              additionalProperties:
                type: object
              type: object
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                  amountCents: 50000
                  id: cg_01J
                  org: acme
                  remainingCents: 50000
                msg: ""
                status: ok
              schema:
                $ref: '#/components/schemas/rawOut'
          description: ok
      summary: createCreditGrant mints credit for one org.
      tags:
      - admin
  /v1/admin/customers:
    get:
      description: |-
        Customers lists every customer org at a glance, sorted by slug: owner email, plan,
        suspend status, member count, balance, month-to-date spend and MRR.

        Each row costs one IAM read plus the org's money reads, fanned out under a fixed
        concurrency ceiling so a large fleet cannot stampede the upstreams. Every read is
        best-effort per row: an upstream miss degrades THAT field to its honest zero rather
        than failing the fleet.
      operationId: adminCustomers
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                - balanceCents: 5000
                  created: "2026-01-04T00:00:00Z"
                  display: Acme
                  lastActive: "2026-07-26T18:00:00Z"
                  mrrCents: 9900
                  org: acme
                  ownerEmail: ada@acme.com
                  plan: pro
                  spendCents: 12500
                  status: active
                  users: 7
                data2: 1
                msg: ""
                status: ok
              schema:
                $ref: '#/components/schemas/CustomersOut'
          description: ok
      summary: |-
        Customers lists every customer org at a glance, sorted by slug: owner email, plan,
        suspend status, member count, balance, month-to-date spend and MRR.

        Each row costs one IAM read plus the org's money reads, fanned out under a fixed
        concurrency ceiling so a large fleet cannot stampede the upstreams.
      tags:
      - admin
  /v1/admin/customers/{org}:
    get:
      description: CustomerDetail answers GET /v1/admin/customers/:org.
      operationId: adminCustomer
      parameters:
      - description: Org is the tenant slug from the path.
        in: path
        name: org
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerDetailOut'
          description: ok
      summary: CustomerDetail answers GET /v1/admin/customers/:org.
      tags:
      - admin
  /v1/admin/customers/{org}/credit:
    post:
      description: |-
        GrantCredit issues a staff credit grant to the org named in the path — a comp, refund
        or promo — through the ONE credit-write path core.ApplyGrant, which validates the
        amount against the per-grant cap, checks the org exists, moves the money and records
        the tamper-evident audit row.

        The credit lands on the account account.Payer resolves, NOT necessarily the org: name
        a member of a pooled org and the pool is credited. The receipt echoes the subject so
        the caller can see which.
      operationId: adminGrantCredit
      parameters:
      - description: Org is the tenant to credit. Required.
        in: path
        name: org
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              amountCents: 5000
              currency: usd
              reason: launch comp
              source: trial
            schema:
              $ref: '#/components/schemas/GrantIn'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                  balanceCents: 10000
                  balanceExact: "100.000000000000000000"
                  currency: usd
                  grantedCents: 5000
                  org: acme
                  source: trial
                  subject: acme
                  transactionId: tx_01J
                msg: ""
                status: ok
              schema:
                $ref: '#/components/schemas/GrantOut'
          description: ok
      summary: |-
        GrantCredit issues a staff credit grant to the org named in the path — a comp, refund
        or promo — through the ONE credit-write path core.ApplyGrant, which validates the
        amount against the per-grant cap, checks the org exists, moves the money and records
        the tamper-evident audit row.

        The credit lands on the account account.Payer resolves, NOT necessarily the org: name
        a member of a pooled org and the pool is credited.
      tags:
      - admin
  /v1/admin/customers/{org}/reactivate:
    post:
      description: |-
        ReactivateCustomer restores access for every member of the org, undoing a suspend. It
        reports the same per-user breakdown.
      operationId: adminReactivateCustomer
      parameters:
      - description: Org is the tenant slug from the path.
        in: path
        name: org
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrgIn'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                  affected:
                  - ada
                  - bob
                  failed: []
                  org: acme
                  suspended: false
                msg: ""
                status: ok
              schema:
                $ref: '#/components/schemas/AccessOut'
          description: ok
      summary: ReactivateCustomer restores access for every member of the org, undoing
        a suspend.
      tags:
      - admin
  /v1/admin/customers/{org}/suspend:
    post:
      description: |-
        SuspendCustomer cuts off every member of the org: IAM refuses a forbidden user at
        login AND at token issuance, so a suspended customer can neither sign in nor mint a
        fresh token. Fully reversible with ReactivateCustomer.

        The result names every user updated and every user that was NOT — a partial failure
        leaves the org in a mixed state and says so instead of reporting a clean success.
      operationId: adminSuspendCustomer
      parameters:
      - description: Org is the tenant slug from the path.
        in: path
        name: org
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrgIn'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                  affected:
                  - ada
                  - bob
                  failed: []
                  org: acme
                  suspended: true
                msg: ""
                status: ok
              schema:
                $ref: '#/components/schemas/AccessOut'
          description: ok
      summary: |-
        SuspendCustomer cuts off every member of the org: IAM refuses a forbidden user at
        login AND at token issuance, so a suspended customer can neither sign in nor mint a
        fresh token.
      tags:
      - admin
  /v1/admin/enablement:
    get:
      description: |-
        ListEnablement returns every item an operator has set an enablement state on —
        its global state (off, beta or ga) and the orgs granted its beta. An item
        nobody has touched is absent, because an untouched item is generally
        available; the console composes the candidate list from the live catalog.
        SuperAdmin only; every other caller is refused.
      operationId: get_v1_admin_enablement
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/adminEnablementBoard'
          description: ok
      summary: |-
        ListEnablement returns every item an operator has set an enablement state on —
        its global state (off, beta or ga) and the orgs granted its beta.
      tags:
      - admin
    put:
      description: |-
        SetEnablement sets one item's global enablement state — off, beta or ga — and
        optionally replaces the list of orgs granted its beta. It is generic over
        kind, so the same call manages models, providers and product features through
        the one registry. `off` is an absolute kill switch: a self-service opt-in can
        never re-open it. SuperAdmin only; every other caller is refused.
      operationId: put_v1_admin_enablement
      requestBody:
        content:
          application/json:
            example:
              betaOrgs:
              - acme
              id: labs
              kind: feature
              state: beta
            schema:
              $ref: '#/components/schemas/setEnablementBody'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/adminEnablementItem'
          description: ok
      summary: |-
        SetEnablement sets one item's global enablement state — off, beta or ga — and
        optionally replaces the list of orgs granted its beta.
      tags:
      - admin
  /v1/admin/finance:
    get:
      description: |-
        Finance answers GET /v1/admin/finance. It reads the multi-vendor COGS from commerce
        /v1/costs, the DO promo-credit/burn-down treasury view, and the fleet commerce revenue,
        then hands them to ComputeFinance. SuperAdmin only.
      operationId: adminFinance
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceOut'
          description: ok
      summary: Finance answers GET /v1/admin/finance.
      tags:
      - admin
  /v1/admin/finance/backfill:
    post:
      description: |-
        Backfill carries ONE org's current commerce prepaid balance into the native finance
        wallet — the one-time cutover between the two ledgers.

        It is IDEMPOTENT: the deposit uses the fixed ref "backfill:<org>", so re-running it
        credits the wallet at most once. Safe to retry.

        The pre-migration balance is read from the CO-RESIDENT commerce ledger, not over HTTP:
        the admin HTTP client dials an unroutable in-process address and would read $0, and a
        phantom zero would silently carry nothing while reporting success. When commerce is
        not co-resident this fails rather than migrating nothing.
      operationId: adminFinanceBackfill
      requestBody:
        content:
          application/json:
            example:
              org: acme
            schema:
              $ref: '#/components/schemas/BackfillIn'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                  entryId: fe_01J
                  migratedCents: 50000
                  org: acme
                msg: ""
                status: ok
              schema:
                $ref: '#/components/schemas/BackfillOut'
          description: ok
      summary: |-
        Backfill carries ONE org's current commerce prepaid balance into the native finance
        wallet — the one-time cutover between the two ledgers.

        It is IDEMPOTENT: the deposit uses the fixed ref "backfill:<org>", so re-running it
        credits the wallet at most once.
      tags:
      - admin
  /v1/admin/flags:
    get:
      description: |-
        flagsBoard reads the platform control-plane board: every runtime launch/release
        switch (waitlist, public signup, subsystem activation, gateway limits, network ids)
        with its LIVE value and where that value came from — a stored definition or the
        compiled-in default.
      operationId: adminFlags
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                  switches:
                  - category: launch
                    description: Gate chat behind the waitlist
                    key: waitlist.chat
                    label: Chat waitlist
                    source: default
                    value: true
                msg: ""
                status: ok
              schema:
                $ref: '#/components/schemas/flagsOut'
          description: ok
      summary: 'flagsBoard reads the platform control-plane board: every runtime launch/release'
      tags:
      - admin
  /v1/admin/flags/{key}:
    put:
      description: |-
        setFlag stores or overwrites ONE platform switch's definition and answers with the
        whole board as it now stands. The flip is hot: this pod applies it immediately and
        peers converge within one evaluation TTL (15s by default), with no redeploy.

        The body reaches the flag engine BYTE-FOR-BYTE — it is the engine's definition
        format, not this layer's, so a field the engine understands and admin does not must
        still arrive intact. setFlagIn names the two fields that matter for documentation; it
        is not a filter.

        The write is recorded in the store's activity log against the caller's email.
      operationId: adminSetFlag
      parameters:
      - description: Key is the switch to write, taken from the path (e.g. "waitlist.chat").
        in: path
        name: key
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              active: true
              filters:
                groups:
                - properties: []
                  rollout_percentage: 100
            schema:
              $ref: '#/components/schemas/setFlagIn'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                  switches:
                  - category: launch
                    description: Gate chat behind the waitlist
                    key: waitlist.chat
                    label: Chat waitlist
                    source: stored
                    value: true
                msg: ""
                status: ok
              schema:
                $ref: '#/components/schemas/flagsOut'
          description: ok
      summary: |-
        setFlag stores or overwrites ONE platform switch's definition and answers with the
        whole board as it now stands.
      tags:
      - admin
  /v1/admin/grants:
    get:
      description: |-
        Grants reads the credit-grant ledger across ALL orgs, newest first — who granted what
        to whom, when, and from which money bucket.

        It is a PROJECTION of the tamper-evident audit trail, not a second store: every grant
        is written there as action "admin.customer.credit", so this view cannot drift from
        what actually happened, and FAILED grants appear too.

        A deployment with no local audit store has no history to project, and says so with an
        empty list and a msg rather than an error.
      operationId: adminGrants
      parameters:
      - description: |-
          Org filters by the ACTOR's org (the staff org that issued the grant), which is
          rarely what a reader wants — the target org is a row field, not a filter.
        in: query
        name: org
        required: false
        schema:
          type: string
      - description: |-
          Result filters by outcome: "success" or "error". Empty returns both, which is
          the point of this view — a refused grant is as interesting as a granted one.
        example: success
        in: query
        name: result
        required: false
        schema:
          type: string
      - description: Limit caps the rows returned. Default 200.
        example: "50"
        in: query
        name: limit
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                - actor: z@hanzo.ai
                  amountCents: 5000
                  createdAt: "2026-07-26T18:00:00Z"
                  currency: usd
                  org: acme
                  reason: launch comp
                  result: success
                  source: trial
                  transactionId: tx_01J
                data2: 1
                msg: ""
                status: ok
              schema:
                $ref: '#/components/schemas/GrantsOut'
          description: ok
      summary: Grants reads the credit-grant ledger across ALL orgs, newest first
        — who granted what
      tags:
      - admin
    post:
      description: |-
        IssueGrant issues a credit grant to any org from the operator Grants view, with the
        target named in the body. It funnels through the SAME core.ApplyGrant that
        POST /v1/admin/customers/:org/credit uses, so there is exactly ONE credit-write path
        and one audit trail behind both.
      operationId: adminIssueGrant
      requestBody:
        content:
          application/json:
            example:
              amountCents: 5000
              currency: usd
              org: acme
              reason: launch comp
              source: trial
            schema:
              $ref: '#/components/schemas/GrantIn'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                  balanceCents: 10000
                  balanceExact: "100.000000000000000000"
                  currency: usd
                  grantedCents: 5000
                  org: acme
                  source: trial
                  subject: acme
                  transactionId: tx_01J
                msg: ""
                status: ok
              schema:
                $ref: '#/components/schemas/GrantOut'
          description: ok
      summary: |-
        IssueGrant issues a credit grant to any org from the operator Grants view, with the
        target named in the body.
      tags:
      - admin
  /v1/admin/infra:
    get:
      description: |-
        read serves the whole DigitalOcean infrastructure board: droplets, volumes, DOKS
        clusters and load balancers, each cross-referenced against every cluster's live
        Kubernetes state so the board can say what is safe to destroy and what is not.

        It is cached for up to a minute because one read is a fan-out over the DO API plus a
        full pod/PV listing per cluster. Staleness is never load-bearing: every MUTATION
        re-scans from scratch and ignores this cache.

        Only an unusable DO account is a hard failure. A partial read still produces a board,
        with the failing source named in sources[] — except for clusters and volumes, which
        the safety verdict depends on; without those the analysis degrades rather than
        classifying anything it cannot prove.
      operationId: adminInfra
      parameters:
      - description: |-
          Refresh, when present, forces a full re-scan instead of serving the cached
          snapshot. Every MUTATION re-scans regardless — this is only for the reader.
        example: "1"
        in: query
        name: refresh
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                  clusters: []
                  loadBalancers: []
                  nodes: []
                  sources:
                  - lastSync: "2026-07-27T00:00:00Z"
                    name: do.volumes
                    ok: true
                    rows: 2
                  volumes: []
                msg: ""
                status: ok
              schema:
                $ref: '#/components/schemas/ReadOut'
          description: ok
      summary: |-
        read serves the whole DigitalOcean infrastructure board: droplets, volumes, DOKS
        clusters and load balancers, each cross-referenced against every cluster's live
        Kubernetes state so the board can say what is safe to destroy and what is not.

        It is cached for up to a minute because one read is a fan-out over the DO API plus a
        full pod/PV listing per cluster.
      tags:
      - admin
  /v1/admin/infra/clusters/{id}/nodepools/{pool}/scale:
    post:
      description: |-
        scaleNodePool sets a node pool's node count — the ONE correct way to change how many
        nodes a DOKS cluster has.

        The response states what the board could NOT prove: DOKS picks which nodes a shrink
        removes, so no particular pod is shown to survive one. See NodePool.ScaleTo.
      operationId: adminScaleNodePool
      parameters:
      - description: ID is the DOKS cluster id, from the path.
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: |-
          Pool is the node pool, from the path. Its DO id or its name — both are unique
          within a cluster, and an operator reads the name off the board.
        in: path
        name: pool
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              count: 5
            schema:
              $ref: '#/components/schemas/ScaleIn'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                  cluster: hanzo-k8s
                  from: 3
                  pool: workers
                  to: 5
                msg: ""
                status: ok
              schema:
                $ref: '#/components/schemas/MutationOut'
          description: ok
      summary: |-
        scaleNodePool sets a node pool's node count — the ONE correct way to change how many
        nodes a DOKS cluster has.

        The response states what the board could NOT prove: DOKS picks which nodes a shrink
        removes, so no particular pod is shown to survive one.
      tags:
      - admin
  /v1/admin/infra/droplets/{id}:
    delete:
      description: |-
        deleteDroplet destroys a droplet the board has just proven is NOT a DOKS node. There
        is no snapshot-first undo for a droplet the way there is for a volume: the local disk
        goes with it.
      operationId: adminDeleteDroplet
      parameters:
      - description: ID is the DO droplet id, from the path. Numeric.
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: Size is the target DigitalOcean size slug on resize, e.g. "s-4vcpu-8gb".
        in: query
        name: size
        required: false
        schema:
          type: string
      - description: |-
          Disk requests a PERMANENT resize that grows the disk. DO can never resize such a
          droplet down again, so it defaults false — a CPU/RAM-only change, reversible.
        in: query
        name: disk
        required: false
        schema:
          type: boolean
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                  deleted: true
                  freedMonthlyCents: 4800
                  name: worker-3
                msg: ""
                status: ok
              schema:
                $ref: '#/components/schemas/MutationOut'
          description: ok
      summary: deleteDroplet destroys a droplet the board has just proven is NOT a
        DOKS node.
      tags:
      - admin
  /v1/admin/infra/droplets/{id}/resize:
    post:
      description: |-
        resizeDroplet changes a droplet's plan. Same refusal as delete and for the same
        reason: a DOKS node's size is the node pool's to declare.

        disk=true is a PERMANENT resize — the disk grows and DO can never resize the droplet
        DOWN again. disk=false (the default) changes CPU/RAM only and is reversible. DO
        requires the droplet to be powered off and applies the change asynchronously, so the
        response carries the action to poll, not a completed change.
      operationId: adminResizeDroplet
      parameters:
      - description: ID is the DO droplet id, from the path. Numeric.
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              disk: false
              size: s-4vcpu-8gb
            schema:
              $ref: '#/components/schemas/DropletIn'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                  actionId: 1234567
                  actionStatus: in-progress
                  from: s-2vcpu-4gb
                  name: worker-3
                  permanent: false
                  to: s-4vcpu-8gb
                msg: ""
                status: ok
              schema:
                $ref: '#/components/schemas/MutationOut'
          description: ok
      summary: resizeDroplet changes a droplet's plan.
      tags:
      - admin
  /v1/admin/infra/loadbalancers/{id}:
    delete:
      description: |-
        deleteLoadBalancer destroys a load balancer the board has just proven no live
        type=LoadBalancer Service in any cluster targets.
      operationId: adminDeleteLoadBalancer
      parameters:
      - description: ID is the DO load balancer id, from the path.
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                  deleted: true
                  freedMonthlyCents: 1200
                  ip: 1.2.3.4
                  name: ingress-lb
                msg: ""
                status: ok
              schema:
                $ref: '#/components/schemas/MutationOut'
          description: ok
      summary: deleteLoadBalancer destroys a load balancer the board has just proven
        no live
      tags:
      - admin
  /v1/admin/infra/nodes/{id}/cordon:
    post:
      description: |-
        cordonNode marks one cluster node unschedulable — or schedulable again — and can drain
        the pods already on it.

        It is the ONE infra change that does not go through the run discipline, because there
        is no destructive verdict to check: cordoning is reversible and evicting respects the
        cluster's own PodDisruptionBudgets. It reads the cached board for the same reason.
        The outcome is audited either way, and the result reports how many pods were evicted.
      operationId: adminCordonNode
      parameters:
      - description: ID is the node's droplet id, from the path.
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              cordon: true
              drain: true
            schema:
              $ref: '#/components/schemas/CordonIn'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                  evicted: 7
                  name: worker-3
                  schedulable: false
                msg: ""
                status: ok
              schema:
                $ref: '#/components/schemas/MutationOut'
          description: ok
      summary: |-
        cordonNode marks one cluster node unschedulable — or schedulable again — and can drain
        the pods already on it.

        It is the ONE infra change that does not go through the run discipline, because there
        is no destructive verdict to check: cordoning is reversible and evicting respects the
        cluster's own PodDisruptionBudgets.
      tags:
      - admin
  /v1/admin/infra/volumes/{id}:
    delete:
      description: |-
        deleteVolume destroys a volume the board has just proven no PersistentVolume in any
        cluster references. Irreversible, so it snapshots first unless explicitly waived —
        the snapshot IS the undo.
      operationId: adminDeleteVolume
      parameters:
      - description: ID is the DO volume id, from the path.
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: |-
          Snapshot is the snapshot-first switch on DELETE. Anything other than the literal
          "false" snapshots before destroying — the snapshot IS the undo, so waiving it is
          deliberate and explicit.
        in: query
        name: snapshot
        required: false
        schema:
          type: string
      - description: |-
          Name is the snapshot name on the snapshot action. Blank gets a deterministic
          "<volume>-predelete-<unix>" so the undo is findable in the DO console.
        in: query
        name: name
        required: false
        schema:
          type: string
      - description: |-
          SizeGiB is the target size on the resize action. A volume only ever grows —
          ExpandTo is the verdict that refuses a shrink, so this is not validated here.
        in: query
        name: sizeGiB
        required: false
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                  deleted: true
                  freedMonthlyCents: 2000
                  name: acme-data
                  sizeGiB: 200
                  snapshotId: snap-01J
                msg: ""
                status: ok
              schema:
                $ref: '#/components/schemas/MutationOut'
          description: ok
      summary: |-
        deleteVolume destroys a volume the board has just proven no PersistentVolume in any
        cluster references.
      tags:
      - admin
  /v1/admin/infra/volumes/{id}/resize:
    post:
      description: |-
        expandVolume grows a volume. GROW ONLY — see Volume.ExpandTo for why the other
        direction is a data migration this board deliberately refuses to run.

        The MECHANISM follows the volume's owner, because there is exactly one way to grow each
        kind completely. A volume a PVC claims is grown by patching the claim: the CSI driver
        then resizes the DigitalOcean device AND grows the filesystem on it, leaving claim, PV,
        device and filesystem all agreeing. Calling DigitalOcean directly for that volume would
        grow the device while the PV kept declaring the old capacity and the filesystem never
        grew at all. One operation, one correct mechanism per owner — not two ways to do it.
      operationId: adminResizeVolume
      parameters:
      - description: ID is the DO volume id, from the path.
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VolumeIn'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MutationOut'
          description: ok
      summary: expandVolume grows a volume.
      tags:
      - admin
  /v1/admin/infra/volumes/{id}/snapshot:
    post:
      description: |-
        snapshotVolume takes a point-in-time snapshot of one volume — the undo a delete relies
        on, available on its own so an operator can take one before any risky change.

        It re-scans the board first (never the cache) so the volume it snapshots is one that
        exists right now, and audits the outcome either way.
      operationId: adminSnapshotVolume
      parameters:
      - description: ID is the DO volume id, from the path.
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              name: acme-data-before-migration
            schema:
              $ref: '#/components/schemas/VolumeIn'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                  created: "2026-07-27T00:00:00Z"
                  id: snap-01J
                  name: acme-data-before-migration
                  sizeGiB: 200
                msg: ""
                status: ok
              schema:
                $ref: '#/components/schemas/VolumeSnapshotOut'
          description: ok
      summary: snapshotVolume takes a point-in-time snapshot of one volume — the undo
        a delete relies
      tags:
      - admin
  /v1/admin/invoices:
    get:
      description: "Invoices answers GET /v1/admin/invoices.\n\n\tGET /v1/admin/invoices?org=&status=&limit="
      operationId: adminInvoices
      parameters:
      - description: |-
          Status filters on the invoice's LATEST lifecycle status (paid, open, void, …),
          matched case-insensitively.
        in: query
        name: status
        required: false
        schema:
          type: string
      - description: Org filters to one tenant, matched exactly.
        in: query
        name: org
        required: false
        schema:
          type: string
      - description: Limit caps the rows returned. data2 still reports the full match
          count.
        in: query
        name: limit
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoicesOut'
          description: ok
      summary: Invoices answers GET /v1/admin/invoices.
      tags:
      - admin
  /v1/admin/me:
    get:
      description: |-
        me answers with the validated operator identity — who the console is signed in as,
        which tier they are, and how wide their tenant window is. The fields come from the
        sanitized identity headers the gate just read, so they are authoritative and never
        client-forgeable; nothing is looked up.
      operationId: adminMe
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                  displayName: z
                  email: z@hanzo.ai
                  isSuperAdmin: true
                  isWhiteLabel: false
                  name: z
                  owner: admin
                msg: ""
                status: ok
              schema:
                $ref: '#/components/schemas/meOut'
          description: ok
      summary: |-
        me answers with the validated operator identity — who the console is signed in as,
        which tier they are, and how wide their tenant window is.
      tags:
      - admin
  /v1/admin/metrics:
    get:
      description: "Metrics answers GET /v1/admin/metrics by aggregating commerce.events
        directly\n(fleet-wide, no per-org fan-out). SuperAdmin only.\n\n\tGET /v1/admin/metrics?window=30d&limit=20"
      operationId: adminMetrics
      parameters:
      - description: |-
          Window is the movement window the new/churned MRR and the recent feed are
          measured over. Anything unrecognised falls back to the board default.
        in: query
        name: window
        required: false
        schema:
          type: string
      - description: Limit caps the top-customers table.
        in: query
        name: limit
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsOut'
          description: ok
      summary: |-
        Metrics answers GET /v1/admin/metrics by aggregating commerce.events directly
        (fleet-wide, no per-org fan-out).
      tags:
      - admin
  /v1/admin/money:
    get:
      description: moneyBoardHandler answers GET /v1/admin/money.
      operationId: adminMoney
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoneyOut'
          description: ok
      summary: moneyBoardHandler answers GET /v1/admin/money.
      tags:
      - admin
  /v1/admin/o11y:
    get:
      description: |-
        o11y is the fleet-wide observability board: LLM usage (requests, tokens, cost,
        errors, top orgs, top models), trace RED metrics (count, p50/p95/p99 latency in ms,
        error rate, top services), fleet log volume, and the O11yAI generation rollup — all
        aggregated across EVERY tenant, with no org filter applied.

        Every signal degrades INDEPENDENTLY. A table that is absent or errors contributes its
        zero value and the read still succeeds, so the board renders exactly what the
        warehouse holds rather than failing whole because one of four sources is missing.
        Same when the warehouse is not connected at all: the zero board, never a fabricated
        fleet.
      operationId: adminO11y
      parameters:
      - description: |-
          Range is the lower time bound: 24h, 7d or 30d. Anything else reads as the
          board's own default.
        example: 7d
        in: query
        name: range
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                  end: "2026-07-27T00:00:00Z"
                  llm:
                    costUsd: 0
                    generations: 0
                  logSeries: []
                  range: 7d
                  series: []
                  start: "2026-07-20T00:00:00Z"
                  topModels: []
                  topOrgs: []
                  topServices: []
                  totals:
                    costCents: 41200
                    errors: 37
                    requests: 10420
                    tokens: 8100000
                msg: ""
                status: ok
              schema:
                $ref: '#/components/schemas/o11yOut'
          description: ok
      summary: |-
        o11y is the fleet-wide observability board: LLM usage (requests, tokens, cost,
        errors, top orgs, top models), trace RED metrics (count, p50/p95/p99 latency in ms,
        error rate, top services), fleet log volume, and the O11yAI generation rollup — all
        aggregated across EVERY tenant, with no org filter applied.

        Every signal degrades INDEPENDENTLY.
      tags:
      - admin
  /v1/admin/orgs:
    get:
      description: |-
        orgs lists the tenant directory one row per org, sorted by slug: member count and the
        org's month-to-date spend and credit balance, read live from IAM and commerce.

        The rows are the caller's tenant window, not the fleet: a SuperAdmin gets every org, a
        white-label admin only their own subtree. A per-org read that fails degrades THAT row
        to an honest zero — this panel carries no sources[] channel to report freshness on, so
        the alternative would be a fleet total that silently reads healthy.
      operationId: adminOrgs
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                - created: "2026-01-04T00:00:00Z"
                  creditsCents: 5000
                  display: Acme
                  org: acme
                  products: 0
                  spendCents: 12500
                  tokens: 0
                  users: 7
                data2: 1
                msg: ""
                status: ok
              schema:
                $ref: '#/components/schemas/orgsOut'
          description: ok
      summary: |-
        orgs lists the tenant directory one row per org, sorted by slug: member count and the
        org's month-to-date spend and credit balance, read live from IAM and commerce.

        The rows are the caller's tenant window, not the fleet: a SuperAdmin gets every org, a
        white-label admin only their own subtree.
      tags:
      - admin
  /v1/admin/overview:
    get:
      description: |-
        overview is the Platform Overview tiles: how many orgs and users are in the caller's
        tenant window, the fleet workload counts, and month-to-date spend and credits.

        It ALWAYS answers 200 — a tile board that fails as a whole because one upstream is
        down is useless. Instead every upstream reports itself in sources[]: ok, degraded, or
        not-configured. A commerce read that failed for ANY org marks that source degraded,
        because the spend/credits totals are then an undercount and must not read healthy.

        tokens30d is 0 for the same reason /usage has no series: there is no fleet token
        counter to read yet.
      operationId: adminOverview
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                  activeProducts: 29
                  creditsCents: 10000
                  drift: 1
                  lastSync: "2026-07-27T00:00:00Z"
                  orgs: 2
                  products: 31
                  sources:
                  - lastSync: "2026-07-27T00:00:00Z"
                    name: iam
                    ok: true
                    rows: 2
                  spendCents30d: 250000
                  tokens30d: 0
                  users: 14
                msg: ""
                status: ok
              schema:
                $ref: '#/components/schemas/overviewOut'
          description: ok
      summary: |-
        overview is the Platform Overview tiles: how many orgs and users are in the caller's
        tenant window, the fleet workload counts, and month-to-date spend and credits.

        It ALWAYS answers 200 — a tile board that fails as a whole because one upstream is
        down is useless.
      tags:
      - admin
  /v1/admin/plugins:
    get:
      description: |-
        list reports what each host is actually running: every loaded plugin with its
        version, pid, uptime, reload and restart counts, and its measured CPU, RSS,
        thread and fd cost — read from the kernel, which is only answerable at all
        because a plugin is a process.

        Reading this from deployment config would answer what was INTENDED. Only the
        process knows what is TRUE, and during a rolling upgrade the two disagree on
        purpose.
      operationId: adminPlugins
      parameters:
      - description: |-
          Scope "host" answers for THIS host only. Default "fleet" fans out to every
          live peer. A peer answers a host-scoped read, which is what stops the
          fan-out recursing.
        example: fleet
        in: query
        name: scope
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                - host: cloud-0
                  plugins:
                  - name: billing
                    prefix: /v1/billing
                    reloads: 1
                    restarts: 0
                    running: true
                    source: url
                    version: 9f2c…
                  self: true
                drift:
                - drifted: false
                  name: billing
                  running: 1
                  versions:
                  - 9f2c…
                msg: ""
                status: ok
              schema:
                $ref: '#/components/schemas/ListOut'
          description: ok
      summary: |-
        list reports what each host is actually running: every loaded plugin with its
        version, pid, uptime, reload and restart counts, and its measured CPU, RSS,
        thread and fd cost — read from the kernel, which is only answerable at all
        because a plugin is a process.

        Reading this from deployment config would answer what was INTENDED.
      tags:
      - admin
  /v1/admin/plugins/{name}/disable:
    post:
      description: |-
        disable stops the plugin. Its routes STAY REGISTERED and answer 503 — not 404.

        That is zip's choice and this keeps it. Removing the routes would mutate the
        route table, and re-adding them on enable would grow it without bound across
        repeated cycles, which is the invariant that makes reloads flat in memory. It
        is also the better answer: 404 says "no such API" and a client may cache it
        and stop retrying, while 503 says "this API exists and is down right now",
        which is true and retryable. Which of the two 503s this is — deliberate stop
        or crash — is what the status's disabled flag reports.
      operationId: adminDisablePlugin
      parameters:
      - description: Name is the app, from the path.
        example: billing
        in: path
        name: name
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              name: billing
            schema:
              $ref: '#/components/schemas/NameIn'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                - host: cloud-0
                  ok: true
                msg: billing disabled
                status: ok
              schema:
                $ref: '#/components/schemas/ActionOut'
          description: ok
      summary: disable stops the plugin.
      tags:
      - admin
  /v1/admin/plugins/{name}/enable:
    post:
      description: |-
        enable brings a stopped or disabled plugin back on the artifact it already
        has: the zero Plugin names no new artifact, so Reload reuses the loaded spec
        and clears the disabled flag. Named for what an operator means by it.
      operationId: adminEnablePlugin
      parameters:
      - description: Name is the app, from the path.
        example: billing
        in: path
        name: name
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              name: billing
            schema:
              $ref: '#/components/schemas/NameIn'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                - host: cloud-0
                  ok: true
                msg: billing enabled
                status: ok
              schema:
                $ref: '#/components/schemas/ActionOut'
          description: ok
      summary: |-
        enable brings a stopped or disabled plugin back on the artifact it already
        has: the zero Plugin names no new artifact, so Reload reuses the loaded spec
        and clears the disabled flag.
      tags:
      - admin
  /v1/admin/plugins/{name}/reload:
    post:
      description: |-
        reload swaps a plugin for another build without dropping a request. The
        replacement is started and proven to be LISTENING before any traffic moves to
        it, so a bad build leaves the old one serving and returns an error rather
        than a hole; the old process then drains before it is killed.

        With a version or url+sum it pins; naming a digest this host has run before is
        the rollback, and costs no network because the digest IS the cache key. With
        neither it restarts what is already loaded.

        Fleet scope applies it to one host at a time and STOPS at the first failure,
        so a build that cannot come up reaches exactly one host.
      operationId: adminReloadPlugin
      parameters:
      - description: Name is the app, from the path. It must be one the manifest declares.
        example: billing
        in: path
        name: name
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              name: billing
              version: v1.2.3
            schema:
              $ref: '#/components/schemas/ReloadIn'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                - host: cloud-0
                  ok: true
                  version: 9f2c…
                msg: billing -> 9f2c…
                status: ok
              schema:
                $ref: '#/components/schemas/ActionOut'
          description: ok
      summary: reload swaps a plugin for another build without dropping a request.
      tags:
      - admin
  /v1/admin/products:
    get:
      description: |-
        products lists the fleet workload registry: every operator App CR across the platform
        namespaces with its declared vs running image tag, reconciled health/phase and drift
        verdict. Optionally narrowed by kind, tier or env, each an exact match.

        The rows are the SAME observation /v1/platform/fleet renders — read through the in-process
        platform seam, not a second k8s client — so the two boards can never disagree about what
        the fleet is. A PaaS plane that is not co-resident yields an honestly empty registry,
        never a fabricated row.
      operationId: adminProducts
      parameters:
      - description: Kind matches the operator App CR's declared spec.role (sql|kv|generic|ingress).
        in: query
        name: kind
        required: false
        schema:
          type: string
      - description: Tier matches the derived infra grouping (cloud|data|edge|daemon|paas|app).
        example: data
        in: query
        name: tier
        required: false
        schema:
          type: string
      - description: Env matches the lifecycle namespace (main|test|dev).
        example: main
        in: query
        name: env
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                - cluster: hanzo-k8s
                  declaredTag: v1.4.2
                  drift: false
                  driftSeverity: ok
                  env: main
                  health: green
                  kind: sql
                  latestTag: ""
                  name: sql
                  namespace: hanzo
                  org: hanzoai
                  phase: Running
                  repo: hanzoai/sql
                  runningTag: v1.4.2
                  tier: data
                  updated: ""
                data2: 1
                msg: ""
                status: ok
              schema:
                $ref: '#/components/schemas/productsOut'
          description: ok
      summary: |-
        products lists the fleet workload registry: every operator App CR across the platform
        namespaces with its declared vs running image tag, reconciled health/phase and drift
        verdict.
      tags:
      - admin
  /v1/admin/promos:
    get:
      description: |-
        getPromo reads the current platform plan promo — the singleton discount offer, e.g.
        the 50%-off launch promo. Commerce stores it in the reserved platform namespace, so
        the org sent with the read is the admin org and the service token is what passes
        commerce's own platform-admin gate.
      operationId: adminPromo
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                  active: true
                  end: "2026-09-01T00:00:00Z"
                  percentOff: 50
                  plans:
                  - pro
                  start: "2026-07-01T00:00:00Z"
                data2: 0
                msg: ""
                status: ok
              schema:
                $ref: '#/components/schemas/rawOut'
          description: ok
      summary: |-
        getPromo reads the current platform plan promo — the singleton discount offer, e.g.
        the 50%-off launch promo.
      tags:
      - admin
    put:
      description: |-
        putPromo upserts the platform plan promo — the ONE place the offer is configured.

        The body is commerce's own promo contract and is forwarded BYTE-FOR-BYTE, so no field
        commerce accepts is dropped in transit. promoIn names its documented fields.
      operationId: adminSetPromo
      requestBody:
        content:
          application/json:
            example:
              active: true
              end: "2026-09-01T00:00:00Z"
              percentOff: 50
              plans:
              - pro
              start: "2026-07-01T00:00:00Z"
            schema:
              $ref: '#/components/schemas/promoIn'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                  active: true
                  end: "2026-09-01T00:00:00Z"
                  percentOff: 50
                  plans:
                  - pro
                  start: "2026-07-01T00:00:00Z"
                data2: 0
                msg: ""
                status: ok
              schema:
                $ref: '#/components/schemas/rawOut'
          description: ok
      summary: |-
        putPromo upserts the platform plan promo — the ONE place the offer is configured.

        The body is commerce's own promo contract and is forwarded BYTE-FOR-BYTE, so no field
        commerce accepts is dropped in transit.
      tags:
      - admin
