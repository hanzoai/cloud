  /v1/o11y/annotation-queues:
    get:
      description: |-
        ListAnnotationQueues returns a page of the caller org's human-review queues,
        newest first, narrowed to the caller's project. Another org's queues are never
        visible.
      operationId: get_v1_o11y_annotation-queues
      parameters:
      - description: Page is the 1-based page to read. Default 1.
        example: 1
        in: query
        name: page
        required: false
        schema:
          type: integer
      - description: Limit is how many rows to return. Default 20, capped at 100.
        example: 20
        in: query
        name: limit
        required: false
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/annQueueList'
          description: ok
      summary: |-
        ListAnnotationQueues returns a page of the caller org's human-review queues,
        newest first, narrowed to the caller's project.
      tags:
      - o11y
    post:
      description: |-
        CreateAnnotationQueue creates a human-review queue in the caller's org and
        project. A name already used by another queue in the same project is a 409.
      operationId: post_v1_o11y_annotation-queues
      requestBody:
        content:
          application/json:
            example:
              name: hallucination review
              scoreConfigIds:
              - quality
            schema:
              $ref: '#/components/schemas/createQueueReq'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/annQueueView'
          description: created
      summary: |-
        CreateAnnotationQueue creates a human-review queue in the caller's org and
        project.
      tags:
      - o11y
  /v1/o11y/annotation-queues/{id}:
    delete:
      description: |-
        DeleteAnnotationQueue removes one review queue and every item in it. A queue
        id belonging to another org answers the same 404 an unknown id does, so a
        probe learns nothing about what exists.
      operationId: delete_v1_o11y_annotation-queues_id
      parameters:
      - description: ID is the annotation queue to act on, from the path.
        example: annq_1
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/annQueueDeleted'
          description: ok
      summary: DeleteAnnotationQueue removes one review queue and every item in it.
      tags:
      - o11y
    get:
      description: |-
        GetAnnotationQueue returns one review queue with its pending and completed
        counts and its first page of items. A queue id belonging to another org is a
        404, never a cross-tenant read.
      operationId: get_v1_o11y_annotation-queues_id
      parameters:
      - description: ID is the annotation queue to act on, from the path.
        example: annq_1
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/annQueueDetailView'
          description: ok
      summary: |-
        GetAnnotationQueue returns one review queue with its pending and completed
        counts and its first page of items.
      tags:
      - o11y
    patch:
      description: |-
        UpdateAnnotationQueue changes a review queue's name, description or
        score-config set. A field the request omits is left alone. A name another
        queue in the same project already uses is a 409; a queue id belonging to
        another org is a 404.
      operationId: patch_v1_o11y_annotation-queues_id
      parameters:
      - description: ID is the annotation queue to update, from the path.
        example: annq_1
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              id: annq_1
              name: hallucination review v2
            schema:
              $ref: '#/components/schemas/updateQueueIn'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/annQueueView'
          description: ok
      summary: |-
        UpdateAnnotationQueue changes a review queue's name, description or
        score-config set.
      tags:
      - o11y
  /v1/o11y/annotation-queues/{id}/items:
    get:
      description: |-
        ListAnnotationQueueItems returns a page of one review queue's items, newest
        first, optionally filtered to PENDING or COMPLETED. A queue id belonging to
        another org is a 404, never a cross-tenant list.
      operationId: get_v1_o11y_annotation-queues_id_items
      parameters:
      - description: ID is the annotation queue whose items to list, from the path.
        example: annq_1
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: Status filters to PENDING or COMPLETED items. Absent returns
          both.
        example: PENDING
        in: query
        name: status
        required: false
        schema:
          type: string
      - description: Page is the 1-based page to read. Default 1.
        in: query
        name: page
        required: false
        schema:
          type: integer
      - description: Limit is how many rows to return. Default 20, capped at 100.
        in: query
        name: limit
        required: false
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/annItemList'
          description: ok
      summary: |-
        ListAnnotationQueueItems returns a page of one review queue's items, newest
        first, optionally filtered to PENDING or COMPLETED.
      tags:
      - o11y
    post:
      description: |-
        AddAnnotationQueueItems enqueues traces, observations or sessions on a review
        queue. Each item names exactly one object, either by traceId / observationId /
        sessionId or by objectType plus objectId; every item enters PENDING. A queue
        id belonging to another org is a 404.
      operationId: post_v1_o11y_annotation-queues_id_items
      parameters:
      - description: ID is the annotation queue to add to, from the path.
        example: annq_1
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              id: annq_1
              items:
              - traceId: tr_1
            schema:
              $ref: '#/components/schemas/addItemsIn'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/annItemsCreated'
          description: created
      summary: |-
        AddAnnotationQueueItems enqueues traces, observations or sessions on a review
        queue.
      tags:
      - o11y
  /v1/o11y/annotation-queues/{id}/items/{itemId}:
    patch:
      description: |-
        UpdateAnnotationQueueItem moves one queue item between PENDING and COMPLETED
        and sets its assignee. Completing an item stamps its completedAt. An item that
        exists under a different queue answers the same 404 an unknown item does, and
        so does a queue belonging to another org.
      operationId: patch_v1_o11y_annotation-queues_id_items_itemId
      parameters:
      - description: ID is the annotation queue the item belongs to, from the path.
        example: annq_1
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: ItemID is the item to update, from the path.
        example: annqi_1
        in: path
        name: itemId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              id: annq_1
              itemId: annqi_1
              status: COMPLETED
            schema:
              $ref: '#/components/schemas/updateItemIn'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/annItemView'
          description: ok
      summary: |-
        UpdateAnnotationQueueItem moves one queue item between PENDING and COMPLETED
        and sets its assignee.
      tags:
      - o11y
