        required: true
        schema:
          type: string
  /explore:
    get:
      operationId: get_explore
  /git:
    get:
      operationId: get_git
  /git/{org}/{repo}:
    get:
      operationId: get_git_by_org_by_repo
      parameters:
      - in: path
        name: org
        required: true
        schema:
          type: string
      - in: path
        name: repo
        required: true
        schema:
          type: string
  /git/{org}/{repo}/blob/{wildcard1}:
    get:
      operationId: get_git_by_org_by_repo_blob_by_wildcard1
      parameters:
      - in: path
        name: org
        required: true
        schema:
          type: string
      - in: path
        name: repo
        required: true
        schema:
          type: string
      - in: path
        name: wildcard1
        required: true
        schema:
          type: string
  /git/{org}/{repo}/commits:
    get:
      operationId: get_git_by_org_by_repo_commits
      parameters:
      - in: path
        name: org
        required: true
        schema:
          type: string
      - in: path
        name: repo
        required: true
        schema:
          type: string
  /git/{org}/{repo}/tree/{wildcard1}:
    get:
      operationId: get_git_by_org_by_repo_tree_by_wildcard1
      parameters:
      - in: path
        name: org
        required: true
        schema:
          type: string
      - in: path
        name: repo
        required: true
        schema:
          type: string
      - in: path
        name: wildcard1
        required: true
        schema:
          type: string
  /git/explore:
    get:
      operationId: get_git_explore
  /login/oauth:
    delete:
      operationId: delete_login_oauth
    get:
      operationId: get_login_oauth
    options:
      operationId: options_login_oauth
    patch:
      operationId: patch_login_oauth
    post:
      operationId: post_login_oauth
    put:
      operationId: put_login_oauth
    trace:
      operationId: trace_login_oauth
  /login/oauth/{wildcard1}:
