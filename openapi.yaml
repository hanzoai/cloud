          description: Run is the run id the cancel was applied to.
          type: string
      type: object
    jobList:
      properties:
        jobs:
          description: |-
            Jobs is the queue, most-recent-first. Every LIVE job is present; terminal
            history is capped, so a busy org's running work is never crowded out.
          items:
            properties:
              attempt:
                type: integer
              closeTime:
                type: string
              failureCause:
                type: string
              gpu:
                type: string
              id:
                type: string
              label:
                type: string
              lastHeartbeat:
                type: string
              leaseExpiry:
                type: string
              runId:
                type: string
              startTime:
                type: string
              status:
