  /v1/connectors:
    get:
      description: |-
        connectors lists the caller's OWN connectors across every provider — the set
        `hanzo connector ls` prints. Rows are keyed (org,user), so this can never
        surface another user's connector, and no secret is in the view.
      operationId: get_v1_connectors
      responses:
        "200":
          content:
            application/json:
              example:
                connectors:
                - account: me@acme.com
                  connectedAt: "2026-07-01T10:00:00Z"
                  expiresAt: "2026-07-01T11:00:00Z"
                  externalId: u-42
                  id: openai:default
                  label: default
                  provider: openai
                  scopes:
                  - api
              schema:
                $ref: '#/components/schemas/connectorsOut'
          description: ok
      summary: |-
        connectors lists the caller's OWN connectors across every provider — the set
        `hanzo connector ls` prints.
      tags:
      - connectors
  /v1/connectors/{id}:
    delete:
      description: |-
        dropConn forgets a connector: every custodied secret, then the row.
        Idempotent — dropping a never-connected id still answers {disconnected:true}
        (disconnect() parity). No provider Revoke: none of the user-plane providers
        exposes a revoke endpoint.
      operationId: delete_v1_connectors_id
      parameters:
      - description: |-
          ID is the connector id, provider + ":" + label ("openai:default") — the
          auth-profile-id shape. Another user's id is simply no row, so 404.
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              example:
                disconnected: true
              schema:
                $ref: '#/components/schemas/disconnectOut'
          description: ok
      summary: |-
        dropConn forgets a connector: every custodied secret, then the row.
        Idempotent — dropping a never-connected id still answers {disconnected:true}
        (disconnect() parity).
      tags:
      - connectors
  /v1/connectors/{id}/refresh:
    post:
      description: |-
        refreshConn forces a token rotation for a connected connector, ahead of the
        automatic rotation a token read would do inside the expiry window. Only
        providers that declare a Refresh support it.
      operationId: post_v1_connectors_id_refresh
      parameters:
      - description: |-
          ID is the connector id, provider + ":" + label ("openai:default") — the
          auth-profile-id shape. Another user's id is simply no row, so 404.
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              id: openai:work
            schema:
              $ref: '#/components/schemas/connectorRef'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                connector:
                  account: me@acme.com
                  connectedAt: "2026-07-01T10:00:00Z"
                  expiresAt: "2026-07-01T12:00:00Z"
                  externalId: u-42
                  id: openai:work
                  label: work
                  provider: openai
                  scopes:
                  - api
                refreshed: true
              schema:
                $ref: '#/components/schemas/refreshOut'
          description: ok
      summary: |-
        refreshConn forces a token rotation for a connected connector, ahead of the
        automatic rotation a token read would do inside the expiry window.
      tags:
      - connectors
  /v1/connectors/{id}/token:
    get:
      description: |-
        tokenConn hands the custodied access token to its owner — the ONE place
        custody exits. The (org,user)-keyed row IS the same-user gate: another user's
        id is simply "no row" → 404. fresh() auto-rotates within the refreshSkew
        window; static providers degenerate to a plain kmsGet of Secrets[0]. Refresh
        tokens are NEVER returned — custody keeps the sink. The token is never logged.
      operationId: get_v1_connectors_id_token
      parameters:
      - description: |-
          ID is the connector id, provider + ":" + label ("openai:default") — the
          auth-profile-id shape. Another user's id is simply no row, so 404.
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              example:
                expiresAt: "2026-07-01T11:00:00Z"
                label: work
                provider: openai
                token: <the access token>
              schema:
                $ref: '#/components/schemas/connectorTokenOut'
          description: ok
      summary: |-
        tokenConn hands the custodied access token to its owner — the ONE place
        custody exits.
      tags:
      - connectors
  /v1/connectors/{provider}/credential:
    post:
      description: |-
        credential is the direct intake path: a customer-held token/setup-token
        (Verify) or an externally obtained OAuth bundle from the CLI's local PKCE
        (Adopt). ALWAYS verify-before-store: a bad credential is refused and NOTHING
        is persisted (connectByCredential's fail-closed order).
      operationId: post_v1_connectors_provider_credential
      parameters:
      - description: Provider is the user-scoped provider's registry id, from the
          path.
        in: path
        name: provider
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              label: work
              provider: openai
              token: sk-user-owned-key
            schema:
              $ref: '#/components/schemas/credentialIn'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                connected: true
                connector:
                  account: me@acme.com
                  connectedAt: "2026-07-01T10:00:00Z"
                  expiresAt: ""
                  externalId: u-42
                  id: openai:work
                  label: work
                  provider: openai
                  scopes:
                  - api
              schema:
                $ref: '#/components/schemas/credentialOut'
          description: ok
      summary: |-
        credential is the direct intake path: a customer-held token/setup-token
        (Verify) or an externally obtained OAuth bundle from the CLI's local PKCE
        (Adopt).
      tags:
      - connectors
  /v1/connectors/{provider}/device:
    post:
      description: |-
        startDevice begins a device sign-in and returns the code to show the user plus
        how to poll for completion. KMS readiness is checked NOW rather than dead-ending
        the user at poll-done (connect() parity), and the per-provider connector cap is
        checked before the provider is called. The provider's device code is persisted
        only in the encrypted grants table and is NEVER returned.
      operationId: post_v1_connectors_provider_device
      parameters:
      - description: Provider is the user-scoped provider's registry id, from the
          path.
        in: path
        name: provider
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              label: work
              provider: openai
            schema:
              $ref: '#/components/schemas/deviceStartIn'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                expiresAt: "2026-07-01T10:15:00Z"
                flow: g_7f2c
                interval: 5
                userCode: WDJB-MJHT
                verifyUrl: https://example.com/device
              schema:
                $ref: '#/components/schemas/deviceStartOut'
          description: ok
      summary: |-
        startDevice begins a device sign-in and returns the code to show the user plus
        how to poll for completion.
      tags:
      - connectors
  /v1/connectors/{provider}/device/{flow}/poll:
    post:
      description: |-
        pollDevice advances a device sign-in. Terminal outcomes are DATA, not errors
        (verifyConn {active:false} discipline) — the status set is closed:
        pending|connected|denied|expired. pollSlow collapses to "pending" on the
        wire; the raised cadence rides interval.
      operationId: post_v1_connectors_provider_device_flow_poll
      parameters:
      - description: Provider is the user-scoped provider's registry id, from the
          path.
        in: path
        name: provider
        required: true
        schema:
          type: string
      - description: |-
          Flow is the id deviceStartOut returned. Expired or another user's flow is
          indistinguishable from an unknown one: 404.
        in: path
        name: flow
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              flow: g_7f2c
              provider: openai
            schema:
              $ref: '#/components/schemas/devicePollIn'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                connector:
                  account: me@acme.com
                  connectedAt: "2026-07-01T10:05:00Z"
                  expiresAt: "2026-07-01T11:00:00Z"
                  externalId: u-42
                  id: openai:work
                  label: work
                  provider: openai
                  scopes:
                  - api
                status: connected
              schema:
                $ref: '#/components/schemas/devicePollOut'
          description: ok
      summary: pollDevice advances a device sign-in.
      tags:
      - connectors
  /v1/connectors/providers:
    get:
      description: |-
        connectorProviders lists the user-scoped provider cards — the catalog of what a
        user can connect, and how. Methods derive from capabilities (Device/Adopt/Verify
        — Mount asserts at least one), never from a parallel kind enum.
      operationId: get_v1_connectors_providers
      responses:
        "200":
          content:
            application/json:
              example:
                providers:
                - category: AI
                  description: Use your own OpenAI account.
                  id: openai
                  methods:
                  - device
                  - token
                  name: OpenAI
                  scopes:
                  - api
              schema:
                $ref: '#/components/schemas/connectorProvidersOut'
          description: ok
      summary: |-
        connectorProviders lists the user-scoped provider cards — the catalog of what a
        user can connect, and how.
      tags:
      - connectors
