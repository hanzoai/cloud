          type: string
        label:
          description: Label is the connector's label.
          type: string
        provider:
          description: Provider is the connector's provider id.
          type: string
        token:
          description: Token is the access token, rotated first if it was within the
            refresh window.
          type: string
      type: object
    connectorsOut:
      properties:
        connectors:
          description: Connectors is the caller's own set. Never null; [] when they
            have none.
          items:
            $ref: '#/components/schemas/connView'
          type: array
      type: object
    contactList:
      properties:
        data:
          description: Data is the page of contacts, most recently updated first.
          items:
            $ref: '#/components/schemas/Contact'
          type: array
      type: object
    contactReq:
      properties:
        city:
          description: City is where the person is based.
          type: string
        companyId:
          description: CompanyID links the contact to one of the org's companies.
          type: string
        email:
          description: Email is the person's email address.
          type: string
        firstName:
          description: FirstName is the person's given name.
          type: string
        id:
          description: |-
            ID names the contact to update and comes from the path. A create ignores
            it: the server mints the id.
          type: string
        jobTitle:
          description: JobTitle is the person's role at their company.
          type: string
        lastName:
          description: LastName is the person's family name.
          type: string
        linkedinLink:
          description: Linkedin is the person's LinkedIn URL.
          type: string
        phone:
          description: Phone is the person's phone number.
          type: string
        xLink:
          description: XLink is the person's X (Twitter) URL.
          type: string
      type: object
    cookieAck:
      properties:
        result:
          description: Result is true when the cookie was written or cleared.
          type: boolean
      type: object
    corpusView:
      properties:
        count:
          description: Count is how many tactics survived every filter.
          type: integer
        stage:
          description: |-
            Stage is the growth stage the tag join ran at — the org's observed stage, or
            the one ?stage= previewed.
          type: string
        strategies:
          description: Strategies are the surviving tactics, in corpus authoring order.
          items:
            $ref: '#/components/schemas/strategyView'
          type: array
      type: object
    createAppReq:
      properties:
        buildType:
          type: string
        description:
          type: string
        dockerfile:
          type: string
        domains:
          items:
            type: string
          type: array
        env:
          items:
            $ref: '#/components/schemas/EnvVarJSON'
          type: array
        environment:
          type: string
        image:
          properties:
            repository:
              type: string
            tag:
              type: string
          type: object
        name:
          type: string
        port:
          type: integer
        replicas:
          type: integer
        repo:
          properties:
            branch:
              type: string
            url:
              type: string
          type: object
        slug:
          type: string
        source:
          type: string
        storageGb:
          type: integer
      type: object
    createClusterReq:
      properties:
        name:
          description: Name is the cluster's name. Required.
          type: string
        nodePool:
          properties:
            count:
              type: integer
            name:
              type: string
            size:
              type: string
          type: object
        region:
          description: Region is the provider region slug (e.g. "nyc3"). Required.
          type: string
        version:
          description: Version is the Kubernetes version slug; empty takes the provider
            default.
          type: string
      type: object
    createFlowReq:
      properties:
        displayName:
          description: DisplayName names the flow's initial draft version.
          type: string
        externalId:
          description: ExternalID is the caller's own id for this flow. Optional.
          type: string
        folderId:
          description: FolderID groups the flow in the builder's tree. Optional.
          type: string
        trigger:
          $ref: '#/components/schemas/FlowTrigger'
          description: |-
            Trigger is the root of the step tree — how the flow starts, and the action
            chain that follows. Optional: a flow may be created empty and edited later.
      type: object
    createQueueReq:
      properties:
        description:
          description: Description is optional free text, up to 512 characters.
          type: string
        name:
          description: |-
            Name is the queue's display handle, 1–128 printable characters. It must be
            unique within the org's project. Required.
          type: string
        scoreConfigIds:
          description: ScoreConfigIDs are the eval score-configs reviewers grade against.
          items:
            type: string
          type: array
      type: object
    createReq:
      properties:
        description:
          description: Description is a free-form blurb, max 4KiB.
          type: string
        name:
          description: |-
            Name is the repo's handle, unique within the scope, and the last segment of
            both clone URLs. Must match ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$; a trailing
            ".git" is stripped first. Required.
          type: string
        project:
          description: |-
            Project narrows the repo to a sub-scope of the org. Omit it to use the
            caller's own X-Project-Id scope; it can never widen past the caller's org.
          type: string
        public:
          description: |-
            Public grants ANONYMOUS read (fetch) only; push and the whole control plane
            stay org-authed. Defaults to false.
          type: boolean
      type: object
    createVersionIn:
      properties:
        displayName:
          description: DisplayName names the new version.
          type: string
        id:
          description: ID is the flow to add a version to, from the path.
          type: string
        trigger:
          $ref: '#/components/schemas/FlowTrigger'
          description: |-
            Trigger is the root of the version's step tree. Optional: a version with no
            trigger is created invalid, and cannot run until one is set.
      type: object
    credentialIn:
      properties:
        accountId:
          description: AccountID scopes the credential where the provider's Verify
            needs one.
          type: string
        label:
          description: Label names this connection; empty means "default".
          type: string
        oauth:
          $ref: '#/components/schemas/oauthBundleIn'
          description: |-
            OAuth is a bundle the CLI already obtained through its own local PKCE flow.
            Present ⇒ the Adopt path; absent ⇒ the Token path.
        provider:
          description: Provider is the user-scoped provider's registry id, from the
            path.
          type: string
        token:
          description: |-
            Token is the customer-held credential for the Verify path. Read on STDIN by
            the CLI, never argv; never logged, echoed, or stored outside KMS.
          type: string
      type: object
    credentialOut:
      properties:
        connected:
          description: Connected is always true — a failed verification is a 400 and
            stores nothing.
          type: boolean
        connector:
          $ref: '#/components/schemas/connView'
          description: Connector is the connector as it now stands.
      type: object
    crmSummary:
      properties:
        companies:
          description: Companies is how many companies the org has.
          type: integer
        contacts:
          description: Contacts is how many contacts the org has.
          type: integer
        opportunities:
          description: Opportunities is how many opportunities the org has.
          type: integer
      type: object
    csrfResp:
      properties:
        csrfToken:
          description: |-
            Token is the value to send back in the X-CSRF-Token header. It is bound to the
            caller's identity, so it authorizes writes as them and as nobody else.
          type: string
        expiresIn:
          description: |-
            ExpiresIn is the token's lifetime in seconds. Fetch a new one when it lapses;
            a write with an expired token is refused.
          type: integer
      type: object
    curriculumView:
      properties:
        curriculum:
          $ref: '#/components/schemas/Curriculum'
          description: 'Curriculum is the enabled journey: its version, title and
            ordered steps.'
        custom:
          description: |-
            Custom is true when the org's OWN curriculum override is active; false when
            the journey comes from the brand blueprint or the embedded fixture.
          type: boolean
      type: object
    databaseCreateIn:
      properties:
        name:
          description: Name is the database name to create.
          type: string
      type: object
    datastoreVolume:
      properties:
        mount:
          type: string
        name:
          type: string
        pct:
          type: number
        sizeGiB:
          type: integer
        usedGiB:
          type: number
      type: object
    decisionIn:
      properties:
        email:
          description: Email identifies the founder on the formation.
          type: string
        status:
          description: 'Status is the decision: reviewer_confirmed or failed. Nothing
            else is accepted.'
          type: string
      type: object
    deployment:
      properties:
        instance:
          type: string
        up:
          type: boolean
      type: object
    devicePollIn:
      properties:
        flow:
          description: |-
            Flow is the id deviceStartOut returned. Expired or another user's flow is
            indistinguishable from an unknown one: 404.
          type: string
        provider:
          description: Provider is the user-scoped provider's registry id, from the
            path.
          type: string
      type: object
    devicePollOut:
      properties:
        connector:
          $ref: '#/components/schemas/connView'
          description: Connector is the connected connector. Present only on "connected".
        interval:
          description: |-
            Interval is the seconds to wait before the next poll. Present only while
            pending, and it may rise when the provider asks the client to slow down.
          type: integer
        status:
          description: Status is the flow's state. "pending" means poll again after
            Interval.
          type: string
      type: object
    deviceStartIn:
      properties:
        label:
          description: |-
            Label names this connection so one user can hold several per provider
            ("work", "personal"). Empty means "default". 1-64 of [A-Za-z0-9._-].
          type: string
        provider:
          description: Provider is the user-scoped provider's registry id, from the
            path.
          type: string
      type: object
    deviceStartOut:
      properties:
        expiresAt:
          description: ExpiresAt is when the flow dies, RFC 3339 UTC.
          type: string
        flow:
          description: Flow is the id to poll with.
          type: string
        interval:
          description: Interval is the seconds to wait between polls.
          type: integer
        userCode:
          description: UserCode is the short code the user types at VerifyURL.
          type: string
        verifyUrl:
          description: VerifyURL is the page the user opens to enter UserCode.
          type: string
      type: object
    digitalocean.Snapshot:
      properties:
        ID:
          type: string
        Name:
          type: string
        SizeGiB:
          type: integer
      type: object
    disconnectOut:
      properties:
        disconnected:
          description: Disconnected is always true — the org's secrets and connection
            row are gone.
          type: boolean
      type: object
    docRef:
      properties:
        doctype:
          description: DocType is the document's DocType, from the path.
          type: string
        name:
          description: |-
            Name is the document's name — its key within the DocType — from the path.
            A name containing a space arrives percent-encoded and is decoded before it
            is matched against the stored one.
          type: string
      type: object
    docTypeList:
      properties:
        data:
          description: Data is every DocType defined in the caller's org.
          items:
            $ref: '#/components/schemas/DocType'
          type: array
      type: object
    documentList:
      properties:
        data:
          description: |-
            Data is the matching documents, newest-updated first unless order_by said
            otherwise, each projected to the requested fields plus the envelope keys.
          items:
            additionalProperties:
              type: object
            type: object
          type: array
      type: object
    domainAddIn:
      properties:
        name:
          description: Name is the custom domain to attach, e.g. "www.acme.com".
          type: string
        project:
          description: Project is the Pages project name, from the path.
          type: string
      type: object
    embedStatusResp:
      properties:
        app:
          description: App is the app this verdict is about.
          type: string
        embedUrl:
          description: |-
            EmbedURL is the in-app landing URL to frame. Empty when the caller is not
            entitled — a non-entitled caller never receives it.
          type: string
        entitled:
          description: Entitled is whether the caller's org may frame this brand-owned
            app.
          type: boolean
        origin:
          description: Origin is the app's origin on this deployment's own brand domain.
          type: string
        phase:
          description: 'Phase is the verdict in one word: not-entitled, not-provisioned
            or ready.'
          type: string
        reachable:
          description: Reachable is whether the app answered the liveness probe.
          type: boolean
      type: object
    enablementBoard:
      properties:
        betas:
          description: Betas are the subset of Items the caller's org may still opt
            into.
          items:
            $ref: '#/components/schemas/userEnablementItem'
          type: array
        items:
          description: Items is every managed item, each resolved for the caller's
            org.
          items:
            $ref: '#/components/schemas/userEnablementItem'
          type: array
        org:
          description: |-
            Org is the org this view was resolved for; empty for a caller with no
            validated principal, who sees only the generally-available items.
          type: string
      type: object
    enablementOptRef:
      properties:
        id:
          description: ID is the item within that namespace.
          type: string
        kind:
          description: 'Kind is the item''s namespace: "model", "provider" or "feature".'
          type: string
      type: object
    engineAdvertisement:
      properties:
        apis:
          description: '["openai","anthropic"]'
          items:
            type: string
          type: array
        models:
          description: ids from the node's GET /v1/models
          items:
            type: string
          type: array
        status:
          description: '"ready" | "unreachable"'
          type: string
        url:
          type: string
      type: object
    esignCompleteIn:
      properties:
        signed:
          description: |-
            Signed, when present, overrides what the provider reports — the manual path
            for a provider whose webhook is not wired. Omit it to take the provider's answer.
          type: boolean
      type: object
    esignOut:
      properties:
        esignRef:
          description: EsignRef is the provider's reference for the signature request.
          type: string
        formation:
          $ref: '#/components/schemas/Formation'
          description: Formation is the org's incorporation record with the reference
            recorded on it.
        provider:
          description: Provider is the wired e-signature provider's name.
          type: string
      type: object
    fileJSON:
      properties:
        content:
          description: Content is the file's bytes, empty when Truncated.
          type: string
        encoding:
          description: 'Encoding is how Content is carried: "utf8" verbatim, or "base64".'
          type: string
        path:
          description: Path is the file's repo-relative path.
          type: string
        size:
          description: Size is the file's byte length in the repo.
          type: integer
        truncated:
          description: |-
            Truncated marks a file past the read cap; no content is sent. A caller
            assembling a desired set must treat this as INCOMPLETE, never as empty.
          type: boolean
      type: object
    filesJSON:
      properties:
        files:
          description: |-
            Files are the selected files, sorted by path. Directories are never
            returned.
          items:
            $ref: '#/components/schemas/fileJSON'
          type: array
        rev:
          description: Rev is the full revision the ref resolved to — pin follow-up
            reads to it.
          type: string
      type: object
    flagsOut:
      properties:
        data:
          $ref: '#/components/schemas/BoardView'
        msg:
          type: string
        status:
          type: string
      type: object
    fleetBoard:
      properties:
        units:
          description: |-
            Units is the union across sources — agent run-targets, BYO workers, BYO
            clusters and Visor machines — each row naming the source it came from.
          items:
            $ref: '#/components/schemas/fleetUnit'
          type: array
      type: object
    fleetMetrics:
      properties:
        at:
          type: string
        gpuUtil:
          type: number
        load1:
          type: number
        memFree:
          type: integer
        memUsed:
          type: integer
      type: object
    fleetSpec:
      properties:
        arch:
          type: string
        cpus:
          type: integer
        gpuModel:
          type: string
        gpus:
          type: integer
        memory:
          type: integer
        os:
          type: string
      type: object
    fleetUnit:
      properties:
        host:
          type: string
        kind:
          type: string
        label:
          type: string
        metrics:
          $ref: '#/components/schemas/fleetMetrics'
        queued:
          type: integer
        running:
          description: |-
            Running is what the unit is actively executing: agent sessions for a run-target,
            in-flight renders for a BYO GPU. Queued is the gpu-jobs backlog on this GPU's
            lane (BYO units only; an agent unit does not queue). Both come from the org's
            gpu-jobs queue for BYO units, overlaid in listFleet.
          type: integer
        sessions:
          type: integer
        source:
          type: string
        spec:
          $ref: '#/components/schemas/fleetSpec'
        status:
          type: string
        unit:
          type: string
      type: object
    flowPage:
      properties:
        data:
          description: Data is the page of flows, newest-updated first.
          items:
            $ref: '#/components/schemas/Flow'
          type: array
      type: object
    flowRef:
      properties:
        id:
          description: ID is the flow to act on, from the path.
          type: string
      type: object
    formationView:
      properties:
        formation:
          $ref: '#/components/schemas/Formation'
          description: Formation is the org's one incorporation record.
        nextStages:
          description: |-
            NextStages are the stages reachable from the formation's current stage,
            whether or not their guards are satisfied yet.
          items:
            type: string
          type: array
      type: object
    foundersIn:
      properties:
        founders:
          description: |-
            Founders is every founding stakeholder. Each needs a name and an email, and
            equityBps between 0 and 10000 (1% == 100 bps).
          items:
            $ref: '#/components/schemas/Founder'
          type: array
      type: object
    gcOut:
      properties:
        maintained:
          description: Maintained is always true; the call fails rather than reporting
            false.
          type: boolean
        repo:
          description: Repo is the repo that was repacked.
          type: string
        sizeBytes:
          description: |-
            SizeBytes is the size measured AFTER the repack — usually smaller, since
            repacking drops the packs it supersedes.
          type: integer
      type: object
    gitSource:
      properties:
        branch:
          type: string
        provider:
          type: string
        url:
          type: string
      type: object
    githubBackfillIn:
      properties:
        state:
          description: |-
            State is the GitHub issue state to walk: "open" (the default), "closed" or
            "all". Anything else is a 400.
          type: string
      type: object
    githubBackfillResult:
      properties:
        created:
          description: Created is how many native issues this pass created.
          type: integer
        failed:
          description: Failed is how many repos or issues errored; the pass continues
            past each.
          type: integer
        issues:
          description: Issues is how many upstream issues were seen.
          type: integer
        repos:
          description: Repos is how many granted repos were walked (archived/disabled
            are skipped).
          type: integer
        truncated:
          description: |-
            Truncated is set when the time budget or the issue cap stopped the pass early.
            Re-run to continue — the mirror is idempotent by ExtRef, so nothing duplicates.
          type: boolean
        updated:
          description: Updated is how many existing native issues this pass refreshed.
          type: integer
      type: object
    githubImportIn:
      properties:
        all:
          description: |-
            All imports every repository the installation grants, instead of naming
            them. Archived and disabled repositories are skipped either way — they
            cannot be fetched.
          type: boolean
        repos:
          description: |-
            Repos names the repositories to import: short names within the org's
            installation, with no owner prefix (a trailing ".git" is stripped).
            Ignored when all is true.
          items:
            type: string
          type: array
      type: object
    githubImportOut:
      properties:
        queued:
          description: Queued is how many repositories were handed to the background
            importer.
          type: integer
        repos:
          description: Repos names those repositories, in the installation's listing
            order.
          items:
            type: string
          type: array
      type: object
    githubPagesBuildOut:
      properties:
        repo:
          description: Repo is the repository the build was queued for.
          type: string
        status:
          description: Status is GitHub's build state at the moment it was queued
            ("queued").
          type: string
        url:
          description: URL is GitHub's API URL for the build, for polling it there.
          type: string
      type: object
    githubPagesDisabledOut:
      properties:
        disabled:
          description: Disabled is always true — a failure is an HTTP error, never
            this shape.
          type: boolean
        repo:
          description: Repo is the repository whose site was deleted.
          type: string
      type: object
    githubPagesEnableReq:
      properties:
        branch:
          description: |-
            Branch is the legacy source branch; empty defaults to the repo's own default
            branch. Ignored when buildType is "workflow".
          type: string
        buildType:
          description: |-
            BuildType selects the builder: "workflow" builds via GitHub Actions, anything
            else builds from the branch source above.
          type: string
        path:
          description: |-
            Path is the source directory within the branch: "/" (the default) or "/docs".
            GitHub allows no others.
          type: string
        repo:
          description: Repo is the repository, from the :repo path segment.
          type: string
      type: object
    githubPagesSource:
      properties:
        branch:
          description: Branch is the branch the site builds from.
          type: string
        path:
          description: 'Path is the directory within that branch: "/" or "/docs".'
          type: string
      type: object
    githubPagesUpdateReq:
      properties:
        branch:
          description: Branch switches the legacy source branch. Empty leaves the
            source alone.
          type: string
        buildType:
          description: 'BuildType switches the builder: "legacy" or "workflow". Empty
            leaves it.'
          type: string
        cname:
          description: |-
            CNAME is the custom domain. Omit to leave it alone, "" to clear it, or a
            valid FQDN to set it.
          type: string
        httpsEnforced:
          description: HTTPSEnforced toggles GitHub's enforce-HTTPS bit. Omit to leave
            it alone.
          type: boolean
        path:
          description: |-
            Path is the source directory to pair with Branch: "/" (the default) or
            "/docs". Read only when Branch is given.
          type: string
        repo:
          description: Repo is the repository, from the :repo path segment.
          type: string
      type: object
    githubPagesUpdatedOut:
      properties:
        repo:
          description: Repo is the repository that was updated.
          type: string
        updated:
          description: Updated is always true — a failure is an HTTP error, never
            this shape.
          type: boolean
      type: object
    githubPagesView:
      properties:
        buildType:
          description: 'BuildType is the builder in use: "legacy" (branch source)
            or "workflow".'
          type: string
        cname:
          description: CNAME is the custom domain, absent when none is set.
          type: string
        custom404:
          description: Custom404 is whether the repo ships its own 404 page.
          type: boolean
        httpsEnforced:
          description: HTTPSEnforced is GitHub's enforce-HTTPS bit.
          type: boolean
        repo:
          description: Repo is the repository the site belongs to.
          type: string
        source:
          $ref: '#/components/schemas/githubPagesSource'
          description: Source is the branch + path the site builds from. Absent under
            "workflow".
        status:
          description: |-
            Status is GitHub's build state: "built", "building" or "errored". Absent
            before the first build.
          type: string
        url:
          description: URL is the live site (GitHub's html_url).
          type: string
      type: object
    githubRepoRef:
      properties:
        repo:
          description: |-
            Repo is the repository's short name within the org's installation, with no
            owner prefix (the owner is server-derived from the grant). A trailing ".git"
            is stripped.
          type: string
      type: object
    githubRepoView:
      properties:
        defaultBranch:
          description: DefaultBranch is the repo's default branch at GitHub.
          type: string
        fullName:
          description: FullName is GitHub's owner/name.
          type: string
        htmlUrl:
          description: HTMLURL is the repo's page at GitHub.
          type: string
        imported:
          description: Imported is whether this repo has been mirrored into git.hanzo.ai.
          type: boolean
        lastSyncedAt:
          description: LastSyncedAt is the last successful mirror, RFC 3339 UTC. Absent
            if never.
          type: string
        name:
          description: Name is the repository's short name within the installation.
          type: string
        private:
          description: Private is GitHub's visibility bit for the repo.
          type: boolean
        syncStatus:
          description: SyncStatus is "synced", "conflict", or "" when the repo is
            not imported.
          type: string
      type: object
    githubReposOut:
      properties:
        repos:
          description: Repos is every repo the installation grants. Never null; []
            when none.
          items:
            $ref: '#/components/schemas/githubRepoView'
          type: array
      type: object
    gpuAlertList:
      properties:
        alerts:
          description: |-
            Alerts is always empty, and typed as a raw list because Visor exposes no
            alert inventory for this surface to shape: there is nothing to describe
            until there is something to return.
          items:
            type: object
          type: array
      type: object
    gpuJob:
      properties:
        attempt:
