  /v1/automations/connectors:
    get:
      description: |-
        Connectors returns the connector catalogue. Each entry is an external service a
        flow step can invoke, carrying its auth descriptor and the input properties of its
        actions and triggers. The catalogue is the same for every tenant, so the gate is a
        validated principal rather than a per-org view.
      operationId: get_v1_automations_connectors
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Catalog'
          description: ok
      summary: Connectors returns the connector catalogue.
      tags:
      - automations
  /v1/automations/connectors/{id}/run:
    post:
      description: |-
        Run executes one connector action in-process and answers the outcome. The
        caller's resolved credential travels in `auth`, delivered to the action
        verbatim — the runtime resolves no credential itself. An action that ran and
        failed (or an action name the connector does not have) answers ok:false with
        the failure message, not an HTTP error; an unknown connector is 404 and a
        missing action 422.
      operationId: post_v1_automations_connectors_id_run
      parameters:
      - description: ID is the connector to run, from the path.
        example: notion
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              action: create_page
              auth: secret-token
              id: notion
              props:
                title: Hello
            schema:
              $ref: '#/components/schemas/runIn'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runResp'
          description: ok
      summary: Run executes one connector action in-process and answers the outcome.
      tags:
      - automations
  /v1/automations/flows:
    get:
      description: |-
        ListFlows returns the caller org's automations, most-recently-updated first. The
        optional `limit` query bounds the page.
      operationId: get_v1_automations_flows
      parameters:
      - description: Limit bounds the page (default 200, maximum 1000).
        in: query
        name: limit
        required: false
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/flowPage'
          description: ok
      summary: ListFlows returns the caller org's automations, most-recently-updated
        first.
      tags:
      - automations
    post:
      description: |-
        CreateFlow creates an automation and its initial DRAFT version in one call. The
        new flow is DISABLED — creating it does not arm its trigger; POST
        /v1/automations/flows/{id}/enable does that.
      operationId: post_v1_automations_flows
      requestBody:
        content:
          application/json:
            example:
              displayName: Nightly Sync
              trigger:
                displayName: Start
                name: trigger
                settings:
                  pieceName: core
                  triggerName: manual
                strategy: MANUAL
                type: PIECE_TRIGGER
            schema:
              $ref: '#/components/schemas/createFlowReq'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/populatedFlow'
          description: created
      summary: CreateFlow creates an automation and its initial DRAFT version in one
        call.
      tags:
      - automations
  /v1/automations/flows/{id}:
    delete:
      description: |-
        DeleteFlow deletes one automation, its versions and its run history. It answers
        no content, and a flow of another org answers not-found.
      operationId: delete_v1_automations_flows_id
      parameters:
      - description: ID is the flow to act on, from the path.
        example: flow_1
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "204":
          description: no content
      summary: DeleteFlow deletes one automation, its versions and its run history.
      tags:
      - automations
    get:
      description: |-
        GetFlow returns one automation and its latest version. That is the flow record
        plus the step tree the builder edits; a flow of another org answers not-found.
      operationId: get_v1_automations_flows_id
      parameters:
      - description: ID is the flow to act on, from the path.
        example: flow_1
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/populatedFlow'
          description: ok
      summary: GetFlow returns one automation and its latest version.
      tags:
      - automations
    patch:
      description: |-
        UpdateFlow updates one automation's metadata in place. Every field is optional; a
        field the request omits is left alone. Publishing a version pins which one runs,
        and is refused unless that version belongs to this flow.
      operationId: patch_v1_automations_flows_id
      parameters:
      - description: ID is the flow to update, from the path.
        example: flow_1
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              folderId: ops
              id: flow_1
            schema:
              $ref: '#/components/schemas/patchFlowIn'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Flow'
          description: ok
      summary: UpdateFlow updates one automation's metadata in place.
      tags:
      - automations
  /v1/automations/flows/{id}/disable:
    post:
      description: |-
        DisableFlow disarms a flow's trigger and marks it DISABLED. Its schedule and its
        event subscriptions are dropped, so a disabled flow is never a live target; runs
        already in flight are unaffected, and it can still be started on demand.
      operationId: post_v1_automations_flows_id_disable
      parameters:
      - description: ID is the flow to act on, from the path.
        example: flow_1
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              id: flow_1
            schema:
              $ref: '#/components/schemas/flowRef'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Flow'
          description: ok
      summary: DisableFlow disarms a flow's trigger and marks it DISABLED.
      tags:
      - automations
  /v1/automations/flows/{id}/enable:
    post:
      description: |-
        EnableFlow arms a flow's trigger and marks it ENABLED. A POLLING trigger gets a
        cron schedule on the durable engine; a WEBHOOK trigger gets a subscription in the
        routing index, so an inbound event starts it; a MANUAL trigger arms nothing and
        still runs on demand.
      operationId: post_v1_automations_flows_id_enable
      parameters:
      - description: ID is the flow to act on, from the path.
        example: flow_1
