          type: string
        id:
          description: ID is the target's identifier ("mir_…"), the handle to remove
            it by.
          type: string
        repo:
          description: Repo is the repo whose advanced refs are pushed downstream.
          type: string
        url:
          description: URL is the canonical https remote, with any embedded credentials
            stripped.
