  /v1/company/esign/complete:
    post:
      description: |-
        CompleteEsign records whether the formation documents have been signed. It
        consults the e-signature provider, which a real provider's webhook drives; the
        signal is idempotent.

        An explicit `signed` in the request overrides the provider's answer, which is
        the manual path for the stub provider that never self-completes.
      operationId: post_v1_company_esign_complete
      requestBody:
        content:
          application/json:
            example:
              signed: true
            schema:
              $ref: '#/components/schemas/esignCompleteIn'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/formationView'
          description: ok
      summary: CompleteEsign records whether the formation documents have been signed.
      tags:
      - company
