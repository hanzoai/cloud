          description: GrossProfit is Revenue − COGS, in cents.
          type: integer
        monthlyBurn:
          description: MonthlyBurn is net cash burned per month in cents; 0 when not
            losing cash.
          type: integer
        months:
          description: Months is the window length in whole months used to normalize
            MRR and burn.
          type: integer
        mrr:
          description: MRR is monthly recurring revenue in cents.
          type: integer
