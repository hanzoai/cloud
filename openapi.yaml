            a slug ("cloud") to its account number.
          type: string
        pattern:
          description: |-
            Pattern is the merchant substring the rule matches on, case-insensitively. It is
            also the key an upsert writes by.
          type: string
        priority:
          description: 'Priority breaks ties: when several patterns match, the highest
            wins.'
          type: integer
      type: object
