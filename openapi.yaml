      operationId: get_v1_framework_summary
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/summaryView'
          description: ok
      summary: 'summary reports how much of the DocType surface the caller''s org
        uses: how'
      tags:
      - framework
