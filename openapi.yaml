            schema:
              $ref: '#/components/schemas/subscribeReq'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/subscriptionView'
          description: created
      summary: |-
        subscribe binds a Slack channel to a repo, so the lifecycle notifier posts
        that repo's push and deploy events there.
      tags:
      - git
  /v1/git/repos/{name}/subscriptions/{id}:
    delete:
      description: |-
        unsubscribe removes one Slack subscription from a repo; the notifier stops
