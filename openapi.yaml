      - in: path
        name: org
        required: true
        schema:
          type: string
      - in: path
        name: repo
        required: true
        schema:
          type: string
  /{org}/{repo}/git-upload-pack:
    post:
      operationId: post_by_org_by_repo_git-upload-pack
      parameters:
      - in: path
        name: org
        required: true
        schema:
          type: string
      - in: path
        name: repo
        required: true
        schema:
          type: string
  /{org}/{repo}/info/refs:
    get:
      operationId: get_by_org_by_repo_info_refs
      parameters:
      - in: path
        name: org
        required: true
        schema:
          type: string
      - in: path
        name: repo
        required: true
        schema:
          type: string
  /{org}/{repo}/tree/{wildcard1}:
    get:
      operationId: get_by_org_by_repo_tree_by_wildcard1
      parameters:
      - in: path
        name: org
        required: true
        schema:
          type: string
      - in: path
        name: repo
        required: true
        schema:
          type: string
