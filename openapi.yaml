components:
  schemas:
    AccessOut:
      properties:
        data:
          properties:
            affected:
              description: Affected lists the usernames that were updated.
              items:
                type: string
              type: array
            failed:
              description: |-
                Failed lists the usernames that were NOT updated. Non-empty means the org is in
                a mixed state and the action should be retried.
              items:
                type: string
              type: array
            org:
              description: Org is the tenant acted on.
              type: string
            suspended:
              description: 'Suspended is the state applied: true for suspend, false
                for reactivate.'
              type: boolean
          type: object
        msg:
          type: string
        status:
          type: string
      type: object
    ActionOut:
      properties:
        data:
          items:
            properties:
              host:
                type: string
              msg:
                type: string
              ok:
                type: boolean
              version:
                type: string
            type: object
          type: array
        msg:
          type: string
        status:
          type: string
      type: object
    Audience:
      properties:
        createdAt:
          description: CreatedAt and UpdatedAt are unix seconds, both server-assigned.
          type: integer
        event:
          description: |-
            Event is the analytics event a member must have fired. EMPTY MEANS NO
            FILTER: the audience is then every mailable customer in the org, and no
            warehouse is consulted.
          type: string
        id:
          description: ID is the server-assigned audience id ("aud_" + 128 random
            bits).
          type: string
        name:
          description: Name is the audience's label. Required, trimmed, capped at
            1024 bytes.
          type: string
        updatedAt:
          type: integer
        windowDays:
          description: |-
            WindowDays is how far back the event counts, ending now. 0 means 30 and
            nothing above 3650 is honoured. Ignored when Event is empty.
          type: integer
      type: object
    AudienceList:
      properties:
        data:
          description: Data is the page; an empty array when the org has saved no
            audience.
          items:
            properties:
              createdAt:
                description: CreatedAt and UpdatedAt are unix seconds, both server-assigned.
                type: integer
              event:
                description: |-
                  Event is the analytics event a member must have fired. EMPTY MEANS NO
                  FILTER: the audience is then every mailable customer in the org, and no
                  warehouse is consulted.
                type: string
              id:
                description: ID is the server-assigned audience id ("aud_" + 128 random
                  bits).
                type: string
              name:
                description: Name is the audience's label. Required, trimmed, capped
                  at 1024 bytes.
                type: string
              updatedAt:
                type: integer
              windowDays:
                description: |-
                  WindowDays is how far back the event counts, ending now. 0 means 30 and
                  nothing above 3650 is honoured. Ignored when Event is empty.
                type: integer
            type: object
          type: array
      type: object
    AudiencePreview:
      properties:
        available:
          description: |-
            Available is false when the roster or the warehouse could not be read; the
            counts are then zero because nothing was measured, not because the cohort
            is empty, and Reason says which read failed.
          type: boolean
        count:
          description: |-
            Count is the cohort size: distinct warehouse identifiers for an event
            audience, mailable customers for an event-less (whole-org) one.
          type: integer
        deliverable:
          description: |-
            Deliverable is how many de-duplicated addresses a send would reach, and
            Unmatched how many cohort identifiers named no customer. Unmatched is
            reported rather than hidden: it is the honest explanation for a cohort of
            500 that mails 3.
          type: integer
        reason:
          type: string
        sample:
          description: |-
            Sample is up to 1000 cohort IDENTIFIERS — never addresses, which product
            analytics does not hold. Empty for an event-less (whole-org) audience.
          items:
            type: string
          type: array
        source:
          description: |-
            Source names where the cohort was read: the events table for an event
            audience, "iam:<org>" for the whole-org one.
          type: string
        unmatched:
          type: integer
      type: object
    BackfillIn:
      properties:
        org:
          description: |-
            Org is the tenant to migrate. Required — there is no fleet-wide form of this
            cutover, because each org must be reconciled on its own.
          type: string
      type: object
    BackfillOut:
      properties:
        data:
          properties:
            entryId:
              description: |-
                EntryID is the finance ledger entry created, or "" when the balance was
                non-positive and there was nothing to carry.
              type: string
            migratedCents:
              description: MigratedCents is the balance carried across, read from
                commerce BEFORE the move.
              type: integer
            org:
              description: Org is the tenant migrated.
              type: string
          type: object
        msg:
          type: string
        status:
          type: string
      type: object
    CalendarPost:
      properties:
        body:
          description: Body is the post text. Required.
          type: string
        channel:
          description: |-
            Channel is the target network: x, facebook, instagram, linkedin, tiktok,
            youtube or threads. Required — a post must name where it goes.
          type: string
        createdAt:
          description: CreatedAt and UpdatedAt are unix seconds, both server-assigned.
          type: integer
        error:
          description: |-
            Error is the exact reason the last publish attempt failed — the honest
            record behind a "failed" status, never a faked success.
          type: string
        id:
          description: ID is the server-assigned post id ("cal_" + 128 random bits).
          type: string
        publishedAt:
          description: PublishedAt is when the publish succeeded; 0 until it does.
          type: integer
        scheduledAt:
          description: |-
            ScheduledAt is the unix publish time; 0 leaves the post a draft, and any
            value makes it "scheduled" for the durable sweep to pick up.
          type: integer
        status:
          description: Status is draft, scheduled, published, failed or canceled.
            Server-owned.
          type: string
        title:
          description: Title is the post's internal label, capped at 1024 bytes.
          type: string
        updatedAt:
          type: integer
      type: object
    Campaign:
      properties:
        budget:
          description: Budget and Spend are minor units (USD cents), clamped to >=
            0.
          type: integer
        channel:
          description: |-
            Channel is the delivery surface: email, sms, social, meta, google or
            tiktok. Empty means email.
          type: string
        createdAt:
          description: CreatedAt and UpdatedAt are unix seconds, both server-assigned.
          type: integer
        id:
          description: ID is the server-assigned campaign id ("camp_" + 128 random
            bits).
          type: string
        name:
          description: Name is the campaign's label. Required, trimmed, capped at
            1024 bytes.
          type: string
        objective:
          description: Objective is the free-text goal ("signups"), capped at 1024
            bytes.
          type: string
        scheduledAt:
          description: |-
            ScheduledAt is the unix send time; 0 means unscheduled. Setting it on a
            campaign with no explicit status makes that status "scheduled".
          type: integer
        spend:
          type: integer
        status:
          description: |-
            Status is the lifecycle: draft, scheduled, active, paused or completed.
            Empty means draft.
          type: string
        updatedAt:
          type: integer
      type: object
    CampaignList:
      properties:
        data:
          description: Data is the page; an empty array when the org has no matching
            campaign.
          items:
            properties:
              budget:
                description: Budget and Spend are minor units (USD cents), clamped
                  to >= 0.
                type: integer
              channel:
                description: |-
                  Channel is the delivery surface: email, sms, social, meta, google or
                  tiktok. Empty means email.
                type: string
              createdAt:
                description: CreatedAt and UpdatedAt are unix seconds, both server-assigned.
                type: integer
              id:
                description: ID is the server-assigned campaign id ("camp_" + 128
                  random bits).
                type: string
              name:
                description: Name is the campaign's label. Required, trimmed, capped
                  at 1024 bytes.
                type: string
              objective:
                description: Objective is the free-text goal ("signups"), capped at
                  1024 bytes.
                type: string
              scheduledAt:
                description: |-
                  ScheduledAt is the unix send time; 0 means unscheduled. Setting it on a
                  campaign with no explicit status makes that status "scheduled".
                type: integer
              spend:
                type: integer
              status:
                description: |-
                  Status is the lifecycle: draft, scheduled, active, paused or completed.
                  Empty means draft.
                type: string
              updatedAt:
                type: integer
            type: object
          type: array
      type: object
    CordonIn:
      properties:
        cordon:
          description: Cordon true marks the node unschedulable; false restores it.
          type: boolean
        drain:
          description: Drain additionally evicts the pods already running there.
          type: boolean
        id:
          description: ID is the node's droplet id, from the path.
          type: string
      type: object
    CustomerDetailOut:
      properties:
        data:
          properties:
            apiKeys:
              type: integer
            balanceCents:
              type: integer
            created:
              type: string
            display:
              type: string
            mrrCents:
              type: integer
            org:
              type: string
            ownerEmail:
              type: string
            plan:
              type: string
            spendCents:
              type: integer
            status:
              type: string
            transactions:
              items:
                properties:
                  cents:
                    type: integer
                  currency:
                    type: string
                  id:
                    type: string
                  notes:
                    type: string
                  time:
                    type: string
                  type:
                    description: '"deposit" (credit) | "withdraw" (usage)'
                    type: string
                type: object
              type: array
            users:
              items:
                properties:
                  created:
                    type: string
                  email:
                    type: string
                  forbidden:
                    type: boolean
                  hasApiKey:
                    type: boolean
                  isAdmin:
                    type: boolean
                  lastSignin:
                    type: string
                  name:
                    type: string
                type: object
              type: array
          type: object
        msg:
          type: string
        status:
          type: string
      type: object
    CustomersOut:
      properties:
        data:
          items:
            properties:
              balanceCents:
                type: integer
              created:
                type: string
              display:
                type: string
              lastActive:
                type: string
              mrrCents:
                type: integer
              org:
                type: string
              ownerEmail:
                type: string
              plan:
                type: string
              spendCents:
                type: integer
              status:
                description: '"active" | "suspended"'
                type: string
              users:
                type: integer
            type: object
          type: array
        data2:
          type: integer
        msg:
          type: string
        status:
          type: string
      type: object
    DropletIn:
      properties:
        disk:
          description: |-
            Disk requests a PERMANENT resize that grows the disk. DO can never resize such a
            droplet down again, so it defaults false — a CPU/RAM-only change, reversible.
          type: boolean
        id:
          description: ID is the DO droplet id, from the path. Numeric.
          type: string
        size:
          description: Size is the target DigitalOcean size slug on resize, e.g. "s-4vcpu-8gb".
          type: string
      type: object
    EnrollInput:
      properties:
        address:
          description: |-
            Address is a single recipient, normalized (lower-cased, trimmed) before
            use. Give this OR audienceId, never both and never neither.
          type: string
        audienceId:
          description: |-
            AudienceID fans the sequence out over a saved audience, resolved live to
            the org's mailable customers. Email only.
          type: string
        channel:
          description: |-
            Channel is the delivery surface; empty means email. An audience resolves
            mailboxes, so an audience enroll must be email.
          type: string
        id:
          description: ID is the sequence id from the path.
          type: string
      type: object
    EnrollResult:
      properties:
        alreadyEnrolled:
          description: |-
            AlreadyEnrolled is how many this sequence had already taken and were left
            alone.
          type: integer
        enrolled:
          description: Enrolled is how many started a walk on this call.
          type: integer
        enrollmentId:
          description: |-
            EnrollmentID names the walk, and is present ONLY for a single-address
            enroll — a fan-out has many, and reporting one of them would be a lie.
          type: string
        resolved:
          description: |-
            Resolved is how many addresses the request named — 1 for an address, the
            audience's deliverable count for an audience.
          type: integer
      type: object
    EnrollmentList:
      properties:
        data:
          items:
            properties:
              address:
                description: Address is the normalized (lower-cased, trimmed) recipient.
                type: string
              channel:
                description: Channel is the delivery surface the steps go out on.
                type: string
              currentStep:
                description: CurrentStep is the index of the step that sends next.
                type: integer
              enrolledAt:
                description: EnrolledAt and UpdatedAt are unix seconds.
                type: integer
              id:
                description: ID is the server-assigned enrollment id ("enr_" + 128
                  random bits).
                type: string
              nextRunAt:
                description: |-
                  NextRunAt is the unix time the current step comes due; 0 once the walk has
                  ended. It IS the schedule — durable in SQLite, so it survives restarts.
                type: integer
              sequenceId:
                description: SequenceID is the sequence being walked.
                type: string
              status:
                description: Status is active, completed or canceled.
                type: string
              updatedAt:
                type: integer
            type: object
          type: array
      type: object
    EnrollmentRef:
      properties:
        eid:
          description: |-
            EID is the enrollment id from the path, as returned by a single-address
            enroll.
          type: string
        id:
          description: ID is the sequence id from the path.
          type: string
      type: object
    FinanceOut:
      properties:
        data:
          properties:
            cost:
              properties:
                configured:
                  type: boolean
                digitalocean:
                  properties:
                    accountBalanceCents:
                      type: integer
                    avgDailyBurnCents:
                      type: integer
                    configured:
                      type: boolean
                    creditRemainingCents:
                      type: integer
                    error:
                      type: string
                    generatedAt:
                      type: string
                    history:
                      items:
                        properties:
                          amountCents:
                            type: integer
                          date:
                            type: string
                          description:
                            type: string
                          type:
                            type: string
                        type: object
                      type: array
                    monthToDateSpendCents:
                      type: integer
                  type: object
                error:
                  type: string
                period:
                  type: string
                totalCents:
                  type: integer
                vendors:
                  items:
                    properties:
                      amountCents:
                        type: integer
                      note:
                        type: string
                      service:
                        type: string
                      source:
                        type: string
                      vendor:
                        type: string
                    type: object
                  type: array
              type: object
            derived:
              properties:
                grossMarginCents:
                  type: integer
                grossMarginPct:
                  type: number
                profitable:
                  type: boolean
                runwayDays:
                  type: number
              type: object
            generatedAt:
              type: string
            revenue:
              properties:
                configured:
                  type: boolean
                creditsConsumedCents:
                  type: integer
                mrrCents:
                  type: integer
                totalRevenueCents:
                  type: integer
              type: object
            sources:
              items:
                properties:
                  at:
                    type: string
                  error:
                    type: string
                  name:
                    type: string
                  ok:
                    type: boolean
                  rows:
                    type: integer
                type: object
              type: array
          type: object
        msg:
          type: string
        status:
          type: string
      type: object
    GrantIn:
      properties:
        amountCents:
          description: |-
            AmountCents is the credit, in whole cents. Must be positive and within the
            per-grant cap.
          type: integer
        currency:
          description: Currency is the ISO code, lower-cased. Empty means usd.
          type: string
        org:
          description: Org is the tenant to credit. Required.
          type: string
        reason:
          description: Reason is the operator's justification, recorded on the audit
            row.
          type: string
        source:
          description: |-
            Source is the money bucket: "trial" (default) for a non-cash comp that is never
            refundable, or "prepaid" for real money. Anything unknown falls back to trial.
          type: string
        user:
          description: |-
            User optionally names a MEMBER to credit, by bare IAM username. Empty credits
            the org. Which of the two the money actually lands on is decided by
            account.Payer, not here: a pooled org keeps one balance whatever is named.
          type: string
      type: object
    GrantOut:
      properties:
        data:
          properties:
            balanceCents:
              type: integer
            balanceExact:
              type: string
            currency:
              type: string
            grantedCents:
              type: integer
            org:
              type: string
            source:
              type: string
            subject:
              type: string
            transactionId:
              type: string
          type: object
        msg:
          type: string
        status:
          type: string
      type: object
    GrantsOut:
      properties:
        data:
          items:
            properties:
              actor:
                description: staff email (or sub) who issued it
                type: string
              amountCents:
                type: integer
              createdAt:
                type: string
              currency:
                type: string
              org:
                type: string
              reason:
                type: string
              result:
                description: success | error
                type: string
              source:
                description: '"trial" | "prepaid"'
                type: string
              transactionId:
                type: string
            type: object
          type: array
        data2:
          type: integer
        msg:
          type: string
        status:
          type: string
      type: object
    InvoicesOut:
      properties:
        data:
          items:
            properties:
              amountCents:
                type: integer
              currency:
                type: string
              display:
                type: string
              due:
                type: string
              id:
                type: string
              issued:
                type: string
              number:
                type: string
              org:
                type: string
              status:
                type: string
            type: object
          type: array
        data2:
          type: integer
        msg:
          type: string
        status:
          type: string
      type: object
    ListOut:
      properties:
        data:
          items:
            properties:
              addr:
                type: string
              error:
                type: string
              host:
                type: string
              plugins:
                items:
                  properties:
                    addr:
                      type: string
                    disabled:
                      type: boolean
                    name:
                      type: string
                    pid:
                      type: integer
                    prefix:
                      type: string
                    prefixes:
                      items:
                        type: string
                      type: array
                    reloads:
                      type: integer
                    restarts:
                      type: integer
                    running:
                      type: boolean
                    since:
                      properties: {}
                      type: object
                    source:
                      type: string
                    usage:
                      properties:
                        cpuNs:
                          type: integer
                        fds:
                          type: integer
                        rssBytes:
                          type: integer
                        threads:
                          type: integer
                      type: object
                    version:
                      type: string
                  type: object
                type: array
              self:
                type: boolean
            type: object
          type: array
        data2:
          type: integer
        drift:
          items:
            properties:
              disabled:
                type: integer
              down:
                type: integer
              drifted:
                type: boolean
              name:
                type: string
              running:
                type: integer
              versions:
                items:
                  type: string
                type: array
            type: object
          type: array
        msg:
          type: string
        status:
          type: string
      type: object
    MetricsOut:
      properties:
        data:
          properties:
            SaaSMetrics:
              properties:
                asOf:
                  type: string
                currency:
                  type: string
                customers:
                  items:
                    properties:
                      category:
                        type: string
                      mrrCents:
                        type: integer
                      org:
                        type: string
                      plan:
                        type: string
                      seats:
                        type: integer
                      since:
                        type: string
                      status:
                        type: string
                      usageCents:
                        type: integer
                    type: object
                  type: array
                gaps:
                  items:
                    type: string
                  type: array
                orgs:
                  type: integer
                revenue:
                  properties:
                    activeSubscriptions:
                      type: integer
                    arrCents:
                      type: integer
                    byCategory:
                      items:
                        properties:
                          category:
                            type: string
                          mrrCents:
                            type: integer
                          subscriptions:
                            type: integer
                        type: object
                      type: array
                    churnedMrrCents:
                      type: integer
                    mrrCents:
                      type: integer
                    netNewMrrCents:
                      type: integer
                    newMrrCents:
                      type: integer
                    payingCustomers:
                      type: integer
                    trials:
                      type: integer
                  type: object
                subscriptions:
                  properties:
                    byPlan:
                      items:
                        properties:
                          active:
                            type: integer
                          category:
                            type: string
                          mrrCents:
                            type: integer
                          name:
                            type: string
                          plan:
                            type: string
                          seats:
                            type: integer
                          trialing:
                            type: integer
                        type: object
                      type: array
                    canceled:
                      type: integer
                    new:
                      type: integer
                    recent:
                      items:
                        properties:
                          at:
                            type: string
                          category:
                            type: string
                          mrrDeltaCents:
                            type: integer
                          org:
                            type: string
                          plan:
                            type: string
                          type:
                            type: string
                        type: object
                      type: array
                    trialsActive:
                      type: integer
                  type: object
                usage:
                  properties:
                    instrumented:
                      type: boolean
                    requests:
                      type: integer
                    windowUsageCents:
                      type: integer
                  type: object
                window:
                  type: string
              type: object
            generatedAt:
              type: string
            sources:
              items:
                properties:
                  at:
                    type: string
                  error:
                    type: string
                  name:
                    type: string
                  ok:
                    type: boolean
                  rows:
                    type: integer
                type: object
              type: array
          type: object
        msg:
          type: string
        status:
          type: string
      type: object
    MutationOut:
      properties:
        data:
          type: object
        msg:
          type: string
        status:
          type: string
      type: object
    NameIn:
      properties:
        name:
          type: string
        scope:
          type: string
      type: object
    None:
      properties: {}
      type: object
    OrgIn:
      properties:
        org:
          description: Org is the tenant slug from the path.
          type: string
      type: object
    PostList:
      properties:
        data:
          items:
            properties:
              body:
                description: Body is the post text. Required.
                type: string
              channel:
                description: |-
                  Channel is the target network: x, facebook, instagram, linkedin, tiktok,
                  youtube or threads. Required — a post must name where it goes.
                type: string
              createdAt:
                description: CreatedAt and UpdatedAt are unix seconds, both server-assigned.
                type: integer
              error:
                description: |-
                  Error is the exact reason the last publish attempt failed — the honest
                  record behind a "failed" status, never a faked success.
                type: string
              id:
                description: ID is the server-assigned post id ("cal_" + 128 random
                  bits).
                type: string
              publishedAt:
                description: PublishedAt is when the publish succeeded; 0 until it
                  does.
                type: integer
              scheduledAt:
                description: |-
                  ScheduledAt is the unix publish time; 0 leaves the post a draft, and any
                  value makes it "scheduled" for the durable sweep to pick up.
                type: integer
              status:
                description: Status is draft, scheduled, published, failed or canceled.
                  Server-owned.
                type: string
              title:
                description: Title is the post's internal label, capped at 1024 bytes.
                type: string
              updatedAt:
                type: integer
            type: object
          type: array
      type: object
    PostRef:
      properties:
        id:
          description: ID is the post id from the path, as returned by create.
          type: string
      type: object
    PromoList:
      properties:
        data:
          items:
            properties:
              promo:
                properties:
                  active:
                    description: |-
                      Active is false for a promo that is no longer offered; an inactive promo
                      quotes as ineligible and refuses to redeem.
                    type: boolean
                  code:
                    description: Code is the promo id, e.g. "first1000".
                    type: string
                  createdAt:
                    description: CreatedAt is unix seconds.
                    type: integer
                  description:
                    description: Description is the human-readable offer.
                    type: string
                  maxRedemptions:
                    description: |-
                      MaxRedemptions is the hard fleet-wide cap; the redemption past it is
                      declined.
                    type: integer
                  percentOff:
                    description: PercentOff is the discount applied to ONE month's
                      list price.
                    type: integer
                  plans:
                    description: Plans is the csv of eligible plan ids ("pro,max,team").
                    type: string
                  teamSeatCap:
                    description: |-
                      TeamSeatCap is how many Team seats bill at the promo rate; seats beyond it
                      bill at list.
                    type: integer
