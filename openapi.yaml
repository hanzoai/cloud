          type: string
        name:
          description: Name is the proposed company name.
          type: string
        org:
          description: Org is the tenant whose formation the founder belongs to.
          type: string
        since:
          description: Since is when the formation was last touched, as a unix second.
          type: integer
      type: object
    waitlistBoostRequest:
      properties:
        email:
          description: Email identifies the entry to boost. Either this or RefCode
            is required.
          type: string
        points:
          description: |-
            Points is how many points to award. Must be positive — this seam exists to move
            someone UP toward the cutoff.
          type: integer
        reason:
          description: |-
            Reason is the operator's justification. Not sent to the engine; it is recorded on
            the audit row, which is the point of asking for it.
          type: string
        refCode:
          description: RefCode identifies the entry by its referral code, when the
            email is unknown.
          type: string
        waitlist:
          description: Waitlist is the waitlist slug the grant lands on. Required.
          type: string
      type: object
    walletTopupReq:
      properties:
        fromAddress:
          description: |-
            FromAddress is the wallet the transfer was sent from. Optional; when given it
            must match the transfer's on-chain sender.
          type: string
        rail:
          description: |-
            Which accepted rail the transfer was sent on, e.g. "base-usdc". The client
            names it rather than the server guessing from the tx: the same address can
            exist on several chains, so inferring would risk crediting against the wrong
            treasury. It may be omitted only while exactly one rail is enabled.
          type: string
        txHash:
          description: |-
            TxHash is the hash of the ERC-20 transfer that was already sent to the rail's
            treasury. The receipt is read from that chain; nothing is credited that the
            chain did not confirm.
          type: string
      type: object
    walletTopupResp:
      properties:
        balance:
          description: |-
            Balance is the org's new USD-ledger balance in cents. Best-effort: a read
            failure reports 0, and the credit has already landed either way.
          type: integer
        creditedCents:
          description: |-
            CreditedCents is the USD credit recorded, derived from the ON-CHAIN value
            using the token's own decimals — never a client-supplied number.
          type: integer
        status:
          description: Status is how commerce recorded the payment.
          type: string
        txHash:
          description: TxHash is the transfer that was credited.
          type: string
      type: object
    workerList:
      properties:
        workers:
          description: |-
            Workers is one row per connected BYO machine, each carrying the host's own
            report (GPUs, driver versions, capabilities) rather than a normalized view.
          items:
            $ref: '#/components/schemas/byoWorker'
          type: array
      type: object
