  /v1/embed-status:
    get:
      description: |-
        EmbedStatus reports whether one of this brand's shared embedded apps (cms, erp,
        help) may be framed by the caller and is actually running, so a console module
        can choose between the embed and the provision panel.

        It answers two questions the browser cannot answer for itself. ENTITLEMENT is
        server-authoritative: each app is a single shared per-BRAND instance, so only a
        member of the owning brand org — or a SuperAdmin — is given the embed URL; every
        other caller gets phase "not-entitled" and no URL. REACHABILITY is a probe of
        that origin, which a cross-origin page cannot read for itself.

        The probed host is always <app>.<this deployment's own brand domain>: no part of
        it comes from the request, so this can never be steered into probing an
        arbitrary origin.
      operationId: get_v1_embed-status
      parameters:
      - description: 'App is the embedded app to report on: cms (Content Studio),
          erp or help.'
        example: cms
        in: query
        name: app
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/embedStatusResp'
          description: ok
      summary: |-
        EmbedStatus reports whether one of this brand's shared embedded apps (cms, erp,
        help) may be framed by the caller and is actually running, so a console module
        can choose between the embed and the provision panel.

        It answers two questions the browser cannot answer for itself.
      tags:
      - embed-status
  /v1/enablement:
    get:
      description: |-
        GetEnablement returns what the caller's org can actually use: every managed
        item with its global state, whether it is effective here, whether this org is
        already opted into its beta, and whether it may still opt in. Read-only and
        safe for any caller — one without a validated principal simply sees the
        generally-available items and no opt-in affordance, never another org's state.
      operationId: get_v1_enablement
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/enablementBoard'
          description: ok
      summary: |-
        GetEnablement returns what the caller's org can actually use: every managed
        item with its global state, whether it is effective here, whether this org is
        already opted into its beta, and whether it may still opt in.
      tags:
      - enablement
  /v1/enablement/optin:
    post:
      description: |-
        OptIntoBeta opts the caller's OWN org into a beta item. The org is the
        caller's validated one, so this can never target another org, and the registry
        refuses anything not in beta — so it can neither re-open an item an operator
        turned off nor touch one that is already generally available. Requires a
        signed-in caller with an org.
      operationId: post_v1_enablement_optin
      requestBody:
        content:
          application/json:
            example:
              id: labs
              kind: feature
            schema:
              $ref: '#/components/schemas/enablementOptRef'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/userEnablementItem'
          description: ok
      summary: OptIntoBeta opts the caller's OWN org into a beta item.
      tags:
      - enablement
  /v1/enablement/optout:
    post:
      description: |-
        OptOutOfBeta removes the caller's OWN org from a beta item's grant list, the
        reverse of OptIntoBeta and idempotent. The org is the caller's validated one,
        so this can never revoke another org's grant. Requires a signed-in caller with
        an org.
      operationId: post_v1_enablement_optout
      requestBody:
        content:
          application/json:
            example:
              id: labs
              kind: feature
            schema:
              $ref: '#/components/schemas/enablementOptRef'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/userEnablementItem'
          description: ok
      summary: |-
        OptOutOfBeta removes the caller's OWN org from a beta item's grant list, the
        reverse of OptIntoBeta and idempotent.
      tags:
      - enablement
