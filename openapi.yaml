  /v1/fleet:
    get:
      description: |-
        listFleet returns every compute unit the caller's org has, from every source, each
        carrying its latest utilization: agent run-targets, the BYO machines that dialed
        in, attached BYO clusters and Visor-provisioned machines.

        A unit with a live snapshot of its own keeps it; the rest are overlaid from the
        utilization series, and only when the sample agrees about the SOURCE — two planes
        could mint the same unit id, and a board must never show one machine's load on
        another's row. BYO GPU units also carry their gpu-jobs queue depth. Every source
        is folded in independently: a broken one costs its own rows and nothing else.
      operationId: listFleet
      responses:
        "200":
          content:
            application/json:
              example:
                units:
                - host: spark
                  kind: worker
                  label: spark
                  metrics:
                    at: "2026-07-27T09:00:00Z"
                    gpuUtil: 0.42
                  queued: 2
                  running: 1
                  sessions: 0
                  source: byo
                  spec:
                    arch: arm64
                    cpus: 20
                    gpuModel: NVIDIA GB10
                    gpus: 1
                    os: linux
                  status: online
                  unit: spark
              schema:
                $ref: '#/components/schemas/fleetBoard'
          description: ok
      summary: |-
        listFleet returns every compute unit the caller's org has, from every source, each
        carrying its latest utilization: agent run-targets, the BYO machines that dialed
        in, attached BYO clusters and Visor-provisioned machines.

        A unit with a live snapshot of its own keeps it; the rest are overlaid from the
        utilization series, and only when the sample agrees about the SOURCE — two planes
        could mint the same unit id, and a board must never show one machine's load on
        another's row.
      tags:
      - fleet
  /v1/fleet/jobs:
    get:
      description: |-
        listFleetJobs returns the caller org's gpu-jobs render queue, each row tagged with
        the GPU it targets (empty = the shared any-GPU lane) and the node claiming it,
        optionally narrowed to one GPU's queue and/or one status.

        A job whose worker died — STARTED with an elapsed lease and not yet reclaimed —
        reads "stalled", not "running". Fail-soft: an unavailable tasks engine yields an
        empty queue rather than an error.
      operationId: listFleetJobs
      parameters:
      - description: |-
          GPU selects one node's lane: jobs TARGETED at it (gpu:<node>) or CLAIMED by
          it. The literal "shared" selects the any-GPU lane — no target, no claimant.
          Matched case-insensitively.
        in: query
        name: gpu
        required: false
        schema:
          type: string
      - description: |-
          Status selects one lifecycle state: queued, running, stalled, completed,
          failed or canceled.
        in: query
        name: status
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              example:
                jobs:
                - attempt: 1
                  gpu: spark
                  id: job-1
                  label: hero
                  runId: job-1
                  status: running
                  type: studio.render
                  worker: spark
              schema:
                $ref: '#/components/schemas/jobList'
          description: ok
      summary: |-
        listFleetJobs returns the caller org's gpu-jobs render queue, each row tagged with
        the GPU it targets (empty = the shared any-GPU lane) and the node claiming it,
        optionally narrowed to one GPU's queue and/or one status.

        A job whose worker died — STARTED with an elapsed lease and not yet reclaimed —
        reads "stalled", not "running".
      tags:
      - fleet
  /v1/fleet/jobs/{id}/cancel:
    post:
      description: |-
        cancelFleetJob cancels a queued or running render in the caller's org. The engine
        cancel is org-scoped, so a tenant can only ever cancel its OWN job: a job in
        another tenant's shard is 404, exactly like one that never existed. An
        already-finished job is 409.
      operationId: cancelFleetJob
      parameters:
      - description: ID is the job (activity) id, from the URL path.
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              reason: superseded
            schema:
              $ref: '#/components/schemas/jobCancel'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                canceled: job-1
                run: job-1
              schema:
                $ref: '#/components/schemas/jobCanceled'
          description: ok
      summary: cancelFleetJob cancels a queued or running render in the caller's org.
      tags:
      - fleet
  /v1/fleet/samples:
    get:
      description: |-
        listFleetSamples returns the caller org's utilization series, oldest first.

        A rejected narrower is a 400 carrying its own reason (the vocabulary is ours and
        safe to echo); a warehouse failure is logged and answered 503 "unavailable",
        because a chart that silently reads "no load" when the truth is "we cannot tell"
        is worse than one that says so. An ABSENT warehouse is different again: it returns
        an empty series, which renders honestly as "no samples yet".
      operationId: listFleetSamples
      parameters:
      - description: Unit selects one compute unit's series by its source-local id.
        in: query
        name: unit
        required: false
        schema:
          type: string
      - description: 'Source selects one plane: "agent", "byo" or "visor".'
        in: query
        name: source
        required: false
        schema:
          type: string
      - description: |-
          Range is the lookback window (e.g. "1h", "24h", "7d"); empty takes the
          warehouse default.
        in: query
        name: range
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              example:
                samples:
                - at: "2026-07-27T09:00:00Z"
                  gpuModel: GB10
                  gpuUtil: 0.42
                  gpus: 1
                  host: spark
                  kind: worker
                  source: byo
                  unit: spark
              schema:
                $ref: '#/components/schemas/sampleList'
          description: ok
      summary: |-
        listFleetSamples returns the caller org's utilization series, oldest first.

        A rejected narrower is a 400 carrying its own reason (the vocabulary is ours and
        safe to echo); a warehouse failure is logged and answered 503 "unavailable",
        because a chart that silently reads "no load" when the truth is "we cannot tell"
        is worse than one that says so.
      tags:
      - fleet
    post:
      description: |-
        ingestSample records a BYO worker's live GPU utilization into the SAME series the
        fleet board overlays. The org is the validated principal and source/kind are fixed
        server-side, so a worker names only its own metrics — never another tenant or
        another source. Answers 202: the warehouse write is DETACHED (its own bounded
        context, never in the response path), so a slow or absent warehouse cannot stall a
        heartbeat.
      operationId: recordFleetSample
      requestBody:
        content:
          application/json:
            example:
              gpuModel: GB10
              gpuUtil: 0.42
              gpus: 1
              host: spark
              memFree: 200
              memUsed: 100
              unit: spark
            schema:
              $ref: '#/components/schemas/sampleIngest'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                recorded: true
              schema:
                $ref: '#/components/schemas/sampleAccepted'
          description: ok
      summary: |-
        ingestSample records a BYO worker's live GPU utilization into the SAME series the
        fleet board overlays.
      tags:
      - fleet
  /v1/fleet/workers:
    get:
      description: |-
        listFleetWorkers returns the caller org's BYO machines — the ones that dialed in
        via `hanzo link` — with everything each host reported about itself. The Machines
        and GPUs pages fold the same data into their normalized shapes; this is the
        canonical raw list a fleet view (or the CLI's `status`) reads.
      operationId: listFleetWorkers
      responses:
        "200":
          content:
            application/json:
              example:
                workers:
                - arch: arm64
                  cpus: 20
                  gpus:
                  - memoryTotal: 122880 MiB
                    name: NVIDIA GB10
                  hostname: spark
                  id: spark
                  location: on-prem
                  provider: byo
                  status: online
              schema:
                $ref: '#/components/schemas/workerList'
          description: ok
      summary: |-
        listFleetWorkers returns the caller org's BYO machines — the ones that dialed in
        via `hanzo link` — with everything each host reported about itself.
      tags:
      - fleet
  /v1/framework/{doctype}:
    get:
      description: |-
        listDocuments returns the caller org's documents of one DocType, filtered,
        ordered and projected by the query. The DocType is resolved FIRST — through
        the same permission gate the list itself uses — because the query is validated
        against its schema: a filter, sort or field name the DocType does not declare
        is refused rather than reaching the store.
      operationId: get_v1_framework_doctype
      parameters:
      - description: DocType is the DocType to list, from the path.
        example: Task
        in: path
        name: doctype
        required: true
        schema:
          type: string
      - description: |-
          Filters is a JSON object of equality matches, e.g. {"priority":"High"}.
          Every key must be a field the DocType declares (or the managed name /
          docstatus); an undeclared one is refused rather than silently ignored.
        example: '{"priority":"High"}'
        in: query
        name: filters
        required: false
        schema:
          type: string
      - description: |-
          Fields projects the response to a subset — a JSON array ["a","b"] or a
          comma list "a,b". The envelope keys are always returned.
        in: query
        name: fields
        required: false
        schema:
          type: string
      - description: OrderBy is "<field> [asc|desc]". Empty means most-recently-updated
          first.
        example: estimate asc
        in: query
        name: order_by
        required: false
        schema:
          type: string
      - description: |-
          Limit caps the rows returned. Anything that is not a positive integer
          leaves the engine's default in place.
        example: "20"
        in: query
        name: limit
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/documentList'
          description: ok
      summary: |-
        listDocuments returns the caller org's documents of one DocType, filtered,
        ordered and projected by the query.
      tags:
      - framework
    post:
      operationId: post_v1_framework_by_doctype
      parameters:
      - in: path
        name: doctype
        required: true
        schema:
          type: string
      tags:
      - framework
  /v1/framework/{doctype}/{name}:
    delete:
      description: |-
        deleteDocument removes one document, after its on_trash hooks agree. A
        SUBMITTED document cannot be deleted — cancel it first. Answers 204.
      operationId: delete_v1_framework_doctype_name
      parameters:
      - description: DocType is the document's DocType, from the path.
        example: Task
        in: path
        name: doctype
        required: true
        schema:
          type: string
      - description: |-
          Name is the document's name — its key within the DocType — from the path.
          A name containing a space arrives percent-encoded and is decoded before it
          is matched against the stored one.
        example: TASK-00001
        in: path
        name: name
        required: true
        schema:
          type: string
      responses:
        "204":
          description: no content
      summary: deleteDocument removes one document, after its on_trash hooks agree.
      tags:
      - framework
    get:
      description: getDocument returns one document by name, with Password fields
        redacted.
      operationId: get_v1_framework_doctype_name
      parameters:
      - description: DocType is the document's DocType, from the path.
        example: Task
        in: path
        name: doctype
        required: true
        schema:
          type: string
      - description: |-
          Name is the document's name — its key within the DocType — from the path.
          A name containing a space arrives percent-encoded and is decoded before it
          is matched against the stored one.
        example: TASK-00001
        in: path
        name: name
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: object
                type: object
          description: ok
      summary: getDocument returns one document by name, with Password fields redacted.
      tags:
      - framework
    put:
      operationId: put_v1_framework_by_doctype_by_name
      parameters:
      - in: path
        name: doctype
        required: true
        schema:
          type: string
      - in: path
        name: name
        required: true
        schema:
          type: string
      tags:
      - framework
  /v1/framework/{doctype}/{name}/cancel:
    post:
      description: |-
        cancelDocument moves a submitted document to cancelled (docstatus 1 → 2) after
        its on_cancel hooks agree. Cancelling is terminal — a cancelled document
        cannot be re-submitted — but it CAN then be deleted.
      operationId: post_v1_framework_doctype_name_cancel
      parameters:
      - description: DocType is the document's DocType, from the path.
        example: Task
        in: path
        name: doctype
        required: true
        schema:
          type: string
      - description: |-
          Name is the document's name — its key within the DocType — from the path.
          A name containing a space arrives percent-encoded and is decoded before it
          is matched against the stored one.
        example: TASK-00001
        in: path
        name: name
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              doctype: Task
              name: TASK-00001
            schema:
              $ref: '#/components/schemas/docRef'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: object
                type: object
          description: ok
      summary: |-
        cancelDocument moves a submitted document to cancelled (docstatus 1 → 2) after
        its on_cancel hooks agree.
      tags:
      - framework
  /v1/framework/{doctype}/{name}/submit:
    post:
      description: |-
        submitDocument moves a draft to submitted (docstatus 0 → 1) after its
        on_submit hooks agree. A submitted document is IMMUTABLE: further writes and
        deletes are refused until it is cancelled. Only a submittable DocType has this
        lifecycle; any other docstatus is an illegal transition.
      operationId: post_v1_framework_doctype_name_submit
      parameters:
      - description: DocType is the document's DocType, from the path.
        example: Task
        in: path
        name: doctype
        required: true
        schema:
          type: string
      - description: |-
          Name is the document's name — its key within the DocType — from the path.
          A name containing a space arrives percent-encoded and is decoded before it
          is matched against the stored one.
        example: TASK-00001
        in: path
        name: name
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              doctype: Task
              name: TASK-00001
            schema:
              $ref: '#/components/schemas/docRef'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: object
                type: object
          description: ok
      summary: |-
        submitDocument moves a draft to submitted (docstatus 0 → 1) after its
        on_submit hooks agree.
      tags:
      - framework
  /v1/framework/doctypes:
    get:
      description: |-
        listDocTypes returns every DocType defined in the caller's org. Another
        tenant's definitions are never included: the org is part of the store key.
      operationId: get_v1_framework_doctypes
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/docTypeList'
          description: ok
      summary: listDocTypes returns every DocType defined in the caller's org.
      tags:
      - framework
    post:
      description: |-
        createDocType defines a DocType in the caller's org: the metadata that gives a
        document surface its fields, its naming rule, whether it has a submit/cancel
        lifecycle, and which role may do what to it. Manager-only — on a fresh org the
        first caller to administer it is seeded as its System Manager, after which
        only a System Manager (or a platform admin) may define. Answers 201.
      operationId: post_v1_framework_doctypes
      requestBody:
        content:
          application/json:
            example:
              autoname: TASK-.#####
              fields:
              - fieldname: subject
                fieldtype: Data
                reqd: true
              name: Task
            schema:
              $ref: '#/components/schemas/DocType'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocType'
          description: created
      summary: |-
        createDocType defines a DocType in the caller's org: the metadata that gives a
        document surface its fields, its naming rule, whether it has a submit/cancel
        lifecycle, and which role may do what to it.
      tags:
      - framework
  /v1/framework/doctypes/{name}:
    delete:
      description: |-
        deleteDocType removes a DocType and every document stored under it. The
        definition and its data go together — a document with no schema can be neither
        validated nor read back — so there is no undo. Manager-only. Answers 204.
      operationId: delete_v1_framework_doctypes_name
      parameters:
      - description: |-
          Name is the DocType's name, from the path. A name containing a space
          ("Sales Invoice") arrives percent-encoded and is decoded before it is
          matched against the stored one.
        example: Task
        in: path
        name: name
        required: true
        schema:
          type: string
      responses:
        "204":
          description: no content
      summary: deleteDocType removes a DocType and every document stored under it.
      tags:
      - framework
    get:
      description: |-
        getDocType returns one DocType definition — its fields, naming rule,
        permissions and lifecycle flags. Scoped to the caller's org, so another
        tenant's DocType of the same name is simply not found.
      operationId: get_v1_framework_doctypes_name
      parameters:
      - description: |-
          Name is the DocType's name, from the path. A name containing a space
          ("Sales Invoice") arrives percent-encoded and is decoded before it is
          matched against the stored one.
        example: Task
        in: path
        name: name
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocType'
          description: ok
      summary: |-
        getDocType returns one DocType definition — its fields, naming rule,
        permissions and lifecycle flags.
      tags:
      - framework
    put:
      description: |-
        replaceDocType replaces a DocType definition wholesale (PUT semantics): the
        stored definition becomes the body. The name in the URL is authoritative over
        the body's, and documents already stored under the DocType are left intact.
        Manager-only.
      operationId: put_v1_framework_doctypes_name
      parameters:
      - example: Task
        in: path
        name: name
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              fields:
              - fieldname: subject
                fieldtype: Data
              name: Task
            schema:
              $ref: '#/components/schemas/DocType'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocType'
          description: ok
      summary: |-
        replaceDocType replaces a DocType definition wholesale (PUT semantics): the
        stored definition becomes the body.
      tags:
      - framework
  /v1/framework/modules:
    get:
      description: |-
        listModules returns every app lane compiled into this deployment and the
        DocTypes each one installs. It describes the BINARY, not the org: what a given
        org has actually installed is the per-module state below.
      operationId: get_v1_framework_modules
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/moduleList'
          description: ok
      summary: |-
        listModules returns every app lane compiled into this deployment and the
        DocTypes each one installs.
      tags:
      - framework
  /v1/framework/modules/{module}:
    get:
      description: |-
        getModule returns one app lane's install state for the caller's org: the
        DocTypes the lane declares, and which of them already exist in the org. That
        is the honest "set up" versus "installed" answer a console renders.
      operationId: get_v1_framework_modules_module
      parameters:
      - description: Module is the lane's registered name ("cms", "erp"), from the
          path.
        example: cms
        in: path
        name: module
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleState'
          description: ok
      summary: |-
        getModule returns one app lane's install state for the caller's org: the
        DocTypes the lane declares, and which of them already exist in the org.
      tags:
      - framework
  /v1/framework/modules/{module}/install:
    post:
      description: |-
        installModule creates an app lane's DocTypes in the caller's org. Idempotent
        and create-if-absent: a DocType the org already has is reported as existing
        and never replaced, so re-installing cannot clobber a definition the org has
        since edited. Manager-only.
      operationId: post_v1_framework_modules_module_install
      parameters:
      - description: Module is the lane's registered name ("cms", "erp"), from the
          path.
        example: cms
        in: path
        name: module
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              module: cms
            schema:
              $ref: '#/components/schemas/moduleRef'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Install'
          description: ok
      summary: installModule creates an app lane's DocTypes in the caller's org.
      tags:
      - framework
  /v1/framework/roles:
    get:
      description: |-
        listRoles returns every (user, role) assignment in the caller's org. Roles are
        what DocType permissions are written against, so this is the grant table the
        permission calculus resolves a member's rights from.
      operationId: get_v1_framework_roles
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/roleList'
          description: ok
      summary: listRoles returns every (user, role) assignment in the caller's org.
      tags:
      - framework
    post:
      description: |-
        assignRole grants one user one role in the caller's org — how a member gains
        rights on a DocType, since permissions name roles and never users.
        Manager-only. Answers 201.
      operationId: post_v1_framework_roles
      requestBody:
        content:
          application/json:
            example:
              role: System Manager
              user: u_alice
            schema:
              $ref: '#/components/schemas/Role'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
          description: created
      summary: |-
        assignRole grants one user one role in the caller's org — how a member gains
        rights on a DocType, since permissions name roles and never users.
        Manager-only.
      tags:
      - framework
  /v1/framework/roles/{user}/{role}:
    delete:
      description: |-
        revokeRole removes one (user, role) grant in the caller's org. Manager-only.
        Answers 204; a grant that does not exist is not found.
      operationId: delete_v1_framework_roles_user_role
      parameters:
      - description: User is the assignee whose grant is being revoked, from the path.
        example: u_alice
        in: path
        name: user
        required: true
        schema:
          type: string
      - description: |-
          Role is the role to revoke, from the path. A role name containing a space
          ("System Manager") arrives percent-encoded and is decoded before it is
          matched against the stored assignment.
        example: System Manager
        in: path
        name: role
        required: true
        schema:
          type: string
      responses:
        "204":
          description: no content
      summary: revokeRole removes one (user, role) grant in the caller's org.
      tags:
      - framework
  /v1/framework/summary:
