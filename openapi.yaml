  /v1/team/account/cookie:
    delete:
      description: |-
        ClearCookie signs this browser out of team by expiring the HttpOnly
        account-token cookie the OAuth callback set. It is the counterpart of the
        cookie PUT, it takes nothing — the cookie it clears is named by this service,
        never by the caller — and it is unconditional: a caller with no cookie, an
        expired one or a forged one all get the same acknowledgement, because clearing
        something that is not there is the same outcome as clearing something that is.

        It clears ONLY the team session cookie. The IAM access-token cookie the same
        callback set is a different credential with a different lifetime and is left
        alone, so this is a team sign-out, not a platform one.
      operationId: delete_v1_team_account_cookie
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cookieAck'
          description: ok
      summary: |-
        ClearCookie signs this browser out of team by expiring the HttpOnly
        account-token cookie the OAuth callback set.
      tags:
      - team
    put:
      operationId: put_v1_team_account_cookie
      tags:
      - team
  /v1/team/account/providers:
    get:
      description: |-
        ListProviders returns the identity providers this deployment starts a login
        with. It is always exactly one — hanzo.id. Which identities that door accepts
        (Google, GitHub, passkey, password) is IAM's question, answered on IAM's own
        page next to the identity check and the training-data consent that must
        precede a first session; listing them here would be a second place holding
        that answer, and the two drift the moment IAM gains or drops one.
      operationId: get_v1_team_account_providers
      responses:
        "200":
          content:
            application/json:
              example:
              - displayName: Hanzo
                name: openid
              schema:
                items:
                  $ref: '#/components/schemas/ProviderInfo'
                type: array
          description: ok
      summary: |-
        ListProviders returns the identity providers this deployment starts a login
        with.
      tags:
      - team
  /v1/team/billing/plan:
    get:
      description: |-
        ReadPlan returns the plan and seat counts for the caller's OWN org, resolved
        from the VERIFIED team session token — never a client header. Seats and guests
        are the org's distinct active human members (a bot member is not a seat); the
        plan comes from the licensing entitlement and is empty when that read is
        unavailable, so the page shows an honest dash rather than a fabricated tier. A
        caller with no verified session gets 401, and a real seat-read failure is a
        502 rather than a false "0 members".
      operationId: get_v1_team_billing_plan
      responses:
        "200":
          content:
            application/json:
              example:
                active: true
                guestLimit: 3
                guests: 1
                plan: pro
                seats: 3
                upgradeUrl: https://billing.hanzo.ai
              schema:
                $ref: '#/components/schemas/planInfo'
          description: ok
      summary: |-
        ReadPlan returns the plan and seat counts for the caller's OWN org, resolved
        from the VERIFIED team session token — never a client header.
      tags:
      - team
  /v1/team/billing/ui:
    get:
      operationId: get_v1_team_billing_ui
      tags:
      - team
  /v1/team/billing/ui/{wildcard1}:
    get:
      operationId: get_v1_team_billing_ui_by_wildcard1
      parameters:
      - in: path
        name: wildcard1
        required: true
        schema:
          type: string
      tags:
