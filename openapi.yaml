      properties:
        account:
          description: |-
            Account is the account label the provider reported for the credential.
            apikey path only; a pointer because "" is a real answer the provider gave.
          type: string
        authorizeUrl:
          description: AuthorizeURL is the provider consent URL to send the user to.
            OAuth path only.
          type: string
        connected:
          description: Connected is true on the apikey path once the credential verified
            and sealed.
          type: boolean
        externalId:
          description: ExternalID is the provider's account id for the credential.
            apikey path only.
          type: string
        provider:
          description: Provider is the connector's registry id. apikey path only.
          type: string
        scopes:
          description: |-
            Scopes are the permissions the credential carries. apikey path only; never
            null on that path ([] when the provider reported none).
          items:
            type: string
          type: array
      type: object
