  /v1/marketing/audiences:
    get:
      description: listAudiences returns the org's saved audiences, most recently
        updated first.
      operationId: get_v1_marketing_audiences
      parameters:
      - description: Limit caps the rows returned; 0 means 200 and nothing above 1000
          is honoured.
        example: 50
        in: query
        name: limit
        required: false
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudienceList'
          description: ok
      summary: listAudiences returns the org's saved audiences, most recently updated
        first.
      tags:
      - marketing
    post:
      description: |-
        createAudience saves a cohort filter for the caller's org. Name is required.
        Omitting event saves the WHOLE-ORG audience — every mailable customer — which
        needs no analytics warehouse; naming one narrows that roster to the customers
        who fired it within windowDays.
      operationId: post_v1_marketing_audiences
      requestBody:
        content:
          application/json:
            example:
              event: model.invoked
              name: Model users, last 30d
              windowDays: 30
            schema:
              $ref: '#/components/schemas/Audience'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Audience'
          description: ok
      summary: createAudience saves a cohort filter for the caller's org.
      tags:
      - marketing
