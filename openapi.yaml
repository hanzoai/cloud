              category:
                description: Category groups the card ("Communication", "Developer",
                  "Marketing").
                type: string
              connected:
                description: Connected is whether this org has a live connection to
                  the provider.
                type: boolean
              connection:
                description: |-
                  Connection is the connected account's non-secret detail. Absent when the org
