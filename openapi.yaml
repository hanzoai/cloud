      - marketing
  /v1/marketing/calendar:
    get:
      description: |-
        listCalendarPosts returns the org's calendar, soonest scheduled first,
        optionally narrowed to one status.
      operationId: get_v1_marketing_calendar
      parameters:
      - description: |-
          Status keeps only posts in that state (draft, scheduled, published,
          failed, canceled). Empty means every post.
        example: scheduled
        in: query
        name: status
        required: false
        schema:
          type: string
      - description: Limit caps the rows returned; 0 means 200 and nothing above 1000
          is honoured.
        example: 50
        in: query
        name: limit
        required: false
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostList'
          description: ok
      summary: listCalendarPosts returns the org's calendar, soonest scheduled first,
      tags:
      - marketing
    post:
      description: |-
        createCalendarPost adds a post to the content calendar. Channel and body are
        required. A scheduledAt in the future makes the post "scheduled" and the
        durable sweep publishes it when it comes due — claimed once, so a post
        publishes at most once; without one it stays a draft.
      operationId: post_v1_marketing_calendar
      requestBody:
        content:
          application/json:
            example:
              body: Hanzo Cloud is live.
              channel: x
              scheduledAt: 1780000000
              title: Launch day
            schema:
              $ref: '#/components/schemas/CalendarPost'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarPost'
          description: ok
      summary: createCalendarPost adds a post to the content calendar.
      tags:
      - marketing
  /v1/marketing/calendar/{id}:
    delete:
      description: |-
        deleteCalendarPost removes one of the caller org's posts and answers 204. A
        post already published is deleted from the calendar only — nothing is
        retracted from the network it went out on.
      operationId: delete_v1_marketing_calendar_id
      parameters:
      - description: ID is the post id from the path, as returned by create.
        example: cal_1d7f3b9e5a2c8046f1b3d5a7c9e02468
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "204":
          description: no content
      summary: deleteCalendarPost removes one of the caller org's posts and answers
        204.
      tags:
      - marketing
    get:
      description: |-
        getCalendarPost returns one of the caller org's posts, including the exact
        error behind a failed publish. A post belonging to another org reads as not
        found.
      operationId: get_v1_marketing_calendar_id
      parameters:
      - description: ID is the post id from the path, as returned by create.
        example: cal_1d7f3b9e5a2c8046f1b3d5a7c9e02468
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarPost'
          description: ok
      summary: |-
        getCalendarPost returns one of the caller org's posts, including the exact
        error behind a failed publish.
      tags:
      - marketing
    put:
      description: |-
        updateCalendarPost replaces a post's editable fields. It is a full write, not
        a patch, and it RESETS the lifecycle from the schedule: a scheduledAt makes
        the post "scheduled" again and none makes it a draft — so editing a failed
        post requeues it rather than leaving it stuck.
      operationId: put_v1_marketing_calendar_id
      parameters:
      - description: ID is the server-assigned post id ("cal_" + 128 random bits).
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              body: Hanzo Cloud is live — try it free.
              channel: x
              scheduledAt: 1780003600
              title: Launch day
            schema:
              $ref: '#/components/schemas/CalendarPost'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarPost'
          description: ok
      summary: updateCalendarPost replaces a post's editable fields.
      tags:
      - marketing
  /v1/marketing/calendar/{id}/publish:
    post:
      description: |-
        publishCalendarPost publishes a post NOW, synchronously, whatever its
        schedule. No social connector is wired today, so every channel answers an
        honest 501 naming the seam a real one would plug into, and the post is
        recorded failed with that exact reason — never a faked "published".
      operationId: post_v1_marketing_calendar_id_publish
      parameters:
      - description: ID is the post id from the path, as returned by create.
        example: cal_1d7f3b9e5a2c8046f1b3d5a7c9e02468
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              id: cal_1d7f3b9e5a2c8046f1b3d5a7c9e02468
            schema:
              $ref: '#/components/schemas/PostRef'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarPost'
          description: ok
      summary: |-
        publishCalendarPost publishes a post NOW, synchronously, whatever its
        schedule.
      tags:
      - marketing
  /v1/marketing/campaigns:
    get:
      description: |-
        listCampaigns returns the org's campaigns, most recently updated first,
        optionally narrowed to one lifecycle status.
      operationId: get_v1_marketing_campaigns
      parameters:
      - description: |-
          Status keeps only campaigns in that lifecycle state (draft, scheduled,
          active, paused, completed). Empty means every campaign.
        example: active
        in: query
        name: status
        required: false
        schema:
          type: string
      - description: Limit caps the rows returned; 0 means 200 and nothing above 1000
          is honoured.
        example: 25
        in: query
        name: limit
        required: false
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignList'
          description: ok
      summary: listCampaigns returns the org's campaigns, most recently updated first,
      tags:
      - marketing
    post:
      description: |-
        createCampaign registers a campaign in the caller's org. Name is required;
        channel defaults to email and status to draft, and a future scheduledAt with
        no explicit status makes the campaign "scheduled". Budget and spend are cents
        and are clamped to >= 0. The id, createdAt and updatedAt of the input are
        ignored — the server assigns them.
      operationId: post_v1_marketing_campaigns
      requestBody:
        content:
          application/json:
            example:
              budget: 50000
              channel: meta
              name: Spring Launch
              objective: signups
              scheduledAt: 1780000000
            schema:
              $ref: '#/components/schemas/Campaign'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
          description: ok
      summary: createCampaign registers a campaign in the caller's org.
      tags:
      - marketing
  /v1/marketing/campaigns/{id}:
    delete:
      description: |-
        deleteCampaign removes one of the caller org's campaigns and answers 204. A
        campaign belonging to another org reads as not found and is left untouched.
      operationId: delete_v1_marketing_campaigns_id
      parameters:
      - description: ID is the campaign id from the path, as returned by create.
        example: camp_9f2a1c7d4e8b0a6f3d2c5b1e7a9f4c60
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "204":
          description: no content
      summary: deleteCampaign removes one of the caller org's campaigns and answers
        204.
      tags:
      - marketing
    get:
      description: |-
        getCampaign returns one of the caller org's campaigns. A campaign belonging to
        another org reads as not found.
      operationId: get_v1_marketing_campaigns_id
      parameters:
      - description: ID is the campaign id from the path, as returned by create.
        example: camp_9f2a1c7d4e8b0a6f3d2c5b1e7a9f4c60
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
          description: ok
      summary: getCampaign returns one of the caller org's campaigns.
      tags:
      - marketing
    put:
      description: |-
        updateCampaign replaces a campaign's editable fields. It is a full write, not
        a patch: every field takes the value in the body, and an omitted one is
        cleared. The id comes from the path — the body cannot retarget another
        campaign — and createdAt is never rewritten.
      operationId: put_v1_marketing_campaigns_id
      parameters:
      - description: ID is the server-assigned campaign id ("camp_" + 128 random bits).
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              budget: 50000
              channel: meta
              name: Spring Launch
              objective: signups
              spend: 12500
              status: active
            schema:
              $ref: '#/components/schemas/Campaign'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
          description: ok
      summary: updateCampaign replaces a campaign's editable fields.
      tags:
      - marketing
  /v1/marketing/campaigns/{id}/schedule:
    post:
      description: |-
        scheduleCampaign sets a campaign's send time and moves it to "scheduled". A
        scheduledAt of 0 clears the schedule and returns it to "draft".
      operationId: post_v1_marketing_campaigns_id_schedule
      parameters:
      - description: ID is the campaign id from the path.
        example: camp_9f2a1c7d4e8b0a6f3d2c5b1e7a9f4c60
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              id: camp_9f2a1c7d4e8b0a6f3d2c5b1e7a9f4c60
              scheduledAt: 1780000000
            schema:
              $ref: '#/components/schemas/ScheduleInput'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
          description: ok
      summary: scheduleCampaign sets a campaign's send time and moves it to "scheduled".
      tags:
      - marketing
  /v1/marketing/promos:
    get:
      description: |-
        listPromos returns every promo the deployment offers with its live counters:
        how many orgs have redeemed it and how many redemptions remain under the cap.
        The promos are fleet-wide, not per-org — only the counters move.
      operationId: get_v1_marketing_promos
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                - promo:
                    active: true
                    code: first1000
                    maxRedemptions: 1000
                    percentOff: 90
                  redeemed: 137
                  remaining: 863
              schema:
                $ref: '#/components/schemas/PromoList'
          description: ok
      summary: 'listPromos returns every promo the deployment offers with its live
        counters:'
      tags:
      - marketing
  /v1/marketing/promos/{code}/eligibility:
    get:
      description: |-
        quotePromo prices a promo against a plan and seat count. It is PURE: nothing
        is redeemed, credited or counted, so it is safe to call from a pricing page on
        every keystroke. An inactive promo or an exhausted cap quotes ineligible with
        the reason rather than erroring.
      operationId: get_v1_marketing_promos_code_eligibility
      parameters:
      - description: Code is the promo code from the path.
        example: first1000
        in: path
        name: code
        required: true
        schema:
          type: string
      - description: |-
          Plan is the plan being priced: pro, max or team. Anything else (including
          the free Developer plan) has no list price and so nothing to discount.
        example: team
        in: query
        name: plan
        required: false
        schema:
          type: string
      - description: |-
          Seats is the Team seat count; 0 means 1, and it is ignored for the
          single-seat plans.
        example: 12
        in: query
        name: seats
        required: false
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              example:
                chargeCents: 418900
                code: first1000
                discountCents: 179100
                eligible: true
                listCents: 19900
                plan: team
                remaining: 863
                seats: 12
              schema:
                $ref: '#/components/schemas/Quote'
          description: ok
      summary: quotePromo prices a promo against a plan and seat count.
      tags:
      - marketing
  /v1/marketing/promos/{code}/redeem:
    post:
      description: |-
        redeemPromo redeems the promo for the caller's org, crediting the discount
        value to its wallet through the finance ledger. Three guards run under one
        lock so the cap cannot be raced past: the fleet-wide redemption cap, one
        redemption per org, and one per payment instrument.

        It is IDEMPOTENT: an org that already redeemed gets its original redemption
        back with alreadyRedeemed true and is not credited twice.
      operationId: post_v1_marketing_promos_code_redeem
      parameters:
      - description: Code is the promo code from the path.
        example: first1000
        in: path
        name: code
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              code: first1000
              instrument: pm_1QxYz2AbCdEf
              plan: pro
              seats: 1
            schema:
              $ref: '#/components/schemas/RedeemInput'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedeemResult'
          description: ok
      summary: |-
        redeemPromo redeems the promo for the caller's org, crediting the discount
        value to its wallet through the finance ledger.
      tags:
      - marketing
  /v1/marketing/promos/{code}/redemption:
    get:
      description: |-
        getRedemption returns the caller org's OWN redemption of a promo — an
        org-scoped read, so it can never surface another tenant's. Not found when this
        org has not redeemed it.
      operationId: get_v1_marketing_promos_code_redemption
      parameters:
      - description: Code is the promo code from the path, e.g. "first1000".
        example: first1000
        in: path
        name: code
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Redemption'
          description: ok
      summary: |-
        getRedemption returns the caller org's OWN redemption of a promo — an
        org-scoped read, so it can never surface another tenant's.
      tags:
      - marketing
  /v1/marketing/sequences:
    get:
      description: listSequences returns the org's drip sequences, most recently updated
        first.
      operationId: get_v1_marketing_sequences
      parameters:
      - description: Limit caps the rows returned; 0 means 200 and nothing above 1000
          is honoured.
        example: 50
        in: query
        name: limit
        required: false
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SequenceList'
          description: ok
      summary: listSequences returns the org's drip sequences, most recently updated
        first.
      tags:
      - marketing
    post:
      description: |-
        createSequence registers a drip sequence in the caller's org. Name is
        required; status defaults to draft, and a sequence must be ACTIVE before it
        will accept enrollments. The id, createdAt and updatedAt of the input are
        ignored — the server assigns them.
      operationId: post_v1_marketing_sequences
      requestBody:
        content:
          application/json:
            example:
              name: Trial onboarding
              status: draft
            schema:
              $ref: '#/components/schemas/Sequence'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sequence'
          description: ok
      summary: createSequence registers a drip sequence in the caller's org.
      tags:
      - marketing
  /v1/marketing/sequences/{id}:
    get:
      description: |-
        getSequence returns one of the caller org's sequences together with its steps
        in send order. A sequence belonging to another org reads as not found.
      operationId: get_v1_marketing_sequences_id
      parameters:
      - description: ID is the sequence id from the path, as returned by create.
        example: seq_7b3e5a1c9d024f68b0a3e7c5d9f1a248
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SequenceView'
          description: ok
      summary: |-
        getSequence returns one of the caller org's sequences together with its steps
        in send order.
      tags:
      - marketing
  /v1/marketing/sequences/{id}/enroll:
    post:
      description: |-
        enroll adds one contact or a whole audience to a sequence and schedules the
        first step for each. The sequence must be ACTIVE (a draft sends nothing), and
        the request must name exactly one of address or audienceId.

        Enrolling is ALL this does: the message itself is sent later by the drip
        engine, through the suppression gate, so an opted-out customer can be enrolled
        here and still never be mailed. Re-posting is safe — an address this sequence
        already took is counted in alreadyEnrolled and never double-dripped — which is
        what makes retrying a partially-applied announcement a resume rather than a
        second send.
      operationId: post_v1_marketing_sequences_id_enroll
      parameters:
      - description: ID is the sequence id from the path.
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              audienceId: aud_4c1e9b7a2d6f0538e4a7c9b1d3f5027a
              channel: email
            schema:
              $ref: '#/components/schemas/EnrollInput'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                alreadyEnrolled: 3
                enrolled: 409
                resolved: 412
              schema:
                $ref: '#/components/schemas/EnrollResult'
          description: ok
      summary: |-
        enroll adds one contact or a whole audience to a sequence and schedules the
        first step for each.
      tags:
      - marketing
  /v1/marketing/sequences/{id}/enrollments:
    get:
      description: |-
        listEnrollments returns who is walking one sequence, most recently enrolled
        first, with each walk's current step and next due time.
      operationId: get_v1_marketing_sequences_id_enrollments
      parameters:
      - description: ID is the sequence id from the path.
        example: seq_7b3e5a1c9d024f68b0a3e7c5d9f1a248
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: Limit caps the rows returned; 0 means 200 and nothing above 1000
          is honoured.
        example: 100
        in: query
        name: limit
        required: false
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentList'
          description: ok
      summary: listEnrollments returns who is walking one sequence, most recently
        enrolled
      tags:
      - marketing
  /v1/marketing/sequences/{id}/enrollments/{eid}/cancel:
    post:
      description: |-
        cancelEnrollment stops one walk mid-sequence and answers 204: no further step
        is sent, and steps already delivered are not recalled. Only an ACTIVE
        enrollment can be canceled — one already completed or canceled reads as not
        found.
      operationId: post_v1_marketing_sequences_id_enrollments_eid_cancel
      parameters:
      - description: ID is the sequence id from the path.
        example: seq_7b3e5a1c9d024f68b0a3e7c5d9f1a248
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: |-
          EID is the enrollment id from the path, as returned by a single-address
          enroll.
        example: enr_2a8d6f0b4c1e9375a0d2f6b8c4e19f73
        in: path
        name: eid
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              eid: enr_2a8d6f0b4c1e9375a0d2f6b8c4e19f73
              id: seq_7b3e5a1c9d024f68b0a3e7c5d9f1a248
            schema:
              $ref: '#/components/schemas/EnrollmentRef'
        required: true
      responses:
        "204":
          description: no content
      summary: |-
        cancelEnrollment stops one walk mid-sequence and answers 204: no further step
        is sent, and steps already delivered are not recalled.
      tags:
      - marketing
  /v1/marketing/sequences/{id}/status:
    post:
      description: |-
        setSequenceStatus flips draft/active/archived — the activation gate for
        sending, since only an active sequence accepts enrollments. It does not touch
        enrollments already walking: archiving stops new ones, not in-flight ones.
      operationId: post_v1_marketing_sequences_id_status
      parameters:
      - description: ID is the sequence id from the path.
        example: seq_7b3e5a1c9d024f68b0a3e7c5d9f1a248
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              id: seq_7b3e5a1c9d024f68b0a3e7c5d9f1a248
              status: active
            schema:
              $ref: '#/components/schemas/SequenceStatus'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SequenceStatus'
          description: ok
      summary: |-
        setSequenceStatus flips draft/active/archived — the activation gate for
        sending, since only an active sequence accepts enrollments.
      tags:
      - marketing
  /v1/marketing/sequences/{id}/steps:
    get:
      description: listSteps returns one sequence's steps in send order.
      operationId: get_v1_marketing_sequences_id_steps
      parameters:
      - description: ID is the sequence id from the path, as returned by create.
        example: seq_7b3e5a1c9d024f68b0a3e7c5d9f1a248
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StepList'
          description: ok
      summary: listSteps returns one sequence's steps in send order.
      tags:
      - marketing
    post:
      description: |-
        addStep appends a message to the END of a sequence: the new step's idx is one
        past the last, so steps arrive in the order they are added. Body is required
        and delaySeconds must be >= 0. Adding a step does not disturb enrollments
        already walking — one that has passed this index simply never sees it.
      operationId: post_v1_marketing_sequences_id_steps
      parameters:
      - description: SequenceID is the sequence id from the path (the route's :id).
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              body: Here is how to make your first request…
              delaySeconds: 86400
              subject: 'Day 1: your first model call'
            schema:
              $ref: '#/components/schemas/StepInput'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Step'
          description: ok
      summary: |-
        addStep appends a message to the END of a sequence: the new step's idx is one
        past the last, so steps arrive in the order they are added.
      tags:
      - marketing
  /v1/marketing/summary:
    get:
      description: |-
        summary rolls up the caller org's campaigns: how many there are, how many are
        active, and the summed budget and spend in cents.
      operationId: get_v1_marketing_summary
      responses:
        "200":
          content:
            application/json:
              example:
                active: 3
                budget: 500000
                campaigns: 12
                spend: 128400
              schema:
                $ref: '#/components/schemas/Summary'
          description: ok
      summary: 'summary rolls up the caller org''s campaigns: how many there are,
        how many are'
      tags:
      - marketing
  /v1/marketing/suppressions:
    delete:
      description: |-
        removeSuppression re-subscribes an address on one channel and answers 204. An
        address that is not on the list reads as not found.
      operationId: delete_v1_marketing_suppressions
      parameters:
      - description: |-
          Channel is the surface opted out of: email, sms, social, meta, google or
          tiktok. Empty means email. Opting out of one leaves the others reachable.
        example: email
        in: query
        name: channel
        required: false
        schema:
          type: string
      - description: |-
          Address is the recipient, normalized (lower-cased, trimmed) so an opt-out
          cannot be slipped past on a case or whitespace difference. Required.
        example: person@example.com
        in: query
        name: address
        required: false
        schema:
          type: string
      - description: |-
          Reason is a free-text note, capped at 1024 bytes. The public one-click
          endpoint records "one-click unsubscribe".
        in: query
        name: reason
        required: false
        schema:
          type: string
      - description: CreatedAt is unix seconds, server-assigned.
        in: query
        name: createdAt
        required: false
        schema:
          type: integer
      responses:
        "204":
          description: no content
      summary: removeSuppression re-subscribes an address on one channel and answers
        204.
      tags:
      - marketing
    get:
      description: |-
        listSuppressions returns the org's opt-out list, newest first — everyone the
        send gate will refuse to deliver to.
      operationId: get_v1_marketing_suppressions
      parameters:
      - description: Limit caps the rows returned; 0 means 200 and nothing above 1000
          is honoured.
        example: 100
        in: query
        name: limit
        required: false
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuppressionList'
          description: ok
      summary: listSuppressions returns the org's opt-out list, newest first — everyone
        the
      tags:
      - marketing
    post:
      description: |-
        addSuppression records an opt-out for the org (admin / self-service
        management). Address is required; channel defaults to email. It is idempotent:
        re-suppressing the same tuple keeps the original record rather than erroring.
        From here on the ONE send gate refuses that recipient on that channel.
      operationId: post_v1_marketing_suppressions
      requestBody:
        content:
          application/json:
            example:
              address: person@example.com
              channel: email
              reason: asked support to stop
            schema:
              $ref: '#/components/schemas/Suppression'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Suppression'
          description: ok
      summary: |-
        addSuppression records an opt-out for the org (admin / self-service
        management).
      tags:
      - marketing
  /v1/marketing/unsubscribe:
    get:
      description: |-
        unsubscribe is the PUBLIC one-click endpoint (no principal): a recipient
        clicks the signed link in an email footer. The token binds (org, channel,
        address), so a caller can only opt OUT exactly the tuple it was minted for —
        never another address and never another org. An invalid token is refused, and
        a deployment with no KMS-sealed key refuses rather than accepting anything.
      operationId: get_v1_marketing_unsubscribe
      parameters:
      - description: Org is the org the link was minted for.
        example: acme
        in: query
        name: org
        required: false
        schema:
          type: string
      - description: Channel is the surface to opt out of.
        example: email
        in: query
        name: channel
        required: false
        schema:
          type: string
      - description: Address is the recipient to opt out.
        example: person@example.com
        in: query
        name: address
        required: false
        schema:
          type: string
      - description: |-
          Token is the HMAC over (org, channel, address). It is the ONLY authority
          here — there is no principal — so it binds the request to one tuple and
          nothing else.
        example: 9f2a…
        in: query
        name: token
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              example:
                address: person@example.com
                channel: email
                unsubscribed: true
              schema:
                $ref: '#/components/schemas/Unsubscribed'
          description: ok
      summary: |-
        unsubscribe is the PUBLIC one-click endpoint (no principal): a recipient
        clicks the signed link in an email footer.
      tags:
      - marketing
