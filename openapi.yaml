  /v1/admin/aimetrics:
    get:
      description: |-
        aimetrics is the fleet AI board: O11yAI generations (count, cost, avg/p95 latency,
        per-model), per-model usage from the live cloud_usage ledger, and the eval plane
        (traces, scores, score names, runs, and the average-score trend).

        Every signal degrades INDEPENDENTLY — a table that is absent or errors contributes its
        zero value and the read still succeeds. O11yAI latency is a SEPARATE query from
        generations and cost on purpose: a Nullable end_time or a column mismatch there must
        not zero the two numbers that did read.
      operationId: adminAIMetrics
      parameters:
      - description: |-
          Range is the lower time bound: 24h, 7d or 30d. Anything else reads as the
          board's own default.
        example: 7d
        in: query
        name: range
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                  end: "2026-07-27T00:00:00Z"
                  evalRuns: []
                  o11yAiModels: []
                  range: 7d
                  scoreNames: []
                  scoreSeries: []
                  start: "2026-07-20T00:00:00Z"
                  topModels: []
                msg: ""
                status: ok
              schema:
                $ref: '#/components/schemas/aimetricsOut'
          description: ok
      summary: |-
        aimetrics is the fleet AI board: O11yAI generations (count, cost, avg/p95 latency,
        per-model), per-model usage from the live cloud_usage ledger, and the eval plane
        (traces, scores, score names, runs, and the average-score trend).

        Every signal degrades INDEPENDENTLY — a table that is absent or errors contributes its
        zero value and the read still succeeds.
      tags:
      - admin
  /v1/admin/analytics:
    get:
      description: |-
        analytics is the SaaS product-analytics board over the caller's tenant window: active
        customers, new and churned, retention, MRR, ARPU, the usage trend and the top
        customers by spend — every number folded from the commerce ledger, not sampled.

        The window is the caller's, not the fleet's: a SuperAdmin gets every org, a
        white-label admin only their own subtree (core.ScopedOrgs, the one scope predicate).

        sources[] carries each upstream's freshness so a partial read is VISIBLE rather than
        silently low: a ledger that answered for only some orgs marks commerce-ledger degraded
        instead of publishing an undercount as healthy.
      operationId: adminAnalytics
      parameters:
      - description: |-
          Range is the lower time bound: 24h, 7d or 30d. Anything else reads as the
          board's own default.
        example: 30d
        in: query
        name: range
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                  generatedAt: "2026-07-27T00:00:00Z"
                  interval: day
                  range: 30d
                  sources:
                  - lastSync: "2026-07-27T00:00:00Z"
                    name: iam
                    ok: true
                    rows: 2
                msg: ""
                status: ok
              schema:
                $ref: '#/components/schemas/analyticsOut'
          description: ok
      summary: 'analytics is the SaaS product-analytics board over the caller''s tenant
        window: active'
      tags:
      - admin
  /v1/admin/applications:
    get:
      description: |-
        applications lists IAM applications for one owner org, forwarded VERBATIM from IAM's
        get-applications. These are the platform's OIDC clients — the console reads clientId
        off each row.
      operationId: adminApplications
      parameters:
      - description: |-
          Owner is the org whose rows to read. Defaults to the admin org, which owns the
          platform's roles and applications.
        example: admin
        in: query
        name: owner
        required: false
        schema:
          type: string
      - description: |-
          Page is the 1-based page number. Forwarded only when set — IAM applies its own
          default otherwise.
        example: "1"
        in: query
        name: p
        required: false
        schema:
          type: string
      - description: PageSize is rows per page. Forwarded only when set.
        example: "50"
        in: query
        name: pageSize
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                - clientId: cid
                  name: hanzo-cloud
                  owner: admin
                data2: 1
                msg: ""
                status: ok
              schema:
                $ref: '#/components/schemas/iamRowsOut'
          description: ok
      summary: |-
        applications lists IAM applications for one owner org, forwarded VERBATIM from IAM's
        get-applications.
      tags:
      - admin
  /v1/admin/audit:
    get:
      description: |-
        Records reads cloud's tamper-evident audit trail, newest first, with the chain's live
        integrity attached so a listing can be badged as verified.

        When cloud has no local store configured it falls back to forwarding IAM's own
        get-records trail verbatim — a DIFFERENT trail, federated so the endpoint never
        regresses to an empty list. Those rows carry no integrity of ours, so the field is
        null there.
      operationId: adminAudit
      parameters:
      - description: Org restricts the trail to one tenant.
        example: acme
        in: query
        name: org
        required: false
        schema:
          type: string
      - description: Sub restricts it to one actor (the validated subject that made
          the request).
        in: query
        name: sub
        required: false
        schema:
          type: string
      - description: Action restricts it to one action name, e.g. "admin.waitlist.grant".
        example: admin.waitlist.grant
        in: query
        name: action
        required: false
        schema:
          type: string
      - description: Resource restricts it to one resource kind, e.g. "credit-grant".
        in: query
        name: resource
        required: false
        schema:
          type: string
      - description: ResourceID restricts it to one resource instance.
        in: query
        name: resourceId
        required: false
        schema:
          type: string
      - description: Result restricts it to "success" or "error".
        in: query
        name: result
        required: false
        schema:
          type: string
      - description: |-
          Since is the inclusive lower time bound, RFC3339. An unparseable value is
          ignored rather than refused — one malformed filter must not hide the trail.
        example: "2026-07-01T00:00:00Z"
        in: query
        name: since
        required: false
        schema:
          type: string
      - description: Until is the upper time bound, RFC3339, with the same tolerance.
        in: query
        name: until
        required: false
        schema:
          type: string
      - description: PageSize is rows per page, default 100.
        example: "50"
        in: query
        name: pageSize
        required: false
        schema:
          type: string
      - description: Page is the 1-based page number, driving the offset.
        in: query
        name: p
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                - action: admin.waitlist.grant
                  org: acme
                  resource: waitlist
                  result: success
                  seq: 41
                  sub: z@hanzo.ai
                  ts: "2026-07-26T18:00:00Z"
                data2: 1
                integrity:
                  brokenAt: -1
                  count: 42
                  headHash: 9f2c
                  ok: true
                msg: ""
                status: ok
              schema:
                $ref: '#/components/schemas/RecordsOut'
          description: ok
      summary: |-
        Records reads cloud's tamper-evident audit trail, newest first, with the chain's live
        integrity attached so a listing can be badged as verified.

        When cloud has no local store configured it falls back to forwarding IAM's own
        get-records trail verbatim — a DIFFERENT trail, federated so the endpoint never
        regresses to an empty list.
      tags:
      - admin
  /v1/admin/audit/verify:
    get:
      description: |-
        Verify walks the WHOLE hash chain and reports whether it is intact: how many records
        were checked, the head hash to pin externally against tail-truncation, and — when the
        chain is broken — the seq of the first bad record and why.

        brokenAt is -1 exactly when ok is true. An unconfigured store is an honest failure
        here rather than a fabricated pass.
      operationId: adminAuditVerify
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                  brokenAt: -1
                  count: 42
                  headHash: 9f2c
                  ok: true
                msg: ""
                status: ok
              schema:
                $ref: '#/components/schemas/VerifyOut'
          description: ok
      summary: |-
        Verify walks the WHOLE hash chain and reports whether it is intact: how many records
        were checked, the head hash to pin externally against tail-truncation, and — when the
        chain is broken — the seq of the first bad record and why.

        brokenAt is -1 exactly when ok is true.
      tags:
      - admin
