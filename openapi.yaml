    delete:
      description: |-
        deleteAudience removes one of the caller org's audiences and answers 204. It
        deletes the saved filter only — no customer, event or enrollment is touched.
      operationId: delete_v1_marketing_audiences_id
      parameters:
      - description: ID is the audience id from the path, as returned by create.
        example: aud_4c1e9b7a2d6f0538e4a7c9b1d3f5027a
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "204":
          description: no content
      summary: deleteAudience removes one of the caller org's audiences and answers
        204.
      tags:
      - marketing
    get:
      description: |-
        getAudience returns one of the caller org's saved audiences. An audience
        belonging to another org reads as not found.
      operationId: get_v1_marketing_audiences_id
      parameters:
      - description: ID is the audience id from the path, as returned by create.
        example: aud_4c1e9b7a2d6f0538e4a7c9b1d3f5027a
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Audience'
          description: ok
      summary: getAudience returns one of the caller org's saved audiences.
      tags:
      - marketing
  /v1/marketing/audiences/{id}/preview:
    get:
      description: |-
        previewAudience evaluates the cohort LIVE — the same resolution an enrollment
        would run — and reports how big it is and how many real mailboxes it reaches.
        It is the honest answer to "is this send worth making": a cohort of 500 that
        mails 3 says so, in deliverable and unmatched. Nothing is sent.
      operationId: get_v1_marketing_audiences_id_preview
      parameters:
      - description: ID is the audience id from the path, as returned by create.
        example: aud_4c1e9b7a2d6f0538e4a7c9b1d3f5027a
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              example:
                available: true
                count: 500
                deliverable: 3
                sample:
                - u_1
                - u_2
                source: hanzo.events
                unmatched: 497
              schema:
                $ref: '#/components/schemas/AudiencePreview'
          description: ok
      summary: |-
        previewAudience evaluates the cohort LIVE — the same resolution an enrollment
        would run — and reports how big it is and how many real mailboxes it reaches.
        It is the honest answer to "is this send worth making": a cohort of 500 that
        mails 3 says so, in deliverable and unmatched.
