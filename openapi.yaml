  /v1/integrations/github/issues/backfill:
    post:
      description: |-
        githubIssuesBackfill seeds the native tracker with the EXISTING issues across the
        org's granted repos (default state=open); the webhook keeps them live thereafter.
        Org-scoped by the validated principal — a caller only ever backfills its OWN org.
        Synchronous + bounded (a total time budget and an issue cap) so it returns the
        counts directly; idempotent by ExtRef, so a re-run continues where a truncated
        pass left off and never duplicates.
      operationId: post_v1_integrations_github_issues_backfill
      requestBody:
        content:
          application/json:
            example:
              state: all
            schema:
              $ref: '#/components/schemas/githubBackfillIn'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                created: 410
                failed: 0
                issues: 430
                repos: 12
                updated: 20
              schema:
                $ref: '#/components/schemas/githubBackfillResult'
          description: ok
      summary: githubIssuesBackfill seeds the native tracker with the EXISTING issues
        across the
      tags:
      - integrations
  /v1/integrations/github/repos:
    get:
      description: |-
        githubRepos lists the org's granted GitHub repositories, each annotated with its
        native import + sync status from the git object plane. Org-authed: the org comes
        from the validated principal, and the granted set is bounded to THAT org's
        installation token — an org can never enumerate another org's repos. The console
        polls it to watch an import flip a repo to imported.
      operationId: get_v1_integrations_github_repos
      responses:
        "200":
          content:
            application/json:
              example:
                repos:
                - defaultBranch: main
                  fullName: acme/widgets
                  htmlUrl: https://github.com/acme/widgets
                  imported: true
                  lastSyncedAt: "2026-07-01T10:00:00Z"
                  name: widgets
                  private: true
                  syncStatus: synced
              schema:
                $ref: '#/components/schemas/githubReposOut'
          description: ok
      summary: |-
        githubRepos lists the org's granted GitHub repositories, each annotated with its
        native import + sync status from the git object plane.
      tags:
      - integrations
  /v1/integrations/github/repos/{repo}/pages:
    delete:
      description: |-
        githubPagesDisable deletes the repo's Pages site. 404 when there is none, so a
        caller can tell "turned it off" from "there was nothing on".
      operationId: delete_v1_integrations_github_repos_repo_pages
      parameters:
      - description: |-
          Repo is the repository's short name within the org's installation, with no
          owner prefix (the owner is server-derived from the grant). A trailing ".git"
          is stripped.
        example: widgets
        in: path
        name: repo
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              example:
                disabled: true
                repo: widgets
              schema:
                $ref: '#/components/schemas/githubPagesDisabledOut'
          description: ok
      summary: githubPagesDisable deletes the repo's Pages site.
      tags:
      - integrations
    get:
      description: |-
        githubPagesGet returns the repo's Pages status, live URL, custom domain and build
        source. The repo is resolved against the org installation's GRANTED set, so a
        caller can never address a repo the App was not granted; 404 when the repo has no
        Pages site.
      operationId: get_v1_integrations_github_repos_repo_pages
      parameters:
      - description: |-
          Repo is the repository's short name within the org's installation, with no
          owner prefix (the owner is server-derived from the grant). A trailing ".git"
          is stripped.
        example: widgets
        in: path
        name: repo
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              example:
                buildType: legacy
                cname: docs.acme.com
                custom404: false
                httpsEnforced: true
                repo: widgets
                source:
                  branch: main
                  path: /docs
                status: built
                url: https://acme.github.io/widgets/
              schema:
                $ref: '#/components/schemas/githubPagesView'
          description: ok
      summary: |-
        githubPagesGet returns the repo's Pages status, live URL, custom domain and build
        source.
      tags:
      - integrations
    post:
      description: |-
        githubPagesEnable creates the repo's Pages site and answers 201 Created with it.
        With buildType "workflow" the site builds via GitHub Actions; otherwise it builds
        from a branch source, defaulting to the repo's own default branch when none is
        given. Only "/" and "/docs" are legal source paths (GitHub's rule).
      operationId: post_v1_integrations_github_repos_repo_pages
      parameters:
      - description: Repo is the repository, from the :repo path segment.
        example: widgets
        in: path
        name: repo
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              branch: main
              path: /docs
              repo: widgets
            schema:
              $ref: '#/components/schemas/githubPagesEnableReq'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                buildType: legacy
                custom404: false
                httpsEnforced: true
                repo: widgets
                source:
                  branch: main
                  path: /docs
                status: building
                url: https://acme.github.io/widgets/
              schema:
                $ref: '#/components/schemas/githubPagesView'
          description: ok
      summary: |-
        githubPagesEnable creates the repo's Pages site and answers 201 Created with it.
        With buildType "workflow" the site builds via GitHub Actions; otherwise it builds
        from a branch source, defaulting to the repo's own default branch when none is
        given.
      tags:
      - integrations
    put:
      description: |-
        githubPagesUpdate sets or clears the custom domain (cname) and updates HTTPS
        enforcement, build type, or source. ONLY the provided fields are sent to GitHub,
        so an update never resets a setting the caller did not mention.
      operationId: put_v1_integrations_github_repos_repo_pages
      parameters:
      - description: Repo is the repository, from the :repo path segment.
        example: widgets
        in: path
        name: repo
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              cname: docs.acme.com
              httpsEnforced: true
              repo: widgets
            schema:
              $ref: '#/components/schemas/githubPagesUpdateReq'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                repo: widgets
                updated: true
              schema:
                $ref: '#/components/schemas/githubPagesUpdatedOut'
          description: ok
      summary: |-
        githubPagesUpdate sets or clears the custom domain (cname) and updates HTTPS
        enforcement, build type, or source.
      tags:
      - integrations
  /v1/integrations/github/repos/{repo}/pages/builds:
    post:
      description: |-
        GithubPagesBuild requests a Pages rebuild and returns the queued build's status.
        The build is queued AT GITHUB, not completed here, so the answer is 202 Accepted
        and its status is the one GitHub reported at queue time. 404 when the repository
        has no Pages site, or when the org's installation was not granted it.
      operationId: post_v1_integrations_github_repos_repo_pages_builds
      parameters:
      - description: |-
          Repo is the repository's short name within the org's installation, with no
          owner prefix (the owner is server-derived from the grant). A trailing ".git"
          is stripped.
        example: widgets
        in: path
        name: repo
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              repo: widgets
            schema:
              $ref: '#/components/schemas/githubRepoRef'
        required: true
      responses:
        "202":
          content:
            application/json:
              example:
                repo: widgets
                status: queued
                url: https://api.github.com/repos/acme/widgets/pages/builds/1
              schema:
                $ref: '#/components/schemas/githubPagesBuildOut'
          description: accepted
      summary: |-
        GithubPagesBuild requests a Pages rebuild and returns the queued build's status.
        The build is queued AT GITHUB, not completed here, so the answer is 202 Accepted
        and its status is the one GitHub reported at queue time.
      tags:
      - integrations
  /v1/integrations/github/repos/import:
    post:
      description: |-
        GithubImport imports the selected (or all) granted repos into git.hanzo.ai. The
        selection is intersected with the installation's GRANTED set, so a client can
        never import a repo the App was not granted (org isolation + a grant check). The
        import runs in a bounded background worker (don't block the request), so the
        answer is 202 Accepted; poll GET /v1/integrations/github/repos for the per-repo
        status to flip to imported.
      operationId: post_v1_integrations_github_repos_import
      requestBody:
        content:
          application/json:
            example:
              repos:
              - widgets
            schema:
              $ref: '#/components/schemas/githubImportIn'
        required: true
      responses:
        "202":
          content:
            application/json:
              example:
                queued: 1
                repos:
                - widgets
              schema:
                $ref: '#/components/schemas/githubImportOut'
          description: accepted
      summary: GithubImport imports the selected (or all) granted repos into git.hanzo.ai.
      tags:
      - integrations
