  /v1/crm/companies/{id}:
    delete:
      description: |-
        DeleteCompany removes one of the caller org's companies and answers 204. Any
        contact or opportunity in the org that referenced it keeps existing with the
        reference cleared, so nothing is left pointing at a company that is gone.
      operationId: delete_v1_crm_companies_id
      parameters:
      - description: ID is the record to act on, from the path.
        example: comp_1
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "204":
          description: no content
      summary: DeleteCompany removes one of the caller org's companies and answers
        204.
      tags:
      - crm
    get:
      description: |-
        GetCompany returns one of the caller org's companies. An id belonging to
        another org reads as not found.
      operationId: get_v1_crm_companies_id
      parameters:
      - description: ID is the record to act on, from the path.
        example: comp_1
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
          description: ok
      summary: GetCompany returns one of the caller org's companies.
      tags:
      - crm
    put:
      description: |-
        UpdateCompany replaces one of the caller org's companies. Every writable
        field is taken from the request, so a field the request omits is CLEARED —
        send the whole record. A name is required.
      operationId: put_v1_crm_companies_id
      parameters:
      - description: |-
          ID names the company to update and comes from the path. A create ignores
          it: the server mints the id.
        example: comp_1
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              employees: 64
              id: comp_1
              name: MaxPower Inc
            schema:
              $ref: '#/components/schemas/companyReq'
        required: true
      responses:
        "200":
          content:
