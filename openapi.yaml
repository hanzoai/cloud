  /v1/clusters:
    get:
      description: |-
        listClusters returns the caller org's clusters from both sources: the managed
        clusters projected from Visor's node pools, and the BYO clusters attached to the
        caller's project. A Visor outage costs the managed half only — the BYO half
        still lists, because a page that 502s on an optional provider is worse than a
        page that shows what it can.
      operationId: listClusters
      responses:
        "200":
          content:
            application/json:
              example:
                clusters:
                - doksClusterId: cl-1
                  kind: managed
                  name: prod
                  nodeCount: 2
                  nodePools:
                  - count: 2
                    name: gpu
                    poolId: p-1
                    size: gpu-h100x8-640gb
                  nodeSize: gpu-h100x8-640gb
                  status: running
              schema:
                $ref: '#/components/schemas/clusterList'
          description: ok
      summary: |-
        listClusters returns the caller org's clusters from both sources: the managed
        clusters projected from Visor's node pools, and the BYO clusters attached to the
        caller's project.
      tags:
      - clusters
    post:
      description: |-
        attachCluster attaches a BYO cluster to the caller's org — the kubeconfig is
        validated, KMS-sealed and added to the fleet — and answers 201 with the cluster
        as it now appears on GET /v1/clusters. Billed the nominal management fee: the
        customer brings the compute, Hanzo meters the management plane.
      operationId: attachCluster
      requestBody:
        content:
          application/json:
            example:
              default: false
              kubeconfig: |-
                apiVersion: v1
                kind: Config
                ...
              name: lab
              provider: on-prem
            schema:
              $ref: '#/components/schemas/clusterAttach'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                kind: byo
                name: lab
                nodeCount: 3
                nodePools: []
                nvidiaGpu: 2
                region: on-prem
                status: attached
              schema:
                $ref: '#/components/schemas/clusterView'
          description: ok
      summary: |-
        attachCluster attaches a BYO cluster to the caller's org — the kubeconfig is
        validated, KMS-sealed and added to the fleet — and answers 201 with the cluster
        as it now appears on GET /v1/clusters.
      tags:
      - clusters
  /v1/clusters/{clusterId}/pools:
    post:
      description: |-
        createPool adds a node pool to one of the caller org's clusters and answers 201
        with the created pool. Only the CreateNodePoolSpec fields are forwarded;
        owner/provider/clusterId ride in the query exactly as Visor expects them.
      operationId: createNodePool
      parameters:
      - description: ClusterID is the cluster to add the pool to, from the URL path.
        in: path
        name: clusterId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              autoScale: false
              count: 2
              name: gpu
              provider: digitalocean
              size: gpu-h100x8-640gb
            schema:
              $ref: '#/components/schemas/poolCreate'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                count: 2
                name: gpu
                poolId: p-1
                size: gpu-h100x8-640gb
              schema:
                $ref: '#/components/schemas/nodePoolView'
          description: ok
      summary: |-
        createPool adds a node pool to one of the caller org's clusters and answers 201
        with the created pool.
      tags:
      - clusters
  /v1/clusters/{clusterId}/pools/{poolId}:
    delete:
      description: |-
        deletePool removes a node pool from one of the caller org's clusters. The owner
        scopes the delete to the caller's tenant; provider+clusterId drive the
        provider-side removal. Answers 204.
      operationId: deleteNodePool
      parameters:
      - description: ClusterID and PoolID address the pool, from the URL path.
        in: path
        name: clusterId
        required: true
        schema:
          type: string
      - in: path
        name: poolId
        required: true
        schema:
          type: string
      - description: Provider is the cloud the cluster lives on, from ?provider=.
          Required.
        in: query
        name: provider
        required: false
        schema:
          type: string
      responses:
        "204":
          description: no content
      summary: deletePool removes a node pool from one of the caller org's clusters.
      tags:
      - clusters
  /v1/clusters/{clusterId}/pools/{poolId}/scale:
    post:
      description: |-
        scalePool resizes a node pool to an absolute node count and returns the pool as
        Visor reports it after the change.
      operationId: scaleNodePool
      parameters:
      - description: ClusterID and PoolID address the pool, from the URL path.
        in: path
        name: clusterId
        required: true
        schema:
          type: string
      - in: path
        name: poolId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              count: 4
              provider: digitalocean
            schema:
              $ref: '#/components/schemas/poolScale'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                count: 4
                name: gpu
                poolId: p-1
                size: gpu-h100x8-640gb
              schema:
                $ref: '#/components/schemas/nodePoolView'
          description: ok
      summary: scalePool resizes a node pool to an absolute node count and returns
        the pool as
      tags:
      - clusters
  /v1/clusters/{id}:
    delete:
      description: |-
        detachCluster removes a BYO cluster from the caller org's fleet. It only ever
        touches BYO clusters — a managed cluster's nodes are removed through the node-pool
        routes — and answers 404 when the name is not in this org's fleet.
      operationId: detachCluster
      parameters:
      - description: |-
          ID is the cluster's fleet name (the `name` it was attached under), matched
          lower-cased.
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              example:
                detached: lab
              schema:
                $ref: '#/components/schemas/clusterDetached'
          description: ok
      summary: detachCluster removes a BYO cluster from the caller org's fleet.
      tags:
      - clusters
