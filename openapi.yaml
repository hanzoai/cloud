  /v1/cloudflare/zones:
    get:
      description: |-
        ZonesList lists the Cloudflare zones the org's connected API token can see,
        paged and filtered by the query parameters Cloudflare itself accepts. Zones are
        token-scoped by Cloudflare, so no account is resolved. Any org member may read.

        Zone and DNS-record MANAGEMENT is not here: it stays on the Hanzo DNS plane
        (/v1/dns). This only surfaces the Cloudflare zone objects the asset plane needs
        — a zone id is what addresses a Worker route or an analytics read.
      operationId: get_v1_cloudflare_zones
      parameters:
      - description: Page is the 1-based page of zones to return.
        in: query
        name: page
        required: false
        schema:
          type: string
      - description: PerPage is how many zones one page holds.
        in: query
        name: per_page
        required: false
        schema:
          type: string
      - description: Name filters to the zone with this domain name.
        in: query
        name: name
        required: false
        schema:
          type: string
      - description: Status filters by zone status (active, pending, initializing,
          …).
        in: query
        name: status
        required: false
        schema:
          type: string
      - description: Order names the field to sort by, and Direction sorts asc or
          desc.
        in: query
        name: order
        required: false
        schema:
          type: string
      - in: query
        name: direction
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cfResult'
          description: ok
      summary: |-
        ZonesList lists the Cloudflare zones the org's connected API token can see,
        paged and filtered by the query parameters Cloudflare itself accepts.
      tags:
      - cloudflare
  /v1/cloudflare/zones/{zone}:
    get:
      description: |-
        ZoneGet reads one Cloudflare zone the org's token can see. Any org member may
        read. A zone id the token cannot see is Cloudflare's own not-found, relayed.
      operationId: get_v1_cloudflare_zones_zone
      parameters:
      - description: Zone is the 32-hex Cloudflare zone id.
        example: 0123456789abcdef0123456789abcdef
        in: path
        name: zone
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cfResult'
          description: ok
      summary: ZoneGet reads one Cloudflare zone the org's token can see.
      tags:
      - cloudflare
  /v1/cloudflare/zones/{zone}/analytics:
    get:
      description: |-
        ZoneAnalytics reads a zone's Cloudflare traffic dashboard — requests, bandwidth,
        threats and pageviews over the since/until window. Any org member may read.

        A zone whose Cloudflare plan does not serve this endpoint yields Cloudflare's
        OWN error, never a fabricated success.
      operationId: get_v1_cloudflare_zones_zone_analytics
      parameters:
      - description: Zone is the 32-hex Cloudflare zone id.
        example: 0123456789abcdef0123456789abcdef
        in: path
        name: zone
        required: true
        schema:
          type: string
      - description: |-
          Since and Until bound the window, in the form Cloudflare accepts — an RFC 3339
          time or a negative number of minutes from now ("-1440" is the last day).
        example: "-1440"
        in: query
        name: since
        required: false
        schema:
          type: string
      - example: "0"
        in: query
        name: until
        required: false
        schema:
          type: string
      - description: Continuous asks Cloudflare for only fully-aggregated buckets.
        in: query
        name: continuous
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cfResult'
          description: ok
      summary: |-
        ZoneAnalytics reads a zone's Cloudflare traffic dashboard — requests, bandwidth,
        threats and pageviews over the since/until window.
      tags:
      - cloudflare
  /v1/cloudflare/zones/{zone}/purge:
    post:
      description: |-
        ZonePurge drops a zone's Cloudflare edge cache — either the whole zone
        (purge_everything) or exactly the listed file URLs. Requires org admin.

        Purging is the one zone-scoped WRITE this plane owns. It is not DNS — no record
        changes — so it does not belong on /v1/dns, and it is not a connection, so it does
        not belong on the integrations plane. It is a cache operation on a zone, which is
        what this asset plane is for. It takes the admin gate because dropping a zone's
        cache sends every subsequent request to the origin: on a site fronting a small
        origin that is a self-inflicted load spike, so it is a change, not a look.

        Exactly one selector is required. Cloudflare treats a body with neither as a
        no-op and answers 200, which reads as "purged" to a caller that never purged
        anything — the failure we refuse to pass through.
      operationId: post_v1_cloudflare_zones_zone_purge
      parameters:
      - description: Zone is the 32-hex Cloudflare zone id, from the path.
        example: 0123456789abcdef0123456789abcdef
        in: path
        name: zone
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              purge_everything: true
              zone: 0123456789abcdef0123456789abcdef
            schema:
              $ref: '#/components/schemas/purgeIn'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cfResult'
          description: ok
      summary: |-
        ZonePurge drops a zone's Cloudflare edge cache — either the whole zone
        (purge_everything) or exactly the listed file URLs.
      tags:
      - cloudflare
  /v1/clusters:
    get:
      description: |-
        listClusters returns the caller org's clusters from both sources: the managed
        clusters projected from Visor's node pools, and the BYO clusters attached to the
        caller's project. A Visor outage costs the managed half only — the BYO half
        still lists, because a page that 502s on an optional provider is worse than a
        page that shows what it can.
      operationId: listClusters
      responses:
        "200":
          content:
            application/json:
              example:
                clusters:
                - doksClusterId: cl-1
                  kind: managed
                  name: prod
                  nodeCount: 2
                  nodePools:
                  - count: 2
                    name: gpu
                    poolId: p-1
                    size: gpu-h100x8-640gb
                  nodeSize: gpu-h100x8-640gb
                  status: running
              schema:
                $ref: '#/components/schemas/clusterList'
          description: ok
      summary: |-
        listClusters returns the caller org's clusters from both sources: the managed
        clusters projected from Visor's node pools, and the BYO clusters attached to the
        caller's project.
      tags:
      - clusters
    post:
      description: |-
        attachCluster attaches a BYO cluster to the caller's org — the kubeconfig is
        validated, KMS-sealed and added to the fleet — and answers 201 with the cluster
        as it now appears on GET /v1/clusters. Billed the nominal management fee: the
        customer brings the compute, Hanzo meters the management plane.
      operationId: attachCluster
      requestBody:
        content:
          application/json:
            example:
              default: false
              kubeconfig: |-
                apiVersion: v1
                kind: Config
                ...
              name: lab
              provider: on-prem
            schema:
              $ref: '#/components/schemas/clusterAttach'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                kind: byo
                name: lab
                nodeCount: 3
                nodePools: []
                nvidiaGpu: 2
                region: on-prem
                status: attached
              schema:
                $ref: '#/components/schemas/clusterView'
          description: ok
      summary: |-
        attachCluster attaches a BYO cluster to the caller's org — the kubeconfig is
        validated, KMS-sealed and added to the fleet — and answers 201 with the cluster
        as it now appears on GET /v1/clusters.
      tags:
      - clusters
  /v1/clusters/{clusterId}/pools:
    post:
      description: |-
        createPool adds a node pool to one of the caller org's clusters and answers 201
        with the created pool. Only the CreateNodePoolSpec fields are forwarded;
        owner/provider/clusterId ride in the query exactly as Visor expects them.
      operationId: createNodePool
      parameters:
      - description: ClusterID is the cluster to add the pool to, from the URL path.
        in: path
        name: clusterId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              autoScale: false
              count: 2
              name: gpu
              provider: digitalocean
              size: gpu-h100x8-640gb
            schema:
              $ref: '#/components/schemas/poolCreate'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                count: 2
                name: gpu
                poolId: p-1
                size: gpu-h100x8-640gb
              schema:
                $ref: '#/components/schemas/nodePoolView'
          description: ok
      summary: |-
        createPool adds a node pool to one of the caller org's clusters and answers 201
        with the created pool.
      tags:
      - clusters
  /v1/clusters/{clusterId}/pools/{poolId}:
    delete:
      description: |-
        deletePool removes a node pool from one of the caller org's clusters. The owner
        scopes the delete to the caller's tenant; provider+clusterId drive the
        provider-side removal. Answers 204.
      operationId: deleteNodePool
      parameters:
      - description: ClusterID and PoolID address the pool, from the URL path.
        in: path
        name: clusterId
        required: true
        schema:
          type: string
      - in: path
        name: poolId
        required: true
        schema:
          type: string
      - description: Provider is the cloud the cluster lives on, from ?provider=.
          Required.
        in: query
        name: provider
        required: false
        schema:
          type: string
      responses:
        "204":
          description: no content
      summary: deletePool removes a node pool from one of the caller org's clusters.
      tags:
      - clusters
  /v1/clusters/{clusterId}/pools/{poolId}/scale:
    post:
      description: |-
        scalePool resizes a node pool to an absolute node count and returns the pool as
        Visor reports it after the change.
      operationId: scaleNodePool
      parameters:
      - description: ClusterID and PoolID address the pool, from the URL path.
        in: path
        name: clusterId
        required: true
        schema:
          type: string
      - in: path
        name: poolId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              count: 4
              provider: digitalocean
            schema:
              $ref: '#/components/schemas/poolScale'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                count: 4
                name: gpu
                poolId: p-1
                size: gpu-h100x8-640gb
              schema:
                $ref: '#/components/schemas/nodePoolView'
          description: ok
      summary: scalePool resizes a node pool to an absolute node count and returns
        the pool as
      tags:
      - clusters
  /v1/clusters/{id}:
    delete:
      description: |-
        detachCluster removes a BYO cluster from the caller org's fleet. It only ever
        touches BYO clusters — a managed cluster's nodes are removed through the node-pool
        routes — and answers 404 when the name is not in this org's fleet.
      operationId: detachCluster
      parameters:
      - description: |-
          ID is the cluster's fleet name (the `name` it was attached under), matched
          lower-cased.
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              example:
                detached: lab
              schema:
                $ref: '#/components/schemas/clusterDetached'
          description: ok
      summary: detachCluster removes a BYO cluster from the caller org's fleet.
      tags:
      - clusters
