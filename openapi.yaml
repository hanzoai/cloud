          type: string
        sourceId:
          description: |-
            SourceID is the source event's own id within that namespace. Together with
            SourceKind it is the key that makes a repeat posting a no-op.
          type: string
        sourceKind:
          description: SourceKind is the idempotency namespace naming what booked
            this, e.g. "scan".
          type: string
      type: object
