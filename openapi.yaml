        that is not this repo's subscription is not found.
      operationId: delete_v1_git_repos_name_subscriptions_id
      parameters:
      - description: Name is the repo, from the :name path segment.
        example: widgets
        in: path
        name: name
        required: true
        schema:
          type: string
      - description: ID is the row to remove, from the :id path segment.
