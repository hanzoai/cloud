  /v1/admin/usage:
    get:
      description: |-
        usage returns the month-to-date money totals: one org's when org names one, else the
        fleet sum across every org a SuperAdmin can see.

        series and byProduct are ALWAYS empty. A daily trend and a per-product split are not
        derivable from the commerce billing API — they live in insights/datastore — so this
        answers with the honest empty arrays rather than fabricating a shape the console would
        then chart. Same reason tokens and requests are 0: there is no fleet counter to read.
      operationId: adminUsage
      parameters:
      - description: |-
          Org reads ONE tenant's month-to-date total instead of the fleet sum. Honoured
          for a SuperAdmin only — a white-label admin always reads their own org.
        in: query
        name: org
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                  byProduct: []
                  series: []
                  totals:
                    requests: 0
                    spendCents: 12500
                    tokens: 0
                msg: ""
                status: ok
              schema:
                $ref: '#/components/schemas/usageOut'
          description: ok
      summary: |-
        usage returns the month-to-date money totals: one org's when org names one, else the
        fleet sum across every org a SuperAdmin can see.

        series and byProduct are ALWAYS empty.
      tags:
      - admin
  /v1/admin/usage/funding:
    get:
      description: |-
        UsageFunding splits our upstream AI usage by how it was FUNDED: one row per (provider,
        model) over the window, tagged credit (provider grant still remaining), paid (grant
        exhausted) or paid_only (no grant at all).

        The class is resolved at the PROVIDER level from the credit ledger, not per call — the
        per-call split, and the `byo` class, arrive when the metering write stamps a funding
        column on cloud_usage and this can GROUP BY it directly. Until then a provider with
        remaining grant reports all of its usage as credit, which is right in aggregate and
        approximate at the boundary where a grant runs out mid-window.

        An unparseable window falls back to the last 30 days rather than refusing: this is a
        dashboard read, and a typo in a date must not blank the board.
      operationId: adminUsageFunding
      parameters:
      - description: |-
          From is the inclusive start of the window. Unparseable or absent, together with
          To, falls back to the last 30 days.
        in: query
        name: from
        required: false
        schema:
          type: string
      - description: To is the exclusive end of the window.
        in: query
        name: to
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                - cost_cents: 420
                  funding: credit
                  model: llama-3.3-70b
                  provider: digitalocean
                  requests: 310
                  tokens: 1200000
                msg: ""
                status: ok
              schema:
                $ref: '#/components/schemas/UsageFundingOut'
          description: ok
      summary: |-
        UsageFunding splits our upstream AI usage by how it was FUNDED: one row per (provider,
        model) over the window, tagged credit (provider grant still remaining), paid (grant
        exhausted) or paid_only (no grant at all).

        The class is resolved at the PROVIDER level from the credit ledger, not per call — the
        per-call split, and the `byo` class, arrive when the metering write stamps a funding
        column on cloud_usage and this can GROUP BY it directly.
      tags:
      - admin
  /v1/admin/users:
    get:
      description: |-
        users lists the user directory across the caller's tenant window, one page at a time.
        data2 is IAM's REAL total, so the console can page through it.

        A SuperAdmin may aim the read at one tenant with org; a white-label admin cannot — for
        them the owner is hard-pinned to their own org and org is ignored, which is what keeps
        the directory from becoming a cross-tenant read.
      operationId: adminUsers
      parameters:
      - description: |-
          Org narrows the directory to ONE tenant. Honoured for a SuperAdmin only — a
          white-label admin is pinned to their own org and this is ignored.
        in: query
        name: org
        required: false
        schema:
          type: string
      - description: Query is a free-text filter, matched by IAM as a "contains" over
          the user name.
        in: query
        name: q
        required: false
        schema:
          type: string
      - description: |-
          Page is the 1-based page number. Defaults to "1"; IAM returns zero rows AND a
          zero total when it is unset, so this layer never leaves it empty.
        in: query
        name: p
        required: false
        schema:
          type: string
      - description: PageSize is rows per page. Defaults to "200", the shared admin
          page size.
        in: query
        name: pageSize
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                - created: "2026-01-04T00:00:00Z"
                  displayName: Ada
                  email: ada@acme.com
                  forbidden: false
                  isAdmin: true
                  isSuperAdmin: false
                  lastSignin: "2026-07-01T09:12:00Z"
                  name: ada
                  owner: acme
                  tag: ""
                data2: 222
                msg: ""
                status: ok
              schema:
                $ref: '#/components/schemas/usersOut'
          description: ok
      summary: users lists the user directory across the caller's tenant window, one
        page at a time.
      tags:
      - admin
  /v1/admin/waitlist:
    get:
      description: |-
        waitlist reads one waitlist's leaderboard from the Hanzo waitlist engine — position,
        points and referral standing per entry — proxied server-authed with the engine secret,
        never a client credential.

        The engine's payload is forwarded VERBATIM as data; the console normalizes it. When
        the engine is not configured on this deployment the read still succeeds, with an empty
        object and a msg saying so, so the panel shows an honest not-wired state instead of an
        error the operator would chase.
      operationId: adminWaitlist
      parameters:
      - description: |-
          Waitlist is the waitlist slug to read (e.g. "chat"). The engine decides what an
          empty slug means.
        in: query
        name: waitlist
        required: false
        schema:
          type: string
      - description: Page is the 1-based page number.
        in: query
        name: page
        required: false
        schema:
          type: string
      - description: PageSize is entries per page.
        in: query
        name: pageSize
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                  entries:
                  - email: ada@acme.com
                    points: 120
                    position: 7
                  total: 842
                msg: ""
                status: ok
              schema:
                $ref: '#/components/schemas/rawOut'
          description: ok
      summary: |-
        waitlist reads one waitlist's leaderboard from the Hanzo waitlist engine — position,
        points and referral standing per entry — proxied server-authed with the engine secret,
        never a client credential.

        The engine's payload is forwarded VERBATIM as data; the console normalizes it.
      tags:
      - admin
  /v1/admin/waitlist/boost:
    post:
      description: |-
        waitlistBoost grants a user waitlist points, moving them up toward the access cutoff.
        This is the access lever: the cutoff itself does not move, the person does.

        It funnels through the engine's verified grant seam (POST /v1/waitlist/award with
        source="grant" — the ONE path that honours an explicit points amount) and writes a
        tamper-evident audit row either way, so a FAILED grant is recorded too. The reason
        field goes only to that row.
      operationId: adminWaitlistBoost
      requestBody:
        content:
          application/json:
            example:
              email: ada@acme.com
              points: 50
              reason: design partner
              waitlist: chat
            schema:
              $ref: '#/components/schemas/waitlistBoostRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                  email: ada@acme.com
                  points: 170
                  position: 3
                msg: ""
                status: ok
              schema:
                $ref: '#/components/schemas/rawOut'
          description: ok
      summary: |-
        waitlistBoost grants a user waitlist points, moving them up toward the access cutoff.
        This is the access lever: the cutoff itself does not move, the person does.

        It funnels through the engine's verified grant seam (POST /v1/waitlist/award with
        source="grant" — the ONE path that honours an explicit points amount) and writes a
        tamper-evident audit row either way, so a FAILED grant is recorded too.
      tags:
      - admin
