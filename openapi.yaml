  /v1/git/keys:
    get:
      description: |-
        listKeys returns the SSH public keys registered to the caller's org — the keys
        that authenticate `git clone git@<host>:<org>/<repo>.git`. Keys are org-scoped
        on read even though the fingerprint index is global, so one org never sees
        another's.
      operationId: get_v1_git_keys
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                - createdAt: "2026-07-01T10:00:00Z"
                  fingerprint: SHA256:9pQ…
                  id: gitkey_4a1b
                  publicKey: ssh-ed25519 AAAAC3Nz…
                  title: laptop
              schema:
                $ref: '#/components/schemas/keyList'
          description: ok
      summary: |-
        listKeys returns the SSH public keys registered to the caller's org — the keys
        that authenticate `git clone git@<host>:<org>/<repo>.git`.
      tags:
      - git
    post:
      description: |-
        registerKey registers an SSH public key so it can authenticate `git clone
        git@<host>:<org>/<repo>.git` for the caller's org. The key line is parsed and
        canonicalized before storage, its SHA256 fingerprint becomes the auth lookup
        handle, and the full public key round-trips (it is public). Answers 201.
        Fingerprints are globally unique, so a key already registered — to this org or
        any other — is a 409: one key belongs to exactly one org.
      operationId: post_v1_git_keys
      requestBody:
        content:
          application/json:
            example:
              publicKey: ssh-ed25519 AAAAC3Nz… z@hanzo.ai
              title: laptop
            schema:
              $ref: '#/components/schemas/registerKeyReq'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/keyView'
          description: created
      summary: |-
        registerKey registers an SSH public key so it can authenticate `git clone
        git@<host>:<org>/<repo>.git` for the caller's org.
      tags:
      - git
  /v1/git/keys/{id}:
    delete:
      description: |-
        deleteKey removes a registered SSH key, scoped to the caller's org: an org can
        only delete its own, and a key id it does not own is not found. Answers 204
        with no body. Once removed the key no longer authenticates any SSH git access.
      operationId: delete_v1_git_keys_id
      parameters:
      - description: ID is the key's identifier ("gitkey_…"), from the :id path segment.
        example: gitkey_4a1b
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/noContent'
          description: ok
      summary: |-
        deleteKey removes a registered SSH key, scoped to the caller's org: an org can
        only delete its own, and a key id it does not own is not found.
      tags:
      - git
  /v1/git/repos:
    get:
      description: |-
        listRepos returns the repos in the caller's scope, most recently updated
        first. The scope is the request principal's — the gateway-minted org and its
        optional project — never anything off the wire, so a caller only ever sees its
        own. Rows carry no branches or HEAD; read one repo for those.
      operationId: get_v1_git_repos
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                - cloneUrl: https://api.hanzo.ai/v1/git/acme/widgets.git
                  createdAt: "2026-07-01T10:00:00Z"
                  defaultBranch: main
                  id: repo_9f3c
                  name: widgets
                  org: acme
                  public: false
                  sizeBytes: 4096
                  sshUrl: git@git.hanzo.ai:acme/widgets.git
              schema:
                $ref: '#/components/schemas/repoList'
          description: ok
      summary: |-
        listRepos returns the repos in the caller's scope, most recently updated
        first.
      tags:
      - git
    post:
      description: |-
        createRepo provisions an empty bare repository in the caller's scope and
        returns it with its clone URLs. Answers 201. The name must be unique within
        the scope — a repeat is a 409, never a silent overwrite of an existing repo.
        The org comes from the validated principal, so a repo is always born owned by
        the caller's own tenant.
      operationId: post_v1_git_repos
      requestBody:
        content:
          application/json:
            example:
              description: the widget service
              name: widgets
            schema:
              $ref: '#/components/schemas/createReq'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/repoView'
          description: created
      summary: |-
        createRepo provisions an empty bare repository in the caller's scope and
        returns it with its clone URLs.
      tags:
      - git
  /v1/git/repos/{name}:
    delete:
      description: |-
        deleteRepo removes a repo's metadata and purges its storage. Answers 204 with
        no body. The metadata row is the source of truth for existence, so a storage
        purge that fails is logged and the delete still succeeds — and a second call
        is a 404, not a second delete.
      operationId: delete_v1_git_repos_name
      parameters:
      - description: |-
          Name is the repo's org-unique handle, from the :name path segment. A
          trailing ".git" is stripped.
        example: widgets
        in: path
        name: name
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/noContent'
          description: ok
      summary: deleteRepo removes a repo's metadata and purges its storage.
      tags:
      - git
    get:
      description: |-
        getRepo returns one repo with its live ref state: every branch name and the
        resolved HEAD commit. Both are read from the object store on each call, so an
        empty repo reports no branches and an empty head rather than failing. A repo
        outside the caller's scope is not found.
      operationId: get_v1_git_repos_name
      parameters:
      - description: |-
          Name is the repo's org-unique handle, from the :name path segment. A
          trailing ".git" is stripped.
        example: widgets
        in: path
        name: name
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/repoView'
          description: ok
      summary: |-
        getRepo returns one repo with its live ref state: every branch name and the
        resolved HEAD commit.
      tags:
      - git
    patch:
      description: |-
        setVisibility flips a repo's public bit, the one mutable repo setting today.
        Public grants ANONYMOUS fetch only; push and the whole control plane stay
        org-authed. Returns the updated repo.
      operationId: patch_v1_git_repos_name
      parameters:
      - description: Name is the repo to update, from the :name path segment.
        example: widgets
        in: path
        name: name
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              name: widgets
              public: true
            schema:
              $ref: '#/components/schemas/patchIn'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/repoView'
          description: ok
      summary: |-
        setVisibility flips a repo's public bit, the one mutable repo setting today.
        Public grants ANONYMOUS fetch only; push and the whole control plane stay
        org-authed.
      tags:
      - git
  /v1/git/repos/{name}/blob:
    get:
      description: |-
        browseBlob returns one file's bytes at one revision. Text comes back verbatim,
        binary comes back base64, and a file past the 1 MiB view cap comes back marked
        truncated with NO content — the client is expected to clone instead.
      operationId: get_v1_git_repos_name_blob
      parameters:
      - description: Name is the repo to read, from the :name path segment.
        example: widgets
        in: path
        name: name
        required: true
        schema:
          type: string
      - description: Ref is a branch, tag or commit; empty means the repo's HEAD.
        example: main
        in: query
        name: ref
        required: false
        schema:
          type: string
      - description: Path is repo-relative; empty is the tree root. Traversal is stripped.
        example: go.mod
        in: query
        name: path
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              example:
                binary: false
                content: |
                  module widgets
                encoding: utf8
                path: go.mod
                size: 42
                truncated: false
              schema:
                $ref: '#/components/schemas/blobJSON'
          description: ok
      summary: browseBlob returns one file's bytes at one revision.
      tags:
      - git
  /v1/git/repos/{name}/commits:
    get:
      description: |-
        browseCommits walks a ref's history newest first, or one path's history when a
        path is given. There is no cursor: the page is the newest `limit` commits.
      operationId: get_v1_git_repos_name_commits
      parameters:
      - description: Name is the repo to read, from the :name path segment.
        example: widgets
        in: path
        name: name
        required: true
        schema:
          type: string
      - description: Ref is the branch, tag or commit to walk back from; empty means
          HEAD.
        example: main
        in: query
        name: ref
        required: false
        schema:
          type: string
      - description: Path narrows the history to commits touching it; empty walks
          the whole ref.
        in: query
        name: path
        required: false
        schema:
          type: string
      - description: Limit caps the page. Anything not positive means 50; the cap
          is 100.
        example: 2
        in: query
        name: limit
        required: false
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              example:
                commits:
                - authorEmail: ada@hanzo.ai
                  authorName: Ada
                  date: "2026-07-01T10:00:00Z"
                  message: add the widget service
                  sha: a1b2c3d4e5f6
                  shortSha: a1b2c3d
              schema:
                $ref: '#/components/schemas/commitsJSON'
          description: ok
      summary: |-
        browseCommits walks a ref's history newest first, or one path's history when a
        path is given.
      tags:
      - git
  /v1/git/repos/{name}/files:
    get:
      description: |-
        browseFiles returns every file a glob selects at one revision, WITH its bytes
        and the revision they came from. It is the read a delivery generator makes:
        one call answers "what is the inventory at this commit, and what does it say",
        where listing and then fetching would be a request per file.

        Returning the resolved revision matters as much as the bytes. A generator that
        lists at `main` and then reads at `main` can straddle a push and assemble half
        its inventory from one commit and half from the next; resolving once makes the
        whole read consistent by construction.

        A file past the read cap comes back Truncated with no content rather than
        being dropped. A caller building a desired set has to know the difference
        between "this file is empty" and "this file was not read" — silently omitting
        it is how a pruning reconcile deletes what the missing file declared.
      operationId: get_v1_git_repos_name_files
      parameters:
      - description: Name is the repo to read, from the :name path segment.
        example: universe
        in: path
        name: name
        required: true
        schema:
          type: string
      - description: Ref is a branch, tag or commit; empty means the repo's HEAD.
        example: main
        in: query
        name: ref
        required: false
        schema:
          type: string
      - description: |-
          Glob selects files, matched segment by segment so `*` never crosses a `/`.
          `**` matches zero or more whole segments.
        example: charts/app/values/*/*.yaml
        in: query
        name: glob
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/filesJSON'
          description: ok
      summary: |-
        browseFiles returns every file a glob selects at one revision, WITH its bytes
        and the revision they came from.
      tags:
      - git
  /v1/git/repos/{name}/gc:
    post:
      description: |-
        gc repacks a repo into one bitmapped pack and rewrites its commit-graph, so
        the next clone reuses the bitmap instead of walking the whole object graph.
        Idempotent, and safe to interrupt — git swaps both artifacts atomically. It
        runs under one pack slot with the same memory bounds as a clone, so it can
        block behind heavy pack traffic rather than compete with it. Storage usage is
        re-measured afterwards, since a repack reclaims space.
      operationId: post_v1_git_repos_name_gc
      parameters:
      - description: |-
          Name is the repo's org-unique handle, from the :name path segment. A
          trailing ".git" is stripped.
        example: widgets
        in: path
        name: name
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              name: widgets
            schema:
              $ref: '#/components/schemas/repoRef'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                maintained: true
                repo: widgets
                sizeBytes: 3072
              schema:
                $ref: '#/components/schemas/gcOut'
          description: ok
      summary: |-
        gc repacks a repo into one bitmapped pack and rewrites its commit-graph, so
        the next clone reuses the bitmap instead of walking the whole object graph.
        Idempotent, and safe to interrupt — git swaps both artifacts atomically.
      tags:
      - git
  /v1/git/repos/{name}/mirror:
    post:
      description: |-
        mirror imports an external git repository into the caller's repo, provisioning
        it on first use. Fetch is FORCED and covers every ref, so a first call clones
        the source and a repeat call re-syncs it — the endpoint is idempotent by mirror
        semantics. Mirrored bytes are metered exactly like a push, and a push.landed
        event is emitted for the default branch so the code index picks the repo up.
      operationId: post_v1_git_repos_name_mirror
      parameters:
      - description: |-
          Name is the local repo to mirror into, from the :name path segment. It is
          CREATED on first use.
        example: widgets
        in: path
        name: name
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              name: widgets
              source: https://github.com/acme/widgets.git
            schema:
              $ref: '#/components/schemas/mirrorReq'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/repoView'
          description: ok
      summary: |-
        mirror imports an external git repository into the caller's repo, provisioning
        it on first use.
      tags:
      - git
  /v1/git/repos/{name}/mirrors:
    get:
      description: |-
        listMirrors returns a repo's outbound mirror targets — the downstream remotes
        the mirror reactor pushes to whenever a push lands here.
      operationId: get_v1_git_repos_name_mirrors
      parameters:
      - description: |-
          Name is the repo's org-unique handle, from the :name path segment. A
          trailing ".git" is stripped.
        example: widgets
        in: path
        name: name
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                - createdAt: "2026-07-01T10:00:00Z"
                  host: github.com
                  id: mir_2d90
                  repo: widgets
                  url: https://github.com/acme/widgets.git
              schema:
                $ref: '#/components/schemas/mirrorList'
          description: ok
      summary: listMirrors returns a repo's outbound mirror targets — the downstream
        remotes
      tags:
      - git
    post:
      description: |-
        addMirror registers a downstream remote the repo's advanced refs are pushed to
        whenever a push lands here. Answers 201. The URL must be https to a host on the
        mirror allowlist (github.com / gitlab.com): the same set the mirror credential
        may be sent to, so a target can never capture the shared token or point the push
        at an internal service. Any embedded userinfo is stripped — credentials ride
        env-only at push time and never enter the stored URL. One mirror per host per
        repo; a second is a 409.
      operationId: post_v1_git_repos_name_mirrors
      parameters:
      - description: |-
          Name is the repo whose advanced refs are pushed downstream, from the :name
          path segment.
        example: widgets
        in: path
        name: name
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              name: widgets
              url: https://github.com/acme/widgets.git
            schema:
              $ref: '#/components/schemas/mirrorTargetReq'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/mirrorTargetView'
          description: created
      summary: |-
        addMirror registers a downstream remote the repo's advanced refs are pushed to
        whenever a push lands here.
      tags:
      - git
  /v1/git/repos/{name}/mirrors/{id}:
    delete:
      description: |-
        deleteMirror removes one outbound mirror target; later pushes stop being
        forwarded to it. Answers 204 with no body. Nothing is done to the downstream
        remote itself — only this repo's intent to push there is dropped.
      operationId: delete_v1_git_repos_name_mirrors_id
      parameters:
      - description: Name is the repo, from the :name path segment.
        example: widgets
        in: path
        name: name
        required: true
        schema:
          type: string
      - description: ID is the row to remove, from the :id path segment.
        example: mir_2d90
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/noContent'
          description: ok
      summary: |-
        deleteMirror removes one outbound mirror target; later pushes stop being
        forwarded to it.
      tags:
      - git
  /v1/git/repos/{name}/push:
    post:
      description: |-
        pushFiles lands a set of files as one commit without a git client — the
        hanzo.app builder's push. The repo is CREATED on first push, the files are
        merged onto the branch tip (unlisted files survive), and the same
        push-to-deploy hook a real receive-pack fires is fired, so downstream this is
        indistinguishable from a `git push`.
      operationId: post_v1_git_repos_name_push
      parameters:
      - description: |-
          Name is the repo to push into, from the :name path segment. It is CREATED
          on first push if it does not exist.
        example: widgets
        in: path
        name: name
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              branch: main
              files:
              - content: <h1>hi</h1>
                path: index.html
              message: generated build
              name: widgets
            schema:
              $ref: '#/components/schemas/pushReq'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                branch: main
                cloneUrl: https://api.hanzo.ai/v1/git/acme/widgets.git
                commit: a1b2c3d4e5f6
                sshUrl: git@git.hanzo.ai:acme/widgets.git
              schema:
                $ref: '#/components/schemas/pushResp'
          description: ok
      summary: |-
        pushFiles lands a set of files as one commit without a git client — the
        hanzo.app builder's push.
      tags:
      - git
