  /v1/crm/applications:
    get:
      description: |-
        ListApplications returns the org's Startup Program applications, newest first.
        Each carries its AI screen and its stage history; a stage narrows the page to
        one pipeline stage.
      operationId: get_v1_crm_applications
      parameters:
      - description: |-
          Stage returns only the applications at that pipeline stage when set:
          applied, screened, qualified, credits-offered, onboarded or rejected.
        in: query
        name: stage
        required: false
        schema:
          type: string
      - description: 'Limit caps the rows returned: 200 by default, 1000 at most.'
        in: query
        name: limit
        required: false
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/applicationList'
          description: ok
      summary: ListApplications returns the org's Startup Program applications, newest
        first.
      tags:
      - crm
    post:
      operationId: post_v1_crm_applications
      tags:
      - crm
  /v1/crm/applications/{id}:
    get:
      description: |-
        GetApplication returns one Startup Program application with its AI screen and stage history.
        An id belonging to another org reads as not found.
      operationId: get_v1_crm_applications_id
      parameters:
      - description: ID is the record to act on, from the path.
        example: appl_1
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
          description: ok
      summary: GetApplication returns one Startup Program application with its AI
        screen and stage history.
      tags:
      - crm
    patch:
      description: |-
        PatchApplication moves one Startup Program application through the pipeline. The
        move is recorded on the application's timeline, attributed to the calling
        staff user: it may advance exactly one stage, go back to any earlier stage,
        reject from any non-rejected stage, or reopen a rejected application to
        `applied`; anything else is refused. Rejecting requires a reason. A note with
        no stage change is still recorded.
      operationId: patch_v1_crm_applications_id
      parameters:
      - description: ID is the application to move, from the path.
        example: appl_1
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              id: appl_1
              reason: not a fit this round
              stage: rejected
            schema:
              $ref: '#/components/schemas/patchApplicationIn'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
          description: ok
      summary: PatchApplication moves one Startup Program application through the
        pipeline.
      tags:
      - crm
