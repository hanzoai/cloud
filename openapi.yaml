          type: string
      tags:
      - commerce
  /v1/company:
    get:
      description: |-
        Get returns the caller org's formation and the stages reachable from it, or 404
        when the org has not begun one.
      operationId: get_v1_company
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/formationView'
          description: ok
      summary: Get returns the caller org's formation and the stages reachable from
        it, or 404
      tags:
      - company
    post:
      description: |-
        Begin starts the org's one formation and returns it with the stages reachable
        from it. It is idempotent: an org that already has a formation gets that one
        back with 200, while a first call creates it and answers 201.
      operationId: post_v1_company
      requestBody:
        content:
          application/json:
            example:
              jurisdiction: DE
              name: Acme Inc.
              structure: c-corp
            schema:
              $ref: '#/components/schemas/beginIn'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/formationView'
          description: ok
      summary: |-
        Begin starts the org's one formation and returns it with the stages reachable
        from it.
      tags:
      - company
  /v1/company/advance:
    post:
      description: |-
        Advance runs the ONE guarded transition of the formation machine. It is the
        only door between stages: the actions populate data, this decides ordering.

        An edge the machine does not define answers 409; an edge whose guard is not yet
        satisfied answers 422 naming what is missing. Reaching the terminal `company`
        stage also records the incorporation on the canonical cap table, and that must
        succeed before the transition is persisted.
      operationId: post_v1_company_advance
      requestBody:
        content:
          application/json:
            example:
              to: founders
            schema:
              $ref: '#/components/schemas/advanceIn'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/formationView'
          description: ok
      summary: Advance runs the ONE guarded transition of the formation machine.
      tags:
      - company
  /v1/company/documents:
    post:
      description: |-
        GenerateDocuments renders the formation documents for the chosen structure and
        jurisdiction, ingests each into the org's data room, and submits the state
        filing through the filing seam.

        With no filing partner wired the filing is recorded honestly as "manual" — no
        filing id is fabricated. Available only at the documents stage.
      operationId: post_v1_company_documents
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/noInput'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/formationView'
          description: ok
      summary: |-
        GenerateDocuments renders the formation documents for the chosen structure and
        jurisdiction, ingests each into the org's data room, and submits the state
        filing through the filing seam.

        With no filing partner wired the filing is recorded honestly as "manual" — no
        filing id is fabricated.
      tags:
      - company
  /v1/company/esign:
    post:
      description: |-
        RequestEsign sends the generated formation documents for signature by every
        founder and records the provider's reference on the formation. Available only
        at the esign stage.
      operationId: post_v1_company_esign
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/noInput'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/esignOut'
