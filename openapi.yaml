  /v1/team/bots:
    get:
      description: |-
        ListBots returns the caller org's bot members — the org's agents projected as
        the workspace Employees they become, each with the member account uuid and
        Person reference the roster addresses it by. An agents subsystem that is not
        mounted answers an empty list, never an error.
      operationId: get_v1_team_bots
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/botRoster'
          description: ok
      summary: |-
        ListBots returns the caller org's bot members — the org's agents projected as
        the workspace Employees they become, each with the member account uuid and
        Person reference the roster addresses it by.
      tags:
      - team
  /v1/team/bots/sync:
    post:
      description: |-
        SyncBots re-projects the caller org's agents as workspace members into EVERY
        workspace of the org, and removes the ones whose agent is gone. It is
        idempotent, and admin only: mutating a workspace's roster requires the
        gateway-minted admin flag, which a client can never forge. It answers how many
        roster entries the reconcile touched.
      operationId: post_v1_team_bots_sync
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/botSync'
          description: ok
      summary: |-
        SyncBots re-projects the caller org's agents as workspace members into EVERY
        workspace of the org, and removes the ones whose agent is gone.
      tags:
      - team
  /v1/team/files/{workspace}:
    post:
      operationId: post_v1_team_files_by_workspace
      parameters:
      - in: path
        name: workspace
        required: true
        schema:
          type: string
      tags:
      - team
  /v1/team/files/{workspace}/{filename}:
    delete:
      description: |-
        DeleteBlob removes one blob from a workspace's file store. The caller must
        hold a verified session AND be a member of the workspace; anything else — an
        unknown workspace, another tenant's workspace, a workspace the caller is not
        in — answers the same 404, so a probe learns nothing about what exists.

        It is IDEMPOTENT: deleting a present or an absent blob both answer 204, so a
        delete never confirms a blob's existence and a foreign blob id (a physical key
        the caller can never name into another tenant's box) is a harmless no-op. A
        storage backend that is unavailable fails closed with 502 rather than lying
        about success.
      operationId: delete_v1_team_files_workspace_filename
      parameters:
      - description: Workspace is the workspace uuid the blob belongs to, from the
          path.
        example: 6579…
        in: path
        name: workspace
        required: true
        schema:
          type: string
      - description: |-
          Filename is the last path segment, which the front sets to the blob id
          when it sends no explicit `file`.
        in: path
        name: filename
        required: true
        schema:
          type: string
      - description: File is the blob id, and wins over the path segment when both
          are present.
        example: 0d4f…
        in: query
        name: file
        required: false
        schema:
          type: string
      responses:
        "204":
          description: no content
      summary: DeleteBlob removes one blob from a workspace's file store.
      tags:
      - team
    get:
      operationId: get_v1_team_files_by_workspace_by_filename
      parameters:
      - in: path
        name: workspace
        required: true
        schema:
          type: string
      - in: path
        name: filename
        required: true
        schema:
          type: string
      tags:
      - team
