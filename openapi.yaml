        lastHeartbeat:
          type: string
        leaseExpiry:
          type: string
        runId:
          type: string
        startTime:
          type: string
        status:
          description: queued|running|completed|failed|canceled
          type: string
        type:
          type: string
        worker:
          type: string
      type: object
    gpuList:
      properties:
        gpus:
          description: |-
            GPUs is every accelerator the org has, from Visor GPU droplets and from BYO
            workers alike.
          items:
            $ref: '#/components/schemas/gpuView'
          type: array
      type: object
    gpuView:
      properties:
        id:
          type: string
        location:
          type: string
        machine:
          type: string
        memory:
          type: string
        model:
          type: string
        name:
          type: string
        provider:
          description: |-
            Provider distinguishes a BYO accelerator ("byo") from a Visor-provisioned
            one (the machine's real provider). Memory is VRAM when known (BYO reports it
            from nvidia-smi; Visor's machine object carries none, so it stays empty and
            the UI renders "—"). Both are additive + omitempty: existing rows are
            unaffected and the console normalizer ignores fields it does not read.
          type: string
        region:
          type: string
        status:
          type: string
      type: object
    healthView:
      properties:
        provider:
          description: Provider is the wired verification provider's name ("manual"
            by default).
          type: string
        status:
          description: Status is "ok" when the subsystem is live.
          type: string
      type: object
    iamRowsOut:
      properties:
        data:
          type: object
        data2:
          type: integer
        msg:
          type: string
        status:
          type: string
      type: object
    imageView:
      properties:
        repository:
          type: string
        tag:
          type: string
      type: object
    importCapTableIn:
      properties:
        range:
          description: Range is an optional A1 range within the sheet; empty reads
            the default range.
          type: string
        spreadsheetId:
          description: SpreadsheetID is a Google Sheets id. Required.
          type: string
      type: object
    importCapTableOut:
      properties:
        formation:
          $ref: '#/components/schemas/Formation'
          description: Formation is the org's incorporation record, now marked cap-table-imported.
        rows:
          description: Rows is how many rows were read from the sheet, header included.
          type: integer
        stakeholdersImported:
          description: StakeholdersImported is how many stakeholders the cap table
            accepted.
          type: integer
      type: object
    importDocumentsIn:
      properties:
        folderId:
          description: FolderID is a Google Drive folder id. Required.
          type: string
      type: object
    importDocumentsOut:
      properties:
        formation:
          $ref: '#/components/schemas/Formation'
          description: Formation is the org's incorporation record with the imported
            document ids.
        ingested:
          description: Ingested is how many files this call put in the data room.
          type: integer
      type: object
    inboxOut:
      properties:
        items:
          description: Items is every document still unsorted or in draft, newest
            first.
          items:
            $ref: '#/components/schemas/InboxItem'
          type: array
      type: object
    ingressMiddlewares:
      properties:
        middlewares:
          description: Middlewares is the org's middlewares, ordered by id.
          items:
            $ref: '#/components/schemas/Middleware'
          type: array
      type: object
    ingressRoutes:
      properties:
        routes:
          description: Routes is the org's routes, ordered by id.
          items:
            $ref: '#/components/schemas/Route'
          type: array
      type: object
    ingressServices:
      properties:
        services:
          description: Services is the org's services, ordered by id.
          items:
            $ref: '#/components/schemas/Service'
          type: array
      type: object
    ingressStatus:
      properties:
        acmeCacheDir:
          description: ACMECacheDir is where autocert persists accounts and certificates.
          type: string
        acmeStaging:
          description: ACMEStaging is true when certificates are issued from Let's
            Encrypt staging.
          type: boolean
        edgeEnabled:
          description: EdgeEnabled is true when the edge listeners are actually bound.
          type: boolean
        httpAddr:
          description: HTTPAddr is the address the ACME HTTP-01 + HTTP router listens
            on.
          type: string
        httpsAddr:
          description: HTTPSAddr is the address the SNI TLS terminator listens on.
          type: string
        liveHosts:
          description: LiveHosts is how many hosts the compiled table routes.
          type: integer
        proxy:
          description: Proxy names the reverse-proxy implementation behind every route.
          type: string
        role:
          description: Role is "edge" when CLOUD_INGRESS_EDGE_ENABLED is set, else
            "app".
          type: string
        tlsHosts:
          description: |-
            TLSHosts is how many hosts the ACME HostPolicy will issue a certificate
            for. NOT a subset of LiveHosts: an extraHost owns no route, and a TLS route
            naming a missing service is skipped while its host still wants a cert.
          type: integer
      type: object
    ingressTLS:
      properties:
        acmeDirectory:
          description: |-
            ACMEDirectory is the ACME endpoint in use: the staging URL, or
            "letsencrypt-production".
          type: string
        acmeEmail:
          description: |-
            ACMEEmail is the account email the PROCESS was started with
            (CLOUD_INGRESS_ACME_EMAIL), not the stored config's.
          type: string
        config:
          $ref: '#/components/schemas/TLSConfig'
          description: Config is the caller org's stored ACME intent.
        edgeEnabled:
          description: EdgeEnabled is true when the edge listeners are actually bound.
          type: boolean
        managedHosts:
          description: |-
            ManagedHosts is every host the ACME HostPolicy will issue a certificate for
            — the union across ALL orgs of TLS-marked routes and configured extraHosts,
            because one process holds one certificate cache.
          items:
            type: string
          type: array
        note:
          description: Note states which fields hot-apply and which need an edge restart.
          type: string
        role:
          description: Role is "edge" when this instance binds the listeners, else
            "app".
          type: string
      type: object
    itemInput:
      properties:
        assignee:
          description: Assignee is the reviewer this item is for, up to 512 characters.
          type: string
        objectId:
          description: ObjectID is the referenced object's id, paired with objectType.
          type: string
        objectType:
          description: |-
            ObjectType is TRACE, OBSERVATION or SESSION — the generic form, paired
            with objectId.
          type: string
        observationId:
          description: |-
            ObservationID references an observation — the console-friendly form of
            objectType=OBSERVATION.
          type: string
        sessionId:
          description: |-
            SessionID references a session — the console-friendly form of
            objectType=SESSION.
          type: string
        traceId:
          description: |-
            TraceID references a trace — the console-friendly form of
            objectType=TRACE.
          type: string
      type: object
    jobCancel:
      properties:
        id:
          description: ID is the job (activity) id, from the URL path.
          type: string
        reason:
          description: Reason is recorded on the cancellation; empty records "canceled
            from console".
          type: string
        run:
          description: |-
            Run is the run id; empty defaults to the job id, which is what the dispatcher
            sets (runId == activityId == prompt_id), so the common case sends no body.
          type: string
      type: object
    jobCanceled:
      properties:
        canceled:
          description: Canceled is the job id that was canceled.
          type: string
        run:
          description: Run is the run id the cancel was applied to.
          type: string
      type: object
    jobList:
      properties:
        jobs:
          description: |-
            Jobs is the queue, most-recent-first. Every LIVE job is present; terminal
            history is capped, so a busy org's running work is never crowded out.
          items:
            $ref: '#/components/schemas/gpuJob'
          type: array
      type: object
    keyList:
      properties:
        data:
          description: Data holds the org's keys.
          items:
            $ref: '#/components/schemas/keyView'
          type: array
      type: object
    keyTypeIn:
      properties:
        type:
          description: |-
            Type is the key class to act on: "secret" (sk-, session-equivalent, belongs
            on a server) or "publishable" (pk-, org-identifying, safe in a browser
            bundle). Omitted means secret, which is what every existing caller means.
          type: string
      type: object
    keyView:
      properties:
        createdAt:
          description: CreatedAt is RFC 3339 UTC.
          type: string
        fingerprint:
          description: |-
            Fingerprint is the key's SHA256 fingerprint ("SHA256:…"), globally unique
            and the handle SSH auth resolves a presented key by.
          type: string
        id:
          description: ID is the key's identifier ("gitkey_…"), the handle to delete
            it by.
          type: string
        publicKey:
          description: PublicKey is the canonical OpenSSH authorized-key line as stored.
          type: string
        title:
          description: Title is the key's label — the caller's, or the comment on
            the key line.
          type: string
      type: object
    kycRefreshOut:
