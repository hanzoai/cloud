  /v1/team/transactor/api/v1/statistics:
    get:
      description: |-
        Statistics returns the transactor's live sessions for the workspace the
        caller's token names — the endpoint the front's workspace switcher and server
        panel poll on the transactor base. The token is verified exactly like the
        WebSocket upgrade is, and activeSessions carries ONLY that token's own
        workspace, never another tenant's sessions. An invalid or expired token is
        401.
      operationId: get_v1_team_transactor_api_v1_statistics
      parameters:
      - description: Token is the workspace token minted by selectWorkspace.
        example: eyJhbGciOiJIUzI1NiJ9…
        in: query
        name: token
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/statsOut'
          description: ok
      summary: |-
        Statistics returns the transactor's live sessions for the workspace the
        caller's token names — the endpoint the front's workspace switcher and server
        panel poll on the transactor base.
      tags:
      - team
