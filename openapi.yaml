      description: |-
        ListTargets returns every machine registered to the caller's org, newest
        first, each with its live session load.
      operationId: get_v1_agents_targets
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/targetList'
          description: ok
      summary: ListTargets returns every machine registered to the caller's org, newest
      tags:
      - agents
    post:
      description: |-
        RegisterTarget registers a machine as an agent target, or re-links one that is
        already registered. Re-linking is idempotent and keyed on org+host+owner, so a
        machine that reconnects refreshes its own row rather than piling up duplicates;
        it answers 200, while a first registration answers 201.
      operationId: post_v1_agents_targets
      requestBody:
        content:
          application/json:
            example:
              host: gpu-01
              kind: gpu
              label: workshop
            schema:
              $ref: '#/components/schemas/targetReq'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/targetView'
          description: ok
      summary: |-
        RegisterTarget registers a machine as an agent target, or re-links one that is
        already registered.
      tags:
      - agents
  /v1/agents/targets/{id}:
    delete:
      description: |-
        DeleteTarget deregisters one machine. Only its owner, or an org admin, may
        remove it; an unknown id, a cross-org id and a machine owned by someone else
        all answer the same not-found, so a probe learns nothing about what exists.
      operationId: delete_v1_agents_targets_id
      parameters:
      - description: ID is the target to act on, from the path.
        example: tgt_1
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/targetDeleted'
          description: ok
      summary: DeleteTarget deregisters one machine.
      tags:
      - agents
    get:
      description: GetTarget returns one registered machine, with its live session
        load.
      operationId: get_v1_agents_targets_id
      parameters:
      - description: ID is the target to act on, from the path.
        example: tgt_1
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/targetView'
          description: ok
      summary: GetTarget returns one registered machine, with its live session load.
      tags:
      - agents
    patch:
      description: |-
        PatchTarget updates one machine in place. Every field is optional; a field the
        request omits is left alone. A metrics patch IS a heartbeat — the server stamps
        its own clock, so a client can neither forge nor backdate staleness.
      operationId: patch_v1_agents_targets_id
      parameters:
      - description: ID is the target to update, from the path.
        example: tgt_1
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              id: tgt_1
              status: draining
            schema:
              $ref: '#/components/schemas/patchTargetIn'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/targetView'
          description: ok
      summary: PatchTarget updates one machine in place.
      tags:
      - agents
