      responses:
        "200":
          content:
            application/json:
              example:
                data:
                  enforce: false
                  id: cap_1
                  limitCents: 250000
                data2: 0
                msg: ""
                status: ok
              schema:
                $ref: '#/components/schemas/rawOut'
          description: ok
      summary: updateSpendCap edits one cap by id — raise or lower the ceiling, flip
