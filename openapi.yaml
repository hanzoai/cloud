                type: string
              name:
                description: Name is the repository's short name within the installation.
                type: string
              private:
                description: Private is GitHub's visibility bit for the repo.
                type: boolean
              syncStatus:
                description: SyncStatus is "synced", "conflict", or "" when the repo
                  is not imported.
                type: string
            type: object
          type: array
      type: object
