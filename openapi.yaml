components:
  schemas:
    AccessChange:
      properties:
        affected:
          description: Affected lists the usernames that were updated.
          items:
            type: string
          type: array
        failed:
          description: |-
            Failed lists the usernames that were NOT updated. Non-empty means the org is in
            a mixed state and the action should be retried.
          items:
            type: string
          type: array
        org:
          description: Org is the tenant acted on.
          type: string
        suspended:
          description: 'Suspended is the state applied: true for suspend, false for
            reactivate.'
          type: boolean
      type: object
    AccessOut:
      properties:
        data:
          $ref: '#/components/schemas/AccessChange'
        msg:
          type: string
        status:
          type: string
      type: object
    Account:
      properties:
        name:
          type: string
        number:
          type: string
        party:
          type: string
        type:
          type: string
      type: object
    ActionOut:
      properties:
        data:
          items:
            $ref: '#/components/schemas/Result'
          type: array
        msg:
          type: string
        status:
          type: string
      type: object
    ActionRecord:
      properties:
        args:
          type: string
        createdAt:
          type: integer
        err:
          type: string
        id:
          type: string
        ok:
          type: boolean
        result:
          type: string
        stepId:
          type: string
        tool:
          type: string
      type: object
    Application:
      properties:
        company:
          type: string
        companyId:
          type: string
        contactId:
          type: string
        contactName:
          type: string
        createdAt:
          type: integer
        email:
          type: string
        events:
          items:
            $ref: '#/components/schemas/StageEvent'
          type: array
        id:
          type: string
        metadata:
          additionalProperties:
            type: object
          type: object
        reason:
          type: string
        role:
          type: string
        screen:
          $ref: '#/components/schemas/ScreenResult'
        stage:
          type: string
        tier1:
          type: boolean
        updatedAt:
          type: integer
        website:
          type: string
      type: object
    AskRequest:
      properties:
        from:
          description: |-
            From is the RFC3339 start of the metric window. Empty means all time, treated as a
            single reporting period (see monthsBetween).
          type: string
        question:
          description: |-
            Question is the plain-language question about the org's books, e.g. "what is my
            MRR?". Longer than 2000 characters is truncated, never refused.
          type: string
        to:
          description: To is the RFC3339 end of the metric window. Empty means up
            to now.
          type: string
      type: object
    AskResponse:
      properties:
        answer:
          description: |-
            Answer is one or two sentences answering the question, every number in it taken
            from Figures.
          type: string
        figures:
          description: Figures are the grounded numbers the answer states, each already
            formatted.
          items:
            $ref: '#/components/schemas/Figure'
          type: array
        followups:
          description: Followups are sharper questions to ask next, chosen from the
            same intent.
          items:
            type: string
          type: array
        sources:
          description: |-
            Sources name the books reports the figures were computed from — "pnl",
            "balance-sheet", "trial-balance".
          items:
            type: string
          type: array
      type: object
    Audience:
      properties:
        createdAt:
          description: CreatedAt and UpdatedAt are unix seconds, both server-assigned.
          type: integer
        event:
          description: |-
            Event is the analytics event a member must have fired. EMPTY MEANS NO
            FILTER: the audience is then every mailable customer in the org, and no
            warehouse is consulted.
          type: string
        id:
          description: ID is the server-assigned audience id ("aud_" + 128 random
            bits).
          type: string
        name:
          description: Name is the audience's label. Required, trimmed, capped at
            1024 bytes.
          type: string
        updatedAt:
          type: integer
        windowDays:
          description: |-
            WindowDays is how far back the event counts, ending now. 0 means 30 and
            nothing above 3650 is honoured. Ignored when Event is empty.
          type: integer
      type: object
    AudienceList:
      properties:
        data:
          description: Data is the page; an empty array when the org has saved no
            audience.
          items:
            $ref: '#/components/schemas/Audience'
          type: array
      type: object
    AudiencePreview:
      properties:
        available:
          description: |-
            Available is false when the roster or the warehouse could not be read; the
            counts are then zero because nothing was measured, not because the cohort
            is empty, and Reason says which read failed.
          type: boolean
        count:
          description: |-
            Count is the cohort size: distinct warehouse identifiers for an event
            audience, mailable customers for an event-less (whole-org) one.
          type: integer
        deliverable:
          description: |-
            Deliverable is how many de-duplicated addresses a send would reach, and
            Unmatched how many cohort identifiers named no customer. Unmatched is
            reported rather than hidden: it is the honest explanation for a cohort of
            500 that mails 3.
          type: integer
        reason:
          type: string
        sample:
          description: |-
            Sample is up to 1000 cohort IDENTIFIERS — never addresses, which product
            analytics does not hold. Empty for an event-less (whole-org) audience.
          items:
            type: string
          type: array
        source:
          description: |-
            Source names where the cohort was read: the events table for an event
            audience, "iam:<org>" for the whole-org one.
          type: string
        unmatched:
          type: integer
      type: object
    Backend:
      properties:
        url:
          description: URL is the upstream server, http(s)://host[:port].
          type: string
        weight:
          description: Weight is this member's share of the round-robin; must be >=
            0.
          type: integer
      type: object
    BackfillIn:
      properties:
        org:
          description: |-
            Org is the tenant to migrate. Required — there is no fleet-wide form of this
            cutover, because each org must be reconciled on its own.
          type: string
      type: object
    BackfillOut:
      properties:
        data:
          $ref: '#/components/schemas/Backfilled'
        msg:
          type: string
        status:
          type: string
      type: object
    Backfilled:
      properties:
        entryId:
          description: |-
            EntryID is the finance ledger entry created, or "" when the balance was
            non-positive and there was nothing to carry.
          type: string
        migratedCents:
          description: MigratedCents is the balance carried across, read from commerce
            BEFORE the move.
          type: integer
        org:
          description: Org is the tenant migrated.
          type: string
      type: object
    BalanceLine:
      properties:
        account:
          type: string
        amount:
          description: cents, display sign
          type: integer
        name:
          type: string
        type:
          type: string
      type: object
    BalanceSheet:
      properties:
        asOf:
          type: string
        assets:
          items:
            $ref: '#/components/schemas/BalanceLine'
          type: array
        balanced:
          description: TotalAssets == TotalLiabilities + TotalEquity
          type: boolean
        equity:
          items:
            $ref: '#/components/schemas/BalanceLine'
          type: array
        liabilities:
          items:
            $ref: '#/components/schemas/BalanceLine'
          type: array
        totalAssets:
          type: integer
        totalEquity:
          type: integer
        totalLiabilities:
          type: integer
      type: object
    BankQuestion:
      properties:
        connector:
          type: string
        createdAt:
          type: string
        externalId:
          type: string
        prompt:
          type: string
        status:
          type: string
      type: object
    BankTally:
      properties:
        ingested:
          description: transactions seen
          type: integer
        posted:
          description: vouchers newly posted (outflow + reconciled)
          type: integer
        questions:
          description: unmatched inflows that raised a question
          type: integer
        reconciled:
          description: inflows cleared against Square-clearing
          type: integer
        skipped:
          description: already-processed idempotent no-ops
          type: integer
        transfers:
          description: own-account moves recorded (no P&L)
          type: integer
      type: object
    BankTxnRow:
      properties:
        amountCents:
          type: integer
        connector:
          type: string
        currency:
          type: string
        description:
          type: string
        direction:
          type: string
        externalId:
          type: string
        matchedVoucher:
          type: string
        merchant:
          type: string
        postedAt:
          type: string
        status:
          type: string
      type: object
    Blog:
      properties:
        caseStudy:
          type: string
        how:
          type: string
        slug:
          type: string
        title:
          type: string
        why:
          type: string
      type: object
    Blueprint:
      properties:
        brand:
          type: string
        enabled:
          type: boolean
        principles:
          description: the 64-principle spine (Zen of Hanzo archetypes)
          items:
            $ref: '#/components/schemas/Principle'
          type: array
        sections:
          items:
            $ref: '#/components/schemas/Section'
          type: array
        steps:
          items:
            $ref: '#/components/schemas/JourneyStep'
          type: array
        strategies:
          items:
            $ref: '#/components/schemas/Strategy'
          type: array
        templates:
          items:
            $ref: '#/components/schemas/Template'
          type: array
        title:
          type: string
        version:
          type: string
      type: object
    BoardView:
      properties:
        auditUrl:
          type: string
        configured:
          type: boolean
        engine:
          type: string
        manageUrl:
          type: string
        switches:
          items:
            $ref: '#/components/schemas/SwitchView'
          type: array
      type: object
    BookRequest:
      properties:
        override:
          description: |-
            Override books this bill even when one of the SAME economic identity
            (vendor, total, issue date) already posted — the explicit human confirmation that a
            same-looking bill is a genuine second spend, not the same receipt re-scanned.
          type: boolean
        scanId:
          description: |-
            ScanID is the scanned document's file hash, as GET /v1/books/inbox and the scan
            draft report it. It is the idempotency key: re-booking the same scan writes nothing.
          type: string
        voucher:
          $ref: '#/components/schemas/Voucher'
          description: |-
            Voucher is the reviewed voucher to post. Its source is FORCED to (scan, scanId)
            server-side, so it can never be booked under another source's key.
      type: object
    BookResponse:
      properties:
        posted:
          description: |-
            Posted is true when this call wrote the voucher, false when the same scan had
            already booked and nothing was written.
          type: boolean
        scanId:
          description: ScanID echoes the scan that was booked.
          type: string
      type: object
    CalendarPost:
      properties:
        body:
          description: Body is the post text. Required.
          type: string
        channel:
          description: |-
            Channel is the target network: x, facebook, instagram, linkedin, tiktok,
            youtube or threads. Required — a post must name where it goes.
          type: string
        createdAt:
          description: CreatedAt and UpdatedAt are unix seconds, both server-assigned.
          type: integer
        error:
          description: |-
            Error is the exact reason the last publish attempt failed — the honest
            record behind a "failed" status, never a faked success.
          type: string
        id:
          description: ID is the server-assigned post id ("cal_" + 128 random bits).
          type: string
        publishedAt:
          description: PublishedAt is when the publish succeeded; 0 until it does.
          type: integer
        scheduledAt:
          description: |-
            ScheduledAt is the unix publish time; 0 leaves the post a draft, and any
            value makes it "scheduled" for the durable sweep to pick up.
          type: integer
        status:
          description: Status is draft, scheduled, published, failed or canceled.
            Server-owned.
          type: string
        title:
          description: Title is the post's internal label, capped at 1024 bytes.
          type: string
        updatedAt:
          type: integer
      type: object
    Campaign:
      properties:
        budget:
          description: Budget and Spend are minor units (USD cents), clamped to >=
            0.
          type: integer
        channel:
          description: |-
            Channel is the delivery surface: email, sms, social, meta, google or
            tiktok. Empty means email.
          type: string
        createdAt:
          description: CreatedAt and UpdatedAt are unix seconds, both server-assigned.
          type: integer
        id:
          description: ID is the server-assigned campaign id ("camp_" + 128 random
            bits).
          type: string
        name:
          description: Name is the campaign's label. Required, trimmed, capped at
            1024 bytes.
          type: string
        objective:
          description: Objective is the free-text goal ("signups"), capped at 1024
            bytes.
          type: string
        scheduledAt:
          description: |-
            ScheduledAt is the unix send time; 0 means unscheduled. Setting it on a
            campaign with no explicit status makes that status "scheduled".
          type: integer
        spend:
          type: integer
        status:
          description: |-
            Status is the lifecycle: draft, scheduled, active, paused or completed.
            Empty means draft.
          type: string
        updatedAt:
          type: integer
      type: object
    CampaignList:
      properties:
        data:
          description: Data is the page; an empty array when the org has no matching
            campaign.
          items:
            $ref: '#/components/schemas/Campaign'
          type: array
      type: object
    Catalog:
      properties:
        connectorCount:
          type: integer
        connectors:
          items:
            $ref: '#/components/schemas/ConnectorMetadata'
          type: array
      type: object
    Cluster:
      properties:
        id:
          type: string
        idlePVCs:
          type: integer
        monthlyCents:
          type: integer
        name:
          type: string
        nodePools:
          type: integer
        nodes:
          type: integer
        pods:
          type: integer
        pools:
          items:
            $ref: '#/components/schemas/NodePool'
          type: array
        pvcs:
          type: integer
        pvs:
          type: integer
        region:
          type: string
        scanError:
          type: string
        scanned:
          type: boolean
        status:
          type: string
        version:
          type: string
      type: object
    Company:
      properties:
        arr:
          type: integer
        city:
          type: string
        country:
          type: string
        createdAt:
          type: integer
        currency:
          type: string
        domainName:
          type: string
        employees:
          type: integer
        id:
          type: string
        idealCustomerProfile:
          type: boolean
        linkedinLink:
          type: string
        name:
          type: string
        updatedAt:
          type: integer
        xLink:
          type: string
      type: object
    ConnectorAction:
      properties:
        description:
          type: string
        displayName:
          type: string
        name:
          type: string
        props:
          items:
            $ref: '#/components/schemas/PropSpec'
          type: array
      type: object
    ConnectorAuth:
      properties:
        required:
          type: boolean
        type:
          type: string
      type: object
    ConnectorMetadata:
      properties:
        actions:
          items:
            $ref: '#/components/schemas/ConnectorAction'
          type: array
        auth:
          $ref: '#/components/schemas/ConnectorAuth'
        categories:
          items:
            type: string
          type: array
        description:
          type: string
        displayName:
          type: string
        logoUrl:
          type: string
        name:
          type: string
        triggers:
          items:
            $ref: '#/components/schemas/ConnectorTrigger'
          type: array
        version:
          type: string
      type: object
    ConnectorTrigger:
      properties:
        description:
          type: string
        displayName:
          type: string
        name:
          type: string
        props:
          items:
            $ref: '#/components/schemas/PropSpec'
          type: array
        strategy:
          type: string
      type: object
    Contact:
      properties:
        city:
          type: string
        companyId:
          type: string
        createdAt:
          type: integer
        email:
          type: string
        firstName:
          type: string
        id:
          type: string
        jobTitle:
          type: string
        lastName:
          type: string
        linkedinLink:
          type: string
        phone:
          type: string
        updatedAt:
          type: integer
        xLink:
          type: string
      type: object
    CordonIn:
      properties:
        cordon:
          description: Cordon true marks the node unschedulable; false restores it.
          type: boolean
        drain:
          description: Drain additionally evicts the pods already running there.
          type: boolean
        id:
          description: ID is the node's droplet id, from the path.
          type: string
      type: object
    Cost:
      properties:
        dropletsMonthly:
          type: integer
        loadBalancersMonthly:
          type: integer
        reclaimableMonthly:
          type: integer
        totalMonthly:
          type: integer
        volumesMonthly:
          type: integer
        wastedMonthly:
          description: |-
            WastedMonthly is what the fleet pays every month for provisioned-but-empty space on
            the volumes a kubelet actually measured.

            It is NOT ReclaimableMonthly and must never be added to it. Reclaimable is money a
            button on this board collects, by deleting volumes proven to belong to no one.
            Wasted is money locked inside volumes that are IN USE and holding live data:
            DigitalOcean can only ever grow a volume, so collecting it means copying a database
            onto a smaller one. See shrinkRecipe.

            It is also a LOWER BOUND — unmeasured volumes contribute nothing.
          type: integer
      type: object
    Curriculum:
      properties:
        steps:
          items:
            $ref: '#/components/schemas/JourneyStep'
          type: array
        title:
          type: string
        version:
          type: string
      type: object
    CustomerDetailData:
      properties:
        apiKeys:
          type: integer
        balanceCents:
          type: integer
        created:
          type: string
        display:
          type: string
        mrrCents:
          type: integer
        org:
          type: string
        ownerEmail:
          type: string
        plan:
          type: string
        spendCents:
          type: integer
        status:
          type: string
        transactions:
          items:
            $ref: '#/components/schemas/CustomerTxn'
          type: array
        users:
          items:
            $ref: '#/components/schemas/CustomerUser'
          type: array
      type: object
    CustomerDetailOut:
      properties:
        data:
          $ref: '#/components/schemas/CustomerDetailData'
        msg:
          type: string
        status:
          type: string
      type: object
    CustomerRow:
      properties:
        balanceCents:
          type: integer
        created:
          type: string
        display:
          type: string
        lastActive:
          type: string
        mrrCents:
          type: integer
        org:
          type: string
        ownerEmail:
          type: string
        plan:
          type: string
        spendCents:
          type: integer
        status:
          description: '"active" | "suspended"'
          type: string
        users:
          type: integer
      type: object
    CustomerTxn:
      properties:
        cents:
          type: integer
        currency:
          type: string
        id:
          type: string
        notes:
          type: string
        time:
          type: string
        type:
          description: '"deposit" (credit) | "withdraw" (usage)'
          type: string
      type: object
    CustomerUser:
      properties:
        created:
          type: string
        email:
          type: string
        forbidden:
          type: boolean
        hasApiKey:
          type: boolean
        isAdmin:
          type: boolean
        lastSignin:
          type: string
        name:
          type: string
      type: object
    CustomersOut:
      properties:
        data:
          items:
            $ref: '#/components/schemas/CustomerRow'
          type: array
        data2:
          type: integer
        msg:
          type: string
        status:
          type: string
      type: object
    D1Query:
      properties:
        params:
          items: {}
          type: array
        sql:
          type: string
      type: object
    DoCost:
      properties:
        accountBalanceCents:
          type: integer
        avgDailyBurnCents:
          type: integer
        configured:
          type: boolean
        creditRemainingCents:
          type: integer
        error:
          type: string
        generatedAt:
          type: string
        history:
          items:
            $ref: '#/components/schemas/DoHistoryPoint'
          type: array
        monthToDateSpendCents:
          type: integer
      type: object
    DoHistoryPoint:
      properties:
        amountCents:
          type: integer
        date:
          type: string
        description:
          type: string
        type:
          type: string
      type: object
    DocField:
      properties:
        default:
          type: string
        fetchFrom:
          type: string
        fieldname:
          type: string
        fieldtype:
          type: string
        hidden:
          type: boolean
        inListView:
          type: boolean
        label:
          type: string
        options:
          type: string
        readOnly:
          type: boolean
        reqd:
          type: boolean
        unique:
          type: boolean
      type: object
    DocPerm:
      properties:
        cancel:
          type: boolean
        create:
          type: boolean
        delete:
          type: boolean
        read:
          type: boolean
        role:
          type: string
        submit:
          type: boolean
        write:
          type: boolean
      type: object
    DocType:
      properties:
        autoname:
          type: string
        createdAt:
          type: integer
        fields:
          items:
            $ref: '#/components/schemas/DocField'
          type: array
        isSingle:
          type: boolean
        isSubmittable:
          type: boolean
        module:
          type: string
        name:
          type: string
        permissions:
          items:
            $ref: '#/components/schemas/DocPerm'
          type: array
        titleField:
          type: string
        updatedAt:
          type: integer
      type: object
    Drift:
      properties:
        disabled:
          type: integer
        down:
          type: integer
        drifted:
          type: boolean
        name:
          type: string
        running:
          type: integer
        versions:
          items:
            type: string
          type: array
      type: object
    DropletIn:
      properties:
        disk:
          description: |-
            Disk requests a PERMANENT resize that grows the disk. DO can never resize such a
            droplet down again, so it defaults false — a CPU/RAM-only change, reversible.
          type: boolean
        id:
          description: ID is the DO droplet id, from the path. Numeric.
          type: string
        size:
          description: Size is the target DigitalOcean size slug on resize, e.g. "s-4vcpu-8gb".
          type: string
      type: object
    EnrollInput:
      properties:
        address:
          description: |-
            Address is a single recipient, normalized (lower-cased, trimmed) before
            use. Give this OR audienceId, never both and never neither.
          type: string
        audienceId:
          description: |-
            AudienceID fans the sequence out over a saved audience, resolved live to
            the org's mailable customers. Email only.
          type: string
        channel:
          description: |-
            Channel is the delivery surface; empty means email. An audience resolves
            mailboxes, so an audience enroll must be email.
          type: string
        id:
          description: ID is the sequence id from the path.
          type: string
      type: object
    EnrollResult:
      properties:
        alreadyEnrolled:
          description: |-
            AlreadyEnrolled is how many this sequence had already taken and were left
            alone.
          type: integer
        enrolled:
          description: Enrolled is how many started a walk on this call.
          type: integer
        enrollmentId:
          description: |-
            EnrollmentID names the walk, and is present ONLY for a single-address
            enroll — a fan-out has many, and reporting one of them would be a lie.
          type: string
        resolved:
          description: |-
            Resolved is how many addresses the request named — 1 for an address, the
            audience's deliverable count for an audience.
          type: integer
      type: object
    Enrollment:
      properties:
        address:
          description: Address is the normalized (lower-cased, trimmed) recipient.
          type: string
        channel:
          description: Channel is the delivery surface the steps go out on.
          type: string
        currentStep:
          description: CurrentStep is the index of the step that sends next.
          type: integer
        enrolledAt:
          description: EnrolledAt and UpdatedAt are unix seconds.
          type: integer
        id:
          description: ID is the server-assigned enrollment id ("enr_" + 128 random
            bits).
          type: string
        nextRunAt:
          description: |-
            NextRunAt is the unix time the current step comes due; 0 once the walk has
            ended. It IS the schedule — durable in SQLite, so it survives restarts.
          type: integer
        sequenceId:
          description: SequenceID is the sequence being walked.
          type: string
        status:
          description: Status is active, completed or canceled.
          type: string
        updatedAt:
          type: integer
      type: object
    EnrollmentList:
      properties:
        data:
          items:
            $ref: '#/components/schemas/Enrollment'
          type: array
      type: object
    EnrollmentRef:
