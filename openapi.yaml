  /v1/k8s/clusters:
    get:
      description: |-
        listK8sClusters lists the org's DOKS clusters (Visor, house account) folded with
        the org's BYO clusters — ONE fleet cluster view under the unified k8s noun. A Visor
        outage is logged and skipped so a down optional provider never hides the BYO list.
      operationId: listKubernetesClusters
      responses:
        "200":
          content:
            application/json:
              example:
                clusters:
                - doClusterId: cl-1
                  doksClusterId: cl-1
                  kind: managed
                  name: prod
                  nodeCount: 0
                  nodePools: []
                  region: nyc3
                  status: running
              schema:
                $ref: '#/components/schemas/clusterList'
          description: ok
      summary: |-
        listK8sClusters lists the org's DOKS clusters (Visor, house account) folded with
        the org's BYO clusters — ONE fleet cluster view under the unified k8s noun.
      tags:
      - k8s
    post:
      description: |-
        createK8sCluster provisions a DOKS cluster for the caller's org and answers 201.
        ADMIN-GATED — a SuperAdmin, or an OrgAdmin of the caller's own org — because
        provisioning spends real infrastructure on the house account. The request is
        validated at this boundary, then Visor owns provisioning and the hanzo-org
        ownership tag.
      operationId: createKubernetesCluster
      requestBody:
        content:
          application/json:
            example:
              name: prod
              nodePool:
                count: 2
                name: gpu
                size: gpu-h100x8-640gb
              region: nyc3
            schema:
              $ref: '#/components/schemas/createClusterReq'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                doClusterId: cl-1
                doksClusterId: cl-1
                kind: managed
                name: prod
                nodeCount: 0
                nodePools: []
                region: nyc3
                status: provisioning
              schema:
                $ref: '#/components/schemas/clusterView'
          description: ok
      summary: |-
        createK8sCluster provisions a DOKS cluster for the caller's org and answers 201.
        ADMIN-GATED — a SuperAdmin, or an OrgAdmin of the caller's own org — because
        provisioning spends real infrastructure on the house account.
      tags:
      - k8s
  /v1/k8s/clusters/{id}:
    delete:
      description: |-
        deleteK8sCluster destroys a DOKS cluster by id and answers 204. ADMIN-GATED, like
        create. Visor scopes the delete to the org (refuses a foreign id), so this can
        only ever remove the caller org's own cluster.
      operationId: deleteKubernetesCluster
      parameters:
      - description: |-
          ID is the provider's DOKS cluster id. Visor scopes the lookup to the caller's
          org, so another tenant's id resolves to not-found rather than their cluster.
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "204":
          description: no content
      summary: deleteK8sCluster destroys a DOKS cluster by id and answers 204.
      tags:
      - k8s
    get:
      description: |-
        getK8sCluster returns one cluster's detail: node pools + worker nodes. Visor scopes
        the lookup to the org (a foreign or missing id resolves to not-found), so a tenant
        can never read another tenant's cluster by guessing an id.
      operationId: getKubernetesCluster
      parameters:
      - description: |-
          ID is the provider's DOKS cluster id. Visor scopes the lookup to the caller's
          org, so another tenant's id resolves to not-found rather than their cluster.
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              example:
                doksClusterId: cl-1
                kind: managed
                name: prod
                nodeCount: 1
                nodePools:
                - count: 1
                  name: gpu
                  poolId: p-1
                  size: gpu-h100x8-640gb
                nodeSize: gpu-h100x8-640gb
                nodes:
                - id: node-1
                  name: node-1
                  status: active
                region: nyc3
                status: running
              schema:
                $ref: '#/components/schemas/clusterDetailView'
          description: ok
      summary: 'getK8sCluster returns one cluster''s detail: node pools + worker nodes.'
      tags:
      - k8s
  /v1/k8s/nodes:
    get:
      description: |-
        listK8sNodes returns every DOKS worker node in the org's clusters as a machine —
        the SAME set the fleet folds in (managedMachines), exposed directly under the k8s
        noun. House account (hanzo-org cluster tag) + BYOC, deduped by Visor.
      operationId: listKubernetesNodes
      responses:
        "200":
          content:
            application/json:
              example:
                nodes:
                - id: node-1
                  name: node-1
                  region: nyc3
                  status: active
                  type: s-4vcpu-8gb
                  vcpu: 4
              schema:
                $ref: '#/components/schemas/nodeList'
          description: ok
      summary: |-
        listK8sNodes returns every DOKS worker node in the org's clusters as a machine —
        the SAME set the fleet folds in (managedMachines), exposed directly under the k8s
        noun.
      tags:
      - k8s
