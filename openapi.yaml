  /v1/company/genesis:
    post:
      description: |-
        RecordGenesis seeds the canonical cap table with the founding allocation
        (stakeholders, a common share class, issued shares) and anchors the
        deterministic equity-genesis root on-chain.

        It is idempotent: once a root is recorded the cap table is NOT re-seeded, which
        would double-issue founder share certificates. The root is persisted even when
        the on-chain submit fails, because the root is the tamper-evident witness and
        must not be recomputed on retry. Available only at the genesis stage.
      operationId: post_v1_company_genesis
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/noInput'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/formationView'
          description: ok
      summary: |-
        RecordGenesis seeds the canonical cap table with the founding allocation
        (stakeholders, a common share class, issued shares) and anchors the
        deterministic equity-genesis root on-chain.

        It is idempotent: once a root is recorded the cap table is NOT re-seeded, which
        would double-issue founder share certificates.
      tags:
      - company
  /v1/company/import/captable:
    post:
      description: |-
        ImportCapTable reads an existing company's cap table from a Google Sheet and
        adds its stakeholders to the canonical cap table.

        The first row is a header and columns are matched by name (case-insensitive):
        name and email are required, type/relationship/institution optional. A sheet
        without name and email columns, or with no usable data rows, is refused with
        400. Available only at the import stage.
      operationId: post_v1_company_import_captable
      requestBody:
        content:
          application/json:
            example:
              range: Cap Table!A1:E100
              spreadsheetId: 1AbCdEfGhIjKlMnOpQrStUvWxYz
            schema:
              $ref: '#/components/schemas/importCapTableIn'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/importCapTableOut'
          description: ok
      summary: |-
        ImportCapTable reads an existing company's cap table from a Google Sheet and
        adds its stakeholders to the canonical cap table.

        The first row is a header and columns are matched by name (case-insensitive):
        name and email are required, type/relationship/institution optional.
      tags:
      - company
  /v1/company/import/documents:
    post:
      description: |-
        ImportDocuments ingests an existing company's corporate documents from a Google
        Drive folder into the org's data room. The import is shallow — sub-folders are
        skipped, not walked — and available only at the import stage.
      operationId: post_v1_company_import_documents
      requestBody:
        content:
          application/json:
            example:
              folderId: 1AbCdEfGhIjKlMnOpQrStUvWxYz
            schema:
              $ref: '#/components/schemas/importDocumentsIn'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/importDocumentsOut'
          description: ok
      summary: |-
        ImportDocuments ingests an existing company's corporate documents from a Google
        Drive folder into the org's data room.
      tags:
      - company
  /v1/company/kyc:
    post:
      description: |-
        StartKYC opens an identity-verification session for every founder with the
        wired provider and records each session's reference on the formation.

        A start is never a decision: any terminal status the provider reports at
        inquiry time is clamped back to pending, so the payment gate can never open
        here. A terminal status arrives only from POST /v1/company/kyc/refresh (the
        provider) or POST /v1/company/kyc/decision (a Hanzo platform reviewer).
      operationId: post_v1_company_kyc
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/noInput'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/kycStartOut'
          description: ok
      summary: |-
        StartKYC opens an identity-verification session for every founder with the
        wired provider and records each session's reference on the formation.

        A start is never a decision: any terminal status the provider reports at
        inquiry time is clamped back to pending, so the payment gate can never open
        here.
      tags:
      - company
  /v1/company/kyc/decision:
    post:
      description: |-
        DecideKYC records a privileged reviewer's MANUAL decision on a founder's KYC —
        the human-in-the-loop path, and the ONLY route to a pass when no real provider
        is wired. It produces a DISTINCT reviewer_confirmed, never a provider
        "verified".

        Because Hanzo forms the entity and carries the formation KYC/AML obligation,
        the reviewer is a HANZO platform reviewer (SuperAdmin), and the decision is
        ATTRIBUTED to them.
      operationId: post_v1_company_kyc_decision
      requestBody:
        content:
          application/json:
            example:
              email: ada@acme.com
              status: reviewer_confirmed
            schema:
              $ref: '#/components/schemas/decisionIn'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/formationView'
          description: ok
      summary: |-
        DecideKYC records a privileged reviewer's MANUAL decision on a founder's KYC —
        the human-in-the-loop path, and the ONLY route to a pass when no real provider
        is wired.
      tags:
      - company
  /v1/company/kyc/refresh:
    post:
      description: |-
        RefreshKYC reconciles each pending founder's KYC with the WIRED provider — the
        PULL path to a provider-reported terminal status. For the manual provider the
        check stays pending; for a real provider it reflects the settled decision,
        ATTRIBUTED to the provider.

        It NEVER trusts a client-asserted status — the status comes from the provider
        seam — so a client cannot force a pass here, and an already-passing founder
        (e.g. a reviewer confirmation) is left untouched.
      operationId: post_v1_company_kyc_refresh
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/noInput'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/kycRefreshOut'
          description: ok
      summary: |-
        RefreshKYC reconciles each pending founder's KYC with the WIRED provider — the
        PULL path to a provider-reported terminal status.
      tags:
      - company
  /v1/company/payment:
    post:
      operationId: post_v1_company_payment
      tags:
      - company
  /v1/company/register:
    get:
      description: |-
        ListRegister returns the platform's whole formation register, newest activity
        first — every org's formation, not the caller's. It is a Hanzo platform
        operation: a caller who is not a platform reviewer gets 403.

        Filter by stage and structure, page with limit and offset. An unknown stage is
        refused with 400 rather than returning a silently empty page.
      operationId: get_v1_company_register
      parameters:
      - description: Stage keeps only formations at that stage. Empty means any.
        example: founders
        in: query
        name: stage
        required: false
        schema:
          type: string
      - description: Structure keeps only formations of that entity kind. Empty means
          any.
        in: query
        name: structure
        required: false
        schema:
          type: string
      - description: Limit bounds the page; 0 or less means the default of 200.
        example: 50
        in: query
        name: limit
        required: false
        schema:
          type: integer
      - description: Offset skips that many rows.
        in: query
        name: offset
        required: false
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/registerPage'
          description: ok
      summary: |-
        ListRegister returns the platform's whole formation register, newest activity
        first — every org's formation, not the caller's.
      tags:
      - company
  /v1/company/register/summary:
    get:
      description: |-
        SummarizeRegister counts the platform's formations by stage — the register's
        shape in one read, so a queue that is growing is visible as a number rather
        than inferred by paging the list. A Hanzo platform operation: a caller who is
        not a platform reviewer gets 403.
      operationId: get_v1_company_register_summary
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/registerCounts'
          description: ok
      summary: |-
        SummarizeRegister counts the platform's formations by stage — the register's
        shape in one read, so a queue that is growing is visible as a number rather
        than inferred by paging the list.
      tags:
      - company
  /v1/company/review:
    get:
      description: |-
        ReviewQueue reports the founders whose KYC is not yet settled, oldest formation
        first, so the queue drains in the order founders have been waiting. A Hanzo
        platform operation: a caller who is not a platform reviewer gets 403.

        It only says who is waiting; the decision itself is POST
        /v1/company/kyc/decision.
      operationId: get_v1_company_review
      parameters:
      - description: Limit bounds how many formations are scanned; 0 or less means
          the default of 200.
        example: 50
        in: query
        name: limit
        required: false
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/reviewQueue'
          description: ok
      summary: |-
        ReviewQueue reports the founders whose KYC is not yet settled, oldest formation
        first, so the queue drains in the order founders have been waiting.
      tags:
      - company
  /v1/company/skip:
    post:
      description: |-
        Skip marks the org as already incorporated and moves it onto the import path,
        so an existing company brings its documents and cap table in instead of forming
        a new entity. Available only at the structure stage.
      operationId: post_v1_company_skip
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/noInput'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/formationView'
          description: ok
      summary: |-
        Skip marks the org as already incorporated and moves it onto the import path,
        so an existing company brings its documents and cap table in instead of forming
        a new entity.
      tags:
      - company
  /v1/company/structure:
    put:
      description: |-
        SetStructure records the entity kind, the state of formation and the proposed
        name. Available only at the structure stage; an unknown structure or
        jurisdiction, or an empty name, is refused with 400.
      operationId: put_v1_company_structure
      requestBody:
        content:
          application/json:
            example:
              jurisdiction: DE
              name: Acme Inc.
              structure: c-corp
            schema:
              $ref: '#/components/schemas/structureIn'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/formationView'
          description: ok
      summary: |-
        SetStructure records the entity kind, the state of formation and the proposed
        name.
      tags:
      - company
  /v1/compliance/accreditation:
    get:
      description: |-
        ListAccreditation returns the org's tracked accreditation-state records, newest
        first — evidence entries the org keeps, never a platform certification.
      operationId: get_v1_compliance_accreditation
      parameters:
      - description: Limit caps the rows returned; non-positive means the server default.
        in: query
        name: limit
        required: false
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/accList'
          description: ok
      summary: ListAccreditation returns the org's tracked accreditation-state records,
        newest
      tags:
      - compliance
    post:
      description: |-
        CreateAccreditation records an ASSERTED accreditation state for a subject — the
        subject's own assertion, with no verifier. Every CONFIRMED state
        (provider_verified, reviewer_confirmed) and every rejected/expired state is a
        DECISION recorded via the decision endpoint, attributed to the reviewer — a
        create can never stamp a confirmation. The underlying figures (income, net
        worth) are never stored; only the method, category, and state.
      operationId: post_v1_compliance_accreditation
      requestBody:
        content:
          application/json:
            example:
              basis: income
              method: self_attested
              subjectId: sub_1
            schema:
              $ref: '#/components/schemas/accreditationReq'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/accView'
          description: created
      summary: |-
        CreateAccreditation records an ASSERTED accreditation state for a subject — the
        subject's own assertion, with no verifier.
      tags:
      - compliance
  /v1/compliance/accreditation/{id}:
    get:
      description: GetAccreditation returns one tracked accreditation record.
      operationId: get_v1_compliance_accreditation_id
      parameters:
      - description: ID is the accreditation record to read, from the path.
        example: acc_1
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/accView'
          description: ok
      summary: GetAccreditation returns one tracked accreditation record.
      tags:
      - compliance
  /v1/compliance/accreditation/{id}/decision:
    post:
      description: |-
        DecideAccreditation records an org reviewer's decision on an accreditation
        record — a reviewer confirmation, a provider verification the reviewer has
        evidence of (a CPA/attorney letter, a verifier report), a rejection, or an
        expiry. ROLE-GATED (an org admin or platform reviewer) and ATTRIBUTED: the
        reviewer's identity is recorded as ReviewerSub and audited. Human-in-the-loop:
        the platform never confirms on its own, and even a provider_verified state
        carries the reviewer who recorded it.
      operationId: post_v1_compliance_accreditation_id_decision
      parameters:
      - description: ID is the accreditation record to decide, from the path.
        example: acc_1
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              id: acc_1
              status: reviewer_confirmed
            schema:
              $ref: '#/components/schemas/accreditationDecision'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/accView'
          description: ok
      summary: |-
        DecideAccreditation records an org reviewer's decision on an accreditation
        record — a reviewer confirmation, a provider verification the reviewer has
        evidence of (a CPA/attorney letter, a verifier report), a rejection, or an
        expiry.
      tags:
      - compliance
  /v1/compliance/audit:
    get:
      description: |-
        AuditRead is the compliance-scoped read of the SHARED tamper-evident audit plane —
        the SOC 2 posture surface (privileged actions: who started/decided what, when). The
        org is PINNED to the caller's validated org and the rows are narrowed to
        compliance.* actions. Fail-closed: no principal is a 403, no configured audit
        store a 501.
      operationId: get_v1_compliance_audit
      parameters:
      - description: 'Result filters rows by outcome result: success, deny, or error;
          empty means all.'
        in: query
        name: result
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/auditList'
          description: ok
      summary: |-
        AuditRead is the compliance-scoped read of the SHARED tamper-evident audit plane —
        the SOC 2 posture surface (privileged actions: who started/decided what, when).
      tags:
      - compliance
  /v1/compliance/health:
    get:
      description: |-
        Health reports subsystem liveness and the wired verification provider. Fail-open
        on purpose: it never probes the external provider, so a provider outage cannot
        fail liveness.
      operationId: get_v1_compliance_health
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/healthView'
          description: ok
      summary: Health reports subsystem liveness and the wired verification provider.
      tags:
      - compliance
  /v1/compliance/records:
    get:
      description: |-
        ListRecords is the unified compliance-record view for the org: its verifications
        and accreditation records together, each provider-reported or tracked, never
        platform-asserted. PII stays in the subject store; records carry only opaque ids
        and statuses.
      operationId: get_v1_compliance_records
      parameters:
      - description: Limit caps the rows returned; non-positive means the server default.
        in: query
        name: limit
        required: false
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/recordList'
          description: ok
      summary: |-
        ListRecords is the unified compliance-record view for the org: its verifications
        and accreditation records together, each provider-reported or tracked, never
        platform-asserted.
      tags:
      - compliance
  /v1/compliance/status:
    get:
      description: |-
        Status is the org's honest posture read: the wired provider and the per-status
        tally of its verifications. It is deliberately NOT a boolean "compliant" — it
        reports counts of provider-reported states and carries the boundary disclaimer.
      operationId: get_v1_compliance_status
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/statusView'
          description: ok
      summary: |-
        Status is the org's honest posture read: the wired provider and the per-status
        tally of its verifications.
      tags:
      - compliance
  /v1/compliance/subjects:
    get:
      description: |-
        ListSubjects returns the org's subjects as PII-MINIMIZED summaries — no name or
        email, only whether an email is on file. The full record is returned only by the
        explicit single-subject read.
      operationId: get_v1_compliance_subjects
      parameters:
      - description: Limit caps the rows returned; non-positive means the server default.
        in: query
        name: limit
        required: false
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/subjectList'
          description: ok
      summary: |-
        ListSubjects returns the org's subjects as PII-MINIMIZED summaries — no name or
        email, only whether an email is on file.
      tags:
      - compliance
    post:
      description: |-
        CreateSubject records a party the org is verifying as part of its own
        onboarding/compliance — a team member, vendor, customer, or counterparty. The
        subject's contact PII (name/email) is sealed at rest and returned only to the
        owning org; downstream records reference the subject by opaque id.
      operationId: post_v1_compliance_subjects
      requestBody:
        content:
          application/json:
            example:
              email: founder@example.com
              kind: individual
              name: Ada
            schema:
              $ref: '#/components/schemas/subjectReq'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subject'
          description: created
      summary: |-
        CreateSubject records a party the org is verifying as part of its own
        onboarding/compliance — a team member, vendor, customer, or counterparty.
      tags:
      - compliance
  /v1/compliance/subjects/{id}:
    get:
      description: |-
        GetSubject returns one subject WITH its contact PII — the only surface that
        returns it, and only to the owning org. The response is never cached by any
        intermediary.
      operationId: get_v1_compliance_subjects_id
      parameters:
      - description: ID is the subject to read, from the path.
        example: sub_1
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subject'
          description: ok
      summary: |-
        GetSubject returns one subject WITH its contact PII — the only surface that
        returns it, and only to the owning org.
      tags:
      - compliance
  /v1/compliance/verifications:
    get:
      description: |-
        ListVerifications returns the org's KYC/KYB verifications, newest first — opaque
        subject references and provider-reported statuses only, no subject PII.
      operationId: get_v1_compliance_verifications
      parameters:
      - description: Limit caps the rows returned; non-positive means the server default.
        in: query
        name: limit
        required: false
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/checkList'
          description: ok
      summary: ListVerifications returns the org's KYC/KYB verifications, newest first
        — opaque
      tags:
      - compliance
    post:
      description: |-
        StartVerification begins a KYC/KYB verification of a subject through the wired
        provider — an existing subject by id, or one created inline from the request.
        The returned status is provider-reported and never terminal on a fresh start:
        starting a verification can never yield a verified record, and a provider error
        is a 502, never a verification.
      operationId: post_v1_compliance_verifications
      requestBody:
        content:
          application/json:
            example:
              subjectId: sub_1
            schema:
              $ref: '#/components/schemas/verificationReq'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/checkView'
          description: created
      summary: StartVerification begins a KYC/KYB verification of a subject through
        the wired
      tags:
      - compliance
  /v1/compliance/verifications/{id}:
    get:
      description: |-
        GetVerification returns one verification — its opaque subject reference and
        provider-reported status, no subject PII.
      operationId: get_v1_compliance_verifications_id
      parameters:
      - description: ID is the verification to act on, from the path.
        example: chk_1
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/checkView'
          description: ok
      summary: GetVerification returns one verification — its opaque subject reference
        and
      tags:
      - compliance
  /v1/compliance/verifications/{id}/decision:
    post:
      description: |-
        DecideVerification records a privileged reviewer's MANUAL decision on a
        verification — the human-in-the-loop path, and the ONLY route to a passing status
        when no real provider is wired. It produces a DISTINCT reviewer_confirmed, never
        a provider_verified (a provider decision is the provider's to report, via the
        webhook or a reconcile), and it is ROLE-GATED (an org admin or platform reviewer)
        AND ATTRIBUTED (the reviewer's user id is DecidedBy), so a manual pass is always
        accountable.
      operationId: post_v1_compliance_verifications_id_decision
      parameters:
      - description: ID is the verification to decide, from the path.
        example: chk_1
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              id: chk_1
              status: reviewer_confirmed
            schema:
              $ref: '#/components/schemas/verificationDecision'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/checkView'
          description: ok
      summary: |-
        DecideVerification records a privileged reviewer's MANUAL decision on a
        verification — the human-in-the-loop path, and the ONLY route to a passing status
        when no real provider is wired.
      tags:
      - compliance
  /v1/compliance/verifications/{id}/refresh:
    post:
      description: |-
        RefreshVerification polls the wired provider for its current decision and
        records it, ATTRIBUTED to the provider — the internal PULL reconcile. For the
        Manual provider the check stays pending; for a hosted provider it reflects the
        provider's settled status. A poll error is a 502, never a verification.
      operationId: post_v1_compliance_verifications_id_refresh
      parameters:
      - description: ID is the verification to act on, from the path.
        example: chk_1
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              id: chk_1
            schema:
              $ref: '#/components/schemas/verificationRef'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/checkView'
          description: ok
      summary: |-
        RefreshVerification polls the wired provider for its current decision and
        records it, ATTRIBUTED to the provider — the internal PULL reconcile.
      tags:
      - compliance
  /v1/compliance/verifications/webhook:
    post:
      operationId: post_v1_compliance_verifications_webhook
      tags:
      - compliance
  /v1/compute/bots:
    get:
      description: |-
        listBots returns the caller org's bot machines — the kind=bot machines — each
        joined with the agent binding that says which cloud Agent it runs.

        The bindings are read ONCE and joined by machine id, so the list is O(1) upstream
        calls, not N+1. A bindings read that fails only costs the reconciled status: a bot
        still lists without it.
      operationId: listBots
      responses:
        "200":
          content:
            application/json:
              example:
                bots:
                - agent: bot-a
                  binding:
                    agentName: bot-a
                    machineId: drop-a
                    status: running
                  id: drop-a
                  name: bot-a
                  status: running
              schema:
                $ref: '#/components/schemas/botList'
          description: ok
      summary: |-
        listBots returns the caller org's bot machines — the kind=bot machines — each
        joined with the agent binding that says which cloud Agent it runs.

        The bindings are read ONCE and joined by machine id, so the list is O(1) upstream
        calls, not N+1.
      tags:
      - compute
  /v1/compute/bots/{id}:
    delete:
      description: |-
        deleteBot tears down both halves of a bot: it unbinds the agent (best-effort — a
        bot with no binding still deletes), then terminates the machine. Answers 204.
      operationId: deleteBot
      parameters:
      - description: |-
          ID is the bot machine's id — the same id the machines surface addresses it
          by. Scoped to the caller's org upstream, so another tenant's id is 404.
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "204":
          description: no content
      summary: |-
        deleteBot tears down both halves of a bot: it unbinds the agent (best-effort — a
        bot with no binding still deletes), then terminates the machine.
      tags:
      - compute
    get:
      description: |-
        getBot returns one of the caller org's bot machines with its agent binding.

        A machine counts as a Bot if it carries the hanzo-kind:bot tag OR has an agent
        binding — either signal is authoritative, so a bot resolves even before its
        cloud-init has stamped every tag. A machine that is neither is 404: this route
        answers for bots, not for machines.
      operationId: getBot
      parameters:
      - description: |-
          ID is the bot machine's id — the same id the machines surface addresses it
          by. Scoped to the caller's org upstream, so another tenant's id is 404.
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              example:
                agent: bot-a
                binding:
                  agentName: bot-a
                  machineId: drop-a
                  status: running
                id: drop-a
                name: bot-a
                status: running
              schema:
                $ref: '#/components/schemas/botView'
          description: ok
      summary: |-
        getBot returns one of the caller org's bot machines with its agent binding.

        A machine counts as a Bot if it carries the hanzo-kind:bot tag OR has an agent
        binding — either signal is authoritative, so a bot resolves even before its
        cloud-init has stamped every tag.
      tags:
      - compute
  /v1/compute/bots/{id}/{action}:
    post:
      operationId: post_v1_compute_bots_by_id_by_action
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - in: path
        name: action
        required: true
        schema:
          type: string
      tags:
      - compute
  /v1/compute/bots/launch:
    post:
      operationId: post_v1_compute_bots_launch
      tags:
      - compute
  /v1/compute/regions:
    get:
      operationId: get_v1_compute_regions
      tags:
      - compute
  /v1/compute/sizes:
    get:
      operationId: get_v1_compute_sizes
      tags:
      - compute
  /v1/connector/github/webhook:
    post:
      operationId: post_v1_connector_github_webhook
      tags:
      - connector
  /v1/connectors:
    get:
      description: |-
        connectors lists the caller's OWN connectors across every provider — the set
        `hanzo connector ls` prints. Rows are keyed (org,user), so this can never
        surface another user's connector, and no secret is in the view.
      operationId: get_v1_connectors
      responses:
        "200":
          content:
            application/json:
              example:
                connectors:
                - account: me@acme.com
                  connectedAt: "2026-07-01T10:00:00Z"
                  expiresAt: "2026-07-01T11:00:00Z"
                  externalId: u-42
                  id: openai:default
                  label: default
                  provider: openai
                  scopes:
                  - api
              schema:
                $ref: '#/components/schemas/connectorsOut'
          description: ok
      summary: |-
        connectors lists the caller's OWN connectors across every provider — the set
        `hanzo connector ls` prints.
      tags:
      - connectors
  /v1/connectors/{id}:
    delete:
      description: |-
        dropConn forgets a connector: every custodied secret, then the row.
        Idempotent — dropping a never-connected id still answers {disconnected:true}
        (disconnect() parity). No provider Revoke: none of the user-plane providers
        exposes a revoke endpoint.
      operationId: delete_v1_connectors_id
      parameters:
      - description: |-
          ID is the connector id, provider + ":" + label ("openai:default") — the
          auth-profile-id shape. Another user's id is simply no row, so 404.
        example: openai:work
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              example:
                disconnected: true
              schema:
                $ref: '#/components/schemas/disconnectOut'
          description: ok
      summary: |-
        dropConn forgets a connector: every custodied secret, then the row.
        Idempotent — dropping a never-connected id still answers {disconnected:true}
        (disconnect() parity).
      tags:
      - connectors
  /v1/connectors/{id}/refresh:
    post:
      description: |-
        refreshConn forces a token rotation for a connected connector, ahead of the
        automatic rotation a token read would do inside the expiry window. Only
        providers that declare a Refresh support it.
      operationId: post_v1_connectors_id_refresh
      parameters:
      - description: |-
          ID is the connector id, provider + ":" + label ("openai:default") — the
          auth-profile-id shape. Another user's id is simply no row, so 404.
        example: openai:work
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              id: openai:work
            schema:
              $ref: '#/components/schemas/connectorRef'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                connector:
                  account: me@acme.com
                  connectedAt: "2026-07-01T10:00:00Z"
                  expiresAt: "2026-07-01T12:00:00Z"
                  externalId: u-42
                  id: openai:work
                  label: work
                  provider: openai
                  scopes:
                  - api
                refreshed: true
              schema:
                $ref: '#/components/schemas/refreshOut'
          description: ok
      summary: |-
        refreshConn forces a token rotation for a connected connector, ahead of the
        automatic rotation a token read would do inside the expiry window.
      tags:
      - connectors
  /v1/connectors/{id}/token:
    get:
      description: |-
        tokenConn hands the custodied access token to its owner — the ONE place
        custody exits. The (org,user)-keyed row IS the same-user gate: another user's
        id is simply "no row" → 404. fresh() auto-rotates within the refreshSkew
        window; static providers degenerate to a plain kmsGet of Secrets[0]. Refresh
        tokens are NEVER returned — custody keeps the sink. The token is never logged.
      operationId: get_v1_connectors_id_token
      parameters:
      - description: |-
          ID is the connector id, provider + ":" + label ("openai:default") — the
          auth-profile-id shape. Another user's id is simply no row, so 404.
        example: openai:work
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              example:
                expiresAt: "2026-07-01T11:00:00Z"
                label: work
                provider: openai
                token: <the access token>
              schema:
                $ref: '#/components/schemas/connectorTokenOut'
          description: ok
      summary: |-
        tokenConn hands the custodied access token to its owner — the ONE place
        custody exits.
      tags:
      - connectors
  /v1/connectors/{provider}/credential:
    post:
      description: |-
        credential is the direct intake path: a customer-held token/setup-token
        (Verify) or an externally obtained OAuth bundle from the CLI's local PKCE
        (Adopt). ALWAYS verify-before-store: a bad credential is refused and NOTHING
        is persisted (connectByCredential's fail-closed order).
      operationId: post_v1_connectors_provider_credential
      parameters:
      - description: Provider is the user-scoped provider's registry id, from the
          path.
        example: openai
        in: path
        name: provider
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              label: work
              provider: openai
              token: sk-user-owned-key
            schema:
              $ref: '#/components/schemas/credentialIn'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                connected: true
                connector:
                  account: me@acme.com
                  connectedAt: "2026-07-01T10:00:00Z"
                  expiresAt: ""
                  externalId: u-42
                  id: openai:work
                  label: work
                  provider: openai
                  scopes:
                  - api
              schema:
                $ref: '#/components/schemas/credentialOut'
          description: ok
      summary: |-
        credential is the direct intake path: a customer-held token/setup-token
        (Verify) or an externally obtained OAuth bundle from the CLI's local PKCE
        (Adopt).
      tags:
      - connectors
  /v1/connectors/{provider}/device:
    post:
      description: |-
        startDevice begins a device sign-in and returns the code to show the user plus
        how to poll for completion. KMS readiness is checked NOW rather than dead-ending
        the user at poll-done (connect() parity), and the per-provider connector cap is
        checked before the provider is called. The provider's device code is persisted
        only in the encrypted grants table and is NEVER returned.
      operationId: post_v1_connectors_provider_device
      parameters:
      - description: Provider is the user-scoped provider's registry id, from the
          path.
        example: openai
        in: path
        name: provider
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              label: work
              provider: openai
            schema:
              $ref: '#/components/schemas/deviceStartIn'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                expiresAt: "2026-07-01T10:15:00Z"
                flow: g_7f2c
                interval: 5
                userCode: WDJB-MJHT
                verifyUrl: https://example.com/device
              schema:
                $ref: '#/components/schemas/deviceStartOut'
          description: ok
      summary: |-
        startDevice begins a device sign-in and returns the code to show the user plus
        how to poll for completion.
      tags:
      - connectors
  /v1/connectors/{provider}/device/{flow}/poll:
    post:
      description: |-
        pollDevice advances a device sign-in. Terminal outcomes are DATA, not errors
        (verifyConn {active:false} discipline) — the status set is closed:
        pending|connected|denied|expired. pollSlow collapses to "pending" on the
        wire; the raised cadence rides interval.
      operationId: post_v1_connectors_provider_device_flow_poll
      parameters:
      - description: Provider is the user-scoped provider's registry id, from the
          path.
        example: openai
        in: path
        name: provider
        required: true
        schema:
          type: string
      - description: |-
          Flow is the id deviceStartOut returned. Expired or another user's flow is
          indistinguishable from an unknown one: 404.
        example: g_7f2c
        in: path
        name: flow
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              flow: g_7f2c
              provider: openai
            schema:
              $ref: '#/components/schemas/devicePollIn'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                connector:
                  account: me@acme.com
                  connectedAt: "2026-07-01T10:05:00Z"
                  expiresAt: "2026-07-01T11:00:00Z"
                  externalId: u-42
                  id: openai:work
                  label: work
                  provider: openai
                  scopes:
                  - api
                status: connected
              schema:
                $ref: '#/components/schemas/devicePollOut'
          description: ok
      summary: pollDevice advances a device sign-in.
      tags:
      - connectors
  /v1/connectors/providers:
    get:
      description: |-
        connectorProviders lists the user-scoped provider cards — the catalog of what a
        user can connect, and how. Methods derive from capabilities (Device/Adopt/Verify
        — Mount asserts at least one), never from a parallel kind enum.
      operationId: get_v1_connectors_providers
      responses:
        "200":
          content:
            application/json:
              example:
                providers:
                - category: AI
                  description: Use your own OpenAI account.
                  id: openai
                  methods:
                  - device
                  - token
                  name: OpenAI
                  scopes:
                  - api
              schema:
                $ref: '#/components/schemas/connectorProvidersOut'
          description: ok
      summary: |-
        connectorProviders lists the user-scoped provider cards — the catalog of what a
        user can connect, and how.
      tags:
      - connectors
