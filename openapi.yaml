          description: |-
            Stage is the pipeline stage: NEW, SCREENING, MEETING, PROPOSAL or CUSTOMER
            (case-insensitive). Empty defaults to NEW.
          type: string
      type: object
    orgRow:
      properties:
        created:
          type: string
        creditsCents:
          type: integer
        display:
          type: string
        org:
          type: string
        products:
          type: integer
        spendCents:
          type: integer
        tokens:
          type: integer
        users:
          type: integer
      type: object
    orgsOut:
      properties:
        data:
          items:
            $ref: '#/components/schemas/orgRow'
          type: array
        data2:
          type: integer
        msg:
          type: string
        status:
          type: string
      type: object
    overviewData:
      properties:
        activeProducts:
          type: integer
        creditsCents:
          type: integer
        drift:
          type: integer
        lastSync:
          type: string
        orgs:
          type: integer
        products:
          type: integer
        sources:
          items:
            $ref: '#/components/schemas/SourceStatus'
          type: array
        spendCents30d:
          type: integer
        tokens30d:
          type: integer
        users:
          type: integer
      type: object
    overviewOut:
      properties:
        data:
          $ref: '#/components/schemas/overviewData'
        msg:
          type: string
        status:
          type: string
      type: object
    overviewView:
      properties:
        custom:
          type: boolean
        funnel:
          $ref: '#/components/schemas/Funnel'
        progress:
          $ref: '#/components/schemas/progressView'
        steps:
          items:
            $ref: '#/components/schemas/stepView'
          type: array
        title:
          type: string
        version:
          type: string
      type: object
    patchApplicationIn:
      properties:
        id:
          description: ID is the application to move, from the path.
          type: string
        note:
          description: |-
            Note is a free-text comment recorded on the timeline, with or without a
            stage change.
          type: string
        reason:
          description: Reason records WHY, and is required to reject.
          type: string
        stage:
          description: |-
            Stage is the stage to move to: applied, screened, qualified,
            credits-offered, onboarded or rejected. Omit to leave the stage alone.
          type: string
      type: object
    patchFlowIn:
      properties:
        externalId:
          description: ExternalID sets the caller's own id for this flow.
          type: string
        folderId:
          description: FolderID moves the flow in the builder's tree.
          type: string
        id:
          description: ID is the flow to update, from the path.
          type: string
        metadata:
          description: Metadata replaces the caller's opaque JSON.
          items:
            type: integer
          type: array
        publishedVersionId:
          description: |-
            PublishedVersionID pins the version runs execute. It must name a version OF
            THIS FLOW; empty clears the pin, so runs take the latest version again.
          type: string
      type: object
    patchIn:
      properties:
        name:
          description: Name is the repo to update, from the :name path segment.
          type: string
        public:
          description: |-
            Public flips anonymous read access. Omit it and the request is refused —
            there is nothing else to update yet.
          type: boolean
      type: object
    patchTargetIn:
      properties:
        id:
          description: ID is the target to update, from the path.
          type: string
      type: object
    planInfo:
      properties:
        active:
          description: Active is whether that plan's entitlement is live.
          type: boolean
        guestLimit:
          description: GuestLimit is the plan's team.guests cap, when the plan carries
            one.
          type: integer
        guests:
          description: Guests is how many of those seats are guests.
          type: integer
        plan:
          description: |-
            Plan is the licensed plan id, empty when it cannot be resolved here — an
            honest dash on the page, never a fabricated tier.
          type: string
        seats:
          description: Seats is the org's distinct active human members.
          type: integer
        upgradeUrl:
          description: UpgradeURL is where the page sends a caller who wants a bigger
            plan.
          type: string
      type: object
    point:
      properties:
        t:
          description: T is the bucket start, RFC3339 in UTC.
          type: string
        v:
          description: V is the bucket's value.
          type: number
      type: object
    poolCreate:
      properties:
        autoScale:
          description: AutoScale turns the provider's cluster autoscaler on for this
            pool.
          type: boolean
        clusterId:
          description: ClusterID is the cluster to add the pool to, from the URL path.
          type: string
        count:
          description: Count is how many nodes the pool starts with.
          type: integer
        maxNodes:
          type: integer
        minNodes:
          description: |-
            MinNodes and MaxNodes bound the autoscaler; they are ignored unless
            AutoScale is set.
          type: integer
        name:
          description: Name is the pool's name.
          type: string
        provider:
          description: |-
            Provider is the cloud the cluster lives on (e.g. "digitalocean"). Required —
            Visor routes the create by it. Accepted from the body or ?provider=.
          type: string
        size:
          description: Size is the provider size slug for each node (e.g. "s-4vcpu-8gb").
          type: string
      type: object
    poolScale:
      properties:
        clusterId:
          description: ClusterID and PoolID address the pool, from the URL path.
          type: string
        count:
          description: |-
            Count is the node count to scale TO — an absolute target, not a delta, and
            never negative.
          type: integer
        poolId:
          type: string
        provider:
          description: Provider is the cloud the cluster lives on. Required; body
            or ?provider=.
          type: string
      type: object
    populatedFlow:
      properties:
        created:
          description: Created and Updated are unix milliseconds.
          type: integer
        externalId:
          description: ExternalID is the caller's own id for this flow, if it set
            one.
          type: string
        folderId:
          description: FolderID groups the flow in the builder's tree.
          type: string
        id:
          description: ID is the flow's id.
          type: string
        metadata:
          description: Metadata is the caller's opaque JSON, stored and returned verbatim.
          items:
            type: integer
          type: array
        projectId:
          description: |-
            Org is the owning org, which this surface names projectId. Server-derived from
            the validated principal — never read from a request.
          type: string
        publishedVersionId:
          description: |-
            PublishedVersionID is the version a run executes when set; empty means the
            latest version runs.
          type: string
        status:
          description: Status is ENABLED or DISABLED — whether the flow's trigger
            is armed.
          type: string
        updated:
          type: integer
        version:
          $ref: '#/components/schemas/FlowVersion'
          description: Version is the flow's latest version — its display name and
            step tree.
      type: object
    pricingHealth:
      properties:
        service:
          description: Service names the subsystem that answered.
          type: string
        status:
          description: Status is "ok" whenever this subsystem is mounted.
          type: string
      type: object
    pricingModelList:
      properties:
        models:
          description: |-
            Models are the catalog entries visible to the caller, each an opaque
            object exactly as the pricing source emits it, with any admin override
            merged on top. An admin additionally sees hidden entries, each annotated
            under "_overlay".
          items:
            additionalProperties:
              type: object
            type: object
          type: array
        total:
          description: |-
            Total is how many models this answer carries — recounted over the visible
            set, not the catalog's own total.
          type: integer
        updated:
          description: |-
            Updated is when the catalog was last refreshed, as the pricing source
            recorded it.
          type: object
      type: object
    pricingNoInput:
      properties: {}
      type: object
    pricingProviderList:
      properties:
        providers:
          additionalProperties:
            type: object
          description: |-
            Providers maps a provider name to its opaque info object. A provider
            hidden for the caller's org is absent entirely.
          type: object
        updated:
          description: |-
            Updated is when the catalog was last refreshed, as the pricing source
            recorded it.
          type: object
      type: object
    pricingSyncOut:
      properties:
        status:
          description: Status is "ok" when the sync completed.
          type: string
        updated:
          description: Updated is the RFC 3339 time the refreshed catalog was stamped
            with.
          type: string
      type: object
    productRow:
      properties:
        cluster:
          description: hanzo-k8s
          type: string
        declaredTag:
          description: spec.image.tag on the App CR (declared truth)
          type: string
        drift:
          description: any drift flag present
          type: boolean
        driftSeverity:
          description: ok|yellow|red (rolled-up)
          type: string
        env:
          description: main|test|dev (lifecycle namespace)
          type: string
        health:
          description: green|yellow|red|unknown
          type: string
        kind:
          description: operator App CR spec.role (sql|kv|generic|ingress) or ""
          type: string
        latestTag:
          description: newest released tag (GH release reader — empty until wired)
          type: string
        name:
          type: string
        namespace:
          description: k8s namespace
          type: string
        org:
          description: image namespace (hanzoai|luxfi|docker.io/…)
          type: string
        phase:
          description: operator status.phase (Running/Creating/…)
          type: string
        repo:
          description: owner/repo image coordinate
          type: string
        runningTag:
          description: observed from the live Deployment
          type: string
        tier:
          description: 'derived: cloud|data|edge|daemon|paas|app (grouping)'
          type: string
        updated:
          type: string
      type: object
    productsOut:
      properties:
        data:
          items:
            $ref: '#/components/schemas/productRow'
          type: array
        data2:
          type: integer
        msg:
          type: string
        status:
          type: string
      type: object
    profileMetrics:
      properties:
        funnel:
          $ref: '#/components/schemas/Funnel'
        launchProgress:
          $ref: '#/components/schemas/progressView'
        records:
          type: integer
        revenueCents:
          type: integer
      type: object
    profileResponse:
      properties:
        keyMetrics:
          $ref: '#/components/schemas/profileMetrics'
        signals:
          additionalProperties:
            type: boolean
          type: object
        stage:
          type: string
      type: object
    progressView:
      properties:
        done:
          type: integer
        next:
          type: string
        percent:
          type: integer
        total:
          type: integer
      type: object
    projectView:
      properties:
        applications:
          type: integer
        createdAt:
          type: integer
        description:
          type: string
        name:
          type: string
        org:
          type: string
        slug:
          type: string
      type: object
    promoIn:
      properties:
        active:
          description: 'Active is the master switch: false parks the offer without
            deleting it.'
          type: boolean
        end:
          description: End is when the offer closes (RFC3339).
          type: string
        percentOff:
          description: PercentOff is the discount, 0-100.
          type: integer
        plans:
          description: Plans are the plan ids the offer applies to.
          items:
            type: string
          type: array
        start:
          description: Start is when the offer opens (RFC3339).
          type: string
      type: object
    providerRef:
      properties:
        provider:
          description: |-
            Provider is the registry id of the connector — "slack", "github",
            "cloudflare". Unknown ids are 404, as are the user-plane (/v1/connectors)
            providers, which this surface never resolves.
          type: string
      type: object
    providerView:
      properties:
        available:
          description: |-
            Available is whether THIS DEPLOYMENT has the provider's app credentials, so
            connect can succeed. False renders the card without a working Connect button.
          type: boolean
        category:
          description: Category groups the card ("Communication", "Developer", "Marketing").
          type: string
        connected:
          description: Connected is whether this org has a live connection to the
            provider.
          type: boolean
        connection:
          $ref: '#/components/schemas/connectionView'
          description: |-
            Connection is the connected account's non-secret detail. Absent when the org
            has no connection; tokens NEVER appear here (they live only in KMS).
        description:
          description: Description is the one-line pitch the console card shows.
          type: string
        id:
          description: ID is the provider's registry id and the :provider path segment
            ("slack").
          type: string
        name:
          description: Name is the provider's display name ("Slack").
          type: string
      type: object
    purgeIn:
      properties:
        files:
          description: Files purges exactly the listed URLs — at most 30, Cloudflare's
            per-request cap.
          items:
            type: string
          type: array
        purge_everything:
          description: Everything drops the zone's entire edge cache.
          type: boolean
        zone:
          description: Zone is the 32-hex Cloudflare zone id, from the path.
          type: string
      type: object
    pushFile:
      properties:
        content:
          description: Content is the file's bytes, carried per Encoding.
          type: string
        encoding:
          description: Encoding is "base64", or "utf-8" (the default, also "utf8"
            / "text").
          type: string
        path:
          description: Path is repo-relative. Absolute or traversing paths are refused.
          type: string
      type: object
    pushReq:
      properties:
        branch:
          description: |-
            Branch to advance; empty means "main". A fresh branch that is the repo's
            first also becomes HEAD.
          type: string
        files:
          description: |-
            Files are added to or overwritten on the branch tip — files already there
            and not listed SURVIVE. At least one, at most 5000, 32 MiB each.
          items:
            $ref: '#/components/schemas/pushFile'
          type: array
        message:
          description: Message is the commit message; empty gets a generated one.
          type: string
        name:
          description: |-
            Name is the repo to push into, from the :name path segment. It is CREATED
            on first push if it does not exist.
          type: string
      type: object
    pushResp:
      properties:
        branch:
          description: Branch is the branch that was advanced, resolved (never empty).
          type: string
        cloneUrl:
          description: CloneURL is the repo's HTTPS remote.
          type: string
        commit:
          description: Commit is the new commit's full hash.
          type: string
        sshUrl:
          description: SSHURL is the repo's scp-style SSH remote.
          type: string
      type: object
    railList:
      properties:
        rails:
          description: Rails is every (chain, token, treasury) triple this deployment
            accepts.
          items:
            $ref: '#/components/schemas/railView'
          type: array
      type: object
    railView:
      properties:
        chain:
          description: Chain is the human chain name, e.g. "Base".
          type: string
        chainId:
          description: ChainID is the EIP-155 chain id the wallet must be on.
          type: integer
        decimals:
          description: |-
            Decimals is the token's decimal places — 6 for USDC, 18 for an 18-decimal
            token. Cents are derived per-rail from it.
          type: integer
        id:
          description: ID is the stable rail id to name when submitting a transfer,
            e.g. "base-usdc".
          type: string
        symbol:
          description: Symbol is the display symbol, e.g. "USDC".
          type: string
        token:
          description: Token is the ERC-20 contract address to transfer.
          type: string
        treasury:
          description: Treasury is the address on this chain to send funds to.
          type: string
      type: object
    rawOut:
      properties:
        data:
          type: object
        data2:
          type: integer
        msg:
          type: string
        status:
          type: string
      type: object
    readmeJSON:
      properties:
        content:
          description: Content is the file's text, verbatim and unrendered.
          type: string
        encoding:
          description: Encoding is always "utf8" — a README is text by definition.
          type: string
        path:
          description: Path is the file the README was found at (README.md, README,
            …).
          type: string
      type: object
    recordList:
      properties:
        accreditation:
          description: Accreditation is the org's tracked accreditation-state records.
          items:
            $ref: '#/components/schemas/accView'
          type: array
        disclaimer:
          description: |-
            Disclaimer states that statuses are provider-reported or tracked, never a
            platform assertion of legal or regulatory compliance.
          type: string
        verifications:
          description: Verifications is the org's KYC/KYB checks, provider-reported
            statuses only.
          items:
            $ref: '#/components/schemas/checkView'
          type: array
      type: object
    refJSON:
      properties:
        name:
          description: Name is the short ref name ("main", "v1.2.0"), not the full
            refs/… path.
          type: string
        sha:
          description: SHA is the full commit hash the ref resolves to.
          type: string
      type: object
    refreshOut:
      properties:
        connector:
          $ref: '#/components/schemas/connView'
          description: Connector is the connector with its new expiry.
        refreshed:
          description: Refreshed is always true — a failed rotation is an HTTP error.
          type: boolean
      type: object
    refsJSON:
      properties:
        branches:
          description: Branches are the repo's heads; empty on a repo with no commits.
          items:
            $ref: '#/components/schemas/refJSON'
          type: array
        default:
          description: Default is the branch name a caller gets when it asks for no
            ref.
          type: string
        tags:
          description: Tags are the repo's tags; empty when there are none.
          items:
            $ref: '#/components/schemas/refJSON'
          type: array
      type: object
    registerCounts:
      properties:
        byStage:
          additionalProperties:
            type: integer
          description: ByStage counts formations per stage, keyed by the stage name.
          type: object
        total:
          description: Total is every formation in the register.
          type: integer
      type: object
    registerKeyReq:
      properties:
        publicKey:
          description: |-
            PublicKey is one OpenSSH authorized-key line ("ssh-ed25519 AAAA… you@host").
            Required; a line that does not parse is refused and never stored.
          type: string
        title:
          description: |-
            Title labels the key in the console. Max 256 chars; when omitted the
            comment on the key line is used.
          type: string
      type: object
    registerPage:
      properties:
        count:
          description: Count is how many rows this page holds.
          type: integer
        formations:
          description: Formations are the rows, newest activity first.
          items:
            $ref: '#/components/schemas/Registration'
          type: array
        limit:
          description: Limit is the page size that was applied.
          type: integer
        offset:
          description: Offset is the offset that was applied.
          type: integer
      type: object
    repoList:
      properties:
        data:
          description: Data holds the repos in scope, most recently updated first.
          items:
            $ref: '#/components/schemas/repoView'
          type: array
      type: object
    repoRef:
      properties:
        name:
          description: |-
            Name is the repo's org-unique handle, from the :name path segment. A
            trailing ".git" is stripped.
          type: string
      type: object
    repoView:
      properties:
        branches:
          description: |-
            Branches are the repo's branch names. Read live, so the detail view carries
            them and a list row does not.
          items:
            type: string
          type: array
        cloneUrl:
          description: CloneURL is the HTTPS smart-HTTP remote `git clone` takes.
          type: string
        createdAt:
          description: CreatedAt is RFC 3339 UTC.
          type: string
        defaultBranch:
          description: DefaultBranch is where HEAD points on a fresh repo ("main").
          type: string
        description:
          description: Description is the caller-supplied blurb (max 4KiB).
          type: string
        head:
          description: Head is the resolved HEAD commit, empty on an empty repo.
          type: string
        id:
          description: ID is the repo's stable, prefixed identifier ("repo_" + 128
            random bits).
          type: string
        name:
          description: Name is the org-unique handle, and the last path segment of
            both URLs below.
          type: string
        org:
          description: Org owns the repo — the gateway-minted X-Org-Id, and the isolation
            key.
          type: string
        project:
          description: |-
            Project is the optional sub-scope the repo lives in; absent for the org's
            default scope.
          type: string
        public:
          description: |-
            Public grants ANONYMOUS read (fetch) only; push and the whole control plane
            stay org-authed.
          type: boolean
        sizeBytes:
          description: |-
            SizeBytes is the repo's measured on-disk size, re-measured on create, after
            each push, and after a gc. This is the number billing meters.
          type: integer
        sshUrl:
          description: SSHURL is the scp-style SSH remote (git@host:org/repo.git).
          type: string
        updatedAt:
          description: UpdatedAt is RFC 3339 UTC, empty until the first write.
          type: string
      type: object
    retentionCohort:
      properties:
        cohort:
          type: string
        size:
          type: integer
        values:
          items:
            type: number
          type: array
      type: object
    retentionGrid:
      properties:
        cohorts:
          items:
            $ref: '#/components/schemas/retentionCohort'
          type: array
        interval:
          description: '"month"'
          type: string
        periods:
          type: integer
      type: object
    reviewQueue:
      properties:
        count:
          description: Count is how many founders are waiting.
          type: integer
        queue:
          description: Queue is one entry per unsettled founder, oldest formation
            first.
          items:
            $ref: '#/components/schemas/waiting'
          type: array
      type: object
    revokedKey:
      properties:
        ok:
          description: |-
            OK is true when the key was revoked. A failure is an error status, never a
            false here.
          type: boolean
        type:
          description: |-
            Type is the key class that was revoked, resolved — so a caller that named
            nothing can see it revoked the secret key.
          type: string
      type: object
    roleList:
      properties:
        data:
          description: Data is every (user, role) assignment in the caller's org.
          items:
            $ref: '#/components/schemas/Role'
          type: array
      type: object
    roundOut:
      properties:
        roundId:
          description: RoundID is the cap table's id for the recorded round.
          type: string
      type: object
    routeCreateIn:
      properties:
        pattern:
          description: Pattern is the URL pattern to bind, e.g. "acme.com/api/*".
          type: string
        script:
          description: |-
            Script is the Worker script to dispatch to. Omit it to leave the pattern
            bound to no script, which is how Cloudflare expresses "bypass the Worker here".
          type: string
        zone:
          description: Zone is the 32-hex Cloudflare zone id, from the path.
          type: string
      type: object
    rulesOut:
      properties:
        rules:
          description: |-
            Rules is every rule the org has set, highest priority first — the order they
            are matched in.
          items:
            $ref: '#/components/schemas/Rule'
          type: array
      type: object
    runIn:
      properties:
        action:
          description: Action is the name of the connector action to invoke.
          type: string
        auth:
          description: |-
            Auth is the caller's resolved credential for the connector, handed to the
            action verbatim. Its shape is whatever the connector's auth descriptor
            declares (a token string, an object), so it is opaque here.
          type: object
        id:
          description: ID is the connector to run, from the path.
          type: string
        props:
          additionalProperties:
            type: object
          description: Props are the action's input properties, keyed by property
            name.
          type: object
      type: object
    runPage:
      properties:
        data:
          description: Data is the page of runs, newest first.
          items:
            $ref: '#/components/schemas/FlowRun'
          type: array
      type: object
    runReq:
      properties:
        env:
          items:
            $ref: '#/components/schemas/EnvVarJSON'
          type: array
        gpu:
          type: integer
        image:
          type: string
        maxScale:
          type: integer
        minScale:
          type: integer
        name:
          type: string
        port:
          type: integer
        runtime:
          type: string
        shape:
          type: string
      type: object
    runResp:
      properties:
        error:
          description: Error is the connector-level failure message when not ok.
          type: string
        ok:
          description: Ok reports whether the action ran to completion.
          type: boolean
        output:
          description: Output is the action's result when ok. Its shape is the action's
            own.
          type: object
      type: object
    runView:
      properties:
        id:
          type: string
        name:
          type: string
        shape:
          type: string
        status:
          type: string
        url:
          type: string
      type: object
    safeIn:
      properties:
        documentIds:
          description: DocumentIDs are data room document ids to raise a signature
            request over. Required.
          items:
            type: string
          type: array
        signers:
          description: Signers are the recipients, each a name and an email. Required.
          items:
            $ref: '#/components/schemas/Signer'
          type: array
      type: object
    safeOut:
      properties:
        esignRef:
          description: EsignRef is the provider's reference for the signature request.
          type: string
        provider:
          description: Provider is the wired e-signature provider's name.
          type: string
