  /v1/admin/audit:
    get:
      description: |-
        Records reads cloud's tamper-evident audit trail, newest first, with the chain's live
        integrity attached so a listing can be badged as verified.

        When cloud has no local store configured it falls back to forwarding IAM's own
        get-records trail verbatim — a DIFFERENT trail, federated so the endpoint never
        regresses to an empty list. Those rows carry no integrity of ours, so the field is
        null there.
      operationId: adminAudit
      parameters:
      - description: Org restricts the trail to one tenant.
        in: query
        name: org
        required: false
        schema:
          type: string
      - description: Sub restricts it to one actor (the validated subject that made
          the request).
        in: query
        name: sub
        required: false
        schema:
          type: string
      - description: Action restricts it to one action name, e.g. "admin.waitlist.grant".
        in: query
        name: action
        required: false
        schema:
          type: string
      - description: Resource restricts it to one resource kind, e.g. "credit-grant".
        in: query
        name: resource
        required: false
        schema:
          type: string
      - description: ResourceID restricts it to one resource instance.
        in: query
        name: resourceId
        required: false
        schema:
          type: string
      - description: Result restricts it to "success" or "error".
        in: query
        name: result
        required: false
        schema:
          type: string
      - description: |-
          Since is the inclusive lower time bound, RFC3339. An unparseable value is
          ignored rather than refused — one malformed filter must not hide the trail.
        in: query
        name: since
        required: false
        schema:
          type: string
      - description: Until is the upper time bound, RFC3339, with the same tolerance.
        in: query
        name: until
        required: false
        schema:
          type: string
      - description: PageSize is rows per page, default 100.
        in: query
        name: pageSize
        required: false
        schema:
          type: string
      - description: Page is the 1-based page number, driving the offset.
        in: query
        name: p
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                - action: admin.waitlist.grant
                  org: acme
                  resource: waitlist
                  result: success
                  seq: 41
                  sub: z@hanzo.ai
                  ts: "2026-07-26T18:00:00Z"
                data2: 1
                integrity:
                  brokenAt: -1
                  count: 42
                  headHash: 9f2c
                  ok: true
                msg: ""
                status: ok
              schema:
                $ref: '#/components/schemas/RecordsOut'
          description: ok
      summary: |-
        Records reads cloud's tamper-evident audit trail, newest first, with the chain's live
        integrity attached so a listing can be badged as verified.

        When cloud has no local store configured it falls back to forwarding IAM's own
        get-records trail verbatim — a DIFFERENT trail, federated so the endpoint never
        regresses to an empty list.
      tags:
      - admin
  /v1/admin/audit/verify:
    get:
      description: |-
        Verify walks the WHOLE hash chain and reports whether it is intact: how many records
        were checked, the head hash to pin externally against tail-truncation, and — when the
        chain is broken — the seq of the first bad record and why.

        brokenAt is -1 exactly when ok is true. An unconfigured store is an honest failure
        here rather than a fabricated pass.
      operationId: adminAuditVerify
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                  brokenAt: -1
                  count: 42
                  headHash: 9f2c
                  ok: true
                msg: ""
                status: ok
              schema:
                $ref: '#/components/schemas/VerifyOut'
          description: ok
      summary: |-
        Verify walks the WHOLE hash chain and reports whether it is intact: how many records
        were checked, the head hash to pin externally against tail-truncation, and — when the
        chain is broken — the seq of the first bad record and why.

        brokenAt is -1 exactly when ok is true.
      tags:
      - admin
