      properties:
        data:
          properties:
            displayName:
              type: string
            email:
              type: string
            isSuperAdmin:
              type: boolean
            isWhiteLabel:
              description: |-
                IsWhiteLabel marks the admitted NON-super tier: an admin of an enabled
