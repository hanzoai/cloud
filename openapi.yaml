      properties:
        state:
          description: |-
            State is the GitHub issue state to walk: "open" (the default), "closed" or
            "all". Anything else is a 400.
          type: string
      type: object
    githubBackfillResult:
      properties:
        created:
          description: Created is how many native issues this pass created.
          type: integer
        failed:
          description: Failed is how many repos or issues errored; the pass continues
            past each.
          type: integer
        issues:
          description: Issues is how many upstream issues were seen.
          type: integer
        repos:
          description: Repos is how many granted repos were walked (archived/disabled
            are skipped).
          type: integer
        truncated:
          description: |-
            Truncated is set when the time budget or the issue cap stopped the pass early.
            Re-run to continue — the mirror is idempotent by ExtRef, so nothing duplicates.
          type: boolean
        updated:
          description: Updated is how many existing native issues this pass refreshed.
          type: integer
      type: object
    githubPagesDisabledOut:
      properties:
        disabled:
          description: Disabled is always true — a failure is an HTTP error, never
            this shape.
          type: boolean
        repo:
          description: Repo is the repository whose site was deleted.
          type: string
      type: object
    githubPagesEnableReq:
      properties:
        branch:
          description: |-
            Branch is the legacy source branch; empty defaults to the repo's own default
            branch. Ignored when buildType is "workflow".
          type: string
        buildType:
          description: |-
            BuildType selects the builder: "workflow" builds via GitHub Actions, anything
            else builds from the branch source above.
          type: string
        path:
          description: |-
            Path is the source directory within the branch: "/" (the default) or "/docs".
            GitHub allows no others.
          type: string
        repo:
          description: Repo is the repository, from the :repo path segment.
          type: string
      type: object
    githubPagesUpdateReq:
      properties:
        branch:
          description: Branch switches the legacy source branch. Empty leaves the
            source alone.
          type: string
        buildType:
          description: 'BuildType switches the builder: "legacy" or "workflow". Empty
            leaves it.'
          type: string
        cname:
          description: |-
            CNAME is the custom domain. Omit to leave it alone, "" to clear it, or a
            valid FQDN to set it.
          type: string
        httpsEnforced:
          description: HTTPSEnforced toggles GitHub's enforce-HTTPS bit. Omit to leave
            it alone.
          type: boolean
        path:
          description: |-
            Path is the source directory to pair with Branch: "/" (the default) or
            "/docs". Read only when Branch is given.
          type: string
        repo:
          description: Repo is the repository, from the :repo path segment.
          type: string
      type: object
    githubPagesUpdatedOut:
      properties:
        repo:
          description: Repo is the repository that was updated.
          type: string
        updated:
          description: Updated is always true — a failure is an HTTP error, never
            this shape.
          type: boolean
      type: object
    githubPagesView:
      properties:
        buildType:
          description: 'BuildType is the builder in use: "legacy" (branch source)
            or "workflow".'
          type: string
        cname:
          description: CNAME is the custom domain, absent when none is set.
          type: string
        custom404:
          description: Custom404 is whether the repo ships its own 404 page.
          type: boolean
        httpsEnforced:
          description: HTTPSEnforced is GitHub's enforce-HTTPS bit.
          type: boolean
        repo:
          description: Repo is the repository the site belongs to.
          type: string
        source:
          description: Source is the branch + path the site builds from. Absent under
            "workflow".
          properties:
            branch:
              description: Branch is the branch the site builds from.
              type: string
            path:
              description: 'Path is the directory within that branch: "/" or "/docs".'
              type: string
          type: object
        status:
          description: |-
            Status is GitHub's build state: "built", "building" or "errored". Absent
            before the first build.
          type: string
        url:
          description: URL is the live site (GitHub's html_url).
          type: string
      type: object
    githubReposOut:
      properties:
        repos:
          description: Repos is every repo the installation grants. Never null; []
            when none.
          items:
            properties:
              defaultBranch:
                description: DefaultBranch is the repo's default branch at GitHub.
                type: string
              fullName:
                description: FullName is GitHub's owner/name.
