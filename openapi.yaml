  /v1/admin/services:
    get:
      description: |-
        services reads the launch board: every hosted service in the registry with its LIVE
        waitlist mode, evaluated through the flag engine. This is the "remove the waitlist one
        service at a time" view.
      operationId: adminServices
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                  services:
                  - description: ""
                    displayName: Chat
                    hosts:
                    - chat.hanzo.ai
                    service: chat
                    waitlistMode: true
                msg: ""
                status: ok
              schema:
                $ref: '#/components/schemas/servicesOut'
          description: ok
      summary: |-
        services reads the launch board: every hosted service in the registry with its LIVE
        waitlist mode, evaluated through the flag engine.
      tags:
      - admin
    post:
      description: |-
        upsertService onboards a hosted service, or edits one, so a new host comes under the
        launch gate WITHOUT a redeploy. Re-registering an existing service PRESERVES its live
        switch — editing the hosts of a service that is already open must not silently close
        it again.
      operationId: adminUpsertService
      requestBody:
        content:
          application/json:
            example:
              description: Hanzo Chat
              displayName: Chat
              hosts:
              - chat.hanzo.ai
              service: chat
              waitlistMode: true
            schema:
              $ref: '#/components/schemas/ServiceInput'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                  service:
                    description: Hanzo Chat
                    displayName: Chat
                    hosts:
                    - chat.hanzo.ai
                    service: chat
                    waitlistMode: true
                msg: ""
                status: ok
              schema:
                $ref: '#/components/schemas/serviceOut'
          description: ok
      summary: |-
        upsertService onboards a hosted service, or edits one, so a new host comes under the
        launch gate WITHOUT a redeploy.
      tags:
      - admin
  /v1/admin/services/{service}/mode:
    post:
      description: |-
        setServiceMode flips ONE service's waitlist switch — the launch lever. Hot: it takes
        effect on this pod immediately and on peers within one evaluation TTL, with no
        redeploy. An unknown service is a 404, not a silent create; onboarding goes through
        upsertService.
      operationId: adminSetServiceMode
      parameters:
      - description: Service is the slug to flip, taken from the path.
        in: path
        name: service
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              waitlistMode: false
            schema:
              $ref: '#/components/schemas/serviceModeIn'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                  service:
                    description: Hanzo Chat
                    displayName: Chat
                    hosts:
                    - chat.hanzo.ai
                    service: chat
                    waitlistMode: false
                msg: ""
                status: ok
              schema:
                $ref: '#/components/schemas/serviceOut'
          description: ok
      summary: setServiceMode flips ONE service's waitlist switch — the launch lever.
      tags:
      - admin
  /v1/admin/spend-caps:
    get:
      description: |-
        listSpendCaps reads one org's usage caps: its spend alerts plus the derived period
        spend, over/warn state and reset time.

        These are the SAME rows the customer edits in their own console — a platform override
        and a customer budget are one model, not two.
      operationId: adminSpendCaps
      parameters:
      - description: |-
          Org is the tenant to act on. Required for a SuperAdmin — they must name their
          target; ignored for a white-label admin, who always acts on their own org.
        in: query
        name: org
        required: false
        schema:
          type: string
      - description: ID is the cap to edit or remove, from the path. Unused by the
          list and create ops.
        in: query
        name: id
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                - enforce: true
                  id: cap_1
                  limitCents: 100000
                  over: false
                  periodSpendCents: 42000
                  resetsAt: "2026-08-01T00:00:00Z"
                  warn: false
                data2: 0
                msg: ""
                status: ok
              schema:
                $ref: '#/components/schemas/rawOut'
          description: ok
      summary: 'listSpendCaps reads one org''s usage caps: its spend alerts plus the
        derived period'
      tags:
      - admin
    post:
      description: |-
        createSpendCap sets a usage cap on one org — a platform override of a customer budget,
        written to the customer's own spend-alert rows. The body is commerce's spend-alert
        contract, forwarded byte-for-byte.
      operationId: adminCreateSpendCap
      requestBody:
        content:
          application/json:
            example:
              enforce: true
              limitCents: 100000
              org: acme
            schema:
              $ref: '#/components/schemas/capIn'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                  enforce: true
                  id: cap_1
                  limitCents: 100000
                data2: 0
                msg: ""
                status: ok
              schema:
                $ref: '#/components/schemas/rawOut'
          description: ok
      summary: |-
        createSpendCap sets a usage cap on one org — a platform override of a customer budget,
        written to the customer's own spend-alert rows.
      tags:
      - admin
  /v1/admin/spend-caps/{id}:
