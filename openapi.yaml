  /v1/integrations/telegram/connect:
    post:
      description: |-
        telegramConnect mints a short, single-use deep-link code bound to the caller's
        org and returns the t.me link the console navigates to. Org-authed: a caller with
        no validated principal is 403 (same gate as the framework connect). The code is
        stored as an oauth_nonce (org,telegram); the webhook's /start handler claims it to
        bind chat→org. It is short (128-bit hex) so it fits Telegram's 64-char `start`
        payload limit.
      operationId: post_v1_integrations_telegram_connect
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/noArgs'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                authorizeUrl: https://t.me/hanzo_bot?start=9f3c1d2e4b5a6c7d8e9f0a1b2c3d4e5f
              schema:
                $ref: '#/components/schemas/authorizeOut'
          description: ok
      summary: |-
        telegramConnect mints a short, single-use deep-link code bound to the caller's
        org and returns the t.me link the console navigates to.
      tags:
      - integrations
