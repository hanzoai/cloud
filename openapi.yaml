        data:
          type: object
        data2:
          type: integer
        msg:
          type: string
        status:
          type: string
      type: object
    readmeJSON:
      properties:
        content:
          description: Content is the file's text, verbatim and unrendered.
          type: string
        encoding:
          description: Encoding is always "utf8" — a README is text by definition.
          type: string
        path:
          description: Path is the file the README was found at (README.md, README,
            …).
          type: string
      type: object
    refreshOut:
      properties:
        connector:
          description: Connector is the connector with its new expiry.
          properties:
            account:
              description: Account is the provider's label for the connected account.
              type: string
            connectedAt:
              description: ConnectedAt is when the connector was last (re)established,
                RFC 3339 UTC.
              type: string
            expiresAt:
              description: |-
                ExpiresAt is when the access token expires, RFC 3339 UTC; empty for a
                non-expiring credential. Reading the token auto-rotates inside the window.
              type: string
            externalId:
              description: ExternalID is the provider's own id for that account.
              type: string
            id:
              description: ID is provider + ":" + label — what every other connector
                route addresses.
              type: string
            label:
              description: Label is the caller's name for this connection ("default",
                "work").
              type: string
            provider:
              description: Provider is the user-scoped provider's registry id.
              type: string
            scopes:
              description: Scopes are the permissions the credential carries. Never
                null; [] when none.
              items:
                type: string
              type: array
          type: object
        refreshed:
          description: Refreshed is always true — a failed rotation is an HTTP error.
          type: boolean
      type: object
    refsJSON:
      properties:
        branches:
          description: Branches are the repo's heads; empty on a repo with no commits.
          items:
            properties:
              name:
                description: Name is the short ref name ("main", "v1.2.0"), not the
                  full refs/… path.
                type: string
              sha:
                description: SHA is the full commit hash the ref resolves to.
                type: string
            type: object
          type: array
        default:
          description: Default is the branch name a caller gets when it asks for no
            ref.
          type: string
        tags:
          description: Tags are the repo's tags; empty when there are none.
          items:
            properties:
              name:
                description: Name is the short ref name ("main", "v1.2.0"), not the
                  full refs/… path.
                type: string
              sha:
                description: SHA is the full commit hash the ref resolves to.
                type: string
            type: object
          type: array
      type: object
    repoList:
      properties:
        data:
          description: Data holds the repos in scope, most recently updated first.
          items:
            properties:
              branches:
                description: |-
                  Branches are the repo's branch names. Read live, so the detail view carries
                  them and a list row does not.
                items:
                  type: string
                type: array
              cloneUrl:
                description: CloneURL is the HTTPS smart-HTTP remote `git clone` takes.
                type: string
              createdAt:
                description: CreatedAt is RFC 3339 UTC.
                type: string
              defaultBranch:
                description: DefaultBranch is where HEAD points on a fresh repo ("main").
                type: string
              description:
                description: Description is the caller-supplied blurb (max 4KiB).
                type: string
              head:
                description: Head is the resolved HEAD commit, empty on an empty repo.
                type: string
              id:
                description: ID is the repo's stable, prefixed identifier ("repo_"
                  + 128 random bits).
                type: string
              name:
                description: Name is the org-unique handle, and the last path segment
                  of both URLs below.
                type: string
              org:
                description: Org owns the repo — the gateway-minted X-Org-Id, and
                  the isolation key.
                type: string
              project:
                description: |-
                  Project is the optional sub-scope the repo lives in; absent for the org's
                  default scope.
                type: string
              public:
                description: |-
                  Public grants ANONYMOUS read (fetch) only; push and the whole control plane
                  stay org-authed.
                type: boolean
              sizeBytes:
                description: |-
                  SizeBytes is the repo's measured on-disk size, re-measured on create, after
                  each push, and after a gc. This is the number billing meters.
                type: integer
              sshUrl:
                description: SSHURL is the scp-style SSH remote (git@host:org/repo.git).
                type: string
              updatedAt:
                description: UpdatedAt is RFC 3339 UTC, empty until the first write.
                type: string
            type: object
          type: array
      type: object
    repoRef:
      properties:
        name:
          description: |-
            Name is the repo's org-unique handle, from the :name path segment. A
            trailing ".git" is stripped.
          type: string
      type: object
    repoView:
      properties:
        branches:
          description: |-
            Branches are the repo's branch names. Read live, so the detail view carries
            them and a list row does not.
          items:
            type: string
          type: array
        cloneUrl:
          description: CloneURL is the HTTPS smart-HTTP remote `git clone` takes.
          type: string
        createdAt:
          description: CreatedAt is RFC 3339 UTC.
          type: string
        defaultBranch:
          description: DefaultBranch is where HEAD points on a fresh repo ("main").
          type: string
        description:
          description: Description is the caller-supplied blurb (max 4KiB).
          type: string
        head:
          description: Head is the resolved HEAD commit, empty on an empty repo.
          type: string
        id:
          description: ID is the repo's stable, prefixed identifier ("repo_" + 128
            random bits).
          type: string
        name:
          description: Name is the org-unique handle, and the last path segment of
            both URLs below.
          type: string
        org:
          description: Org owns the repo — the gateway-minted X-Org-Id, and the isolation
            key.
          type: string
        project:
          description: |-
            Project is the optional sub-scope the repo lives in; absent for the org's
            default scope.
          type: string
        public:
          description: |-
            Public grants ANONYMOUS read (fetch) only; push and the whole control plane
            stay org-authed.
          type: boolean
        sizeBytes:
          description: |-
            SizeBytes is the repo's measured on-disk size, re-measured on create, after
            each push, and after a gc. This is the number billing meters.
          type: integer
        sshUrl:
          description: SSHURL is the scp-style SSH remote (git@host:org/repo.git).
          type: string
        updatedAt:
          description: UpdatedAt is RFC 3339 UTC, empty until the first write.
          type: string
      type: object
    sampleAccepted:
      properties:
        recorded:
          description: |-
            Recorded is always true: the response is an acknowledgement, and the
            warehouse write is detached, so it reports acceptance, not durability.
          type: boolean
      type: object
    sampleIngest:
      properties:
        gpuModel:
          type: string
        gpuUtil:
          description: |-
            GPUUtil is accelerator utilization as a fraction 0..1; the warehouse clamps
            anything outside that.
          type: number
        gpus:
          description: |-
            GPUs is how many accelerators the reading covers, GPUModel the representative
            model name.
          type: integer
        host:
          description: Host is the node's hostname, for display.
          type: string
        memFree:
          type: integer
        memUsed:
          description: MemUsed and MemFree are host memory in bytes.
          type: integer
        unit:
          description: |-
            Unit is the reporting node's own id — the same id it registered under, and
            the key the board joins this series onto. Required.
          type: string
      type: object
    sampleList:
      properties:
        samples:
          description: Samples are the readings, OLDEST first — the order a chart
            plots.
          items:
            properties:
              at:
                type: string
              costCents:
                type: integer
              cpus:
                type: integer
              gpuModel:
                type: string
              gpuUtil:
                type: number
              gpus:
                type: integer
              host:
                type: string
              kind:
                type: string
              load1:
                type: number
              load5:
                type: number
              load15:
                type: number
              memFree:
                type: integer
              memUsed:
                type: integer
              memory:
                type: integer
              source:
                type: string
              unit:
                type: string
            type: object
          type: array
      type: object
    serviceModeIn:
      properties:
        service:
          description: Service is the slug to flip, taken from the path.
          type: string
        waitlistMode:
          description: |-
            WaitlistMode is the new mode: true gates the service behind the waitlist, false
            opens it. This is the launch lever.
          type: boolean
      type: object
    serviceOut:
      properties:
        data:
          properties:
            service:
              description: Service is the row as it stands after the write, live mode
                included.
              properties:
                ServiceRow:
                  properties:
                    createdAt:
                      type: integer
                    description:
                      type: string
                    displayName:
                      type: string
                    hosts:
                      items:
                        type: string
                      type: array
                    service:
                      type: string
                    updatedAt:
                      type: integer
                    updatedBy:
                      type: string
                  type: object
                waitlistMode:
                  type: boolean
              type: object
          type: object
        msg:
          type: string
        status:
          type: string
      type: object
    servicesOut:
      properties:
        data:
          properties:
            services:
              description: Services is every registered service with its live waitlist
                mode.
              items:
                properties:
                  ServiceRow:
                    properties:
                      createdAt:
                        type: integer
                      description:
                        type: string
                      displayName:
                        type: string
                      hosts:
                        items:
                          type: string
                        type: array
                      service:
                        type: string
                      updatedAt:
                        type: integer
                      updatedBy:
                        type: string
                    type: object
                  waitlistMode:
                    type: boolean
                type: object
              type: array
          type: object
        msg:
          type: string
        status:
          type: string
      type: object
    setFlagIn:
      properties:
        active:
          description: 'Active is the switch itself: true enables the flag for every
            evaluation.'
          type: boolean
        filters:
          description: |-
            Filters is the optional rollout/payload block of a VALUED switch, e.g.
            {"groups":[{"properties":[],"rollout_percentage":100}],"payloads":{"true":250}}.
          items:
            type: integer
          type: array
        key:
          description: Key is the switch to write, taken from the path (e.g. "waitlist.chat").
          type: string
      type: object
    subscriptionList:
      properties:
        data:
          description: Data holds the repo's subscriptions.
          items:
            properties:
              channel:
                description: Channel is the Slack channel id or name the notifier
                  posts to.
                type: string
              createdAt:
                description: CreatedAt is RFC 3339 UTC.
                type: string
              events:
                description: Events is the kind filter; absent means every deliverable
                  kind.
                items:
                  type: string
                type: array
              id:
                description: ID is the subscription's identifier ("sub_…"), the handle
                  to delete it by.
                type: string
              repo:
                description: Repo is the repo whose lifecycle events are delivered.
                type: string
            type: object
          type: array
      type: object
    syncOut:
      properties:
        data:
          properties:
            started:
              type: boolean
          type: object
        msg:
          type: string
        status:
          type: string
      type: object
    treeJSON:
      properties:
        entries:
          description: Entries are the immediate children, directories before files.
          items:
            properties:
              mode:
                description: Mode is the octal git file mode ("100644", "040000",
                  "120000").
                type: string
              name:
                description: Name is the entry's own name, no directory part.
                type: string
              path:
                description: Path is the entry's full repo-relative path.
                type: string
              size:
                description: Size is the file's byte length; 0 for a directory.
                type: integer
              type:
                description: Type is "tree" for a directory, "blob" for a file.
                type: string
            type: object
          type: array
      type: object
    usageOut:
      properties:
        data:
          properties:
            byProduct:
              items:
                properties:
                  product:
                    type: string
                  spendCents:
                    type: integer
                  tokens:
                    type: integer
                type: object
              type: array
            series:
              items:
                properties:
                  date:
                    type: string
                  requests:
                    type: integer
                  spendCents:
                    type: integer
                  tokens:
                    type: integer
                type: object
              type: array
            totals:
              properties:
                requests:
                  type: integer
                spendCents:
                  type: integer
                tokens:
                  type: integer
              type: object
          type: object
        msg:
          type: string
        status:
          type: string
      type: object
    usageView:
      properties:
        org:
          description: Org the rollup is for.
          type: string
        repos:
          description: Repos is every repo the org owns, across every project sub-scope.
          items:
            properties:
              name:
                description: Name is the repo's org-unique handle.
                type: string
              project:
                description: Project is the sub-scope the repo lives in; absent for
                  the default scope.
                type: string
              sizeBytes:
                description: SizeBytes is the repo's on-disk size at its last measurement.
                type: integer
            type: object
          type: array
        totalBytes:
          description: TotalBytes is the sum over Repos — the org's whole git footprint.
          type: integer
      type: object
    usersOut:
      properties:
        data:
          items:
            properties:
              created:
                type: string
              displayName:
                type: string
              email:
                type: string
              forbidden:
                type: boolean
              isAdmin:
                type: boolean
              isSuperAdmin:
                type: boolean
              lastSignin:
                type: string
              name:
                type: string
              owner:
                type: string
              tag:
                type: string
            type: object
          type: array
        data2:
          type: integer
        msg:
          type: string
        status:
          type: string
      type: object
    verifyOut:
      properties:
        account:
          description: Account is the account label the provider reported. Present
            only when active.
          type: string
        active:
          description: Active is whether the stored credential verified live against
            the provider.
          type: boolean
        externalId:
          description: ExternalID is the provider's account id. Present only when
            active.
          type: string
        provider:
          description: Provider is the connector's registry id.
          type: string
        reason:
          description: Reason is why the check failed. Present only when active is
            false.
          type: string
        scopes:
          description: Scopes are the permissions the credential carries. Present
            only when active.
          items:
            type: string
          type: array
      type: object
    waitlistBoostRequest:
      properties:
        email:
          description: Email identifies the entry to boost. Either this or RefCode
            is required.
          type: string
        points:
          description: |-
            Points is how many points to award. Must be positive — this seam exists to move
            someone UP toward the cutoff.
          type: integer
        reason:
          description: |-
            Reason is the operator's justification. Not sent to the engine; it is recorded on
            the audit row, which is the point of asking for it.
          type: string
        refCode:
          description: RefCode identifies the entry by its referral code, when the
            email is unknown.
          type: string
        waitlist:
          description: Waitlist is the waitlist slug the grant lands on. Required.
          type: string
      type: object
    workerList:
      properties:
        workers:
          description: |-
            Workers is one row per connected BYO machine, each carrying the host's own
            report (GPUs, driver versions, capabilities) rather than a normalized view.
          items:
            properties:
              arch:
                description: |-
                  Arch/CPUs/Memory are the connecting host's static CPU spec, mirrored from the
                  registration: Arch is runtime.GOARCH (amd64 | arm64), Memory is total RAM in
                  BYTES — the same fields a code-linked run-target carries, so the /v1/fleet
                  board renders a linked node's arch + cores + RAM like any other unit.
                type: string
              capabilities:
                description: |-
                  Capabilities the worker advertises ("studio.render", "engine.serve"); Engine
                  is present when it runs a hanzo-engine model server. Both additive + omitempty.
                items:
                  type: string
                type: array
              cpuModel:
                type: string
              cpus:
                type: integer
              cuda:
                type: string
              driver:
                type: string
              engine:
                properties:
                  apis:
                    description: '["openai","anthropic"]'
                    items:
                      type: string
                    type: array
                  models:
                    description: ids from the node's GET /v1/models
                    items:
                      type: string
                    type: array
                  status:
                    description: '"ready" | "unreachable"'
                    type: string
                  url:
                    type: string
                type: object
              firstSeen:
                type: string
              gpus:
                items:
                  properties:
                    arch:
                      description: native target, e.g. "gfx1151"
                      type: string
                    memoryTotal:
                      description: VRAM (or unified pool), e.g. "122880 MiB"
                      type: string
                    name:
                      type: string
                    unified:
                      description: unified CPU/GPU memory pool (APU / SoC)
                      type: boolean
                  type: object
                type: array
              hip:
                type: string
              hostname:
                type: string
              id:
                type: string
              jobQueue:
                type: string
              lastHeartbeat:
                type: string
              location:
                description: '"on-prem" (BYO has no cloud region)'
                type: string
              memory:
                type: integer
              os:
                type: string
              provider:
                description: always "byo"
                type: string
              rocm:
                type: string
              status:
                description: online | offline
                type: string
              version:
                type: string
            type: object
          type: array
      type: object
info:
