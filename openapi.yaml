  /v1/git/repos/{name}/subscriptions:
    get:
      description: |-
        listSubscriptions returns a repo's Slack subscriptions — which channels the
        lifecycle notifier posts this repo's push and deploy events to.
      operationId: get_v1_git_repos_name_subscriptions
      parameters:
      - description: |-
          Name is the repo's org-unique handle, from the :name path segment. A
          trailing ".git" is stripped.
        example: widgets
        in: path
        name: name
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                - channel: '#builds'
                  createdAt: "2026-07-01T10:00:00Z"
                  events:
                  - push.landed
                  id: sub_7c2e
                  repo: widgets
              schema:
                $ref: '#/components/schemas/subscriptionList'
          description: ok
      summary: listSubscriptions returns a repo's Slack subscriptions — which channels
        the
      tags:
      - git
    post:
      description: |-
        subscribe binds a Slack channel to a repo, so the lifecycle notifier posts
        that repo's push and deploy events there. Answers 201. The same channel twice
        on one repo is a 409; a repo outside the caller's scope is a 404, exactly as
        reading it is.
      operationId: post_v1_git_repos_name_subscriptions
      parameters:
      - description: Name is the repo to subscribe, from the :name path segment.
        example: widgets
        in: path
        name: name
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
