  /v1/integrations:
    get:
      description: |-
        list returns every registered integration provider together with THIS org's
        connection status for it — the catalog the console's Integrations page renders.
        Org-authed: a caller with no validated principal is 403, because the status is
        per-org and there is no org-less answer. User-plane providers (the /v1/connectors
        surface) are omitted; the two planes are disjoint.
      operationId: get_v1_integrations
      responses:
        "200":
          content:
            application/json:
              example:
                providers:
                - available: true
                  category: Communication
                  connected: true
                  connection:
                    account: Acme
                    connectedAt: "2026-07-01T10:00:00Z"
                    externalId: T0231
                    scopes:
                    - chat:write
                  description: Connect your workspace.
                  id: slack
                  name: Slack
              schema:
                $ref: '#/components/schemas/listOut'
          description: ok
      summary: |-
        list returns every registered integration provider together with THIS org's
        connection status for it — the catalog the console's Integrations page renders.
        Org-authed: a caller with no validated principal is 403, because the status is
        per-org and there is no org-less answer.
      tags:
      - integrations
  /v1/integrations/{provider}:
    get:
      description: |-
        get returns ONE provider with this org's connection status — the same view list
        carries, for a single id. An unknown id is 404, and so is a user-plane provider:
        the org surface never resolves one.
      operationId: get_v1_integrations_provider
      parameters:
      - description: |-
          Provider is the registry id of the connector — "slack", "github",
          "cloudflare". Unknown ids are 404, as are the user-plane (/v1/connectors)
          providers, which this surface never resolves.
        example: slack
        in: path
        name: provider
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              example:
                available: true
                category: Communication
                connected: false
                description: Connect your workspace.
                id: slack
                name: Slack
              schema:
                $ref: '#/components/schemas/providerView'
          description: ok
      summary: |-
        get returns ONE provider with this org's connection status — the same view list
        carries, for a single id.
      tags:
      - integrations
  /v1/integrations/{provider}/callback:
    get:
      operationId: get_v1_integrations_by_provider_callback
      parameters:
      - in: path
        name: provider
        required: true
        schema:
          type: string
      tags:
      - integrations
  /v1/integrations/{provider}/connect:
    post:
      description: |-
        connect acquires the org's credential for one provider. It has TWO paths and the
        REQUEST picks which: a "token" key in the body seals that credential directly
        (verify-before-store), and its absence begins the 3-legged OAuth flow — minting a
        single-use nonce plus an HMAC-signed state that binds this org to this provider,
        and answering with the provider's authorize URL for the caller to redirect to.

        Fail-closed order, unchanged: no principal → 403; unknown provider → 404; an
        AdminOnly connector without the caller's own-org admin bit → 403; not configured
        → 503; KMS not ready → 503 (the flow WILL need to seal a token, so refuse now
        rather than dead-end at the callback).
      operationId: post_v1_integrations_provider_connect
      parameters:
      - description: Provider is the connector's registry id, from the :provider path
          segment.
        example: cloudflare
        in: path
        name: provider
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              accountId: a1b2c3
              provider: cloudflare
              token: cf-scoped-api-token
            schema:
              $ref: '#/components/schemas/connectIn'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                account: Acme
                connected: true
                externalId: a1b2c3
                provider: cloudflare
                scopes: []
              schema:
                $ref: '#/components/schemas/connectOut'
          description: ok
      summary: connect acquires the org's credential for one provider.
      tags:
      - integrations
  /v1/integrations/{provider}/disconnect:
    post:
      description: |-
        disconnect revokes (best-effort) and forgets an org's connection: it deletes
        every custodied KMS secret and the connection row. Idempotent — disconnecting a
        provider that was never connected still returns {disconnected:true}. Symmetric
        with connect: an AdminOnly connector needs the caller's own-org admin bit.
      operationId: post_v1_integrations_provider_disconnect
      parameters:
      - description: |-
          Provider is the registry id of the connector — "slack", "github",
          "cloudflare". Unknown ids are 404, as are the user-plane (/v1/connectors)
          providers, which this surface never resolves.
        example: slack
        in: path
        name: provider
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              provider: slack
            schema:
              $ref: '#/components/schemas/providerRef'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                disconnected: true
              schema:
                $ref: '#/components/schemas/disconnectOut'
          description: ok
      summary: |-
        disconnect revokes (best-effort) and forgets an org's connection: it deletes
        every custodied KMS secret and the connection row.
      tags:
      - integrations
  /v1/integrations/{provider}/verify:
    post:
      description: |-
        verifyConn re-checks a CONNECTED apikey connector's stored credential against the
        provider, live (`hanzo connector verify`). Org-scoped (any member may check
        status); the credential is read from KMS, verified, and NEVER returned or logged.
        A verification failure is reported as {active:false}, not an error — the console/
        CLI renders it. Only apikey providers support verify (OAuth tokens are checked at
        use, not re-verified here).
      operationId: post_v1_integrations_provider_verify
      parameters:
      - description: |-
          Provider is the registry id of the connector — "slack", "github",
          "cloudflare". Unknown ids are 404, as are the user-plane (/v1/connectors)
          providers, which this surface never resolves.
        example: cloudflare
        in: path
        name: provider
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              provider: cloudflare
            schema:
              $ref: '#/components/schemas/providerRef'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                account: Acme
                active: true
                externalId: a1b2c3
                provider: cloudflare
                scopes:
                - zone:read
              schema:
                $ref: '#/components/schemas/verifyOut'
          description: ok
      summary: |-
        verifyConn re-checks a CONNECTED apikey connector's stored credential against the
        provider, live (`hanzo connector verify`).
      tags:
      - integrations
