      responses:
        "200":
          content:
            application/json:
              example:
                agentName: bot-a
                botVersion: 1.4.0
                machineId: drop-a
                status: running
              schema:
                $ref: '#/components/schemas/agentBinding'
          description: ok
      summary: getMachineAgentBinding returns the agent binding of one of the caller
        org's
      tags:
